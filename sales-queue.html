<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Apollo Sales Queue</title>
  <style>
    :root { --bd:#e5e7eb; }
    * { box-sizing: border-box; }
    body { font-family: Inter, -apple-system, Arial, sans-serif; margin: 0; background: #f3f4f6; color: #111827; }
    .wrap { max-width: 1600px; margin: 0 auto; padding: 24px; }
    .card { background: white; border-radius: 18px; padding: 20px; box-shadow: 0 10px 35px rgba(0,0,0,.06); }
    .top { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
    input { padding: 10px 12px; border-radius: 10px; border: 1px solid #d1d5db; }
    button { padding: 10px 14px; border: none; border-radius: 10px; background: #2563eb; color: white; cursor: pointer; font-size: 13px; }
    button:hover { filter: brightness(1.05); }
    .board { display: grid; grid-template-columns: repeat(5, minmax(240px, 1fr)); gap: 12px; align-items: start; }
    .column { background: #f9fafb; border: 1px solid var(--bd); border-radius: 14px; padding: 10px; min-height: 200px; }
    .column h3 { margin: 0 0 10px; font-size: 14px; display: flex; justify-content: space-between; align-items: center; }
    .count { background: #e5e7eb; color: #374151; border-radius: 999px; padding: 2px 8px; font-size: 12px; }
    .lead { background: white; border-radius: 12px; padding: 12px; margin-bottom: 10px; box-shadow: 0 4px 12px rgba(0,0,0,.05); border: 1px solid #f1f2f4; }
    .lead h4 { margin: 0 0 2px; font-size: 14px; }
    .role { color: #4b5563; font-size: 12px; margin-bottom: 8px; }
    .rows { font-size: 12px; color: #374151; display: grid; gap: 3px; margin-bottom: 8px; }
    .rows a { color: #2563eb; text-decoration: none; }
    .rows a:hover { text-decoration: underline; }
    .k { color: #9ca3af; display: inline-block; width: 62px; }
    .chips { margin-bottom: 8px; }
    .chip { display: inline-block; padding: 3px 8px; border-radius: 999px; font-size: 11px; margin: 0 4px 4px 0; background: #eef2ff; color: #4338ca; }
    .chip.hot { background: #fee2e2; color: #b91c1c; }
    .chip.warm { background: #fef3c7; color: #92400e; }
    .chip.cold { background: #e0f2fe; color: #075985; }
    textarea { width: 100%; border: 1px solid #d1d5db; border-radius: 8px; padding: 6px 8px; font: inherit; font-size: 12px; resize: vertical; min-height: 44px; }
    .actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
    .actions button { padding: 6px 8px; font-size: 12px; background: #111827; }
    .actions button.secondary { background: #4b5563; }
    .actions button.success { background: #16a34a; }
    .actions button.warn { background: #b91c1c; }
    .muted { color: #6b7280; font-size: 13px; }
    .gate { font-size: 11px; color: #92400e; background: #fffbeb; border: 1px solid #fde68a; border-radius: 8px; padding: 6px 8px; margin-bottom: 16px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="top">
        <div>
          <h1 style="margin:0">Apollo Sales Queue</h1>
          <p class="muted" style="margin:6px 0 0">Work Apollo leads here. They only enter GHL once you <b>Qualify</b> or <b>Convert</b> them.</p>
        </div>
        <div>
          <input id="listId" placeholder="Apollo list ID (optional)" style="width:220px" />
          <button onclick="pullList()">Pull from Apollo</button>
          <button onclick="loadQueue()" style="background:#4b5563">Refresh</button>
        </div>
      </div>
      <div class="gate">🔒 Cold leads stay out of GHL. GHL contact + opportunity are created only on <b>Qualify</b> or <b>Convert to Deal</b>.</div>
      <div id="status" class="muted">Loading…</div>
      <div class="board" id="board"></div>
    </div>
  </div>

  <script>
    const STATUS_ORDER = ['to_contact', 'contacted', 'qualified', 'converted', 'not_interested'];
    const STATUS_LABELS = {
      to_contact: 'To Contact',
      contacted: 'Contacted',
      qualified: 'Qualified',
      converted: 'Converted',
      not_interested: 'Not Interested'
    };

    function esc(str) {
      return String(str ?? '').replace(/[&<>'"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    function fmtRevenue(v) {
      const n = parseInt(v, 10);
      if (!Number.isFinite(n)) return v || '—';
      if (n >= 1e9) return '£' + (n / 1e9).toFixed(1) + 'b';
      if (n >= 1e6) return '£' + (n / 1e6).toFixed(1) + 'm';
      if (n >= 1e3) return '£' + Math.round(n / 1e3) + 'k';
      return '£' + n;
    }

    async function api(body) {
      const res = await fetch('/api/apollo-sales-queue', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      return res.json();
    }

    async function loadQueue() {
      const status = document.getElementById('status');
      const board = document.getElementById('board');
      status.textContent = 'Loading…';
      try {
        const res = await fetch('/api/apollo-sales-queue');
        const data = await res.json();
        if (!data.success) throw new Error(data.error || 'Unable to load queue');

        const grouped = data.grouped || {};
        board.innerHTML = STATUS_ORDER.map((key) => {
          const leads = grouped[key] || [];
          return `
            <div class="column">
              <h3>${STATUS_LABELS[key]} <span class="count">${leads.length}</span></h3>
              ${leads.length ? leads.map(renderLead).join('') : '<div class="muted" style="font-size:12px">Empty</div>'}
            </div>`;
        }).join('');

        status.textContent = `${data.contacts.length} leads in the queue`;
      } catch (error) {
        status.textContent = error.message;
      }
    }

    function renderLead(c) {
      const website = c.companyWebsite ? `<a href="${esc(c.companyWebsite)}" target="_blank" rel="noopener">${esc(c.companyWebsite.replace(/^https?:\/\//, ''))}</a>` : '—';
      const phone = c.phone ? `<a href="tel:${esc(c.phone)}">${esc(c.phone)}</a>` : '—';
      const email = c.email ? `<a href="mailto:${esc(c.email)}">${esc(c.email)}</a>` : '—';
      const key = c.status;
      return `
        <div class="lead">
          <h4>${esc(c.name || '—')}</h4>
          <div class="role">${esc(c.title || '')}${c.companyName ? ' · ' + esc(c.companyName) : ''}</div>
          <div class="chips">
            <span class="chip ${c.priority || 'warm'}">${esc((c.priority || 'warm').toUpperCase())}</span>
            ${c.companyIndustry ? `<span class="chip">${esc(c.companyIndustry)}</span>` : ''}
          </div>
          <div class="rows">
            <div><span class="k">Website</span> ${website}</div>
            <div><span class="k">Phone</span> ${phone}</div>
            <div><span class="k">Email</span> ${email}</div>
            <div><span class="k">Employees</span> ${c.companyEmployees ?? '—'}</div>
            <div><span class="k">Revenue</span> ${fmtRevenue(c.companyRevenue)}</div>
          </div>
          <textarea id="note-${c.id}" placeholder="Call notes…" onblur="saveNote(${c.id})">${esc(c.callNotes || '')}</textarea>
          <div class="actions">
            ${key !== 'contacted' ? `<button class="secondary" onclick="setStatus(${c.id}, 'contacted')">Contacted</button>` : ''}
            ${key !== 'qualified' ? `<button onclick="setStatus(${c.id}, 'qualified')">Qualify →GHL</button>` : ''}
            ${key !== 'converted' ? `<button class="success" onclick="convert(${c.id})">Convert →Deal</button>` : ''}
            ${key !== 'not_interested' ? `<button class="warn" onclick="setStatus(${c.id}, 'not_interested')">Not interested</button>` : ''}
          </div>
        </div>`;
    }

    async function saveNote(id) {
      const notes = document.getElementById('note-' + id).value;
      await api({ action: 'note', id, notes });
    }

    async function setStatus(id, status) {
      const status_el = document.getElementById('status');
      const notes = document.getElementById('note-' + id)?.value;
      status_el.textContent = status === 'qualified' ? 'Qualifying → creating GHL contact…' : 'Updating…';
      const data = await api({ action: 'status', id, status, notes });
      if (data.success) { loadQueue(); } else { status_el.textContent = data.error; }
    }

    async function convert(id) {
      const status_el = document.getElementById('status');
      const value = prompt('Deal value (£)? Leave blank to skip.');
      const monetaryValue = value ? Number(value.replace(/[^0-9.]/g, '')) : undefined;
      const notes = document.getElementById('note-' + id)?.value;
      status_el.textContent = 'Converting → creating GHL contact + opportunity…';
      const data = await api({ action: 'convert', id, monetaryValue, notes });
      if (data.success) {
        loadQueue();
        status_el.textContent = data.ghl?.opportunitySkipped
          ? `Converted (contact created; opportunity skipped: ${data.ghl.reason})`
          : 'Converted to GHL deal ✅';
      } else {
        status_el.textContent = data.error;
      }
    }

    async function pullList() {
      const listId = document.getElementById('listId').value.trim();
      const status_el = document.getElementById('status');
      status_el.textContent = 'Pulling from Apollo…';
      const data = await api({ action: 'sync-list', listId: listId || undefined });
      if (data.success) {
        status_el.textContent = `Pulled ${data.inserted} leads from Apollo`;
        loadQueue();
      } else {
        status_el.textContent = data.error;
      }
    }

    window.addEventListener('DOMContentLoaded', loadQueue);
  </script>
</body>
</html>
