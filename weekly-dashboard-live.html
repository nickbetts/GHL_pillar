<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weekly Leaderboard Live</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Audiowide&family=Bebas+Neue&family=Barlow+Condensed:wght@500;700;900&family=Cinzel:wght@600;800&family=JetBrains+Mono:wght@600;800&family=Orbitron:wght@500;700;900&display=swap');
    :root {
      --gold:#f5b301;
      --silver:#c7d0dd;
      --bronze:#d98b4a;
      --arena-1:#141a37;
    }
    * { box-sizing:border-box; }
    html, body { margin:0; min-height:100%; font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
    body {
      background:
        radial-gradient(1200px 620px at 12% -8%, rgba(88,101,242,.35) 0%, transparent 55%),
        radial-gradient(900px 500px at 100% 0%, rgba(16,185,129,.28) 0%, transparent 52%),
        radial-gradient(700px 500px at 50% 120%, rgba(245,179,1,.18) 0%, transparent 55%),
        linear-gradient(180deg, var(--arena-1) 0%, #0c1030 100%);
      color:#eef1ff;
      padding:26px 22px 32px;
    }
    .wrap { max-width:1400px; margin:0 auto; }
    .head { display:flex; justify-content:space-between; align-items:flex-start; gap:18px; flex-wrap:wrap; }
    .head h1 {
      margin:0;
      font-size:40px;
      letter-spacing:-.02em;
      font-weight:900;
      background:linear-gradient(92deg,#fff 10%, #ffe89a 50%, #fff 90%);
      -webkit-background-clip:text;
      background-clip:text;
      color:transparent;
      text-shadow:0 2px 30px rgba(255,220,120,.18);
    }
    .head .sub { margin:6px 0 0; color:#aeb6e6; font-size:14px; max-width:700px; }
    .weekbar {
      display:flex; align-items:center; gap:10px; flex-wrap:wrap;
      background:rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.12);
      border-radius:16px;
      padding:8px 10px;
      backdrop-filter:blur(8px);
    }
    .weekbar button {
      height:44px; padding:0 14px; border-radius:12px; cursor:pointer;
      border:1px solid rgba(255,255,255,.16);
      background:rgba(255,255,255,.08); color:#fff; font:inherit; font-weight:800; font-size:14px;
    }
    .weekbar button:hover:not(:disabled) { background:rgba(255,255,255,.18); }
    .weekbar button:disabled { opacity:.35; cursor:not-allowed; }
    .weekbar button.now { background:linear-gradient(120deg,#5865f2,#7c3aed); border-color:transparent; }
    .weeklabel { text-align:center; min-width:210px; }
    .weeklabel .lbl { font-size:11px; text-transform:uppercase; letter-spacing:.14em; color:#9fa8e0; font-weight:800; }
    .weeklabel .rng { font-size:18px; font-weight:800; margin-top:2px; }
    .ribbon { display:grid; grid-template-columns:repeat(auto-fit, minmax(150px,1fr)); gap:12px; margin:20px 0 8px; }
    .points-key { margin-top:12px; display:flex; gap:8px; flex-wrap:wrap; }
    .points-key .pk {
      background:rgba(255,255,255,.08);
      border:1px solid rgba(255,255,255,.14);
      border-radius:999px;
      padding:5px 10px;
      font-size:11px;
      font-weight:800;
      color:#d8defc;
      letter-spacing:.02em;
    }
    .points-key .pk b { color:#fff; }
    .stat {
      position:relative; overflow:hidden;
      background:linear-gradient(160deg, rgba(255,255,255,.10), rgba(255,255,255,.03));
      border:1px solid rgba(255,255,255,.12);
      border-radius:16px; padding:14px 16px;
    }
    .stat .k { font-size:11px; text-transform:uppercase; letter-spacing:.1em; color:#9fa8e0; font-weight:800; }
    .stat .v { margin-top:6px; font-size:30px; font-weight:900; line-height:1; }
    .stat .em { position:absolute; right:10px; top:8px; font-size:22px; opacity:.5; }
    .stat .cmp { margin-top:8px; font-size:11px; }
    .podium-wrap { margin:26px 0 6px; }
    .podium { display:grid; grid-template-columns:1fr 1.15fr 1fr; align-items:end; gap:16px; max-width:1020px; margin:0 auto; }
    .pod { text-align:center; }
    .avatar {
      width:88px; height:88px; border-radius:999px; margin:0 auto 10px;
      display:flex; align-items:center; justify-content:center;
      font-size:30px; font-weight:900; color:#0b1220;
      box-shadow:0 12px 30px rgba(0,0,0,.4);
      position:relative;
    }
    .pod.rank1 .avatar { width:104px; height:104px; font-size:36px; background:linear-gradient(150deg,#ffe07a,#f5b301); box-shadow:0 0 0 4px rgba(245,179,1,.3), 0 16px 40px rgba(245,179,1,.35); }
    .pod.rank2 .avatar { background:linear-gradient(150deg,#eef2f8,#b9c4d6); box-shadow:0 0 0 4px rgba(199,208,221,.28), 0 12px 30px rgba(0,0,0,.4); }
    .pod.rank3 .avatar { background:linear-gradient(150deg,#f0b984,#d98b4a); box-shadow:0 0 0 4px rgba(217,139,74,.28), 0 12px 30px rgba(0,0,0,.4); }
    .crown { position:absolute; top:-30px; left:50%; transform:translateX(-50%); font-size:30px; }
    .medal {
      position:absolute; bottom:-6px; right:-4px;
      width:34px; height:34px; border-radius:999px;
      display:flex; align-items:center; justify-content:center;
      font-size:15px; font-weight:900; color:#0b1220;
      border:3px solid #0c1030;
    }
    .pod.rank1 .medal { background:var(--gold); }
    .pod.rank2 .medal { background:var(--silver); }
    .pod.rank3 .medal { background:var(--bronze); }
    .pod .nm { font-size:18px; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .pod .sc { font-size:13px; color:#c8cef2; margin-top:2px; }
    .pod .sc b { color:#ffe89a; font-size:16px; }
    .plinth {
      margin-top:12px;
      border-radius:14px 14px 6px 6px;
      background:linear-gradient(180deg, rgba(255,255,255,.18), rgba(255,255,255,.04));
      border:1px solid rgba(255,255,255,.14);
      display:flex; align-items:flex-start; justify-content:center;
      font-size:30px; font-weight:900; color:rgba(255,255,255,.5);
      padding-top:10px;
    }
    .pod.rank1 .plinth { height:150px; background:linear-gradient(180deg, rgba(245,179,1,.4), rgba(245,179,1,.08)); border-color:rgba(245,179,1,.45); color:#ffe89a; }
    .pod.rank2 .plinth { height:112px; }
    .pod.rank3 .plinth { height:86px; }
    .pod .minis { display:grid; grid-template-columns:repeat(4, minmax(0, 1fr)); justify-content:center; align-items:center; gap:4px; margin:12px auto 0; width:min(100%, 236px); }
    .mini { background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.12); border-radius:9px; padding:4px 3px; min-width:0; }
    .mini .mn { font-size:14px; font-weight:900; }
    .mini .mk { font-size:8px; text-transform:uppercase; letter-spacing:.04em; color:#9fa8e0; font-weight:800; margin-top:1px; }
    .board { margin-top:28px; display:grid; gap:10px; }
    .board h2 { margin:0 0 4px; font-size:14px; text-transform:uppercase; letter-spacing:.12em; color:#9fa8e0; font-weight:800; }
    .row {
      display:grid; grid-template-columns:52px 1fr auto; align-items:center; gap:14px;
      background:linear-gradient(120deg, rgba(255,255,255,.08), rgba(255,255,255,.03));
      border:1px solid rgba(255,255,255,.10); border-radius:14px; padding:12px 16px;
    }
    .row.top1 { border-color:rgba(245,179,1,.5); box-shadow:inset 0 0 0 1px rgba(245,179,1,.2); }
    .row.top2 { border-color:rgba(199,208,221,.4); }
    .row.top3 { border-color:rgba(217,139,74,.4); }
    .rk { font-size:22px; font-weight:900; text-align:center; color:#c8cef2; }
    .rk small { display:block; font-size:9px; letter-spacing:.1em; color:#7c85bd; font-weight:800; }
    .who { min-width:0; }
    .who .nm { font-size:18px; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .who .brk { display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
    .tag { font-size:10px; font-weight:800; letter-spacing:.02em; text-transform:uppercase; color:#c8cef2; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.10); border-radius:999px; padding:3px 8px; }
    .tag b { color:#fff; }
    .delta { margin-left:6px; font-size:10px; font-weight:900; letter-spacing:.01em; }
    .delta.up { color:#22c55e; }
    .delta.down { color:#ef4444; }
    .delta.flat { color:#93a0d4; }
    .rowscore { text-align:right; }
    .rowscore .v { font-size:26px; font-weight:900; color:#ffe89a; line-height:1; }
    .rowscore .k { font-size:10px; text-transform:uppercase; letter-spacing:.08em; color:#9fa8e0; font-weight:800; margin-top:3px; }
    .rowscore .d { font-size:11px; margin-top:4px; }
    .status { margin-top:16px; color:#9fa8e0; font-size:12px; text-align:center; }
    .unlock {
      position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
      background:rgba(7,10,26,.88); backdrop-filter:blur(16px); z-index:20; padding:24px;
    }
    .unlock.hidden { display:none !important; }
    .unlock-card {
      width:min(100%, 440px); border-radius:18px; padding:22px 22px 18px;
      background:linear-gradient(180deg, rgba(18,24,56,.98), rgba(10,14,34,.98));
      border:1px solid rgba(255,255,255,.14); box-shadow:0 22px 80px rgba(0,0,0,.45);
    }
    .unlock-card h2 { margin:0; font-size:22px; }
    .unlock-card p { margin:6px 0 16px; color:#aeb6e6; font-size:13px; line-height:1.45; }
    .unlock-row { display:flex; gap:10px; }
    .unlock-row input {
      flex:1; height:44px; border-radius:12px; border:1px solid rgba(255,255,255,.14);
      background:rgba(255,255,255,.06); color:#fff; font:inherit; padding:0 12px;
    }
    .unlock-row input:focus { outline:3px solid rgba(88,101,242,.24); border-color:#5865f2; }
    .unlock-row button {
      height:44px; padding:0 16px; border:0; border-radius:12px; cursor:pointer;
      background:linear-gradient(120deg,#5865f2,#7c3aed); color:#fff; font:inherit; font-weight:800;
    }
    .unlock-error { margin-top:10px; color:#ffb4b4; font-size:12px; min-height:16px; }
    .empty { margin-top:20px; padding:40px; border:1px dashed rgba(255,255,255,.2); border-radius:16px; text-align:center; color:#aeb6e6; background:rgba(255,255,255,.03); }

    .funbar {
      margin-top:12px;
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      align-items:center;
      justify-content:space-between;
      background:rgba(255,255,255,.05);
      border:1px solid rgba(255,255,255,.12);
      border-radius:14px;
      padding:10px 12px;
    }
    .theme-toggle { display:flex; gap:6px; flex-wrap:wrap; }
    .theme-toggle button {
      border:1px solid rgba(255,255,255,.2);
      background:rgba(255,255,255,.07);
      color:#fff;
      border-radius:999px;
      padding:6px 11px;
      font-size:11px;
      font-weight:800;
      letter-spacing:.04em;
      text-transform:uppercase;
      cursor:pointer;
    }
    .theme-toggle button.active { background:linear-gradient(120deg,#22d3ee,#3b82f6); border-color:transparent; }
    .confetti-toggle { font-size:12px; color:#c8cef2; display:flex; align-items:center; gap:6px; }

    .streak {
      display:inline-block;
      margin-left:6px;
      border-radius:999px;
      padding:3px 7px;
      font-size:10px;
      font-weight:900;
      letter-spacing:.03em;
      color:#111827;
      background:linear-gradient(120deg,#fde68a,#f59e0b);
      vertical-align:middle;
    }
    .callout { margin-top:6px; font-size:12px; color:#b9c6ff; }
    .pod.joint .plinth { box-shadow:0 0 0 2px rgba(199,208,221,.25) inset; }
    .joint-chip {
      display:inline-block;
      margin-top:6px;
      border-radius:999px;
      border:1px solid rgba(199,208,221,.5);
      background:rgba(199,208,221,.15);
      color:#e7ecff;
      font-size:10px;
      font-weight:900;
      letter-spacing:.04em;
      text-transform:uppercase;
      padding:3px 8px;
    }
    .rank-rise { animation:rankRise .55s ease; }
    @keyframes rankRise {
      0% { transform:translateY(10px); filter:brightness(.9); }
      100% { transform:translateY(0); filter:brightness(1); }
    }

    .confetti-layer { position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:30; }
    .confetti {
      position:absolute;
      top:-16px;
      font-size:12px;
      opacity:.92;
      animation:confettiFall 1500ms linear forwards;
    }
    @keyframes confettiFall {
      to { transform:translateY(105vh) rotate(520deg); opacity:0; }
    }

    /* ============ THEME: CHAMPIONS (luxury awards) ============ */
    body.theme-classic,
    body:not(.theme-arcade):not(.theme-fight) {
      background:
        radial-gradient(1300px 760px at 50% -22%, rgba(212,175,90,.16), transparent 58%),
        radial-gradient(1100px 800px at 88% 118%, rgba(70,90,180,.12), transparent 60%),
        linear-gradient(180deg, #0b0f22 0%, #070a15 62%, #05070f 100%);
    }
    body.theme-classic .head h1,
    body:not(.theme-arcade):not(.theme-fight) .head h1 {
      font-family:'Cinzel', serif;
      letter-spacing:.06em;
      text-transform:uppercase;
      background:linear-gradient(92deg,#f6e7b4 0%, #d4af5a 45%, #fff4cf 70%, #d4af5a 100%);
      -webkit-background-clip:text; background-clip:text; color:transparent;
      text-shadow:0 2px 34px rgba(212,175,90,.24);
    }
    body.theme-classic .pod .nm,
    body.theme-classic .rowscore .v,
    body.theme-classic .stat .v,
    body:not(.theme-arcade):not(.theme-fight) .pod .nm,
    body:not(.theme-arcade):not(.theme-fight) .rowscore .v,
    body:not(.theme-arcade):not(.theme-fight) .stat .v {
      font-family:'Cinzel', serif;
    }
    body.theme-classic .stat,
    body.theme-classic .weekbar,
    body.theme-classic .row,
    body:not(.theme-arcade):not(.theme-fight) .stat,
    body:not(.theme-arcade):not(.theme-fight) .weekbar,
    body:not(.theme-arcade):not(.theme-fight) .row {
      background:linear-gradient(165deg, rgba(24,28,48,.72), rgba(12,15,30,.66));
      border-color:rgba(214,178,102,.22);
      box-shadow:0 18px 40px rgba(0,0,0,.42), inset 0 1px 0 rgba(255,255,255,.05);
      backdrop-filter:blur(10px);
    }
    body.theme-classic .points-key .pk,
    body:not(.theme-arcade):not(.theme-fight) .points-key .pk {
      border-color:rgba(214,178,102,.28);
    }
    body.theme-classic .row.top1,
    body:not(.theme-arcade):not(.theme-fight) .row.top1 {
      border-color:rgba(214,178,102,.55);
      box-shadow:0 18px 44px rgba(0,0,0,.46), inset 0 0 0 1px rgba(214,178,102,.3), 0 0 34px rgba(214,178,102,.14);
    }
    body.theme-classic .theme-toggle button.active,
    body:not(.theme-arcade):not(.theme-fight) .theme-toggle button.active {
      background:linear-gradient(120deg,#c99a3d,#f4dd94);
      color:#1a1405;
    }

    /* ============ THEME: ARCADE (clean synthwave) ============ */
    body.theme-arcade {
      position:relative;
      background:
        radial-gradient(900px 560px at 18% -6%, rgba(236,72,153,.18), transparent 56%),
        radial-gradient(900px 560px at 82% 4%, rgba(34,211,238,.18), transparent 56%),
        linear-gradient(180deg, #08091c 0%, #0a0b22 55%, #070813 100%);
    }
    body.theme-arcade::before {
      content:"";
      position:fixed; left:0; right:0; bottom:0; height:42%;
      background:
        linear-gradient(180deg, transparent, rgba(34,211,238,.06)),
        repeating-linear-gradient(90deg, rgba(120,200,255,.10) 0 1px, transparent 1px 46px),
        repeating-linear-gradient(0deg, rgba(120,200,255,.08) 0 1px, transparent 1px 46px);
      -webkit-mask-image:linear-gradient(180deg, transparent, #000 70%);
      mask-image:linear-gradient(180deg, transparent, #000 70%);
      transform:perspective(420px) rotateX(58deg);
      transform-origin:bottom center;
      pointer-events:none; z-index:0;
    }
    body.theme-arcade .wrap { position:relative; z-index:1; }
    body.theme-arcade .head h1,
    body.theme-arcade .weeklabel .lbl,
    body.theme-arcade .board h2,
    body.theme-arcade .theme-toggle button {
      font-family:'Orbitron', 'Audiowide', system-ui;
      letter-spacing:.12em;
      text-transform:uppercase;
    }
    body.theme-arcade .head h1 {
      background:linear-gradient(92deg,#67e8f9 0%, #a5b4fc 50%, #f0abfc 100%);
      -webkit-background-clip:text; background-clip:text; color:transparent;
      text-shadow:0 0 26px rgba(34,211,238,.32);
    }
    body.theme-arcade .weekbar,
    body.theme-arcade .stat,
    body.theme-arcade .row,
    body.theme-arcade .points-key .pk,
    body.theme-arcade .mini,
    body.theme-arcade .tag {
      border-radius:10px;
      background:linear-gradient(165deg, rgba(18,22,52,.72), rgba(10,12,32,.6));
      border-color:rgba(90,190,240,.32);
      box-shadow:0 14px 34px rgba(0,0,0,.4), inset 0 1px 0 rgba(120,210,255,.08);
      backdrop-filter:blur(8px);
    }
    body.theme-arcade .podium {
      grid-template-columns:1fr;
      gap:14px;
      max-width:820px;
    }
    body.theme-arcade .pod { order:0 !important; }
    body.theme-arcade .pod.p1 { order:1 !important; }
    body.theme-arcade .pod.p2 { order:2 !important; }
    body.theme-arcade .pod.p3 { order:3 !important; }
    body.theme-arcade .avatar,
    body.theme-arcade .rowscore .v,
    body.theme-arcade .stat .v,
    body.theme-arcade .mini .mn,
    body.theme-arcade .rk {
      font-family:'JetBrains Mono', monospace;
    }
    body.theme-arcade .rowscore .v { color:#7dd3fc; text-shadow:0 0 16px rgba(56,189,248,.4); }
    body.theme-arcade .pod.rank1 .plinth,
    body.theme-arcade .pod.rank2 .plinth,
    body.theme-arcade .pod.rank3 .plinth {
      height:auto;
      min-height:96px;
      align-items:center;
      justify-content:center;
      font-size:32px;
      border-radius:12px;
      background:linear-gradient(150deg, rgba(236,72,153,.16), rgba(34,211,238,.16));
      border-color:rgba(90,190,240,.34);
    }
    body.theme-arcade .row {
      transition:transform .24s ease, box-shadow .24s ease, border-color .24s ease;
    }
    body.theme-arcade .row:hover {
      transform:translateY(-3px);
      border-color:rgba(56,189,248,.6);
      box-shadow:0 18px 38px rgba(0,0,0,.5), 0 0 26px rgba(56,189,248,.22);
    }
    body.theme-arcade .theme-toggle button.active {
      background:linear-gradient(120deg,#22d3ee,#818cf8);
      color:#08111f;
    }

    /* ============ THEME: FIGHT NIGHT (spotlight arena) ============ */
    body.theme-fight {
      position:relative;
      background:
        radial-gradient(760px 520px at 50% -12%, rgba(250,204,21,.14), transparent 52%),
        radial-gradient(1200px 900px at 50% 128%, rgba(239,68,68,.12), transparent 58%),
        linear-gradient(180deg, #16110f 0%, #0c0908 60%, #070505 100%);
    }
    body.theme-fight .head h1,
    body.theme-fight .pod .nm,
    body.theme-fight .rowscore .v,
    body.theme-fight .weeklabel .rng,
    body.theme-fight .theme-toggle button {
      font-family:'Bebas Neue','Barlow Condensed',sans-serif;
      letter-spacing:.06em;
      text-transform:uppercase;
    }
    body.theme-fight .head h1 {
      font-size:62px;
      line-height:.92;
      background:linear-gradient(92deg,#fde68a 0%, #f59e0b 45%, #ef4444 100%);
      -webkit-background-clip:text; background-clip:text; color:transparent;
      text-shadow:0 4px 26px rgba(239,68,68,.28);
    }
    body.theme-fight .ribbon { grid-template-columns:repeat(5, minmax(0,1fr)); }
    body.theme-fight .stat,
    body.theme-fight .row,
    body.theme-fight .weekbar {
      border-radius:6px;
      border-color:rgba(250,204,21,.3);
      background:linear-gradient(160deg, rgba(30,20,18,.78), rgba(18,12,11,.7));
      box-shadow:0 18px 40px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,220,150,.06);
      backdrop-filter:blur(6px);
    }
    body.theme-fight .podium {
      grid-template-columns:1fr 1.15fr 1fr;
      gap:20px;
    }
    body.theme-fight .pod.rank1 .plinth {
      background:linear-gradient(180deg, rgba(250,204,21,.28), rgba(120,60,10,.18));
      border-color:rgba(250,204,21,.5);
    }
    body.theme-fight .plinth {
      font-size:36px;
      text-shadow:0 3px 14px rgba(0,0,0,.56);
      background:linear-gradient(180deg, rgba(120,90,60,.2), rgba(0,0,0,.32));
    }
    body.theme-fight .row {
      transition:transform .22s ease, box-shadow .22s ease, border-color .22s ease;
    }
    body.theme-fight .row:hover {
      transform:translateY(-2px);
      border-color:rgba(239,68,68,.5);
      box-shadow:0 20px 40px rgba(0,0,0,.55), 0 0 24px rgba(239,68,68,.16);
    }
    body.theme-fight .row.top1 {
      border-color:rgba(250,204,21,.55);
      box-shadow:0 20px 44px rgba(0,0,0,.55), inset 0 0 0 1px rgba(250,204,21,.3);
    }
    body.theme-fight .tag,
    body.theme-fight .mini,
    body.theme-fight .points-key .pk {
      border-radius:5px;
      border-color:rgba(250,204,21,.4);
      background:rgba(24,16,14,.6);
    }
    body.theme-fight .rowscore .v { color:#fbbf24; }
    body.theme-fight .theme-toggle button.active {
      background:linear-gradient(120deg,#ef4444,#f59e0b);
      color:#170a05;
    }

    @media (max-width: 860px) {
      .head h1 { font-size:28px; }
      .podium { grid-template-columns:1fr 1fr 1fr; gap:10px; }
      .who .nm { font-size:15px; }
      .avatar { width:64px; height:64px; font-size:22px; }
      .pod.rank1 .avatar { width:76px; height:76px; font-size:26px; }
      .pod .minis { display:none; }
      .row { grid-template-columns:40px 1fr auto; padding:10px 12px; }
      body.theme-arcade .podium { grid-template-columns:1fr; }
      body.theme-fight .head h1 { font-size:40px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <section class="head">
      <div>
        <h1>Weekly Leaderboard Live</h1>
        <p class="sub">Screen mode. No sign-in required. Auto refreshes every 30 seconds.</p>
      </div>
      <div class="weekbar">
        <button id="prevWeek" type="button" onclick="cycleWeek(-1)">&#9664; Prev</button>
        <div class="weeklabel">
          <div class="lbl" id="weekTitle">This Week</div>
          <div class="rng" id="weekRange">&mdash;</div>
        </div>
        <button id="nextWeek" type="button" onclick="cycleWeek(1)">Next &#9654;</button>
        <button id="thisWeek" class="now" type="button" onclick="jumpThisWeek()">This week</button>
      </div>
    </section>

    <div id="pointsKey" class="points-key"></div>

    <section class="funbar">
      <div class="theme-toggle" id="themeToggle">
        <button type="button" data-theme="classic">Champions</button>
        <button type="button" data-theme="arcade">Arcade</button>
        <button type="button" data-theme="fight">Fight Night</button>
      </div>
      <label class="confetti-toggle">
        <input type="checkbox" id="confettiToggle" checked />
        Celebrate rank jumps
      </label>
    </section>

    <section id="totals" class="ribbon"></section>
    <section id="podium" class="podium-wrap"></section>
    <section id="board" class="board"></section>
    <div id="status" class="status">Loading leaderboard&hellip;</div>
  </div>

  <div id="unlock" class="unlock">
    <div class="unlock-card">
      <h2>Enter dashboard password</h2>
      <p>This screen is protected. Enter the password to unlock the live leaderboard.</p>
      <div class="unlock-row">
        <input id="unlockPassword" type="password" placeholder="Password" autocomplete="current-password" />
        <button id="unlockButton" type="button">Unlock</button>
      </div>
      <div id="unlockError" class="unlock-error"></div>
    </div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
    const fmt = (n) => Number(n || 0).toLocaleString('en-GB');

    let WEEK_OFFSET = 0;
    let LOADING = false;
    const REFRESH_MS = 30000;
    let AUTO_REFRESH = null;
    const PASSWORD_KEY = 'weekly-dashboard-live-password';
    const WEEK_CACHE = new Map();
    const LAST_RANKS = new Map();
    const THEME_KEY = 'weekly-live-theme';
    const CONFETTI_KEY = 'weekly-live-confetti';

    function initials(name) {
      const parts = String(name || '').trim().split(/\s+/).filter(Boolean);
      if (!parts.length) return '?';
      return (parts[0][0] + (parts.length > 1 ? parts[parts.length - 1][0] : '')).toUpperCase();
    }

    function avatarFace(rep) {
      const avatar = rep && rep.avatar ? String(rep.avatar) : '';
      if (avatar.startsWith('data:')) {
        return `<img src="${esc(avatar)}" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:inherit" />`;
      }
      if (avatar) return esc(avatar);
      return esc(initials(rep && rep.owner));
    }

    function fmtRange(fromKey, toKey) {
      const f = new Date(`${fromKey}T00:00:00`);
      const t = new Date(`${toKey}T00:00:00`);
      if (Number.isNaN(f.getTime()) || Number.isNaN(t.getTime())) return '—';
      const opts = { day:'2-digit', month:'short' };
      return `${f.toLocaleDateString('en-GB', opts)} – ${t.toLocaleDateString('en-GB', opts)}`;
    }

    function ordinal(n) {
      const num = Number(n || 0);
      const abs = Math.abs(num);
      const mod100 = abs % 100;
      if (mod100 >= 11 && mod100 <= 13) return `${num}th`;
      const mod10 = abs % 10;
      if (mod10 === 1) return `${num}st`;
      if (mod10 === 2) return `${num}nd`;
      if (mod10 === 3) return `${num}rd`;
      return `${num}th`;
    }

    function withDisplayRanks(reps) {
      let lastScore = null;
      let lastRank = 0;
      const base = reps.map((rep, idx) => {
        const score = Number(rep?.score || 0);
        const displayRank = (lastScore !== null && score === lastScore) ? lastRank : (idx + 1);
        lastScore = score;
        lastRank = displayRank;
        return { ...rep, displayRank };
      });

      const rankCounts = new Map();
      for (const rep of base) {
        rankCounts.set(rep.displayRank, (rankCounts.get(rep.displayRank) || 0) + 1);
      }

      return base.map((rep) => {
        const joint = (rankCounts.get(rep.displayRank) || 0) > 1;
        const rankText = `${joint ? 'Joint ' : ''}${ordinal(rep.displayRank)}`;
        return { ...rep, rankText, joint };
      });
    }

    function repKey(rep) {
      return String(rep?.ownerId || rep?.owner || '').trim();
    }

    function readShareToken() {
      const params = new URLSearchParams(location.search);
      return params.get('token') || '';
    }

    function readSharePassword() {
      return sessionStorage.getItem(PASSWORD_KEY) || '';
    }

    function rememberPassword(password) {
      sessionStorage.setItem(PASSWORD_KEY, password);
    }

    function forgetPassword() {
      sessionStorage.removeItem(PASSWORD_KEY);
    }

    function setUnlocked(isUnlocked) {
      $('unlock').classList.toggle('hidden', !!isUnlocked);
    }

    async function getJson(url) {
      let res;
      try {
        res = await fetch(url, {
          cache: 'no-store',
          headers: {
            Accept: 'application/json',
            ...(readSharePassword() ? { 'x-dashboard-password': readSharePassword() } : {}),
          },
        });
      } catch {
        return { success: false, error: 'Network error while loading leaderboard' };
      }

      const text = await res.text();
      let data = null;
      try {
        data = text ? JSON.parse(text) : null;
      } catch {
        data = null;
      }

      if (!res.ok) {
        if (res.status === 401) {
          forgetPassword();
          setUnlocked(false);
        }
        return {
          success: false,
          error: (data && data.error) || `Leaderboard API error (${res.status})`,
        };
      }

      if (!data || typeof data !== 'object') {
        return { success: false, error: 'Leaderboard API returned invalid JSON' };
      }

      return data;
    }

    function streakHtml(streak) {
      const value = Number(streak || 0);
      if (value <= 0) return '';
      return `<span class="streak">${esc(value)}-week streak</span>`;
    }

    function rankMoveText(rankMove) {
      const move = Number(rankMove || 0);
      if (move > 0) return `Up ${move} place${move === 1 ? '' : 's'} this week.`;
      if (move < 0) return `Tough swing this week, bounce back is on.`;
      return 'Holding position with steady pressure.';
    }

    function moraleCallout(rep) {
      const delta = Number(rep?.deltas?.score || 0);
      const rank = Number(rep?.displayRank || 0);
      if (rank === 1) return `Setting the tempo this week. ${rankMoveText(rep.rankMove)}`;
      if (delta > 0) return `Momentum building nicely. ${rankMoveText(rep.rankMove)}`;
      if (delta < 0) return 'Still in the fight. One great session can flip this fast.';
      return 'Consistency counts. Keep stacking quality conversations.';
    }

    async function getWeekSnapshot(offset) {
      if (WEEK_CACHE.has(offset)) return WEEK_CACHE.get(offset);
      const token = readShareToken();
      const query = new URLSearchParams({ weekOffset: String(offset), t: String(Date.now()) });
      if (token) query.set('token', token);
      const data = await getJson(`/api/weekly-dashboard-public?${query.toString()}`);
      if (!data || !data.success) {
        WEEK_CACHE.set(offset, null);
        return null;
      }
      const ranked = withDisplayRanks(Array.isArray(data.reps) ? data.reps : []);
      const map = new Map(ranked.map((rep) => [repKey(rep), { score: Number(rep.score || 0), rank: Number(rep.displayRank || 0) }]));
      WEEK_CACHE.set(offset, map);
      return map;
    }

    async function enrichReps(reps) {
      const priorMap = await getWeekSnapshot(WEEK_OFFSET - 1);
      const olderMaps = await Promise.all([1,2,3,4,5].map((step) => getWeekSnapshot(WEEK_OFFSET - 1 - step)));

      const enriched = reps.map((rep) => {
        const key = repKey(rep);
        const previous = priorMap?.get(key) || null;
        let streak = 0;
        let pivot = Number(rep.score || 0);
        const checks = [priorMap, ...olderMaps];
        for (const map of checks) {
          const value = Number(map?.get(key)?.score || 0);
          if (pivot > value) {
            streak += 1;
            pivot = value;
          } else {
            break;
          }
        }
        const rankMove = previous && previous.rank ? (previous.rank - Number(rep.displayRank || 0)) : 0;
        const seenRank = LAST_RANKS.get(key);
        const liveRise = Number.isFinite(seenRank) && seenRank > Number(rep.displayRank || 0);
        return {
          ...rep,
          streak,
          rankMove,
          liveRise,
          callout: moraleCallout({ ...rep, rankMove }),
        };
      });

      LAST_RANKS.clear();
      enriched.forEach((rep) => LAST_RANKS.set(repKey(rep), Number(rep.displayRank || 0)));
      return enriched;
    }

    function ensureConfettiLayer() {
      let layer = document.querySelector('.confetti-layer');
      if (!layer) {
        layer = document.createElement('div');
        layer.className = 'confetti-layer';
        document.body.appendChild(layer);
      }
      return layer;
    }

    function confettiBurst() {
      const enabled = $('confettiToggle')?.checked;
      if (!enabled) return;
      const layer = ensureConfettiLayer();
      const bits = ['*', '+', 'o', '#'];
      for (let i = 0; i < 48; i += 1) {
        const node = document.createElement('div');
        node.className = 'confetti';
        node.textContent = bits[i % bits.length];
        node.style.left = `${Math.random() * 100}%`;
        node.style.color = ['#f59e0b', '#22c55e', '#60a5fa', '#f472b6'][i % 4];
        node.style.animationDelay = `${Math.random() * 180}ms`;
        node.style.animationDuration = `${1200 + Math.random() * 900}ms`;
        layer.appendChild(node);
        setTimeout(() => node.remove(), 2400);
      }
    }

    function totalsHtml(totals, totalsDeltas) {
      const cards = [
        { key:'dealsClosed', label:'Deals closed', value: totals.dealsClosed, em:'🏆' },
        { key:'proposalsSent', label:'Proposals sent', value: totals.proposalsSent, em:'📨' },
        { key:'meetingsAttended', label:'Meetings attended', value: totals.meetingsAttended, em:'🤝' },
        { key:'meetingsBooked', label:'Meetings booked', value: totals.meetingsBooked, em:'📅' },
        { key:'qualifiedContacts', label:'Qualified contacts', value: totals.qualifiedContacts, em:'✅' },
        { key:'calls', label:'Positive calls', value: totals.calls, em:'📞' },
        { key:'callsMadeWeek', label:'Calls made this week', value: totals.callsMadeWeek, em:'📞' },
      ];
      return cards.map((c) => `
        <article class="stat">
          <span class="em">${c.em}</span>
          <div class="k">${esc(c.label)}</div>
          <div class="v">${esc(fmt(c.value))}</div>
          <div class="cmp">${deltaHtml(totalsDeltas?.[c.key])}</div>
        </article>`).join('');
    }

    function pointsKeyHtml(weights) {
      const w = weights || {};
      const items = [
        { label: 'Deal closed', value: w.dealsClosed ?? 100 },
        { label: 'Proposal sent', value: w.proposalsSent ?? 65 },
        { label: 'Meeting attended', value: w.meetingsAttended ?? 40 },
        { label: 'Meeting booked', value: w.meetingsBooked ?? 25 },
        { label: 'Qualified contact', value: w.qualifiedContacts ?? 15 },
        { label: 'Positive call', value: w.callsAnswered ?? 0.5 },
      ];
      return items.map((item) => `<span class="pk">${esc(item.label)} = <b>${esc(fmt(item.value))} pts</b></span>`).join('');
    }

    function deltaHtml(value) {
      const delta = Number(value || 0);
      if (delta > 0) return `<span class="delta up">▲ +${esc(fmt(delta))}</span>`;
      if (delta < 0) return `<span class="delta down">▼ ${esc(fmt(delta))}</span>`;
      return `<span class="delta flat">• 0</span>`;
    }

    function podMinis(rep) {
      const items = [
        { n: rep.dealsClosed, k: 'Closed' },
        { n: rep.proposalsSent, k: 'Proposals' },
        { n: rep.meetingsAttended, k: 'Attend' },
        { n: rep.meetingsBooked, k: 'Booked' },
        { n: rep.qualifiedContacts, k: 'Qual' },
        { n: rep.callsMadeWeek, k: 'Calls this week' },
        { n: rep.calls, k: 'Positive' },
      ];
      return `<div class="minis">${items.map((m) => `<div class="mini"><div class="mn">${esc(fmt(m.n))}</div><div class="mk">${esc(m.k)}</div></div>`).join('')}</div>`;
    }

    function podCard(rep, place) {
      if (!rep) {
        return `<div class="pod p${place}"><div class="avatar">—</div><div class="nm">—</div><div class="sc">No rep</div><div class="plinth">${ordinal(place)}</div></div>`;
      }
      const crown = rep.displayRank === 1 ? '<span class="crown">👑</span>' : '';
      const medalEmoji = rep.displayRank === 1 ? '🥇' : (rep.displayRank === 2 ? '🥈' : (rep.displayRank === 3 ? '🥉' : ''));
      const hasImg = rep.avatar && String(rep.avatar).startsWith('data:');
      const colorStyle = (!hasImg && rep.avatarColor) ? ` style="background:${esc(rep.avatarColor)};color:#fff"` : '';
      return `<div class="pod p${place} rank${rep.displayRank}${rep.joint ? ' joint' : ''}${rep.liveRise ? ' rank-rise' : ''}">
        <div class="avatar"${colorStyle}>${crown}${avatarFace(rep)}<span class="medal">${esc(rep.displayRank)}</span></div>
        <div class="nm">${esc(rep.owner || 'Unassigned')}</div>
        <div class="sc">${medalEmoji} <b>${esc(fmt(rep.score))}</b> pts</div>
        ${rep.joint ? '<div class="joint-chip">Joint place</div>' : ''}
        ${streakHtml(rep.streak)}
        ${podMinis(rep)}
        <div class="callout">${esc(rep.callout || '')}</div>
        <div class="plinth">${esc(rep.rankText)}</div>
      </div>`;
    }

    function renderPodium(reps) {
      if (!reps.length) { $('podium').innerHTML = ''; return; }
      const first = reps[0] || null;
      const second = reps[1] || null;
      const third = reps[2] || null;
      $('podium').innerHTML = `<div class="podium">
        ${podCard(second, 2)}
        ${podCard(first, 1)}
        ${podCard(third, 3)}
      </div>`;
    }

    function rowHtml(rep) {
      const rankClass = rep.displayRank <= 3 ? `top${rep.displayRank}` : '';
      const medal = rep.displayRank === 1 ? '🥇' : (rep.displayRank === 2 ? '🥈' : (rep.displayRank === 3 ? '🥉' : ''));
      return `<div class="row ${rankClass}${rep.liveRise ? ' rank-rise' : ''}">
        <div class="rk">${medal || esc(rep.displayRank)}<small>${esc(rep.rankText)}</small></div>
        <div class="who">
          <div class="nm">${esc(rep.owner || 'Unassigned')}${streakHtml(rep.streak)}</div>
          <div class="brk">
            <span class="tag">Closed <b>${esc(fmt(rep.dealsClosed))}</b>${deltaHtml(rep?.deltas?.dealsClosed)}</span>
            <span class="tag">Proposals <b>${esc(fmt(rep.proposalsSent))}</b>${deltaHtml(rep?.deltas?.proposalsSent)}</span>
            <span class="tag">Attended <b>${esc(fmt(rep.meetingsAttended))}</b>${deltaHtml(rep?.deltas?.meetingsAttended)}</span>
            <span class="tag">Booked <b>${esc(fmt(rep.meetingsBooked))}</b>${deltaHtml(rep?.deltas?.meetingsBooked)}</span>
            <span class="tag">Qualified <b>${esc(fmt(rep.qualifiedContacts))}</b>${deltaHtml(rep?.deltas?.qualifiedContacts)}</span>
            <span class="tag">This week <b>${esc(fmt(rep.callsMadeWeek))}</b>${deltaHtml(rep?.deltas?.callsMadeWeek)}</span>
            <span class="tag">Positive <b>${esc(fmt(rep.calls))}</b></span>
          </div>
          <div class="callout">${esc(rep.callout || '')}</div>
        </div>
        <div class="rowscore">
          <div class="v">${esc(fmt(rep.score))}</div>
          <div class="k">Points</div><div class="d">${deltaHtml(rep?.deltas?.score)}</div>
        </div>
      </div>`;
    }

    function renderBoard(reps) {
      if (!reps.length) {
        $('board').innerHTML = '';
        return;
      }
      $('board').innerHTML = `<h2>Full standings</h2>${reps.map(rowHtml).join('')}`;
    }

    function syncWeekControls(filters) {
      $('nextWeek').disabled = WEEK_OFFSET >= 0;
      $('thisWeek').disabled = WEEK_OFFSET === 0;
      if (WEEK_OFFSET === 0) $('weekTitle').textContent = 'This Week';
      else if (WEEK_OFFSET === -1) $('weekTitle').textContent = 'Last Week';
      else $('weekTitle').textContent = `${Math.abs(WEEK_OFFSET)} Weeks Ago`;
      const from = filters?.weekStart || filters?.from;
      const to = filters?.weekEnd || filters?.to;
      $('weekRange').textContent = fmtRange(from, to);
    }

    function applyTheme(theme) {
      document.body.classList.remove('theme-classic', 'theme-arcade', 'theme-fight');
      if (theme === 'classic') document.body.classList.add('theme-classic');
      if (theme === 'arcade') document.body.classList.add('theme-arcade');
      if (theme === 'fight') document.body.classList.add('theme-fight');
      document.querySelectorAll('#themeToggle button').forEach((btn) => {
        btn.classList.toggle('active', btn.dataset.theme === theme);
      });
      localStorage.setItem(THEME_KEY, theme);
    }

    function initFunControls() {
      const savedTheme = localStorage.getItem(THEME_KEY) || 'classic';
      applyTheme(savedTheme);
      document.querySelectorAll('#themeToggle button').forEach((btn) => {
        btn.addEventListener('click', () => applyTheme(btn.dataset.theme || 'classic'));
      });

      const confettiToggle = $('confettiToggle');
      const savedConfetti = localStorage.getItem(CONFETTI_KEY);
      confettiToggle.checked = savedConfetti !== 'off';
      confettiToggle.addEventListener('change', () => {
        localStorage.setItem(CONFETTI_KEY, confettiToggle.checked ? 'on' : 'off');
      });
    }

    async function loadDashboard() {
      if (LOADING) return;
      LOADING = true;
      $('status').textContent = 'Loading leaderboard…';
      const token = readShareToken();
      const query = new URLSearchParams({ weekOffset: String(WEEK_OFFSET), t: String(Date.now()) });
      if (token) query.set('token', token);
      const data = await getJson(`/api/weekly-dashboard-public?${query.toString()}`);
      LOADING = false;
      if (!data || !data.success) {
        $('totals').innerHTML = '';
        $('podium').innerHTML = '';
        $('board').innerHTML = '<div class="empty">Leaderboard unavailable right now.</div>';
        $('status').textContent = (data && data.error) || 'Could not load leaderboard';
        return;
      }
      const reps = Array.isArray(data.reps) ? data.reps : [];
      const rankedReps = await enrichReps(withDisplayRanks(reps));
      syncWeekControls(data.filters || {});
      $('pointsKey').innerHTML = pointsKeyHtml(data.scoreWeights || {});
      $('totals').innerHTML = totalsHtml(data.totals || {}, data.totalsDeltas || {});
      if (!rankedReps.length) {
        $('podium').innerHTML = '';
        $('board').innerHTML = '<div class="empty">No activity recorded for this week yet. Get on the phones! 📞</div>';
      } else {
        renderPodium(rankedReps);
        renderBoard(rankedReps);
      }

      const rising = rankedReps.some((rep) => rep.liveRise);
      const leader = repKey(rankedReps[0]);
      const lastLeader = window.__lastLeader || null;
      if ((rising || (lastLeader && leader !== lastLeader)) && $('confettiToggle')?.checked) {
        confettiBurst();
      }
      window.__lastLeader = leader;

      const f = data.filters || {};
      const updated = data.lastUpdatedAt ? new Date(data.lastUpdatedAt).toLocaleTimeString('en-GB') : '';
      $('status').textContent = `${rankedReps.length} rep${rankedReps.length === 1 ? '' : 's'} · ${fmtRange(f.weekStart || f.from, f.weekEnd || f.to)} · ${f.timeZone || 'UTC'}${f.isCurrentWeek ? ' · live to now' : ''} · last refresh ${updated}`;
    }

    function cycleWeek(delta) {
      const next = WEEK_OFFSET + delta;
      if (next > 0) return;
      WEEK_OFFSET = next;
      loadDashboard();
    }

    function jumpThisWeek() {
      WEEK_OFFSET = 0;
      loadDashboard();
    }

    window.cycleWeek = cycleWeek;
    window.jumpThisWeek = jumpThisWeek;

    async function unlockDashboard() {
      const password = $('unlockPassword').value.trim();
      if (!password) {
        $('unlockError').textContent = 'Enter the password.';
        return;
      }
      rememberPassword(password);
      $('unlockError').textContent = '';
      setUnlocked(true);
      await loadDashboard();
    }

    window.addEventListener('DOMContentLoaded', () => {
      setUnlocked(false);
      $('unlockPassword').value = readSharePassword();
      $('unlockButton').addEventListener('click', unlockDashboard);
      $('unlockPassword').addEventListener('keydown', (event) => {
        if (event.key === 'Enter') unlockDashboard();
      });
      initFunControls();
      loadDashboard();
      AUTO_REFRESH = setInterval(loadDashboard, REFRESH_MS);
    });
  </script>
</body>
</html>
