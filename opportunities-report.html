<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pipeline Report</title>
  <style>
    :root { --bd:#e5e7eb; --ink:#0f172a; --muted:#64748b; --panel:#ffffff; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; background:radial-gradient(1200px 520px at 10% -10%, #dbeafe 0%, transparent 55%), radial-gradient(900px 420px at 100% 0%, #dcfce7 0%, transparent 50%), #eef2f7; color:var(--ink); }
    .wrap { max-width:1500px; margin:0 auto; padding:28px 22px; }
    .card { background:var(--panel); border-radius:18px; border:1px solid #dbe4f0; box-shadow:0 10px 34px rgba(15,23,42,.08), 0 2px 10px rgba(15,23,42,.04); padding:18px; }
    .top { display:flex; justify-content:space-between; align-items:flex-start; gap:16px; flex-wrap:wrap; margin-bottom:14px; }
    .title { margin:0; font-size:28px; }
    .muted { color:var(--muted); font-size:13px; }
    .toolbar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
    select, button { height:38px; border-radius:10px; font:inherit; font-size:13px; }
    select { border:1px solid #d1d5db; padding:0 12px; background:#fff; }
    button { border:none; background:#2563eb; color:#fff; padding:0 14px; cursor:pointer; font-weight:600; }
    .kpis { display:grid; grid-template-columns:repeat(auto-fit, minmax(180px, 1fr)); gap:10px; margin:12px 0 16px; }
    .kpi { background:linear-gradient(180deg,#fff 0%, #f8fafc 100%); border:1px solid var(--bd); border-radius:12px; padding:10px 12px; }
    .kpi .k { font-size:11px; text-transform:uppercase; letter-spacing:.03em; color:var(--muted); }
    .kpi .v { margin-top:6px; font-size:24px; font-weight:800; }
    .grid { display:grid; grid-template-columns:1.2fr 1.3fr 1fr; gap:12px; }
    .panel { border:1px solid var(--bd); border-radius:14px; background:#fff; padding:12px; min-width:0; }
    .panel h3 { margin:0 0 10px; font-size:15px; }
    .tablewrap { overflow:auto; border:1px solid var(--bd); border-radius:12px; }
    table { width:100%; border-collapse:collapse; font-size:12px; min-width:620px; }
    th, td { padding:9px 10px; border-bottom:1px solid #eef2f7; text-align:left; white-space:nowrap; }
    th { background:#f8fafc; color:#374151; position:sticky; top:0; }
    @media (max-width: 1100px) { .grid { grid-template-columns:1fr; } }
  </style>
  <link rel="stylesheet" href="/sales-app.css" />
</head>
<body class="sq">
  <div class="app">
    <aside class="sidebar" id="sqSidebar"></aside>
    <main class="app-main">
      <div class="wrap">
        <div class="card">
          <div class="top">
            <div>
              <h1 class="title">Pipeline Report</h1>
              <div class="muted">Current opportunity values, stage ageing, and lost-reason reporting for the local pipeline.</div>
            </div>
            <div class="toolbar">
              <select id="ownerFilter"></select>
              <button id="refreshBtn">Refresh</button>
            </div>
          </div>
          <div class="kpis" id="kpis"></div>
          <div id="status" class="muted" style="margin-bottom:12px">Loading...</div>
          <div class="grid">
            <div class="panel"><h3>By Stage</h3><div class="tablewrap"><table><thead><tr><th>Stage</th><th>Count</th><th>MRR</th><th>One-off</th><th>Avg age</th></tr></thead><tbody id="stageRows"></tbody></table></div></div>
            <div class="panel"><h3>By Owner</h3><div class="tablewrap"><table><thead><tr><th>Owner</th><th>Count</th><th>MRR</th><th>One-off</th><th>Won</th><th>Lost</th><th>Avg age</th></tr></thead><tbody id="ownerRows"></tbody></table></div></div>
            <div class="panel"><h3>Loss Reasons</h3><div class="tablewrap"><table><thead><tr><th>Reason</th><th>Count</th><th>Total value</th></tr></thead><tbody id="lossRows"></tbody></table></div></div>
          </div>
        </div>
      </div>
    </main>
  </div>
  <script src="/sales-app.js"></script>
  <script>
    const REPS = [
      { id: '', name: 'All reps' },
      { id: '6FX5X4kH2JFJc6u9zhSC', name: 'Brendon Mwatsenekenyi' },
      { id: 'XbyxbOK1Q1raRCjjGx4O', name: 'Zain Safir-Sheikh' },
      { id: 's7OG2BM94q7uNRsHLqM7', name: 'Amir Ward' },
    ];
    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
    const fmt = (n) => Number(n || 0).toLocaleString('en-GB');
    const fmtCurrency = (n) => `£${Number(n || 0).toLocaleString('en-GB', { minimumFractionDigits: 0, maximumFractionDigits: 0 })}`;
    const fmtDays = (n) => n == null || Number.isNaN(Number(n)) ? '—' : `${Number(n).toFixed(1)}d`;
    function showLogin() { location.href = '/login?next=' + encodeURIComponent(location.pathname); }
    function renderOwnerFilter() { $('ownerFilter').innerHTML = REPS.map((rep) => `<option value="${esc(rep.id)}">${esc(rep.name)}</option>`).join(''); }
    function renderKpis(summary) {
      $('kpis').innerHTML = [
        { label: 'Opportunities', value: fmt(summary.total_count || 0) },
        { label: 'Total MRR', value: fmtCurrency(summary.total_mrr || 0) },
        { label: 'Total one-off', value: fmtCurrency(summary.total_one_off || 0) },
        { label: 'Due today', value: fmt(summary.due_today || 0) },
        { label: 'Overdue', value: fmt(summary.overdue || 0) },
        { label: 'Avg stage age', value: fmtDays(summary.avg_stage_age_days) },
      ].map((item) => `<div class="kpi"><div class="k">${esc(item.label)}</div><div class="v">${esc(item.value)}</div></div>`).join('');
    }
    function renderTableRows(rows, target, mapper, emptyColspan) {
      $(target).innerHTML = rows.length ? rows.map(mapper).join('') : `<tr><td colspan="${emptyColspan}">No data.</td></tr>`;
    }
    async function loadReport() {
      $('status').textContent = 'Loading pipeline report...';
      const params = new URLSearchParams();
      if ($('ownerFilter').value) params.set('ownerId', $('ownerFilter').value);
      const res = await fetch(`/api/opportunities-report?${params.toString()}`, { credentials:'same-origin' });
      if (res.status === 401) { showLogin(); return; }
      if (res.status === 403) { $('status').textContent = 'Reports are available to managers and admins.'; return; }
      const data = await res.json();
      if (!data.success) { $('status').textContent = data.error || 'Could not load report'; return; }
      renderKpis(data.summary || {});
      renderTableRows(data.byStage || [], 'stageRows', (row) => `<tr><td>${esc(row.stage || 'Unknown')}</td><td>${fmt(row.count || 0)}</td><td>${fmtCurrency(row.total_mrr || 0)}</td><td>${fmtCurrency(row.total_one_off || 0)}</td><td>${fmtDays(row.avg_age_days)}</td></tr>`, 5);
      renderTableRows(data.byOwner || [], 'ownerRows', (row) => `<tr><td>${esc(row.owner || 'Unknown')}</td><td>${fmt(row.count || 0)}</td><td>${fmtCurrency(row.total_mrr || 0)}</td><td>${fmtCurrency(row.total_one_off || 0)}</td><td>${fmt(row.won_count || 0)}</td><td>${fmt(row.lost_count || 0)}</td><td>${fmtDays(row.avg_age_days)}</td></tr>`, 7);
      renderTableRows(data.lossReasons || [], 'lossRows', (row) => `<tr><td>${esc(row.reason || 'Unknown')}</td><td>${fmt(row.count || 0)}</td><td>${fmtCurrency(row.total_value || 0)}</td></tr>`, 3);
      $('status').textContent = 'Pipeline report loaded.';
    }
    window.addEventListener('DOMContentLoaded', () => {
      SQ.init(() => {
        renderOwnerFilter();
        $('ownerFilter').addEventListener('change', loadReport);
        $('refreshBtn').addEventListener('click', loadReport);
        loadReport();
      });
    });
  </script>
</body>
</html>
