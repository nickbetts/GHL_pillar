<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Opportunities</title>
  <style>
    :root {
      --bd:#e5e7eb;
      --ink:#0f172a;
      --muted:#64748b;
      --panel:#ffffff;
      --wash:#f8fafc;
    }
    * { box-sizing:border-box; }
    body { margin:0; font-family:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; background:radial-gradient(1200px 520px at 10% -10%, #dbeafe 0%, transparent 55%), radial-gradient(900px 420px at 100% 0%, #dcfce7 0%, transparent 50%), #eef2f7; color:var(--ink); -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility; }
    .wrap { max-width:100%; margin:0 auto; padding:28px 22px; }
    .card { background:var(--panel); border-radius:18px; border:1px solid #dbe4f0; box-shadow:0 10px 34px rgba(15,23,42,.08), 0 2px 10px rgba(15,23,42,.04); padding:18px; }
    .top { display:flex; justify-content:space-between; align-items:flex-start; gap:16px; flex-wrap:wrap; margin-bottom:14px; }
    .title { margin:0; font-size:28px; }
    .muted { color:var(--muted); font-size:13px; }
    .toolbar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    input, select { height:38px; border:1px solid #d1d5db; border-radius:10px; padding:0 12px; font:inherit; font-size:13px; background:#fff; }
    input:focus, select:focus { outline:none; border-color:#2563eb; box-shadow:0 0 0 3px rgba(37,99,235,.12); }
    button { height:38px; border:none; border-radius:10px; background:#2563eb; color:#fff; padding:0 14px; cursor:pointer; font-size:13px; font-weight:600; }
    button.ghost { background:#fff; color:#374151; border:1px solid #d8dce2; }
    .pipeline-wrap { overflow-x:auto; overflow-y:hidden; padding-bottom:8px; margin:0 -2px; }
    .pipeline-wrap::-webkit-scrollbar { height:12px; }
    .pipeline-wrap::-webkit-scrollbar-thumb { background:#cbd5e1; border-radius:999px; border:3px solid #f8fafc; }
    .pipeline-wrap::-webkit-scrollbar-track { background:transparent; }
    .pipeline { display:grid; grid-auto-flow:column; grid-auto-columns:minmax(340px, 340px); gap:14px; align-items:start; min-width:max-content; padding:2px; }
    .lane { background:linear-gradient(180deg,#f8fafc 0%, #f1f5f9 100%); border:1px solid var(--bd); border-radius:18px; min-width:340px; min-height:520px; display:flex; flex-direction:column; overflow:hidden; }
    .lane.drag-over { border-color:#60a5fa; box-shadow:inset 0 0 0 2px rgba(96,165,250,.3); }
    .lane-head { padding:16px 16px 12px; border-bottom:1px solid rgba(15,23,42,.06); background:rgba(255,255,255,.55); }
    .lane-title { display:flex; align-items:center; justify-content:space-between; gap:8px; margin:0; font-size:15px; }
    .lane-count { display:inline-flex; align-items:center; justify-content:center; min-width:28px; height:28px; padding:0 8px; border-radius:999px; background:#fff; color:#334155; border:1px solid #dbe4f0; font-size:12px; font-weight:700; }
    .lane-sub { margin-top:4px; font-size:12px; color:var(--muted); }
    .lane-body { padding:12px; display:grid; gap:12px; }
    .opp-card { background:#fff; border:1px solid #e2e8f0; border-radius:16px; padding:14px; box-shadow:0 4px 14px rgba(15,23,42,.05); cursor:grab; display:flex; flex-direction:column; gap:10px; }
    .opp-card:active { cursor:grabbing; }
    .opp-top { display:flex; justify-content:space-between; gap:10px; align-items:flex-start; }
    .opp-name { margin:0; font-size:15px; font-weight:700; }
    .opp-owner { display:inline-flex; align-items:center; gap:6px; font-size:11px; font-weight:700; color:#1d4ed8; background:#dbeafe; border-radius:999px; padding:4px 8px; white-space:nowrap; }
    .opp-company { margin-top:4px; color:#475569; font-size:12px; }
    .opp-meta { display:grid; gap:4px; font-size:12px; color:#475569; }
    .opp-meta a { color:#2563eb; text-decoration:none; }
    .opp-meta a:hover { text-decoration:underline; }
    .chips { display:flex; flex-wrap:wrap; gap:6px; }
    .chip { display:inline-flex; align-items:center; border-radius:999px; padding:4px 8px; font-size:11px; font-weight:600; background:#eef2ff; color:#4338ca; }
    .chip.good { background:#dcfce7; color:#166534; }
    .chip.warn { background:#fef3c7; color:#92400e; }
    .chip.info { background:#dbeafe; color:#1d4ed8; }
    .opp-notes { padding-top:10px; border-top:1px solid #eef2f7; font-size:12px; color:#64748b; line-height:1.45; }
    .opp-actions { display:flex; gap:8px; flex-wrap:wrap; margin-top:auto; }
    .opp-actions a { display:inline-flex; align-items:center; justify-content:center; height:32px; padding:0 10px; border-radius:8px; text-decoration:none; font-size:12px; font-weight:700; }
    .a-call { background:#0ea5e9; color:#fff; }
    .a-mail { background:#4f46e5; color:#fff; }
    .a-web { background:#111827; color:#fff; }
    .stage-select { width:100%; height:36px; border:1px solid #d1d5db; border-radius:10px; font:inherit; font-size:12px; padding:0 10px; background:#fff; }
    .empty { padding:24px 14px; font-size:12px; color:#94a3b8; background:rgba(255,255,255,.5); border:1px dashed #dbe4f0; border-radius:14px; }
    .kpis { display:grid; grid-template-columns:repeat(auto-fit, minmax(180px, 1fr)); gap:10px; margin:12px 0 16px; }
    .kpi { background:linear-gradient(180deg,#fff 0%, #f8fafc 100%); border:1px solid var(--bd); border-radius:12px; padding:10px 12px; }
    .kpi .k { font-size:11px; text-transform:uppercase; letter-spacing:.03em; color:var(--muted); }
    .kpi .v { margin-top:6px; font-size:24px; font-weight:800; }
    @media (max-width: 680px) {
      .wrap { padding:16px 10px; }
      .pipeline { grid-auto-columns:minmax(290px, 290px); gap:10px; }
      .lane { min-width:290px; min-height:460px; }
      .lane-head { padding:14px 14px 10px; }
      .lane-body { padding:10px; gap:10px; }
      .opp-card { padding:12px; gap:8px; }
    }
  </style>
  <link rel="stylesheet" href="/sales-app.css" />
</head>
<body class="sq">
  <div class="app">
    <aside class="sidebar" id="sqSidebar"></aside>
    <main class="app-main">
      <div class="wrap">
        <div class="card">
          <div class="top">
            <div>
              <h1 class="title">Opportunities</h1>
              <div class="muted">Qualified leads move here as a lightweight pipeline board. Moving an opportunity to Won is what pushes it into GHL.</div>
            </div>
            <div class="toolbar">
              <input id="search" placeholder="Search contact, company or notes" />
              <select id="ownerFilter"></select>
              <button class="ghost" id="refreshBtn">Refresh</button>
            </div>
          </div>
          <div class="kpis" id="kpis"></div>
          <div id="status" class="muted" style="margin-bottom:10px">Loading...</div>
          <div class="pipeline-wrap"><div class="pipeline" id="pipeline"></div></div>
        </div>
      </div>
    </main>
  </div>

  <script src="/sales-app.js"></script>
  <script>
    const STAGES = [
      { key: 'qualified', label: 'Qualified', accent: '#8b5cf6', hint: 'Freshly qualified and ready to advance.' },
      { key: 'scoping', label: 'Scoping', accent: '#60a5fa', hint: 'Discovery and requirements shaping.' },
      { key: 'proposal', label: 'Proposal', accent: '#3b82f6', hint: 'Commercial proposal or scope review.' },
      { key: 'won', label: 'Won', accent: '#22c55e', hint: 'Closed won and handed over.' },
      { key: 'lost', label: 'Lost', accent: '#f87171', hint: 'Closed lost or paused out.' },
    ];

    const REPS = [
      { id: '', name: 'All reps' },
      { id: '6FX5X4kH2JFJc6u9zhSC', name: 'Brendon Mwatsenekenyi' },
      { id: 'XbyxbOK1Q1raRCjjGx4O', name: 'Zain Safir-Sheikh' },
      { id: 's7OG2BM94q7uNRsHLqM7', name: 'Amir Ward' },
    ];

    const DEMO_OPPORTUNITY = {
      id: 'demo-opportunity-1',
      status: 'qualified',
      opportunityStage: 'qualified',
      name: 'Demo Opportunity',
      title: 'Founder',
      companyName: 'Northstar Advisory',
      ownerId: '6FX5X4kH2JFJc6u9zhSC',
      owner: 'Brendon Mwatsenekenyi',
      sector: 'Professional Services',
      subSector: 'Consultancy',
      email: 'demo@northstar.example',
      phone: '0207 555 0101',
      directPhone: '',
      companyWebsite: 'https://example.com',
      callNotes: 'Demo opportunity for pipeline layout. This card is local-only and can be moved between stages without affecting live data.',
      qualifyAnswers: { services: ['SEO', 'Web Design'], budget: '£3k-4k', timeline: '1-3 months', painPoint: 'Lead quality', agencyBefore: 'Yes' },
      isDemo: true,
    };

    let LEADS = [];
    let draggingId = null;

    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
    const fmt = (n) => Number(n || 0).toLocaleString('en-GB');

    function showLogin() { location.href = '/login?next=' + encodeURIComponent(location.pathname); }

    function api(body) {
      return fetch('/api/apollo-sales-queue', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'same-origin',
        body: JSON.stringify(body),
      }).then(async (res) => {
        if (res.status === 401) { showLogin(); return { success:false, error:'Not signed in' }; }
        const data = await res.json().catch(() => ({ success:false, error:'Request failed' }));
        return data;
      });
    }

    function normalizedStage(lead) {
      return STAGES.some((stage) => stage.key === lead.opportunityStage) ? lead.opportunityStage : 'qualified';
    }

    function ownerName(ownerId) {
      return REPS.find((rep) => rep.id === ownerId)?.name || 'Unassigned';
    }

    function renderOwnerFilter() {
      $('ownerFilter').innerHTML = REPS.map((rep) => `<option value="${esc(rep.id)}">${esc(rep.name)}</option>`).join('');
    }

    function scopedLeads() {
      const q = ($('search').value || '').trim().toLowerCase();
      const ownerId = $('ownerFilter').value || '';
      return LEADS.filter((lead) => {
        if (lead.status !== 'qualified') return false;
        if (ownerId && String(lead.ownerId || '') !== ownerId) return false;
        if (!q) return true;
        const hay = [lead.name, lead.title, lead.companyName, lead.callNotes, lead.email, lead.sector, lead.subSector]
          .map((v) => String(v || '').toLowerCase()).join(' ');
        return hay.includes(q);
      });
    }

    function answerChips(lead) {
      const answers = lead.qualifyAnswers && typeof lead.qualifyAnswers === 'object' ? lead.qualifyAnswers : null;
      if (!answers) return '';
      const chips = [];
      if (Array.isArray(answers.services) && answers.services.length) chips.push(`<span class="chip good">${esc(answers.services.join(', '))}</span>`);
      if (answers.budget) chips.push(`<span class="chip warn">Budget: ${esc(answers.budget)}</span>`);
      if (answers.timeline) chips.push(`<span class="chip info">Timeline: ${esc(answers.timeline)}</span>`);
      if (answers.painPoint) chips.push(`<span class="chip">Pain: ${esc(answers.painPoint)}</span>`);
      if (answers.agencyBefore) chips.push(`<span class="chip">Agency before: ${esc(answers.agencyBefore)}</span>`);
      return chips.length ? `<div class="chips">${chips.join('')}</div>` : '';
    }

    function cardHtml(lead) {
      const stage = normalizedStage(lead);
      const phone = lead.directPhone || lead.phone || '';
      const notes = String(lead.callNotes || '').trim();
      return `<article class="opp-card" draggable="true" data-id="${esc(lead.id)}" data-stage="${esc(stage)}">
        <div class="opp-top">
          <div>
            <h3 class="opp-name">${esc(lead.name || 'Unknown')}</h3>
            <div class="opp-company">${esc(lead.title || 'No title')} · ${esc(lead.companyName || 'Unknown company')}</div>
          </div>
          <span class="opp-owner">${esc(ownerName(lead.ownerId))}</span>
        </div>
        <div class="opp-meta">
          <div>${esc(lead.sector || 'Unknown')} / ${esc(lead.subSector || 'Unknown')}</div>
          <div>${lead.email ? `<a href="mailto:${esc(lead.email)}">${esc(lead.email)}</a>` : 'No email'}${phone ? ` · <a href="tel:${esc(phone)}">${esc(phone)}</a>` : ''}</div>
        </div>
        ${lead.isDemo ? `<div class="chips"><span class="chip info">Demo card</span></div>` : ''}
        ${answerChips(lead)}
        ${notes ? `<div class="opp-notes">${esc(notes)}</div>` : ''}
        <div class="opp-actions">
          ${phone ? `<a class="a-call" href="tel:${esc(phone)}">Call</a>` : ''}
          ${lead.email ? `<a class="a-mail" href="mailto:${esc(lead.email)}">Email</a>` : ''}
          ${lead.companyWebsite ? `<a class="a-web" href="${esc(lead.companyWebsite)}" target="_blank" rel="noopener noreferrer">Web</a>` : ''}
        </div>
        <select class="stage-select" data-id="${esc(lead.id)}">
          ${STAGES.map((s) => `<option value="${s.key}" ${s.key === stage ? 'selected' : ''}>${esc(s.label)}</option>`).join('')}
        </select>
      </article>`;
    }

    function renderKpis(leads) {
      const counts = Object.fromEntries(STAGES.map((stage) => [stage.key, 0]));
      leads.forEach((lead) => { counts[normalizedStage(lead)] += 1; });
      $('kpis').innerHTML = STAGES.map((stage) => `
        <div class="kpi">
          <div class="k">${esc(stage.label)}</div>
          <div class="v">${fmt(counts[stage.key])}</div>
        </div>
      `).join('');
    }

    function renderBoard() {
      const leads = scopedLeads();
      renderKpis(leads);
      $('pipeline').innerHTML = STAGES.map((stage) => {
        const items = leads.filter((lead) => normalizedStage(lead) === stage.key);
        return `
          <section class="lane" data-stage="${stage.key}">
            <div class="lane-head">
              <h2 class="lane-title"><span>${esc(stage.label)}</span><span class="lane-count">${fmt(items.length)}</span></h2>
              <div class="lane-sub">${esc(stage.hint)}</div>
            </div>
            <div class="lane-body">
              ${items.length ? items.map(cardHtml).join('') : '<div class="empty">No opportunities in this stage.</div>'}
            </div>
          </section>`;
      }).join('');

      document.querySelectorAll('.opp-card').forEach((card) => {
        card.addEventListener('dragstart', () => { draggingId = card.dataset.id; });
        card.addEventListener('dragend', () => { draggingId = null; document.querySelectorAll('.lane').forEach((lane) => lane.classList.remove('drag-over')); });
      });
      document.querySelectorAll('.lane').forEach((lane) => {
        lane.addEventListener('dragover', (event) => { event.preventDefault(); lane.classList.add('drag-over'); });
        lane.addEventListener('dragleave', () => lane.classList.remove('drag-over'));
        lane.addEventListener('drop', async (event) => {
          event.preventDefault();
          lane.classList.remove('drag-over');
          if (!draggingId) return;
          await moveOpportunity(draggingId, lane.dataset.stage);
        });
      });
      document.querySelectorAll('.stage-select').forEach((select) => {
        select.addEventListener('change', async () => {
          await moveOpportunity(select.dataset.id, select.value);
        });
      });
      $('status').textContent = `${fmt(leads.length)} qualified opportunities in view.`;
    }

    async function moveOpportunity(id, stage) {
      const lead = LEADS.find((item) => String(item.id) === String(id));
      if (!lead) return;
      const current = normalizedStage(lead);
      if (current === stage) return;
      if (lead.isDemo) {
        lead.opportunityStage = stage;
        renderBoard();
        $('status').textContent = `Moved demo opportunity to ${STAGES.find((item) => item.key === stage)?.label || stage}.`;
        return;
      }
      $('status').textContent = 'Updating opportunity stage...';
      const data = await api({ action: 'set-opportunity-stage', id, stage });
      if (!data.success) {
        $('status').textContent = data.error || 'Could not update opportunity stage';
        renderBoard();
        return;
      }
      lead.opportunityStage = stage;
      renderBoard();
      $('status').textContent = stage === 'won'
        ? `Moved ${lead.name || 'opportunity'} to Won and pushed it to GHL.`
        : `Moved ${lead.name || 'opportunity'} to ${STAGES.find((item) => item.key === stage)?.label || stage}.`;
    }

    async function loadOpportunities() {
      $('status').textContent = 'Loading opportunities...';
      const res = await fetch('/api/apollo-sales-queue?source=outbound', { credentials: 'same-origin' });
      if (res.status === 401) { showLogin(); return; }
      const data = await res.json();
      if (!data.success) {
        $('status').textContent = data.error || 'Unable to load opportunities';
        return;
      }
      LEADS = [DEMO_OPPORTUNITY, ...(Array.isArray(data.contacts) ? data.contacts : [])];
      renderBoard();
    }

    window.addEventListener('DOMContentLoaded', () => {
      SQ.init(() => {
        renderOwnerFilter();
        $('search').addEventListener('input', renderBoard);
        $('ownerFilter').addEventListener('change', renderBoard);
        $('refreshBtn').addEventListener('click', loadOpportunities);
        loadOpportunities();
      });
    });
  </script>
</body>
</html>
