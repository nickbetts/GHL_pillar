<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Your workspace</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#F6F6F3;font:15px/1.5 Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:#0B0B0F}
    .card{width:min(460px,92vw);padding:34px 30px;background:#fff;border-radius:16px;box-shadow:0 12px 40px rgba(11,11,15,.08)}
    h1{margin:0 0 6px;font-size:22px;letter-spacing:-.01em}p{margin:0 0 16px;color:#5b5f6b;font-size:14px}
    .who{padding:12px 14px;border:1px solid #e6e7ec;border-radius:10px;background:#fafafa;font-size:13.5px;margin-bottom:18px}
    button{height:42px;padding:0 18px;border:1.5px solid #dfe1e8;border-radius:10px;background:#fff;font:inherit;font-weight:600;cursor:pointer}button:hover{border-color:#4463FF;color:#4463FF}
  </style>
</head>
<body>
  <main class="card">
    <h1 id="name">Your workspace</h1>
    <p>Your workspace is created and your account works. The sales tools are being set up for this workspace and will appear here when they are ready.</p>
    <div class="who" id="who">Checking your sign-in…</div>
    <button type="button" id="out">Sign out</button>
  </main>
  <script>
    const post = (body) => fetch('/api/sq-auth', { method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'same-origin', body: JSON.stringify(body) });
    post({ action: 'me' }).then((r) => (r.ok ? r.json() : null)).then((d) => {
      if (!d || !d.success) { location.replace('/login'); return; }
      if (d.tenant && d.tenant.owner) { location.replace('/sales-queue'); return; }
      document.getElementById('name').textContent = d.tenant ? d.tenant.name : 'Your workspace';
      document.getElementById('who').textContent = `Signed in as ${d.user.name || d.user.email} (${d.user.email})`;
    }).catch(() => location.replace('/login'));
    document.getElementById('out').addEventListener('click', async () => { await post({ action: 'logout' }); location.replace('/login'); });
  </script>
</body>
</html>
