<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in to Stream</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#F6F6F3;font:15px/1.5 Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:#0B0B0F}
    form{width:min(420px,92vw);padding:34px 30px;background:#fff;border-radius:16px;box-shadow:0 12px 40px rgba(11,11,15,.08)}
    h1{margin:0 0 6px;font-size:22px;letter-spacing:-.01em}p{margin:0 0 20px;color:#5b5f6b;font-size:14px}
    .field{display:flex;align-items:center;border:1.5px solid #dfe1e8;border-radius:10px;padding:0 14px;height:46px}
    .field:focus-within{border-color:#4463FF;box-shadow:0 0 0 3px rgba(68,99,255,.15)}
    input{flex:1;min-width:0;border:0;outline:0;font:inherit;height:100%;background:transparent;text-align:right}
    .suffix{color:#5b5f6b;white-space:nowrap}
    button{width:100%;height:46px;margin-top:14px;border:0;border-radius:10px;background:#4463FF;color:#fff;font:inherit;font-weight:600;cursor:pointer}button:hover{background:#3149E8}
    .err{margin-top:10px;color:#b91c1c;font-size:13px;font-weight:600;min-height:18px}
  </style>
</head>
<body>
  <form id="f" autocomplete="off">
    <h1>Sign in to Stream</h1>
    <p>Enter your workspace name to go to your sign-in page.</p>
    <div class="field"><input id="ws" placeholder="your-company" autocapitalize="none" spellcheck="false" autofocus required aria-label="Workspace name" /><span class="suffix">.streamcrm.co.uk</span></div>
    <div class="err" id="err" role="alert"></div>
    <button type="submit">Continue</button>
  </form>
  <script>
    document.getElementById('f').addEventListener('submit', (e) => {
      e.preventDefault();
      const slug = document.getElementById('ws').value.trim().toLowerCase().replace(/\.streamcrm\.co\.uk$/, '');
      if (!/^[a-z][a-z0-9-]{1,30}[a-z0-9]$/.test(slug)) { document.getElementById('err').textContent = 'Workspace names use letters, numbers and hyphens.'; return; }
      location.href = `https://${slug}.streamcrm.co.uk/login`;
    });
  </script>
</body>
</html>
