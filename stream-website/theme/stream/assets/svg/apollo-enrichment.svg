<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="480" height="360" role="img" aria-label="Apollo enrichment: new leads arrive with phones and emails">
<title>Apollo enrichment: new leads arrive with phones and emails</title>
<defs>
<filter id="s-sh" x="-20%" y="-20%" width="140%" height="155%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#14143A" flood-opacity=".10"/></filter>
<filter id="s-sh2" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#14143A" flood-opacity=".10"/></filter>
<radialGradient id="s-bg"><stop offset="0" stop-color="#DCE3FF" stop-opacity=".95"/><stop offset="1" stop-color="#EEF1FF" stop-opacity="0"/></radialGradient>
<linearGradient id="s-g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6B83FF"/><stop offset="1" stop-color="#3049E6"/></linearGradient>
<linearGradient id="s-g2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4463FF"/><stop offset="1" stop-color="#8B5CF6"/></linearGradient>
<linearGradient id="s-g3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFB020"/><stop offset="1" stop-color="#FF5C8A"/></linearGradient>
</defs>
<style>.a{transform-box:fill-box;transform-origin:center}.b{transform-origin:50% 100%}.l{transform-origin:0% 50%}.t{transform-origin:50% 0%}.d{stroke-dasharray:1}
.pop{animation:s-pop var(--dur,7s) cubic-bezier(.2,.8,.2,1) var(--delay,0s) infinite both}
.rise{animation:s-rise var(--dur,7s) cubic-bezier(.2,.8,.2,1) var(--delay,0s) infinite both}
.slide{animation:s-slide var(--dur,7s) cubic-bezier(.2,.8,.2,1) var(--delay,0s) infinite both}
.fade{animation:s-fade var(--dur,7s) ease var(--delay,0s) infinite both}
.grow{animation:s-grow var(--dur,7s) cubic-bezier(.2,.8,.2,1) var(--delay,0s) infinite both}
.growx{animation:s-growx var(--dur,7s) cubic-bezier(.2,.8,.2,1) var(--delay,0s) infinite both}
.draw{animation:s-draw var(--dur,7s) ease-in-out var(--delay,0s) infinite both}
.float{animation:s-float var(--dur,4s) ease-in-out var(--delay,0s) infinite alternate}
.ping{animation:s-ping var(--dur,2.4s) ease-out var(--delay,0s) infinite}
.pulse{animation:s-pulse var(--dur,2s) ease-in-out var(--delay,0s) infinite}
.spin{animation:s-spin var(--dur,20s) linear var(--delay,0s) infinite}
.blink{animation:s-blink var(--dur,1.2s) steps(1,end) var(--delay,0s) infinite}
.flow{animation:s-flow var(--dur,1.2s) linear infinite}
.wave{animation:s-wave var(--dur,6s) linear var(--delay,0s) infinite}
.eq{animation:s-eq var(--dur,1s) ease-in-out var(--delay,0s) infinite}
.conv{animation:s-conv var(--dur,6s) linear var(--delay,0s) infinite both}
.twinkle{animation:s-twinkle var(--dur,2.6s) ease-in-out var(--delay,0s) infinite}
.fall{animation:s-fall var(--dur,5s) ease-in var(--delay,0s) infinite both}
.rev{animation-direction:reverse}
@keyframes s-pop{0%{opacity:0;transform:scale(.6)}7%{opacity:1;transform:scale(1.06)}11%{transform:scale(1)}88%{opacity:1;transform:scale(1)}96%,100%{opacity:0;transform:scale(.96)}}
@keyframes s-rise{0%{opacity:0;transform:translateY(var(--dy,16px))}8%{opacity:1;transform:translateY(0)}88%{opacity:1;transform:translateY(0)}96%,100%{opacity:0;transform:translateY(0)}}
@keyframes s-slide{0%{opacity:0;transform:translateX(var(--dx,-24px))}8%{opacity:1;transform:translateX(0)}88%{opacity:1;transform:translateX(0)}96%,100%{opacity:0;transform:translateX(0)}}
@keyframes s-fade{0%{opacity:0}8%{opacity:1}88%{opacity:1}96%,100%{opacity:0}}
@keyframes s-grow{0%{transform:scaleY(0)}18%{transform:scaleY(1)}88%{transform:scaleY(1)}96%,100%{transform:scaleY(0)}}
@keyframes s-growx{0%{transform:scaleX(0)}18%{transform:scaleX(1)}88%{transform:scaleX(1)}96%,100%{transform:scaleX(0)}}
@keyframes s-draw{0%{stroke-dashoffset:1;opacity:1}22%{stroke-dashoffset:0}88%{stroke-dashoffset:0;opacity:1}96%,100%{stroke-dashoffset:0;opacity:0}}
@keyframes s-float{from{transform:translateY(0)}to{transform:translateY(var(--dy,-8px))}}
@keyframes s-ping{0%{opacity:.55;transform:scale(.5)}100%{opacity:0;transform:scale(1.9)}}
@keyframes s-pulse{0%,100%{transform:scale(1)}50%{transform:scale(var(--sc,1.12))}}
@keyframes s-spin{to{transform:rotate(360deg)}}
@keyframes s-blink{0%,45%{opacity:1}55%,100%{opacity:.15}}
@keyframes s-flow{to{stroke-dashoffset:-24}}
@keyframes s-wave{from{transform:translateX(0)}to{transform:translateX(var(--w,-120px))}}
@keyframes s-eq{0%,100%{transform:scaleY(.25)}50%{transform:scaleY(1)}}
@keyframes s-conv{0%{opacity:0;transform:translateX(0)}8%{opacity:1}88%{opacity:1}100%{opacity:0;transform:translateX(var(--dx,240px))}}
@keyframes s-twinkle{0%,100%{opacity:.25;transform:scale(.7)}50%{opacity:1;transform:scale(1.15)}}
@keyframes s-fall{0%{opacity:0;transform:translateY(-20px) rotate(0)}10%{opacity:1}100%{opacity:0;transform:translateY(var(--dy,120px)) rotate(240deg)}}
@media (prefers-reduced-motion:reduce){.a,.flow{animation:none!important}}</style>
<path d="M148 180 H208" fill="none" stroke="#8FA2FF" stroke-width="2" stroke-dasharray="4 8" stroke-linecap="round" class="flow" style="--dur:1.4s"/><path d="M272 180 H336" fill="none" stroke="#8FA2FF" stroke-width="2" stroke-dasharray="4 8" stroke-linecap="round" class="flow" style="--dur:1.4s"/><g><circle r="4" fill="#4463FF"><animateMotion dur="1.8s" begin="0s" repeatCount="indefinite" path="M148 180 H208"/></circle></g><g><circle r="4" fill="#19C8A0"><animateMotion dur="1.8s" begin="0.9s" repeatCount="indefinite" path="M272 180 H336"/></circle></g><rect x="18" y="150" width="128" height="62" rx="14" fill="#fff" stroke="#E6E9F3" stroke-width="1" filter="url(#s-sh)"/><circle cx="42" cy="181" r="14" fill="#8B5CF6"/><text x="42" y="185.8" font-family="'Plus Jakarta Sans',Inter,system-ui,sans-serif" font-size="12.9" font-weight="700" fill="#fff" text-anchor="middle">AM</text><rect x="64" y="172" width="64" height="8" rx="4" fill="#3A3D4A"/><rect x="64" y="188" width="46" height="6" rx="3" fill="#E6E9F3"/><g class="a fade" style="--delay:0s;--dur:8s"><rect x="40" y="216" width="83" height="20" rx="10" fill="#FFE1EA"/><text x="81.5" y="229.2" font-family="'Plus Jakarta Sans',Inter,system-ui,sans-serif" font-size="9" font-weight="700" fill="#FF5C8A" text-anchor="middle">No phone yet</text></g><g class="a ping" style="--delay:0s;--dur:2.6s"><circle cx="240" cy="180" r="30" fill="#4463FF"/></g><circle cx="240" cy="180" r="30" fill="url(#s-g2)" filter="url(#s-sh)"/><g transform="translate(226.2 166.2) scale(1.2)" fill="none" stroke="#fff" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/></g><rect x="332" y="70" width="140" height="188" rx="16" fill="#fff" stroke="#E6E9F3" stroke-width="1" filter="url(#s-sh)"/><text x="346" y="90" font-family="'Plus Jakarta Sans',Inter,system-ui,sans-serif" font-size="10" font-weight="800" fill="#1C1C1C" text-anchor="start">Enriched lead</text><g class="a pop" style="--delay:0.9s;--dur:8s"><rect x="338" y="96" width="128" height="26" rx="9" fill="#D8F7EE"/><g transform="translate(346 101) scale(0.6)" fill="none" stroke="#0E9F7E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2A19.8 19.8 0 0 1 11.2 18.8 19.5 19.5 0 0 1 5.2 12.8 19.8 19.8 0 0 1 2.08 4.11 2 2 0 0 1 4.06 2h3a2 2 0 0 1 2 1.72c.12.9.34 1.79.65 2.64a2 2 0 0 1-.45 2.11L8 9.73a16 16 0 0 0 6.27 6.27l1.26-1.26a2 2 0 0 1 2.11-.45c.85.31 1.74.53 2.64.65A2 2 0 0 1 22 16.92z"/></g><text x="366" y="113" font-family="'Plus Jakarta Sans',Inter,system-ui,sans-serif" font-size="9.5" font-weight="800" fill="#0E9F7E" text-anchor="start">Mobile</text></g><g class="a pop" style="--delay:1.5s;--dur:8s"><rect x="338" y="130" width="128" height="26" rx="9" fill="#D8F7EE"/><g transform="translate(346 135) scale(0.6)" fill="none" stroke="#0E9F7E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></g><text x="366" y="147" font-family="'Plus Jakarta Sans',Inter,system-ui,sans-serif" font-size="9.5" font-weight="800" fill="#0E9F7E" text-anchor="start">Email</text></g><g class="a pop" style="--delay:2.1s;--dur:8s"><rect x="338" y="164" width="128" height="26" rx="9" fill="#D8F7EE"/><g transform="translate(346 169) scale(0.6)" fill="none" stroke="#0E9F7E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></g><text x="366" y="181" font-family="'Plus Jakarta Sans',Inter,system-ui,sans-serif" font-size="9.5" font-weight="800" fill="#0E9F7E" text-anchor="start">Role</text></g><g class="a rise" style="--delay:0.2s;--dur:8s"><rect x="176" y="236" width="128" height="24" rx="12" fill="#1C1C1C"/><text x="240" y="251.9" font-family="'Plus Jakarta Sans',Inter,system-ui,sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">Apollo</text></g>
</svg>
