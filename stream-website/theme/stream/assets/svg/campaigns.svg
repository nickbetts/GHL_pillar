,system-ui,sans-serif" font-size="10.5" font-weight="800" fill="#1C1C1C" text-anchor="middle">Email 2</text><text x="170" y="150" font-family="'Plus Jakarta Sans',Inter,system-ui,sans-serif" font-size="8.5" font-weight="600" fill="#8A8FA3" text-anchor="middle">Day 3</text></g><g class="a pop" style="--delay:1.3s;--dur:9s"><rect x="242" y="84" width="76" height="72" rx="14" fill="#fff" stroke="#E6E9F3" stroke-width="1" filter="url(#s-sh)"/><g transform="translate(270 96) scale(0.8)" fill="none" stroke="#4463FF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></g><text x="280" y="138" font-family="'Plus Jakarta Sans',Inter,system-ui,sans-serif" font-size="10.5" font-weight="800" fill="#1C1C1C" text-anchor="middle">Email 3</text><text x="280" y="150" font-family="'Plus Jakarta Sans',Inter,system-ui,sans-serif" font-size="8.5" font-weight="600" fill="#8A8FA3" text-anchor="middle">Day 6</text></g><g class="a pop" style="--delay:1.8s;--dur:9s"><rect x="352" y="84" width="76" height="72" rx="14" fill="#fff" stroke="#E6E9F3" stroke-width="1" filter="url(#s-sh)"/><g transform="translate(380 96) scale(0.8)" fill="none" stroke="#19C8A0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 10-10"/></g><text x="390" y="138" font-family="'Plus Jakarta Sans',Inter,system-ui,sans-serif" font-size="10.5" font-weight="800" fill="#1C1C1C" text-anchor="middle">Reply</text><text x="390" y="150" font-family="'Plus Jakarta Sans',Inter,system-ui,sans-serif" font-size="8.5" font-weight="600" fill="#8A8FA3" text-anchor="middle">Day 8</text></g><g class="a rise" style="--delay:0.6s;--dur:9s"><rect x="40" y="196" width="124" height="104" rx="14" fill="#fff" stroke="#E6E9F3" stroke-width="1" filter="url(#s-sh)"/><text x="54" y="222" font-family="'Plus Jakarta Sans',Inter,system-ui,sans-serif" font-size="10" font-weight="700" fill="#8A8FA3" text-anchor="start">Sent</text><text x="54" y="252" font-family="'Plus Jakarta Sans',Inter,system-ui,sans-serif" font-size="24" font-weight="800" fill="#1C1C1C" text-anchor="start">412</text><rect x="54" y="274" width="96" height="8" rx="4" fill="#E6E9F3"/><rect class="a growx l" style="--delay:0.8s;--dur:9s" x="54" y="274" width="96" height="8" rx="4" fill="#4463FF"/></g><g class="a rise" style="--delay:0.8999999999999999s;--dur:9s"><rect x="180" y="196" width="124" height="104" rx="14" fill="#fff" stroke="#E6E9F3" stroke-width="1" filter="url(#s-sh)"/><text x="194" y="222" font-family="'Plus Jakarta Sans',Inter,system-ui,sans-serif" font-size="10" font-weight="700" fill="#8A8FA3" text-anchor="start">Opened</text><text x="194" y="252" font-family="'Plus Jakarta Sans',Inter,system-ui,sans-serif" font-size="24" font-weight="800" fill="#1C1C1C" text-anchor="start">256</text><rect x="194" y="274" width="96" height="8" rx="4" fill="#E6E9F3"/><rect class="a growx l" style="--delay:1.1s;--dur:9s" x="194" y="274" width="59.5" height="8" rx="4" fill="#8B5CF6"/></g><g class="a rise" style="--delay:1.2s;--dur:9s"><rect x="320" y="196" width="124" height="104" rx="14" fill="#fff" stroke="#E6E9F3" stroke-width="1" filter="url(#s-sh)"/><text x="334" y="222" font-family="'Plus Jakarta Sans',Inter,system-ui,sans-serif" font-size="10" font-weight="700" fill="#8A8FA3" text-anchor="start">Replied</text><text x="334" y="252" font-family="'Plus Jakarta Sans',Inter,system-ui,sans-serif" font-size="24" font-weight="800" fill="#1C1C1C" text-anchor="start">98</text><rect x="334" y="274" width="96" height="8" rx="4" fill="#E6E9F3"/><rect class="a growx l" style="--delay:1.4s;--dur:9s" x="334" y="274" width="23" height="8" rx="4" fill="#19C8A0"/></g>
