g><g class="a pop" style="--delay:0.7s;--dur:8s"><rect x="144" y="142" width="66" height="48" rx="9" fill="#FFB020"/><text x="152" y="160" font-family="'Plus Jakarta Sans',Inter,system-ui,sans-serif" font-size="9" font-weight="700" fill="#fff" text-anchor="start">Follow-up</text></g><g class="a pop" style="--delay:1.1s;--dur:8s"><rect x="218" y="88" width="66" height="102" rx="9" fill="#4463FF"/><text x="226" y="106" font-family="'Plus Jakarta Sans',Inter,system-ui,sans-serif" font-size="9" font-weight="700" fill="#fff" text-anchor="start">Demo</text></g><g class="a pop" style="--delay:1.5000000000000002s;--dur:8s"><rect x="292" y="196" width="66" height="48" rx="9" fill="#FF5C8A"/><text x="300" y="214" font-family="'Plus Jakarta Sans',Inter,system-ui,sans-serif" font-size="9" font-weight="700" fill="#fff" text-anchor="start">Callback</text></g><g class="a pop" style="--delay:1.9000000000000001s;--dur:8s"><rect x="366" y="142" width="66" height="48" rx="9" fill="#19C8A0"/><text x="374" y="160" font-family="'Plus Jakarta Sans',Inter,system-ui,sans-serif" font-size="9" font-weight="700" fill="#fff" text-anchor="start">Review</text></g><g class="a blink" style="--delay:2s;--dur:1.6s"><rect x="292" y="88" width="66" height="48" rx="9" fill="none" stroke="#4463FF" stroke-width="1.6" stroke-dasharray="4 4"/></g><g><animateTransform attributeName="transform" type="translate" values="420 300; 300 112; 300 112; 420 300" keyTimes="0;.35;.8;1" dur="8s" repeatCount="indefinite"/><path d="M0 0 L0 17 L5 13 L9 21 L12 19.5 L8 12 L14 12Z" fill="#1C1C1C" stroke="#fff" stroke-width="1.5"/></g><g class="a rise" style="--delay:3.2s;--dur:8s;--dy:14px"><rect x="170" y="318" width="220" height="34" rx="17" fill="#1C1C1C"/><circle cx="192" cy="335" r="10" fill="#19C8A0"/><g transform="translate(187 330) scale(0.4)" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 10-10"/></g><text x="210" y="339" font-family="'Plus Jakarta Sans',Inter,system-ui,sans-serif" font-size="10.5" font-weight="700" fill="#fff" text-anchor="start">Meeting booked · Thu 10:30</text></g>
