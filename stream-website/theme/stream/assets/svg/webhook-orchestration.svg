cx="376" cy="86" r="7" fill="#FF5C8A"/><text x="388" y="90" font-family="'Plus Jakarta Sans',Inter,system-ui,sans-serif" font-size="10.5" font-weight="800" fill="#1C1C1C" text-anchor="start">Apollo</text></g><g class="a float" style="--delay:0.8s;--dur:3.2s;--dy:-4px"><rect x="40" y="280" width="100" height="32" rx="16" fill="#fff" stroke="#E6E9F3" filter="url(#s-sh2)"/><circle cx="56" cy="296" r="7" fill="#FFB020"/><text x="68" y="300" font-family="'Plus Jakarta Sans',Inter,system-ui,sans-serif" font-size="10.5" font-weight="800" fill="#1C1C1C" text-anchor="start">3CX</text></g><g class="a float" style="--delay:1.2000000000000002s;--dur:3.2s;--dy:-4px"><rect x="360" y="280" width="100" height="32" rx="16" fill="#fff" stroke="#E6E9F3" filter="url(#s-sh2)"/><circle cx="376" cy="296" r="7" fill="#19C8A0"/><text x="388" y="300" font-family="'Plus Jakarta Sans',Inter,system-ui,sans-serif" font-size="10.5" font-weight="800" fill="#1C1C1C" text-anchor="start">Mailgun</text></g><g class="a ping" style="--delay:0s;--dur:2.8s"><circle cx="240" cy="180" r="44" fill="#4463FF"/></g><g transform="translate(210 150) scale(0.5)"><rect width="120" height="120" rx="26" fill="#4463FF"/><path d="M103.235 85.2203C97.0106 85.4921 90.3351 85.4341 84.0929 85.4287C76.2493 85.4237 68.4059 85.3545 60.563 85.2213L60.4567 79.1637C60.3793 74.6167 60.4857 71.7241 56.9821 68.176C53.4648 64.614 50.1118 64.6945 45.8225 63.4124C40.1314 61.7118 33.3716 60.4686 27.9595 58.2154C20.7494 55.2133 17.8148 47.0017 17.6905 39.6422C17.6726 38.5359 17.6892 37.4293 17.7416 36.3241L60.378 36.3138C60.175 41.2733 60.8461 50.5419 64.6558 54.2068C68.3818 57.791 75.6831 58.5776 80.4883 59.8436C86.8205 61.5117 94.2706 62.7221 98.8249 67.9241C103.037 72.8057 103.642 79.0892 103.235 85.2203Z" fill="#fff"/><path d="M60.378 36.3139C60.5465 28.36 60.3974 19.8974 60.396 11.9029C70.3945 11.6018 80.9045 14.1484 88.907 20.3379C89.0121 20.4235 89.1163 20.5105 89.2195 20.5975C94.5716 25.1631 96.5771 29.3357 97.1289 36.3145L60.37