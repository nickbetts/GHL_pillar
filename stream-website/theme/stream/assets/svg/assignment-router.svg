#s-sh)"/><circle cx="376" cy="86" r="14" fill="#8B5CF6"/><text x="376" y="90.8" font-family="'Plus Jakarta Sans',Inter,system-ui,sans-serif" font-size="12.9" font-weight="700" fill="#fff" text-anchor="middle">AM</text><rect x="398" y="74" width="54" height="7" rx="3.5" fill="#3A3D4A"/><rect x="398" y="94" width="54" height="6" rx="3" fill="#E6E9F3"/><rect class="a growx l" style="--delay:0.5s;--dur:8s" x="398" y="94" width="13.9" height="6" rx="3" fill="#8B5CF6"/></g><g class="a pop" style="--delay:0.5s;--dur:8s"><rect x="350" y="142" width="114" height="68" rx="14" fill="#fff" stroke="#E6E9F3" stroke-width="1" filter="url(#s-sh)"/><circle cx="376" cy="176" r="14" fill="#FF5C8A"/><text x="376" y="180.8" font-family="'Plus Jakarta Sans',Inter,system-ui,sans-serif" font-size="12.9" font-weight="700" fill="#fff" text-anchor="middle">JK</text><rect x="398" y="164" width="54" height="7" rx="3.5" fill="#3A3D4A"/><rect x="398" y="184" width="54" height="6" rx="3" fill="#E6E9F3"/><rect class="a growx l" style="--delay:0.7s;--dur:8s" x="398" y="184" width="47.8" height="6" rx="3" fill="#FF5C8A"/></g><g class="a pop" style="--delay:0.8s;--dur:8s"><rect x="350" y="232" width="114" height="68" rx="14" fill="#fff" stroke="#E6E9F3" stroke-width="1" filter="url(#s-sh)"/><circle cx="376" cy="266" r="14" fill="#19C8A0"/><text x="376" y="270.8" font-family="'Plus Jakarta Sans',Inter,system-ui,sans-serif" font-size="12.9" font-weight="700" fill="#fff" text-anchor="middle">SR</text><rect x="398" y="254" width="54" height="7" rx="3.5" fill="#3A3D4A"/><rect x="398" y="274" width="54" height="6" rx="3" fill="#E6E9F3"/><rect class="a growx l" style="--delay:0.9s;--dur:8s" x="398" y="274" width="26.2" height="6" rx="3" fill="#19C8A0"/></g><g class="a rise" style="--delay:0.4s;--dur:8s"><rect x="168" y="232" width="136" height="24" rx="12" fill="#EEF1FF"/><text x="236" y="247.5" font-family="'Plus Jakarta Sans',Inter,system-ui,sans-serif" font-size="10" font-weight="700" fill="#4463FF" text-