<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="480" height="360" role="img" aria-label="Inbound handler: every enquiry processed in seconds">
<title>Inbound handler: every enquiry processed in seconds</title>
<defs>
<filter id="s-sh" x="-20%" y="-20%" width="140%" height="155%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#14143A" flood-opacity=".10"/></filter>
<filter id="s-sh2" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#14143A" flood-opacity=".10"/></filter>
<radialGradient id="s-bg"><stop offset="0" stop-color="#DCE3FF" stop-opacity=".95"/><stop offset="1" stop-color="#EEF1FF" stop-opacity="0"/></radialGradient>
<linearGradient id="s-g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6B83FF"/><stop offset="1" stop-color="#3049E6"/></linearGradient>
<linearGradient id="s-g2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4463FF"/><stop offset="1" stop-color="#8B5CF6"/></linearGradient>
<linearGradient id="s-g3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFB020"/><stop offset="1" stop-color="#FF5C8A"/></linearGradient>
</defs>
<style>.a{transform-box:fill-box;transform-origin:center}.b{transform-origin:50% 100%}.l{transform-origin:0% 50%}.t{transform-origin:50% 0%}.d{stroke-dasharray:1}
.pop{animation:s-pop var(--dur,7s) cubic-bezier(.2,.8,.2,1) var(--delay,0s) infinite both}
.rise{animation:s-rise var(--dur,7s) cubic-bezier(.2,.8,.2,1) var(--delay,0s) infinite both}
.slide{animation:s-slide var(--dur,7s) cubic-bezier(.2,.8,.2,1) var(--delay,0s) infinite both}
.fade{animation:s-fade var(--dur,7s) ease var(--delay,0s) infinite both}
.grow{animation:s-grow var(--dur,7s) cubic-bezier(.2,.8,.2,1) var(--delay,0s) infinite both}
.growx{animation:s-growx var(--dur,7s) cubic-bezier(.2,.8,.2,1) var(--delay,0s) infinite both}
.draw{animation:s-draw var(--dur,7s) ease-in-out var(--delay,0s) infinite both}
.float{animation:s-float var(--dur,4s) ease-in-out var(--delay,0s) infinite alternate}
.ping{animation:s-ping var(--dur,2.4s) ease-out var(--delay,0s) infinite}
.pulse{animation:s-pulse var(--dur,2s) ease-in-out var(--delay,0s) infinite}
.spin{animation:s-spin var(--dur,20s) linear var(--delay,0s) infinite}
.blink{animation:s-blink var(--dur,1.2s) steps(1,end) var(--delay,0s) infinite}
.flow{animation:s-flow var(--dur,1.2s) linear infinite}
.wave{animation:s-wave var(--dur,6s) linear var(--delay,0s) infinite}
.eq{animation:s-eq var(--dur,1s) ease-in-out var(--delay,0s) infinite}
.conv{animation:s-conv var(--dur,6s) linear var(--delay,0s) infinite both}
.twinkle{animation:s-twinkle var(--dur,2.6s) ease-in-out var(--delay,0s) infinite}
.fall{animation:s-fall var(--dur,5s) ease-in var(--delay,0s) infinite both}
.rev{animation-direction:reverse}
@keyframes s-pop{0%{opacity:0;transform:scale(.6)}7%{opacity:1;transform:scale(1.06)}11%{transform:scale(1)}88%{opacity:1;transform:scale(1)}96%,100%{opacity:0;transform:scale(.96)}}
@keyframes s-rise{0%{opacity:0;transform:translateY(var(--dy,16px))}8%{opacity:1;transform:translateY(0)}88%{opacity:1;transform:translateY(0)}96%,100%{opacity:0;transform:translateY(0)}}
@keyframes s-slide{0%{opacity:0;transform:translateX(var(--dx,-24px))}8%{opacity:1;transform:translateX(0)}88%{opacity:1;transform:translateX(0)}96%,100%{opacity:0;transform:translateX(0)}}
@keyframes s-fade{0%{opacity:0}8%{opacity:1}88%{opacity:1}96%,100%{opacity:0}}
@keyframes s-grow{0%{transform:scaleY(0)}18%{transform:scaleY(1)}88%{transform:scaleY(1)}96%,100%{transform:scaleY(0)}}
@keyframes s-growx{0%{transform:scaleX(0)}18%{transform:scaleX(1)}88%{transform:scaleX(1)}96%,100%{transform:scaleX(0)}}
@keyframes s-draw{0%{stroke-dashoffset:1;opacity:1}22%{stroke-dashoffset:0}88%{stroke-dashoffset:0;opacity:1}96%,100%{stroke-dashoffset:0;opacity:0}}
@keyframes s-float{from{transform:translateY(0)}to{transform:translateY(var(--dy,-8px))}}
@keyframes s-ping{0%{opacity:.55;transform:scale(.5)}100%{opacity:0;transform:scale(1.9)}}
@keyframes s-pulse{0%,100%{transform:scale(1)}50%{transform:scale(var(--sc,1.12))}}
@keyframes s-spin{to{transform:rotate(360deg)}}
@keyframes s-blink{0%,45%{opacity:1}55%,100%{opacity:.15}}
@keyframes s-flow{to{stroke-dashoffset:-24}}
@keyframes s-wave{from{transform:translateX(0)}to{transform:translateX(var(--w,-120px))}}
@keyframes s-eq{0%,100%{transform:scaleY(.25)}50%{transform:scaleY(1)}}
@keyframes s-conv{0%{opacity:0;transform:translateX(0)}8%{opacity:1}88%{opacity:1}100%{opacity:0;transform:translateX(var(--dx,240px))}}
@keyframes s-twinkle{0%,100%{opacity:.25;transform:scale(.7)}50%{opacity:1;transform:scale(1.15)}}
@keyframes s-fall{0%{opacity:0;transform:translateY(-20px) rotate(0)}10%{opacity:1}100%{opacity:0;transform:translateY(var(--dy,120px)) rotate(240deg)}}
@media (prefers-reduced-motion:reduce){.a,.flow{animation:none!important}}</style>
<g class="a float" style="--delay:0s;--dur:3.4s;--dy:-4px"><rect x="18" y="150" width="112" height="60" rx="18" fill="#fff" stroke="#E6E9F3" filter="url(#s-sh2)"/><g transform="translate(30 168) scale(0.9)" fill="none" stroke="#4463FF" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></g><text x="60" y="177" font-family="'Plus Jakarta Sans',Inter,system-ui,sans-serif" font-size="10" font-weight="800" fill="#1C1C1C" text-anchor="start">New enquiry</text><text x="60" y="191" font-family="'Plus Jakarta Sans',Inter,system-ui,sans-serif" font-size="8.5" font-weight="600" fill="#8A8FA3" text-anchor="start">Web form</text></g><path d="M130 180 H190" fill="none" stroke="#8FA2FF" stroke-width="2" stroke-dasharray="4 8" stroke-linecap="round" class="flow" style="--dur:1.4s"/><g><circle r="4" fill="#4463FF"><animateMotion dur="1.6s" begin="0s" repeatCount="indefinite" path="M130 180 H190"/></circle></g><g class="a slide" style="--delay:0.4s;--dur:8s;--dx:-16px"><rect x="196" y="66" width="170" height="40" rx="12" fill="#fff" stroke="#E6E9F3" filter="url(#s-sh2)"/><g transform="translate(208 76) scale(0.8)" fill="none" stroke="#4463FF" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M12 14l4-4"/><path d="M3.3 17a10 10 0 1 1 17.4 0"/></g><text x="236" y="91" font-family="'Plus Jakarta Sans',Inter,system-ui,sans-serif" font-size="10.5" font-weight="800" fill="#1C1C1C" text-anchor="start">Score 86</text><circle cx="348" cy="86" r="9" fill="#19C8A0"/><g transform="translate(343 81) scale(0.4)" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 10-10"/></g></g><g class="a slide" style="--delay:1.3s;--dur:8s;--dx:-16px"><rect x="196" y="118" width="170" height="40" rx="12" fill="#fff" stroke="#E6E9F3" filter="url(#s-sh2)"/><g transform="translate(208 128) scale(0.8)" fill="none" stroke="#4463FF" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="8.5" r="1.2"/></g><text x="236" y="143" font-family="'Plus Jakarta Sans',Inter,system-ui,sans-serif" font-size="10.5" font-weight="800" fill="#1C1C1C" text-anchor="start">Tag: Construction</text><circle cx="348" cy="138" r="9" fill="#19C8A0"/><g transform="translate(343 133) scale(0.4)" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 10-10"/></g></g><g class="a slide" style="--delay:2.2s;--dur:8s;--dx:-16px"><rect x="196" y="170" width="170" height="40" rx="12" fill="#fff" stroke="#E6E9F3" filter="url(#s-sh2)"/><g transform="translate(208 180) scale(0.8)" fill="none" stroke="#4463FF" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M8.5 6H15a3 3 0 0 1 0 6H9a3 3 0 0 0 0 6h6.5"/></g><text x="236" y="195" font-family="'Plus Jakarta Sans',Inter,system-ui,sans-serif" font-size="10.5" font-weight="800" fill="#1C1C1C" text-anchor="start">Assign: Alex</text><circle cx="348" cy="190" r="9" fill="#19C8A0"/><g transform="translate(343 185) scale(0.4)" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 10-10"/></g></g><g class="a slide" style="--delay:3.1s;--dur:8s;--dx:-16px"><rect x="196" y="222" width="170" height="40" rx="12" fill="#fff" stroke="#E6E9F3" filter="url(#s-sh2)"/><g transform="translate(208 232) scale(0.8)" fill="none" stroke="#4463FF" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/></g><text x="236" y="247" font-family="'Plus Jakarta Sans',Inter,system-ui,sans-serif" font-size="10.5" font-weight="800" fill="#1C1C1C" text-anchor="start">Notify rep</text><circle cx="348" cy="242" r="9" fill="#19C8A0"/><g transform="translate(343 237) scale(0.4)" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 10-10"/></g></g><g class="a ping" style="--delay:3.4s;--dur:2.4s"><circle cx="420" cy="180" r="28" fill="#FFB020"/></g><g class="a pop" style="--delay:3.4s;--dur:8s"><circle cx="420" cy="180" r="26" fill="url(#s-g3)"/><g transform="translate(408 168) scale(1)" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/></g></g><path d="M366 180 H392" fill="none" stroke="#8FA2FF" stroke-width="2" stroke-dasharray="4 8" stroke-linecap="round" class="flow" style="--dur:1.4s"/>
</svg>
