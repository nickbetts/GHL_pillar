<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="480" height="360" role="img" aria-label="Reports: the numbers behind every call, meeting and deal">
<title>Reports: the numbers behind every call, meeting and deal</title>
<defs>
<filter id="s-sh" x="-20%" y="-20%" width="140%" height="155%"><feDropShadow dx="0" dy="9" stdDeviation="9" flood-color="#2B3A8F" flood-opacity=".15"/></filter>
<filter id="s-sh2" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#2B3A8F" flood-opacity=".14"/></filter>
<radialGradient id="s-bg"><stop offset="0" stop-color="#DCE3FF" stop-opacity=".95"/><stop offset="1" stop-color="#EEF1FF" stop-opacity="0"/></radialGradient>
<linearGradient id="s-g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6B83FF"/><stop offset="1" stop-color="#3049E6"/></linearGradient>
<linearGradient id="s-g2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4463FF"/><stop offset="1" stop-color="#8B5CF6"/></linearGradient>
<linearGradient id="s-g3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFB020"/><stop offset="1" stop-color="#FF5C8A"/></linearGradient>
</defs>
<style>.a{transform-box:fill-box;transform-origin:center}.b{transform-origin:50% 100%}.l{transform-origin:0% 50%}.t{transform-origin:50% 0%}.d{stroke-dasharray:1}
.pop{animation:s-pop var(--dur,7s) cubic-bezier(.2,.8,.2,1) var(--delay,0s) infinite both}
.rise{animation:s-rise var(--dur,7s) cubic-bezier(.2,.8,.2,1) var(--delay,0s) infinite both}
.slide{animation:s-slide var(--dur,7s) cubic-bezier(.2,.8,.2,1) var(--delay,0s) infinite both}
.fade{animation:s-fade var(--dur,7s) ease var(--delay,0s) infinite both}
.grow{animation:s-grow var(--dur,7s) cubic-bezier(.2,.8,.2,1) var(--delay,0s) infinite both}
.growx{animation:s-growx var(--dur,7s) cubic-bezier(.2,.8,.2,1) var(--delay,0s) infinite both}
.draw{animation:s-draw var(--dur,7s) ease-in-out var(--delay,0s) infinite both}
.float{animation:s-float var(--dur,4s) ease-in-out var(--delay,0s) infinite alternate}
.ping{animation:s-ping var(--dur,2.4s) ease-out var(--delay,0s) infinite}
.pulse{animation:s-pulse var(--dur,2s) ease-in-out var(--delay,0s) infinite}
.spin{animation:s-spin var(--dur,20s) linear var(--delay,0s) infinite}
.blink{animation:s-blink var(--dur,1.2s) steps(1,end) var(--delay,0s) infinite}
.flow{animation:s-flow var(--dur,1.2s) linear infinite}
.wave{animation:s-wave var(--dur,6s) linear var(--delay,0s) infinite}
.eq{animation:s-eq var(--dur,1s) ease-in-out var(--delay,0s) infinite}
.conv{animation:s-conv var(--dur,6s) linear var(--delay,0s) infinite both}
.twinkle{animation:s-twinkle var(--dur,2.6s) ease-in-out var(--delay,0s) infinite}
.fall{animation:s-fall var(--dur,5s) ease-in var(--delay,0s) infinite both}
.rev{animation-direction:reverse}
@keyframes s-pop{0%{opacity:0;transform:scale(.6)}7%{opacity:1;transform:scale(1.06)}11%{transform:scale(1)}88%{opacity:1;transform:scale(1)}96%,100%{opacity:0;transform:scale(.96)}}
@keyframes s-rise{0%{opacity:0;transform:translateY(var(--dy,16px))}8%{opacity:1;transform:translateY(0)}88%{opacity:1;transform:translateY(0)}96%,100%{opacity:0;transform:translateY(0)}}
@keyframes s-slide{0%{opacity:0;transform:translateX(var(--dx,-24px))}8%{opacity:1;transform:translateX(0)}88%{opacity:1;transform:translateX(0)}96%,100%{opacity:0;transform:translateX(0)}}
@keyframes s-fade{0%{opacity:0}8%{opacity:1}88%{opacity:1}96%,100%{opacity:0}}
@keyframes s-grow{0%{transform:scaleY(0)}18%{transform:scaleY(1)}88%{transform:scaleY(1)}96%,100%{transform:scaleY(0)}}
@keyframes s-growx{0%{transform:scaleX(0)}18%{transform:scaleX(1)}88%{transform:scaleX(1)}96%,100%{transform:scaleX(0)}}
@keyframes s-draw{0%{stroke-dashoffset:1;opacity:1}22%{stroke-dashoffset:0}88%{stroke-dashoffset:0;opacity:1}96%,100%{stroke-dashoffset:0;opacity:0}}
@keyframes s-float{from{transform:translateY(0)}to{transform:translateY(var(--dy,-8px))}}
@keyframes s-ping{0%{opacity:.55;transform:scale(.5)}100%{opacity:0;transform:scale(1.9)}}
@keyframes s-pulse{0%,100%{transform:scale(1)}50%{transform:scale(var(--sc,1.12))}}
@keyframes s-spin{to{transform:rotate(360deg)}}
@keyframes s-blink{0%,45%{opacity:1}55%,100%{opacity:.15}}
@keyframes s-flow{to{stroke-dashoffset:-24}}
@keyframes s-wave{from{transform:translateX(0)}to{transform:translateX(var(--w,-120px))}}
@keyframes s-eq{0%,100%{transform:scaleY(.25)}50%{transform:scaleY(1)}}
@keyframes s-conv{0%{opacity:0;transform:translateX(0)}8%{opacity:1}88%{opacity:1}100%{opacity:0;transform:translateX(var(--dx,240px))}}
@keyframes s-twinkle{0%,100%{opacity:.25;transform:scale(.7)}50%{opacity:1;transform:scale(1.15)}}
@keyframes s-fall{0%{opacity:0;transform:translateY(-20px) rotate(0)}10%{opacity:1}100%{opacity:0;transform:translateY(var(--dy,120px)) rotate(240deg)}}
@media (prefers-reduced-motion:reduce){.a,.flow{animation:none!important}}</style>
<circle cx="240" cy="190" r="175" fill="url(#s-bg)"/><g class="a rise" style="--delay:0.1s;--dur:9s;--dy:-12px"><rect x="36" y="30" width="128" height="70" rx="14" fill="#fff" stroke="#E6E9F3" stroke-width="1" filter="url(#s-sh)"/><text x="50" y="52" font-family="'Plus Jakarta Sans',Inter,system-ui,sans-serif" font-size="10" font-weight="700" fill="#8A8FA3" text-anchor="start">Calls</text><text x="50" y="82" font-family="'Plus Jakarta Sans',Inter,system-ui,sans-serif" font-size="24" font-weight="800" fill="#1C1C1C" text-anchor="start">312</text><rect x="112" y="38" width="41" height="18" rx="9" fill="#EEF1FF"/><text x="132.5" y="50.2" font-family="'Plus Jakarta Sans',Inter,system-ui,sans-serif" font-size="9" font-weight="700" fill="#4463FF" text-anchor="middle">+12%</text></g><g class="a rise" style="--delay:0.30000000000000004s;--dur:9s;--dy:-12px"><rect x="176" y="30" width="128" height="70" rx="14" fill="#fff" stroke="#E6E9F3" stroke-width="1" filter="url(#s-sh)"/><text x="190" y="52" font-family="'Plus Jakarta Sans',Inter,system-ui,sans-serif" font-size="10" font-weight="700" fill="#8A8FA3" text-anchor="start">Meetings</text><text x="190" y="82" font-family="'Plus Jakarta Sans',Inter,system-ui,sans-serif" font-size="24" font-weight="800" fill="#1C1C1C" text-anchor="start">48</text><rect x="252" y="38" width="36" height="18" rx="9" fill="#EEF1FF"/><text x="270" y="50.2" font-family="'Plus Jakarta Sans',Inter,system-ui,sans-serif" font-size="9" font-weight="700" fill="#4463FF" text-anchor="middle">+8%</text></g><g class="a rise" style="--delay:0.5s;--dur:9s;--dy:-12px"><rect x="316" y="30" width="128" height="70" rx="14" fill="#fff" stroke="#E6E9F3" stroke-width="1" filter="url(#s-sh)"/><text x="330" y="52" font-family="'Plus Jakarta Sans',Inter,system-ui,sans-serif" font-size="10" font-weight="700" fill="#8A8FA3" text-anchor="start">Won</text><text x="330" y="82" font-family="'Plus Jakarta Sans',Inter,system-ui,sans-serif" font-size="24" font-weight="800" fill="#1C1C1C" text-anchor="start">£94k</text><rect x="392" y="38" width="41" height="18" rx="9" fill="#D8F7EE"/><text x="412.5" y="50.2" font-family="'Plus Jakarta Sans',Inter,system-ui,sans-serif" font-size="9" font-weight="700" fill="#0E9F7E" text-anchor="middle">+21%</text></g><rect x="36" y="118" width="408" height="196" rx="18" fill="#fff" stroke="#E6E9F3" stroke-width="1" filter="url(#s-sh)"/><rect x="50" y="150" width="390" height="1" rx="0.5" fill="#E6E9F3"/><rect x="50" y="194" width="390" height="1" rx="0.5" fill="#E6E9F3"/><rect x="50" y="238" width="390" height="1" rx="0.5" fill="#E6E9F3"/><rect x="50" y="282" width="390" height="1" rx="0.5" fill="#E6E9F3"/><rect class="a grow b" style="--delay:0.5s;--dur:9s" x="62" y="238" width="34" height="58" rx="8" fill="#DCE3FF"/><rect class="a grow b" style="--delay:0.62s;--dur:9s" x="116" y="212" width="34" height="84" rx="8" fill="#DCE3FF"/><rect class="a grow b" style="--delay:0.74s;--dur:9s" x="170" y="226" width="34" height="70" rx="8" fill="#DCE3FF"/><rect class="a grow b" style="--delay:0.86s;--dur:9s" x="224" y="184" width="34" height="112" rx="8" fill="#DCE3FF"/><rect class="a grow b" style="--delay:0.98s;--dur:9s" x="278" y="200" width="34" height="96" rx="8" fill="#DCE3FF"/><rect class="a grow b" style="--delay:1.1s;--dur:9s" x="332" y="164" width="34" height="132" rx="8" fill="#DCE3FF"/><rect class="a grow b" style="--delay:1.22s;--dur:9s" x="386" y="146" width="34" height="150" rx="8" fill="#4463FF"/><path class="a draw d" style="--delay:1.2s;--dur:9s" d="M79,212.64 L133,188.72 L187,201.6 L241,162.95999999999998 L295,177.68 L349,144.56 L403,128" fill="none" stroke="#1C1C1C" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" pathLength="1"/><g class="a pulse" style="--delay:2.4s;--dur:2s"><circle cx="403" cy="128" r="6" fill="#4463FF" stroke="#fff" stroke-width="3"/></g>
</svg>
