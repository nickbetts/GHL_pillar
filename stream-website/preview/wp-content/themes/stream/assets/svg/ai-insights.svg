ext-anchor="start">Which industry converts best?</text></g><g class="a rise" style="--delay:0.9s;--dur:10s;--dy:14px"><rect x="34" y="96" width="360" height="192" rx="20" fill="#fff" stroke="#E6E9F3" stroke-width="1" filter="url(#s-sh)"/><g class="a pulse" style="--delay:0s;--dur:2.4s"><circle cx="62" cy="126" r="16" fill="url(#s-g2)"/><g transform="translate(54 118) scale(0.7)" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/></g></g><text x="86" y="124" font-family="'Plus Jakarta Sans',Inter,system-ui,sans-serif" font-size="11" font-weight="800" fill="#1C1C1C" text-anchor="start">Stream AI</text><text x="86" y="138" font-family="'Plus Jakarta Sans',Inter,system-ui,sans-serif" font-size="9" font-weight="600" fill="#8A8FA3" text-anchor="start">Based on 1,248 leads this month</text><text x="70" y="168" font-family="'Plus Jakarta Sans',Inter,system-ui,sans-serif" font-size="10" font-weight="600" fill="#3A3D4A" text-anchor="start">Construction</text><rect x="158" y="158" width="200" height="9" rx="4.5" fill="#E6E9F3"/><rect class="a growx l" style="--delay:1.4s;--dur:9s" x="158" y="158" width="170" height="9" rx="4.5" fill="#4463FF"/><text x="372" y="167" font-family="'Plus Jakarta Sans',Inter,system-ui,sans-serif" font-size="10" font-weight="800" fill="#1C1C1C" text-anchor="start">34%</text><text x="70" y="192" font-family="'Plus Jakarta Sans',Inter,system-ui,sans-serif" font-size="10" font-weight="600" fill="#3A3D4A" text-anchor="start">Manufacturing</text><rect x="158" y="182" width="200" height="9" rx="4.5" fill="#E6E9F3"/><rect class="a growx l" style="--delay:1.7s;--dur:9s" x="158" y="182" width="130" height="9" rx="4.5" fill="#8B5CF6"/><text x="372" y="191" font-family="'Plus Jakarta Sans',Inter,system-ui,sans-serif" font-size="10" font-weight="800" fill="#1C1C1C" text-anchor="start"