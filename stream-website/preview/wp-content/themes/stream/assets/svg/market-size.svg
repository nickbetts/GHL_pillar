width="34" height="22" rx="7" fill="#EEF1FF"/><text x="329" y="93" font-family="'Plus Jakarta Sans',Inter,system-ui,sans-serif" font-size="9.5" font-weight="800" fill="#4463FF" text-anchor="middle">TAM</text><text x="354" y="95" font-family="'Plus Jakarta Sans',Inter,system-ui,sans-serif" font-size="17" font-weight="800" fill="#1C1C1C" text-anchor="start">48,200</text><text x="312" y="118" font-family="'Plus Jakarta Sans',Inter,system-ui,sans-serif" font-size="9" font-weight="600" fill="#8A8FA3" text-anchor="start">All UK engineering firms</text></g><g class="a slide" style="--delay:0.6499999999999999s;--dur:9s;--dx:22px"><rect x="300" y="148" width="156" height="72" rx="14" fill="#fff" stroke="#E6E9F3" stroke-width="1" filter="url(#s-sh)"/><rect x="312" y="162" width="34" height="22" rx="7" fill="#DCE3FF"/><text x="329" y="177" font-family="'Plus Jakarta Sans',Inter,system-ui,sans-serif" font-size="9.5" font-weight="800" fill="#4463FF" text-anchor="middle">SAM</text><text x="354" y="179" font-family="'Plus Jakarta Sans',Inter,system-ui,sans-serif" font-size="17" font-weight="800" fill="#1C1C1C" text-anchor="start">12,400</text><text x="312" y="202" font-family="'Plus Jakarta Sans',Inter,system-ui,sans-serif" font-size="9" font-weight="600" fill="#8A8FA3" text-anchor="start">Within your target sectors</text></g><g class="a slide" style="--delay:1s;--dur:9s;--dx:22px"><rect x="300" y="232" width="156" height="72" rx="14" fill="#fff" stroke="#E6E9F3" stroke-width="1" filter="url(#s-sh)"/><rect x="312" y="246" width="34" height="22" rx="7" fill="#4463FF"/><text x="329" y="261" font-family="'Plus Jakarta Sans',Inter,system-ui,sans-serif" font-size="9.5" font-weight="800" fill="#fff" text-anchor="middle">SOM</text><text x="354" y="263" font-family="'Plus Jakarta Sans',Inter,system-ui,sans-serif" font-size="17" font-weight="800" fill="#1C1C1C" text-anchor="start">3,150</text><text x="312" y="286" font-family="'Plus Jakarta Sans',Inter,system-ui,sans-serif" font-size="9" f