="M7 5H4a2 2 0 0 0 2 3.5"/></g><text x="58" y="246" font-family="'Plus Jakarta Sans',Inter,system-ui,sans-serif" font-size="9.5" font-weight="800" fill="#1C1C1C" text-anchor="start">Deal won</text></g><text x="240" y="42" font-family="'Plus Jakarta Sans',Inter,system-ui,sans-serif" font-size="10" font-weight="800" fill="#8A8FA3" text-anchor="middle" letter-spacing="1">RULES</text><g class="a pop" style="--delay:0.2s;--dur:9s"><rect x="190" y="62" width="100" height="56" rx="14" fill="#fff" stroke="#E6E9F3" filter="url(#s-sh2)"/><g transform="translate(200 78) scale(0.9)" fill="none" stroke="#8B5CF6" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M12 14l4-4"/><path d="M3.3 17a10 10 0 1 1 17.4 0"/></g><text x="228" y="94" font-family="'Plus Jakarta Sans',Inter,system-ui,sans-serif" font-size="9.5" font-weight="800" fill="#1C1C1C" text-anchor="start">Score</text></g><g class="a pop" style="--delay:0.6000000000000001s;--dur:9s"><rect x="190" y="138" width="100" height="56" rx="14" fill="#fff" stroke="#E6E9F3" filter="url(#s-sh2)"/><g transform="translate(200 154) scale(0.9)" fill="none" stroke="#8B5CF6" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></g><text x="228" y="170" font-family="'Plus Jakarta Sans',Inter,system-ui,sans-serif" font-size="9.5" font-weight="800" fill="#1C1C1C" text-anchor="start">Dedupe</text></g><g class="a pop" style="--delay:1s;--dur:9s"><rect x="190" y="214" width="100" height="56" rx="14" fill="#fff" stroke="#E6E9F3" filter="url(#s-sh2)"/><g transform="translate(200 230) scale(0.9)" fill="none" stroke="#8B5CF6" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M8.5 6H15a3 3 0 0 1 0 6H9a3 3 0 0 0 0 6h6.5"/></g><text x="228" y="246" font-family="'Plus Jakarta Sans',Inter,system-ui,sans-serif" fon