" y="112" width="7" height="11" rx="2" fill="#8B5CF6"/></g><g class="a fall" style="--delay:1.6500000000000004s;--dur:4s;--dy:230px"><rect x="375" y="112" width="7" height="11" rx="2" fill="#4463FF"/></g><g class="a pop" style="--delay:0s;--dur:10s"><rect x="24" y="30" width="432" height="76" rx="22" fill="url(#s-g3)" filter="url(#s-sh)"/><g transform="translate(40 46) scale(1.1)" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c1 3 5 5 5 10a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-3-1-5 1-9z"/></g><text x="76" y="60" font-family="'Plus Jakarta Sans',Inter,system-ui,sans-serif" font-size="15" font-weight="800" fill="#fff" text-anchor="start" letter-spacing="0.6">DOUBLE POINT FRENZY</text><text x="76" y="80" font-family="'Plus Jakarta Sans',Inter,system-ui,sans-serif" font-size="10.5" font-weight="600" fill="#fff" text-anchor="start">Alex closed a deal. Ends in</text><rect x="316" y="48" width="38" height="42" rx="10" fill="#fff"/><text x="335" y="76" font-family="'Plus Jakarta Sans',Inter,system-ui,sans-serif" font-size="16" font-weight="800" fill="#1C1C1C" text-anchor="middle">47h</text><rect x="360" y="48" width="38" height="42" rx="10" fill="#fff"/><text x="379" y="76" font-family="'Plus Jakarta Sans',Inter,system-ui,sans-serif" font-size="16" font-weight="800" fill="#1C1C1C" text-anchor="middle">59m</text><rect x="404" y="48" width="38" height="42" rx="10" fill="#fff"/><text x="423" y="76" font-family="'Plus Jakarta Sans',system-ui,sans-serif" font-size="17" font-weight="800" fill="#1C1C1C" text-anchor="middle" opacity="0"><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.000;0.167;1" calcMode="discrete" dur="6s" repeatCount="indefinite"/>12s</text><text x="423" y="76" font-family="'Plus Jakarta Sans',system-ui,sans-serif" font-size="17" font-weight="800" fill="#1C1C1C" text-anchor="middle" opacity="0"><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.167;0.333;1" calcMode="discrete" dur="6s" repeatCount="indefinite"/>11s</text><text x="423" y="76" font-family="'Plus Jakarta Sans',system-ui,sans-serif" font-size="17" font-weight="800" fill="#1C1C1C" text-anchor="middle" opacity="0"><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.333;0.500;1" calcMode="discrete" dur="6s" repeatCount="indefinite"/>10s</text><text x="423" y="76" font-family="'Plus Jakarta Sans',system-ui,sans-serif" font-size="17" font-weight="800" fill="#1C1C1C" text-anchor="middle" opacity="0"><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.500;0.667;1" calcMode="discrete" dur="6s" repeatCount="indefinite"/>09s</text><text x="423" y="76" font-family="'Plus Jakarta Sans',system-ui,sans-serif" font-size="17" font-weight="800" fill="#1C1C1C" text-anchor="middle" opacity="0"><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.667;0.833;1" calcMode="discrete" dur="6s" repeatCount="indefinite"/>08s</text><text x="423" y="76" font-family="'Plus Jakarta Sans',system-ui,sans-serif" font-size="17" font-weight="800" fill="#1C1C1C" text-anchor="middle" opacity="0"><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.833;1.000;1" calcMode="discrete" dur="6s" repeatCount="indefinite"/>07s</text></g><g class="a pulse" style="--delay:0s;--dur:2.2s;--sc:1.05"><text x="240" y="218" font-family="'Plus Jakarta Sans',Inter,system-ui,sans-serif" font-size="88" font-weight="800" fill="url(#s-g3)" text-anchor="middle">2×</text></g><g class="a rise" style="--delay:0.6s;--dur:5s;--dy:18px"><rect x="80" y="140" width="56" height="26" rx="13" fill="#D8F7EE"/><text x="108" y="157.2" font-family="'Plus Jakarta Sans',Inter,system-ui,sans-serif" font-size="12" font-weight="700" fill="#0E9F7E" text-anchor="middle">+240</text></g><g class="a rise" style="--delay:1.8s;--dur:5s;--dy:18px"><rect x="344" y="150" width="56" height="26" rx="13" fill="#D8F7EE"/><text x="372" y="167.2" font-family="'Plus Jakarta Sans',Inter,system-ui,sans-serif" font-size="12"