<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Email campaigns | Pillar CRM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/sales-app.css" />
  <link rel="stylesheet" href="/sales-flat.css" />
  <link rel="stylesheet" href="/campaigns.css" />
</head>
<body class="sq">
  <div class="app">
    <aside class="sidebar" id="sqSidebar"></aside>
    <main class="app-main">
      <header class="page-top">
        <div class="page-title">
          <h1>Email campaigns</h1>
          <span class="sub">Multi-step sequences sent from each contact's rep · Mon–Fri, 09:00–17:00 UK</span>
        </div>
        <div class="page-actions">
          <button type="button" class="ghost" data-act="refresh-list"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36L21 8"/><path d="M21 3v5h-5"/></svg>Refresh</button>
          <button type="button" data-act="new"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>New campaign</button>
        </div>
      </header>
      <div class="cmp-layout">
        <aside class="cmp-sidebar" aria-label="Campaigns">
          <div class="search-field">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <input id="campaignSearch" type="search" placeholder="Search campaigns" aria-label="Search campaigns" />
          </div>
          <div class="cmp-filters" id="campaignFilters" role="tablist" aria-label="Filter campaigns"></div>
          <div class="cmp-list" id="campaignList"><div class="cmp-empty">Loading campaigns…</div></div>
        </aside>
        <section class="cmp-main" id="workspace" aria-live="polite"></section>
      </div>
    </main>
  </div>
  <dialog class="cmp-modal" id="modal"></dialog>
  <div class="toast-host" id="toastHost" role="status" aria-live="polite"></div>
  <script src="/sales-app.js"></script>
  <script type="module" src="/campaigns-app.js"></script>
</body>
</html>
