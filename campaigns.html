<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Email Campaigns</title>
  <link rel="stylesheet" href="/sales-app.css">
  <style>
    .campaigns-shell { max-width: 1440px; margin: 0 auto; padding: 24px; }
    .campaign-header, .campaign-toolbar, .campaign-card-head, .step-head, .step-actions, .report-grid { display:flex; align-items:center; gap:12px; }
    .campaign-header, .campaign-toolbar, .campaign-card-head, .step-head { justify-content:space-between; }
    .campaign-header { margin-bottom:20px; }
    .campaign-header h1 { margin:0; }
    .campaign-header p { margin:6px 0 0; color:#475569; }
    .panel, .campaign-card, .step-card { background:#fff; border:1px solid var(--bd); border-radius:12px; }
    .panel { padding:18px; }
    .campaign-layout { display:grid; grid-template-columns:320px minmax(0,1fr); gap:18px; align-items:start; }
    .campaign-list { display:grid; gap:10px; }
    .campaign-card { padding:14px; cursor:pointer; }
    .campaign-card.selected { border-color:var(--teal); box-shadow:0 0 0 2px rgba(15,118,110,.12); }
    .campaign-card h3 { margin:0; font-size:14px; }
    .campaign-card p { margin:5px 0 0; color:#475569; font-size:12px; }
    .status { display:inline-flex; padding:3px 8px; border-radius:999px; background:#f1f5f9; color:#475569; font-size:11px; font-weight:800; text-transform:uppercase; }
    .status.active { background:#dcfce7; color:#166534; }.status.paused { background:#fef3c7; color:#92400e; }.status.archived { background:#fee2e2; color:#991b1b; }
    .field { display:grid; gap:6px; margin-bottom:12px; color:#334155; font-size:12px; font-weight:700; }
    input, textarea { width:100%; border:1px solid #cfd5de; border-radius:8px; padding:9px 10px; font:inherit; font-size:13px; color:#111827; }
    input { height:38px; } textarea { min-height:150px; resize:vertical; line-height:1.5; } select { min-height:38px; border:1px solid #aeb9c7; border-radius:8px; padding:0 10px; background:#fff; color:#172033; font:inherit; font-size:13px; }
    button { border:0; border-radius:8px; padding:9px 12px; background:var(--teal); color:#fff; font:inherit; font-size:12px; font-weight:800; cursor:pointer; }
    button.activate { background:#0f766e; box-shadow:0 1px 2px rgba(15,118,110,.2); }
    button.secondary { background:#fff; color:#334155; border:1px solid #cfd5de; } button.danger { background:#b91c1c; }
    button:disabled { opacity:.45; cursor:not-allowed; }
    .editor-empty { min-height:580px; display:grid; place-items:center; color:#475569; text-align:center; }
    .editor-head { padding-bottom:16px; border-bottom:1px solid var(--bd); margin-bottom:16px; }
    .editor-head h2 { margin:0; font-size:20px; }
    .editor-actions { display:flex; flex-wrap:wrap; gap:8px; }
    .steps { display:grid; gap:14px; }
    .step-card { padding:16px; }
    .wait-connector { display:flex; align-items:center; gap:10px; margin:0 32px; color:#334155; font-size:12px; font-weight:700; }
    .wait-connector::before, .wait-connector::after { content:''; height:1px; background:#cbd5e1; flex:1; }
    .wait-connector .field { display:flex; align-items:center; gap:6px; margin:0; white-space:nowrap; }
    .wait-connector input { width:76px; height:34px; }
    .step-head { align-items:flex-start; margin-bottom:12px; }
    .step-title { display:flex; align-items:center; gap:10px; }
    .step-number { width:28px; height:28px; display:grid; place-items:center; border-radius:50%; background:#0f766e; color:#fff; font-weight:800; font-size:12px; }
    .step-title h3 { margin:0; font-size:15px; }
    .step-meta { color:#475569; font-size:11px; }
    .step-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .step-options { display:grid; grid-template-columns:100px 100px 1fr; gap:10px; }
    .feedback { min-height:20px; color:#0f766e; font-size:12px; }
    .report-grid { flex-wrap:wrap; margin-top:16px; }
    .report-stat { padding:10px 14px; border:1px solid var(--bd); border-radius:8px; background:#f8fafc; font-size:12px; }
    .report-stat strong { display:block; font-size:18px; color:#0f172a; }
    .report-table-wrap { overflow:auto; margin-top:14px; border:1px solid var(--bd); border-radius:8px; }
    .report-table { width:100%; min-width:1120px; border-collapse:collapse; font-size:12px; }
    .report-table th, .report-table td { padding:9px 10px; border-bottom:1px solid var(--bd); text-align:left; white-space:nowrap; }
    .report-table th { background:#f8fafc; color:#475569; font-size:11px; text-transform:uppercase; }
    .report-table tr:last-child td { border-bottom:0; }
    .test-panel { margin-top:18px; padding:14px; border:1px solid #b8c7d8; border-radius:10px; background:#f1f5f9; }
    .test-panel h3 { margin:0 0 10px; font-size:13px; }
    .test-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
    @media (max-width:900px) { .campaign-layout { grid-template-columns:1fr; } .step-grid, .step-options { grid-template-columns:1fr; } .campaign-header { display:block; } .campaign-toolbar { margin-top:12px; justify-content:flex-start; } }
  </style>
</head>
<body class="sq">
  <div class="app"><aside class="sidebar" id="sqSidebar"></aside><main class="app-main">
    <div class="campaigns-shell">
      <header class="campaign-header"><div><h1>Email campaigns</h1><p>Build and manage persistent CRM sequences. Drafts do not send until activated.</p></div><div class="campaign-toolbar"><button id="newCampaign">New campaign</button><button class="secondary" id="growthStarter">Create Growth starter</button></div></header>
      <div class="feedback" id="feedback" role="status"></div>
      <div class="campaign-layout">
        <aside class="panel"><div class="campaign-card-head"><strong>Campaigns</strong><button class="secondary" id="refreshCampaigns">Refresh</button></div><div class="campaign-list" id="campaignList"></div></aside>
        <section class="panel" id="editor"><div class="editor-empty">Select a campaign or create one.</div></section>
      </div>
    </div>
  </main></div>
  <script src="/sales-app.js"></script>
  <script type="module">
    import { GENERAL_VARIANTS, composeTemplate } from '/email-template-data.js';
    const $ = (id) => document.getElementById(id);
    const state = { campaigns: [], selected: null };
    const starterSteps = GENERAL_VARIANTS.map((variant, index) => { const template = composeTemplate('All sectors', variant.key); return { stepOrder: index + 1, stepName: variant.label, subjectTemplate: template?.subject || '', bodyTemplate: template?.body || '', waitDays: index === 0 ? 0 : index === 1 ? 2 : 3, sendHour: 9, sendMinute: 0, sendTimezone: 'Europe/London', active: true }; });

    async function api(body) {
      const response = await fetch('/api/campaigns', { method:'POST', headers:{'Content-Type':'application/json'}, credentials:'same-origin', body:JSON.stringify(body) });
      const data = await response.json().catch(() => ({ success:false, error:'Request failed' }));
      if (response.status === 401) { location.href = '/login?next=/campaigns'; throw new Error('auth'); }
      if (!response.ok || !data.success) throw new Error(data.error || 'Request failed');
      return data;
    }
    function message(text) { $('feedback').textContent = text; }
    function renderList() {
      $('campaignList').innerHTML = state.campaigns.length ? state.campaigns.map((campaign) => `<article class="campaign-card ${state.selected?.id === campaign.id ? 'selected' : ''}" data-id="${campaign.id}"><div class="campaign-card-head"><h3>${escapeHtml(campaign.name)}</h3><span class="status ${campaign.status}">${campaign.status}</span></div><p>${campaign.enrollmentCount || 0} enrolled</p></article>`).join('') : '<p class="muted">No campaigns yet.</p>';
      document.querySelectorAll('.campaign-card[data-id]').forEach((card) => card.addEventListener('click', () => selectCampaign(card.dataset.id)));
    }
    function escapeHtml(value) { return String(value ?? '').replace(/[&<>"']/g, (char) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[char])); }
    async function loadCampaigns() { const data = await api({ action:'list' }); state.campaigns = data.campaigns || []; renderList(); }
    async function selectCampaign(id) { const data = await api({ action:'get', id }); state.selected = data.campaign; renderList(); renderEditor(); }
    function renderEditor() {
      const campaign = state.selected;
      if (!campaign) { $('editor').innerHTML = '<div class="editor-empty">Select a campaign or create one.</div>'; return; }
      const locked = campaign.status === 'active' || campaign.status === 'archived';
      $('editor').innerHTML = `<div class="editor-head"><div class="campaign-card-head"><div><h2>${escapeHtml(campaign.name)}</h2><p class="step-meta">${escapeHtml(campaign.description || 'No description')}</p></div><span class="status ${campaign.status}">${campaign.status}</span></div><div class="editor-actions"><button class="secondary" id="saveCampaign">Save draft</button><button class="secondary" id="cloneCampaign">Clone</button><button class="activate" id="activateCampaign" ${campaign.status === 'active' || campaign.status === 'archived' ? 'disabled' : ''}>Activate campaign</button><button class="secondary" id="pauseCampaign" ${campaign.status !== 'active' ? 'disabled' : ''}>Pause</button><button class="danger" id="archiveCampaign" ${campaign.status === 'archived' ? 'disabled' : ''}>Archive</button></div><p class="step-meta">Activation starts scheduled sends for enrolled leads. Drafts do not send.</p></div><label class="field">Campaign name<input id="campaignName" value="${escapeHtml(campaign.name)}" ${campaign.status === 'archived' ? 'disabled' : ''}></label><label class="field">Description<input id="campaignDescription" value="${escapeHtml(campaign.description || '')}" ${campaign.status === 'archived' ? 'disabled' : ''}></label><section class="test-panel"><h3>Test a step</h3><div class="test-grid"><label class="field">From email<select id="testFromEmail"></select></label><label class="field">From name<input id="testFromName" readonly></label><label class="field">Test recipient email<input id="testToEmail" type="email" placeholder="you@company.com"></label><label class="field">Recipient name<input id="testToName" placeholder="Nick"></label><label class="field">Demo first name<input id="testFirstName" value="Alex" readonly></label><label class="field">Demo company<input id="testCompanyName" value="Acme Ltd" readonly></label><label class="field" style="grid-column:1 / -1">Shared Growth landing URL<input id="testBookingUrl" value="https://click.i3media.net/growth"></label></div><div class="editor-actions"><span class="step-meta" id="testStepStatus">Click Test this step on an email card.</span></div></section><div class="steps" id="steps">${campaign.steps.map((step, index) => `${index ? `<div class="wait-connector"><label class="field">Wait <input data-wait-days type="number" min="0" max="365" value="${step.waitDays}" ${locked ? 'disabled' : ''}> days</label></div>` : ''}${stepEditor(step, locked)}`).join('')}</div><div class="campaign-card-head" style="margin-top:16px"><strong>Report</strong><button class="secondary" id="loadReport">Refresh report</button></div><div class="report-grid" id="report"><span class="step-meta">Load report for current campaign.</span></div><div class="report-table-wrap"><table class="report-table"><thead><tr><th>Recipient</th><th>Company</th><th>Owner</th><th>Step</th><th>Send status</th><th>Sent</th><th>Delivered</th><th>Opened</th><th>Clicked</th><th>Enrollment</th><th>Replied at</th><th>Stop reason</th></tr></thead><tbody id="reportActivity"><tr><td colspan="12">Refresh report for contact activity.</td></tr></tbody></table></div>`;
      $('saveCampaign').addEventListener('click', saveCampaign); $('cloneCampaign').addEventListener('click', cloneCampaign); $('activateCampaign').addEventListener('click', () => campaignAction('activate')); $('pauseCampaign').addEventListener('click', () => campaignAction('pause')); $('archiveCampaign').addEventListener('click', () => campaignAction('archive')); $('loadReport').addEventListener('click', loadReport); setupStepTesting();
    }
    function stepEditor(step, locked) { const time = `${String(step.sendHour ?? 9).padStart(2, '0')}:${String(step.sendMinute ?? 0).padStart(2, '0')}`; return `<article class="step-card" data-step-id="${step.id || ''}"><div class="step-head"><div class="step-title"><span class="step-number">${step.stepOrder}</span><div><h3>${escapeHtml(step.stepName)}</h3><div class="step-meta">Step ${step.stepOrder}</div></div></div><button class="secondary test-step" type="button" data-test-step="${step.stepOrder}">Test this step</button></div><div class="step-grid"><label class="field">Step name<input data-field="stepName" value="${escapeHtml(step.stepName)}" ${locked ? 'disabled' : ''}></label><label class="field">Subject<input data-field="subjectTemplate" value="${escapeHtml(step.subjectTemplate)}" ${locked ? 'disabled' : ''}></label><label class="field">Email body<textarea data-field="bodyTemplate" ${locked ? 'disabled' : ''}>${escapeHtml(step.bodyTemplate)}</textarea></label><div><div class="step-options"><label class="field">Send time<input data-field="sendTime" type="time" step="60" value="${time}" ${locked ? 'disabled' : ''}></label><input type="hidden" data-field="sendTimezone" value="Europe/London"></div><p class="step-meta">UK time · Available variables: {{FIRST_NAME}} {{COMPANY_NAME}} {{SENDER_NAME}} {{SENDER_TITLE}} {{SENDER_EMAIL}} {{BOOKING_URL}} {{SIGNATURE}} {{SIGNATURE_HTML}}</p></div></div></article>`; }
    function selectedTestStep() { const selected = $('steps').querySelector('.step-card.selected'); return selected ? Number(selected.querySelector('[data-test-step]')?.dataset.testStep) : null; }
    async function loadTestSenders() {
      const select = $('testFromEmail');
      select.replaceChildren(new Option('Loading sales reps...', ''));
      const response = await fetch('/api/sq-auth', { method:'POST', headers:{'Content-Type':'application/json'}, credentials:'same-origin', body:JSON.stringify({ action:'list-users' }) });
      const data = await response.json().catch(() => ({}));
      if (!response.ok || !data.success) throw new Error(data.error || 'Unable to load senders');
      const users = (data.users || []).filter((user) => user.active !== false && user.ghlOwnerId && (user.senderEmail || user.email)).sort((a, b) => String(a.name || '').localeCompare(String(b.name || '')));
      select.replaceChildren(...users.map((user) => { const option = document.createElement('option'); const firstName = String(user.name || user.email).trim().split(/\s+/)[0]; option.value = user.senderEmail || user.email; option.textContent = `${firstName} @ I3MEDIA <${option.value}>`; option.dataset.displayName = `${firstName} @ I3MEDIA`; return option; }));
      if (!users.length) select.replaceChildren(new Option('No active sales reps configured', ''));
      updateTestSenderName();
    }
    function updateTestSenderName() { $('testFromName').value = $('testFromEmail').selectedOptions[0]?.dataset.displayName || ''; }
    function setupStepTesting() {
      const testPanel = document.querySelector('.test-panel');
      const steps = $('steps');
      if (testPanel && steps) $('editor').insertBefore(testPanel, steps);
      document.querySelectorAll('[data-test-step]').forEach((button) => button.addEventListener('click', () => {
        document.querySelectorAll('.step-card').forEach((card) => card.classList.remove('selected'));
        button.closest('.step-card').classList.add('selected');
        $('testStepStatus').textContent = `Selected step ${button.dataset.testStep}.`;
        sendStepTest(Number(button.dataset.testStep));
      }));
      $('testFromEmail').addEventListener('change', updateTestSenderName);
      loadTestSenders().catch((error) => { $('testFromEmail').replaceChildren(new Option('Unable to load sales reps', '')); $('testStepStatus').textContent = error.message; });
    }
    async function sendStepTest(stepOrder = selectedTestStep()) {
      if (!stepOrder) { $('testStepStatus').textContent = 'Select a step to test first.'; return; }
      const recipient = $('testToEmail').value.trim();
      if (!recipient) { $('testStepStatus').textContent = 'Enter a test recipient email first.'; return; }
      const card = [...document.querySelectorAll('[data-step-id]')].find((item) => Number(item.querySelector('[data-test-step]')?.dataset.testStep) === stepOrder);
      const read = (name) => card.querySelector(`[data-field="${name}"]`)?.value || '';
      $('testStepStatus').textContent = 'Sending test email...';
      try {
        const response = await fetch('/api/email-send', { method:'POST', headers:{'Content-Type':'application/json'}, credentials:'same-origin', body:JSON.stringify({ action:'send-test', toEmail:recipient, toName:$('testToName').value.trim(), fromEmail:$('testFromEmail').value, fromName:$('testFromName').value, testFirstName:'Alex', testCompanyName:'Acme Ltd', templateKey:`campaign:${state.selected.id}:step:${stepOrder}`, subjectTemplate:read('subjectTemplate'), bodyTemplate:read('bodyTemplate'), senderTitle:'', bookingUrl:$('testBookingUrl').value }) });
        const data = await response.json();
        if (!response.ok || !data.success) throw new Error(data.error || 'Unable to send test email');
        $('testStepStatus').textContent = `Test sent (${data.result?.providerMessageId || 'queued'}).`;
      } catch (error) { $('testStepStatus').textContent = error.message; }
    }
    function formSteps() { return [...document.querySelectorAll('[data-step-id]')].map((card, index) => { const read = (name) => card.querySelector(`[data-field="${name}"]`)?.value ?? ''; const [sendHour, sendMinute] = read('sendTime').split(':').map(Number); const waitDays = Number(card.previousElementSibling?.querySelector('[data-wait-days]')?.value ?? (index === 0 ? 0 : 3)); return { id: card.dataset.stepId || undefined, stepOrder:index + 1, stepName:read('stepName'), subjectTemplate:read('subjectTemplate'), bodyTemplate:read('bodyTemplate'), waitDays:Number.isFinite(waitDays) ? waitDays : 0, sendHour:Number.isFinite(sendHour) ? sendHour : 9, sendMinute:Number.isFinite(sendMinute) ? sendMinute : 0, sendTimezone:'Europe/London', active:true }; }); }
    async function saveCampaign() { try { await api({ action:'update', id:state.selected.id, name:$('campaignName').value, description:$('campaignDescription').value }); await api({ action:'save-steps', id:state.selected.id, steps:formSteps() }); await selectCampaign(state.selected.id); message('Campaign draft saved.'); } catch (error) { message(error.message); } }
    async function campaignAction(action) { try { const data = await api({ action, id:state.selected.id }); state.selected=data.campaign; await loadCampaigns(); renderEditor(); message(`Campaign ${action === 'pause' ? 'paused' : action === 'archive' ? 'archived' : action}.`); } catch (error) { message(error.message); } }
    async function cloneCampaign() { try { const data = await api({ action:'clone', id:state.selected.id }); await loadCampaigns(); await selectCampaign(data.campaign.id); message('Campaign cloned as a draft.'); } catch (error) { message(error.message); } }
    async function loadReport() { try { const data = await api({ action:'report', id:state.selected.id }); const items=[...(data.enrollmentStatuses||[]), ...(data.sendStatuses||[]), ...(data.eventStatuses||[])]; $('report').innerHTML=items.length ? items.map((item)=>`<div class="report-stat"><strong>${item.count}</strong>${escapeHtml(item.status)}</div>`).join('') : '<span class="step-meta">No activity yet.</span>'; const activity=data.activity||[]; $('reportActivity').innerHTML=activity.length ? activity.map((item)=>`<tr><td>${escapeHtml(item.lead_name || item.recipient_email || '')}<br><span class="step-meta">${escapeHtml(item.recipient_email || '')}</span></td><td>${escapeHtml(item.company_name || '')}</td><td>${escapeHtml(item.owner_name || '')}</td><td>${escapeHtml(`${item.step_order}. ${item.step_name || ''}`)}</td><td>${escapeHtml(item.send_status || '')}</td><td>${escapeHtml(item.sent_at ? new Date(item.sent_at).toLocaleString() : '')}</td><td>${item.delivered_count || 0}</td><td>${item.opened_count || 0}</td><td>${item.clicked_count || 0}</td><td>${escapeHtml(item.enrollment_status || '')}</td><td>${escapeHtml(item.stopped_at ? new Date(item.stopped_at).toLocaleString() : '')}</td><td>${escapeHtml(item.stopped_reason || '')}</td></tr>`).join('') : '<tr><td colspan="12">No individual send activity yet.</td></tr>'; } catch (error) { message(error.message); } }
    async function createCampaign(name, steps = []) { try { const data=steps.length ? await api({ action:'seed-growth' }) : await api({ action:'create', name, description:'Persistent CRM sequence' }); await loadCampaigns(); await selectCampaign(data.campaign.id); message(data.created === false ? 'Growth campaign already exists.' : 'Campaign draft created.'); } catch (error) { message(error.message); } }
    $('newCampaign').addEventListener('click', () => createCampaign('New campaign'));
    $('growthStarter').addEventListener('click', () => createCampaign('I3 Growth LP - General sequence', starterSteps));
    $('refreshCampaigns').addEventListener('click', loadCampaigns);
    SQ.init(async (caps) => { if (!caps?.isAdmin) { message('Admin access required to manage campaigns.'); return; } await loadCampaigns(); });
  </script>
</body>
</html>
