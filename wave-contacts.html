<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wave Contacts</title>
  <style>
    :root { --bd:#e5e7eb; }
    * { box-sizing: border-box; }
    body { margin:0; font-family:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; background:#f4f5f7; color:#111827; -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility; }
    .wrap { max-width: 1600px; margin: 0 auto; padding: 28px 24px; }
    .card { background:#fff; border-radius:16px; padding:22px; box-shadow:0 1px 2px rgba(16,24,40,.04), 0 8px 28px rgba(16,24,40,.06); }
    .top { display:flex; justify-content:space-between; align-items:flex-start; gap:16px; flex-wrap:wrap; margin-bottom:18px; }
    .title { margin:0; }
    .muted { color:#6b7280; font-size:13px; }
    .toolbar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    input, select, button { height:38px; border-radius:10px; font:inherit; font-size:13px; }
    input, select { border:1px solid #d1d5db; padding:0 12px; background:#fff; }
    input:focus, select:focus { outline:none; border-color:#2563eb; box-shadow:0 0 0 3px rgba(37,99,235,.12); }
    button { border:none; padding:0 14px; cursor:pointer; background:#2563eb; color:#fff; font-weight:600; transition:background .15s, transform .04s; }
    button:hover { background:#1d4ed8; }
    button:active { transform:translateY(1px); }
    button.ghost { background:#fff; color:#374151; border:1px solid #d8dce2; font-weight:500; }
    button.ghost:hover { background:#f3f4f6; }
    .chips { display:flex; gap:6px; flex-wrap:wrap; margin:12px 0 14px; }
    .chip { display:inline-flex; align-items:center; gap:6px; padding:6px 10px; border-radius:999px; background:#f3f4f6; color:#374151; font-size:12px; cursor:pointer; }
    .chip.active { background:#111827; color:#fff; }
    .grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap:8px; margin:12px 0 14px; }
    .kpi { border:1px solid var(--bd); border-radius:12px; background:#fafafa; padding:10px; }
    .kpi .k { font-size:11px; color:#6b7280; text-transform:uppercase; letter-spacing:.03em; }
    .kpi .v { font-size:22px; font-weight:700; margin-top:4px; }
    .tablewrap { overflow:auto; border:1px solid var(--bd); border-radius:12px; }
    table { width:100%; border-collapse:collapse; font-size:13px; min-width:1200px; }
    thead th { position:sticky; top:0; background:#f9fafb; text-align:left; padding:10px 12px; font-weight:600; color:#374151; border-bottom:1px solid var(--bd); white-space:nowrap; }
    tbody td { padding:9px 12px; border-bottom:1px solid #f1f2f4; vertical-align:middle; }
    tbody tr:hover { background:#f8fafc; }
    .name { font-weight:600; }
    .sub { color:#6b7280; font-size:12px; }
    .pill { padding:3px 9px; border-radius:999px; font-size:12px; font-weight:600; white-space:nowrap; }
    .prio-hot { background:#fee2e2; color:#b91c1c; }
    .prio-warm { background:#fef3c7; color:#92400e; }
    .prio-cold { background:#e0f2fe; color:#075985; }
    .empty { padding:44px; text-align:center; color:#9ca3af; }
    .overlay { position:fixed; inset:0; background:rgba(17,24,39,.6); display:flex; align-items:center; justify-content:center; z-index:50; }
    .overlay .box { background:#fff; padding:28px; border-radius:16px; width:320px; text-align:center; box-shadow:0 20px 60px rgba(0,0,0,.3); }
    .overlay input { width:100%; margin:12px 0; }
    .hidden { display:none; }
    @media (max-width: 900px){ .toolbar { width:100%; } }
  </style>
  <link rel="stylesheet" href="/sales-app.css" />
</head>
<body class="sq">
  <div class="app">
    <aside class="sidebar" id="sqSidebar"></aside>
    <main class="app-main">
  <div class="wrap">
    <div class="card">
      <div class="top">
        <div>
          <h1 class="title" id="pageTitle">Wave Contacts</h1>
          <p class="muted" id="pageCopy" style="margin:6px 0 0">Banked contacts before they are enriched and moved into the main feed.</p>
        </div>
        <div class="toolbar">
          <input id="search" placeholder="Search name, company or title" oninput="render()" style="width:240px" />
          <select id="sectorFilter" onchange="setSectorFilter(this.value)"></select>
          <select id="roleFilter" onchange="setRoleFilter(this.value)">
            <option value="fit">Marketing buyers only</option>
            <option value="excluded">Excluded roles only</option>
            <option value="all">All roles</option>
          </select>
          <button class="ghost" onclick="loadWave()">Refresh</button>
        </div>
      </div>

      <div class="chips" id="waveChips"></div>
      <div id="summary" class="grid"></div>
      <div id="status" class="muted" style="margin-bottom:10px">Loading...</div>

      <div class="tablewrap">
        <table>
          <thead>
            <tr>
              <th>Priority</th>
              <th>Name</th>
              <th>Company</th>
              <th>Sector</th>
              <th>Sub-sector</th>
              <th>Role fit</th>
              <th>Size band</th>
              <th>Revenue band</th>
              <th>Email</th>
              <th>Phone</th>
              <th>Wave</th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </div>
  </div>
    </main>
  </div>

  <script src="/sales-app.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    const fmt = (n) => Number(n || 0).toLocaleString('en-GB');
    const esc = (s) => String(s ?? '').replace(/[&<>'"]/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
    const fmtRevenue = (v) => { const n = parseInt(v, 10); if (!Number.isFinite(n)) return v || '–'; if (n >= 1e9) return `£${(n/1e9).toFixed(1)}b`; if (n >= 1e6) return `£${(n/1e6).toFixed(1)}m`; if (n >= 1e3) return `£${Math.round(n/1e3)}k`; return `£${n}`; };
    const rank = { hot: 0, warm: 1, cold: 2 };
    const WAVE_SIZE = 1111;

    // Vercel rewrites keep the browser URL as /wave-2, /wave-3, /backup while
    // serving wave-contacts.html — so location.search is empty. Read the mode
    // from the pathname first, falling back to any ?wave= query for direct hits.
    const query = new URLSearchParams(location.search);
    const path = location.pathname.replace(/\/+$/, '');
    let mode;
    let waveNumber;
    if (/backup/i.test(path) || query.get('backup') === '1') {
      mode = 'backup';
      waveNumber = null;
    } else {
      const m = path.match(/wave-?(\d+)/i);
      waveNumber = m ? m[1] : (query.get('wave') || '1');
      mode = `wave-${waveNumber}`;
    }
    let CAPS = null;
    let ME = null;
    let CANDIDATES = [];
    let activeSector = 'all';
    let activeRole = 'fit';

    const MODES = [
      { key: 'wave-1', label: 'Wave 1', href: '/wave-1', body: 'Best-fit contacts released first, before enrichment.' },
      { key: 'wave-2', label: 'Wave 2', href: '/wave-2', body: 'Second wave contacts waiting to be enriched.' },
      { key: 'wave-3', label: 'Wave 3', href: '/wave-3', body: 'Third wave contacts before they hit the feed.' },
      { key: 'backup', label: 'Backup', href: '/backup', body: 'Tier 2 reserve not yet released into a wave.' },
    ];

    function showLogin(){ location.href = '/login?next=' + encodeURIComponent(location.pathname); }
    async function logout(){
      try { await fetch('/api/sq-auth', { method:'POST', headers:{'Content-Type':'application/json'}, credentials:'same-origin', body:JSON.stringify({action:'logout'}) }); } catch {}
      location.href = '/login';
    }

    function currentMode(){ return MODES.find((m) => m.key === mode) || MODES[0]; }

    function renderModeChips(){
      $('waveChips').innerHTML = MODES.map((m) => `<div class="chip ${m.key===mode?'active':''}" onclick="window.location.href='${m.href}'">${esc(m.label)}</div>`).join('');
      $('pageTitle').textContent = mode === 'backup' ? 'Backup reserve' : `Wave ${waveNumber}`;
      $('pageCopy').textContent = currentMode().body;
    }

    function renderSectorFilter(){
      const sectors = Array.from(new Set(CANDIDATES.map((c) => c.sector || 'Unknown'))).sort((a, b) => a.localeCompare(b));
      $('sectorFilter').innerHTML = [`<option value="all" ${activeSector==='all'?'selected':''}>All sectors</option>`]
        .concat(sectors.map((s) => `<option value="${esc(s)}" ${activeSector===s?'selected':''}>${esc(s)}</option>`)).join('');
    }

    function setSectorFilter(sector){ activeSector = sector || 'all'; render(); }

    function setRoleFilter(role){ activeRole = role || 'fit'; loadWave(); }

    async function loadWave(){
      $('status').textContent = 'Loading wave contacts...';
      try {
        const body = mode === 'backup' ? { action: 'candidate-list', backup: true, includeEnqueued: false, roleFit: activeRole } : { action: 'candidate-list', wave: Number.parseInt(waveNumber, 10), includeEnqueued: false, roleFit: activeRole };
        const res = await fetch('/api/apollo-sales-queue', { method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'same-origin', body: JSON.stringify(body) });
        if (res.status === 401) { showLogin(); return; }
        const data = await res.json();
        if (!data.success) throw new Error(data.error || 'Unable to load wave');
        CANDIDATES = data.candidates || [];
        renderModeChips();
        renderSectorFilter();
        renderSummary();
        render();
        $('status').textContent = `${fmt(CANDIDATES.length)} contacts loaded · ${mode === 'backup' ? 'backup reserve' : `wave ${waveNumber}`}`;
      } catch (err) {
        $('status').textContent = err.message;
      }
    }

    function filtered(){
      const q = ($('search').value || '').toLowerCase();
      return CANDIDATES.filter((c) => (activeSector === 'all' || (c.sector || 'Unknown') === activeSector)).filter((c) => {
        if (!q) return true;
        return `${c.name || ''} ${c.company_name || ''} ${c.title || ''} ${c.sub_sector || ''}`.toLowerCase().includes(q);
      }).sort((a, b) => (rank[a.priority] ?? 9) - (rank[b.priority] ?? 9) || String(a.company_name || '').localeCompare(String(b.company_name || '')));
    }

    // Waves are computed by rank on the server; derive the label from the row rank.
    function rowWave(c){
      const rn = Number(c.rn);
      if (!Number.isFinite(rn)) return c.wave ?? '–';
      if (rn <= WAVE_SIZE) return '1';
      if (rn <= WAVE_SIZE * 2) return '2';
      if (rn <= WAVE_SIZE * 3) return '3';
      return 'Backup';
    }

    // Apollo's free People Search masks exact size/revenue, so we show the band
    // the contact was pulled in (from tier). Exact figures appear on the main
    // board once the contact is enriched.
    function sizeBand(c){
      if (c.company_employees != null) return String(c.company_employees);
      return Number(c.tier) === 1 ? '1-10' : '1-50';
    }
    function revenueBand(c){
      if (c.company_revenue != null) return fmtRevenue(c.company_revenue);
      return Number(c.tier) === 1 ? '£100k-£2M' : '£300k-£5M';
    }

    function renderSummary(){
      const rows = CANDIDATES;
      const byPriority = { hot: 0, warm: 0, cold: 0 };
      rows.forEach((r) => { byPriority[r.priority || 'warm'] = (byPriority[r.priority || 'warm'] || 0) + 1; });
      const sectors = new Set(rows.map((r) => r.sector || 'Unknown'));
      $('summary').innerHTML = [
        ['Contacts', rows.length],
        ['Hot', byPriority.hot],
        ['Warm', byPriority.warm],
        ['Cold', byPriority.cold],
        ['Sectors', sectors.size],
        ['With email', rows.filter((r) => r.has_email).length],
      ].map(([k, v]) => `<div class="kpi"><div class="k">${esc(k)}</div><div class="v">${fmt(v)}</div></div>`).join('');
    }

    function render(){
      const rows = filtered();
      $('tbody').innerHTML = rows.length ? rows.map((c) => `
        <tr>
          <td><span class="pill prio-${c.priority || 'warm'}">${esc((c.priority || 'warm').toUpperCase())}</span></td>
          <td><div class="name">${esc(c.name || '–')}</div><div class="sub">${esc(c.title || '')}</div></td>
          <td>${esc(c.company_name || '–')}</td>
          <td>${esc(c.sector || 'Unknown')}</td>
          <td>${esc(c.sub_sector || 'Unknown')}</td>
          <td>${c.role_fit === false ? `<span class="pill prio-hot">${esc(c.role_reason || 'excluded')}</span>` : `<span class="sub">${esc(c.role_reason || 'fit')}</span>`}</td>
          <td>${esc(sizeBand(c))}</td>
          <td>${esc(revenueBand(c))}</td>
          <td>${c.has_email ? 'Yes' : 'No'}</td>
          <td>${c.has_phone ? 'Yes' : 'No'}</td>
          <td>${esc(rowWave(c))}</td>
        </tr>`).join('') : '<tr><td colspan="11"><div class="empty">No contacts for this filter.</div></td></tr>';
    }

    function boot(){
      SQ.init((caps, user) => {
        CAPS = caps; ME = user;
        if(!CAPS.viewWaves){ location.href = '/sales-queue'; return; }
        loadWave();
      });
    }

    window.addEventListener('DOMContentLoaded', boot);
  </script>
</body>
</html>
