<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calendar | Pillar CRM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/sales-app.css" />
  <link rel="stylesheet" href="/sales-flat.css" />
  <link rel="stylesheet" href="/calendar.css" />
</head>
<body class="sq">
  <div class="app">
    <aside class="sidebar" id="sqSidebar"></aside>
    <main class="app-main">
      <header class="page-top">
        <div class="page-title">
          <h1>Calendar</h1>
          <span class="sub">Meetings, callbacks and activity blocks across the team</span>
        </div>
        <div class="page-actions">
          <div class="cal-nav">
            <button class="ghost icon" type="button" onclick="shiftAnchor(-1)" aria-label="Previous" title="Previous"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button>
            <button class="ghost" type="button" onclick="jumpToday()">Today</button>
            <button class="ghost icon" type="button" onclick="shiftAnchor(1)" aria-label="Next" title="Next"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></button>
          </div>
          <div class="seg" role="group" aria-label="Calendar view">
            <button id="viewMonth" type="button" onclick="setView('month')">Month</button>
            <button id="viewWeek" type="button" onclick="setView('week')">Week</button>
            <button id="viewDay" type="button" class="on" onclick="setView('day')">Day</button>
          </div>
          <select id="ownerFilter" onchange="setOwner(this.value)" aria-label="Filter by rep">
            <option value="all">All reps</option>
          </select>
        </div>
      </header>
      <div class="wrap">
        <div class="filter-bar">
          <div class="seg" role="group" aria-label="Event type">
            <button id="fltAll" type="button" class="chip-btn on" onclick="setFilter('all')">All</button>
            <button id="fltMeeting" type="button" class="chip-btn" onclick="setFilter('meeting')"><span class="sw meeting"></span>Meetings</button>
            <button id="fltCallback" type="button" class="chip-btn" onclick="setFilter('callback')"><span class="sw callback"></span>Callbacks</button>
            <button id="fltActivity" type="button" class="chip-btn" onclick="setFilter('activity')"><span class="sw activity"></span>Activities</button>
          </div>
          <div class="search-field">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <input id="search" type="search" placeholder="Filter by lead or company" oninput="render()" aria-label="Filter events" />
          </div>
          <div id="status" class="status-line">Loading calendar…</div>
        </div>

        <section id="stats" class="kpi-strip"></section>

        <section class="cal-panel" id="calendarMain">
          <div class="cal-head">
            <h3 id="rangeLabel"></h3>
            <div class="legend"><span><i class="sw meeting"></i>Meeting</span><span><i class="sw callback"></i>Callback</span><span><i class="sw activity"></i>Activity</span><span class="hint" id="viewHint"></span></div>
          </div>
          <div id="monthView"></div>
          <div id="weekView" class="hidden"></div>
          <div id="dayView" class="hidden"></div>
        </section>
      </div>
    </main>
  </div>

  <div id="workflowOverlay" class="workflow-overlay hidden" aria-hidden="true" role="dialog" aria-modal="true" aria-label="Workflow modal">
    <div class="workflow-shell">
      <div class="workflow-head">
        <h3 id="workflowTitle" class="workflow-title">Workflow</h3>
        <button id="workflowClose" type="button" class="workflow-close">Close</button>
      </div>
      <iframe id="workflowFrame" class="workflow-frame" title="Workflow page"></iframe>
    </div>
  </div>

  <script src="/sales-app.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));

    let LEADS = [];
    let BLOCKS = [];
    let VIEW = 'day';
    let FILTER = 'all';
    let OWNER = 'all';
    let ANCHOR = new Date();
    let SELECTED_DAY = dayKey(new Date());
    let USER = null;
    let CAPS = null;
    let nowLineTimer = null;
    const REPS = [
      { id: '6FX5X4kH2JFJc6u9zhSC', name: 'Brendon Mwatsenekenyi' },
      { id: 'XbyxbOK1Q1raRCjjGx4O', name: 'Zain Safir-Sheikh' },
    ];

    function startOfDay(d) {
      const x = new Date(d);
      x.setHours(0, 0, 0, 0);
      return x;
    }

    function endOfDay(d) {
      const x = new Date(d);
      x.setHours(23, 59, 59, 999);
      return x;
    }

    function dayKey(v) {
      const d = new Date(v);
      if (Number.isNaN(d.getTime())) return null;
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }

    function dayLabel(key) {
      const d = new Date(`${key}T00:00:00`);
      return Number.isNaN(d.getTime()) ? key : d.toLocaleDateString('en-GB', { weekday:'short', day:'2-digit', month:'short' });
    }

    function fmtDateTime(iso) {
      if (!iso) return '';
      const d = new Date(iso);
      if (Number.isNaN(d.getTime())) return '';
      return d.toLocaleString('en-GB', { day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit' });
    }

    function fmtTimeRange(startIso, endIso) {
      const s = new Date(startIso || '');
      const e = new Date(endIso || '');
      if (Number.isNaN(s.getTime())) return '';
      const start = s.toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit' });
      if (Number.isNaN(e.getTime())) return start;
      return `${start} - ${e.toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit' })}`;
    }

    function parseIso(iso) {
      const d = new Date(iso || '');
      return Number.isNaN(d.getTime()) ? null : d;
    }

    function toTs(iso) {
      const d = parseIso(iso);
      return d ? d.getTime() : Number.NaN;
    }

    function addMinutes(iso, minutes) {
      const start = parseIso(iso);
      if (!start) return null;
      return new Date(start.getTime() + (minutes * 60 * 1000)).toISOString();
    }

    function defaultEventDurationMinutes(type) {
      if (type === 'meeting') return 60;
      if (type === 'activity') return 30;
      return 20;
    }

    function calendarRepColumns() {
      return REPS;
    }

    function eventMatchesRep(event, repId) {
      return String(event.ownerId || '') === String(repId || '');
    }

    function layoutDayEvents(events) {
      const sorted = [...events].sort((a, b) => {
        const byStart = toTs(a.at) - toTs(b.at);
        if (byStart !== 0) return byStart;
        return toTs(a.endsAt || addMinutes(a.at, defaultEventDurationMinutes(a.type))) - toTs(b.endsAt || addMinutes(b.at, defaultEventDurationMinutes(b.type)));
      });
      const laidOut = [];
      let cluster = [];
      let clusterEnd = Number.NaN;

      const flushCluster = () => {
        if (!cluster.length) return;
        const columns = [];
        let maxCols = 1;
        for (const event of cluster) {
          const startTs = toTs(event.at);
          const endTs = toTs(event.endsAt || addMinutes(event.at, defaultEventDurationMinutes(event.type)));
          let col = columns.findIndex((endAt) => endAt <= startTs);
          if (col === -1) {
            col = columns.length;
            columns.push(endTs);
          } else {
            columns[col] = endTs;
          }
          event._col = col;
          if (columns.length > maxCols) maxCols = columns.length;
        }
        for (const event of cluster) {
          event._cols = maxCols;
          laidOut.push(event);
        }
        cluster = [];
        clusterEnd = Number.NaN;
      };

      for (const event of sorted) {
        const startTs = toTs(event.at);
        const endTs = toTs(event.endsAt || addMinutes(event.at, defaultEventDurationMinutes(event.type)));
        if (!cluster.length) {
          cluster.push(event);
          clusterEnd = endTs;
          continue;
        }
        if (startTs < clusterEnd) {
          cluster.push(event);
          clusterEnd = Math.max(clusterEnd, endTs);
          continue;
        }
        flushCluster();
        cluster.push(event);
        clusterEnd = endTs;
      }
      flushCluster();
      return laidOut;
    }

    function meetingSourceLabel(lead) {
      const origin = String(lead?.opportunityOrigin || '').trim().toLowerCase();
      if (origin === 'manual_activity') return 'Cold activity';
      if (origin === 'manual_opportunity') return 'Manual add';
      if (origin === 'call_list' || origin === 'call_list_lead') return 'Call list lead';
      return 'Call list lead';
    }

    async function api(body) {
      const res = await fetch('/api/apollo-sales-queue', {
        method: 'POST',
        headers: { 'Content-Type':'application/json' },
        credentials: 'same-origin',
        body: JSON.stringify(body),
      });
      if (res.status === 401) {
        location.href = '/login?next=' + encodeURIComponent(location.pathname);
        return { success:false, error:'Not signed in' };
      }
      return res.json().catch(() => ({ success:false, error:'Request failed' }));
    }

    function currentRange() {
      if (VIEW === 'day') {
        const d = new Date(`${SELECTED_DAY}T00:00:00`);
        return { start: startOfDay(d), end: endOfDay(d) };
      }
      if (VIEW === 'week') {
        const base = new Date(`${SELECTED_DAY}T00:00:00`);
        const offset = (base.getDay() + 6) % 7;
        const start = new Date(base);
        start.setDate(base.getDate() - offset);
        const end = new Date(start);
        end.setDate(start.getDate() + 6);
        end.setHours(23, 59, 59, 999);
        return { start, end };
      }
      const mStart = new Date(ANCHOR.getFullYear(), ANCHOR.getMonth(), 1);
      const mEnd = new Date(ANCHOR.getFullYear(), ANCHOR.getMonth() + 1, 0);
      return { start: startOfDay(mStart), end: endOfDay(mEnd) };
    }

    function expandedFetchRange() {
      const { start, end } = currentRange();
      const s = new Date(start);
      const e = new Date(end);
      s.setDate(s.getDate() - 35);
      e.setDate(e.getDate() + 120);
      return { start: s, end: e };
    }

    function buildEvents() {
      const events = [];
      for (const lead of LEADS) {
        if (lead.callbackAt) {
          events.push({
            type: 'callback',
            at: lead.callbackAt,
            endsAt: null,
            leadId: lead.id,
            title: lead.name || 'Unknown',
            company: lead.companyName || '',
            ownerId: lead.ownerId || '',
            owner: lead.owner || 'Unassigned',
            notes: lead.nextStepSummary || '',
          });
        }
        if (lead.meetingScheduledAt) {
          events.push({
            type: 'meeting',
            at: lead.meetingScheduledAt,
            endsAt: null,
            leadId: lead.id,
            title: lead.name || 'Unknown',
            company: lead.companyName || '',
            ownerId: lead.ownerId || '',
            owner: lead.owner || 'Unassigned',
            notes: lead.nextStepSummary || '',
            source: meetingSourceLabel(lead),
          });
        }
      }
      for (const b of BLOCKS) {
        if (!b || !b.startsAt) continue;
        events.push({
          type: 'activity',
          at: b.startsAt,
          endsAt: b.endsAt || null,
          leadId: null,
          title: b.title || 'Activity block',
          company: '',
          ownerId: b.ownerId || '',
          owner: b.ownerName || b.ownerId || 'Unassigned',
          notes: b.notes || '',
        });
      }
      events.sort((a, b) => new Date(a.at).getTime() - new Date(b.at).getTime());
      return events;
    }

    function openWorkflowModal(url, title, opts = {}) {
      const overlay = $('workflowOverlay');
      const frame = $('workflowFrame');
      const titleEl = $('workflowTitle');
      if (!overlay || !frame || !titleEl) return;
      titleEl.textContent = title || 'Workflow';
      overlay.classList.toggle('native-modal', !!opts.nativeModal);
      frame.src = url;
      overlay.classList.remove('hidden');
      overlay.setAttribute('aria-hidden', 'false');
    }

    function closeWorkflowModal() {
      const overlay = $('workflowOverlay');
      const frame = $('workflowFrame');
      if (!overlay || !frame) return;
      overlay.classList.add('hidden');
      overlay.classList.remove('native-modal');
      overlay.setAttribute('aria-hidden', 'true');
      frame.src = 'about:blank';
    }

    function onWorkflowMessage(event) {
      const data = event && event.data;
      if (!data || typeof data !== 'object') return;
      if (data.type === 'workflow-close') closeWorkflowModal();
    }

    function openEventFromCalendar(type, leadId) {
      const id = Number(leadId);
      if (!Number.isFinite(id) || id <= 0) {
        $('status').textContent = 'This calendar event is informational only.';
        return;
      }
      if (type === 'meeting') {
        openWorkflowModal(`/opportunities?lead=${encodeURIComponent(String(id))}&open=meeting&embedded=1`, 'Meeting workflow', { nativeModal: true });
        return;
      }
      if (type === 'callback') {
        openWorkflowModal(`/sales-queue?lead=${encodeURIComponent(String(id))}&open=callback&embedded=1`, 'Callback workflow', { nativeModal: true });
        return;
      }
      $('status').textContent = 'This calendar event is informational only.';
    }

    function filteredEvents(baseEvents) {
      const q = ($('search')?.value || '').trim().toLowerCase();
      return baseEvents.filter((e) => {
        if (FILTER !== 'all' && e.type !== FILTER) return false;
        if (OWNER !== 'all' && String(e.ownerId || '') !== String(OWNER)) return false;
        if (q) {
          const hay = `${e.title || ''} ${e.company || ''} ${e.owner || ''}`.toLowerCase();
          if (!hay.includes(q)) return false;
        }
        return true;
      });
    }

    function setFilter(filter) {
      FILTER = ['all', 'meeting', 'callback', 'activity'].includes(filter) ? filter : 'all';
      render();
    }

    function setOwner(ownerId) {
      OWNER = ownerId || 'all';
      render();
    }

    function setView(view) {
      VIEW = ['day', 'week', 'month'].includes(view) ? view : 'day';
      render();
    }

    async function shiftAnchor(delta) {
      if (VIEW === 'day') {
        const d = new Date(`${SELECTED_DAY}T00:00:00`);
        d.setDate(d.getDate() + delta);
        SELECTED_DAY = dayKey(d);
      } else if (VIEW === 'week') {
        const d = new Date(`${SELECTED_DAY}T00:00:00`);
        d.setDate(d.getDate() + (delta * 7));
        SELECTED_DAY = dayKey(d);
      } else {
        ANCHOR = new Date(ANCHOR.getFullYear(), ANCHOR.getMonth() + delta, 1);
        SELECTED_DAY = dayKey(ANCHOR);
      }
      await refreshBlocks();
      render();
    }

    async function jumpToday() {
      const now = new Date();
      ANCHOR = new Date(now.getFullYear(), now.getMonth(), 1);
      SELECTED_DAY = dayKey(now);
      await refreshBlocks();
      render();
    }

    function ownerOptions(events) {
      const map = new Map();
      events.forEach((e) => {
        const key = String(e.ownerId || '').trim();
        if (!key) return;
        if (!map.has(key)) map.set(key, e.owner || key);
      });
      return Array.from(map.entries()).sort((a, b) => a[1].localeCompare(b[1]));
    }

    function renderOwnerFilter(events) {
      const sel = $('ownerFilter');
      if (!sel) return;
      const opts = ['<option value="all">All reps</option>']
        .concat(ownerOptions(events).map(([id, name]) => `<option value="${esc(id)}" ${String(OWNER) === String(id) ? 'selected' : ''}>${esc(name)}</option>`));
      sel.innerHTML = opts.join('');
    }

    function renderStats(events) {
      const inRange = events.filter((e) => {
        const { start, end } = currentRange();
        const ts = new Date(e.at).getTime();
        return ts >= start.getTime() && ts <= end.getTime();
      });
      const meetings = inRange.filter((e) => e.type === 'meeting').length;
      const callbacks = inRange.filter((e) => e.type === 'callback').length;
      const activities = inRange.filter((e) => e.type === 'activity').length;
      const html = [
        { label:'Events in view', value: inRange.length },
        { label:'Meetings', value: meetings },
        { label:'Callbacks', value: callbacks },
        { label:'Activity blocks', value: activities },
      ].map((s) => `<div class="kpi"><div class="k">${esc(s.label)}</div><div class="v">${esc(s.value)}</div></div>`).join('');
      $('stats').innerHTML = html;
    }

    function fmtTime(iso) {
      const d = parseIso(iso);
      return d ? d.toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit' }) : '';
    }

    function openDay(k) {
      if (!k) return;
      SELECTED_DAY = k;
      VIEW = 'day';
      render();
    }

    function renderMonth(events) {
      const host = $('monthView');
      const monthStart = new Date(ANCHOR.getFullYear(), ANCHOR.getMonth(), 1);
      const monthEnd = new Date(ANCHOR.getFullYear(), ANCHOR.getMonth() + 1, 0);
      const offset = (monthStart.getDay() + 6) % 7;
      const gridStart = new Date(monthStart);
      gridStart.setDate(monthStart.getDate() - offset);
      $('rangeLabel').textContent = monthStart.toLocaleDateString('en-GB', { month:'long', year:'numeric' });

      const grouped = new Map();
      events.forEach((e) => {
        const k = dayKey(e.at);
        if (!k) return;
        if (!grouped.has(k)) grouped.set(k, []);
        grouped.get(k).push(e);
      });

      const labels = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].map((d) => `<div class="dow">${d}</div>`).join('');
      const today = dayKey(new Date());
      const cells = [];
      for (let i = 0; i < 42; i += 1) {
        const d = new Date(gridStart);
        d.setDate(gridStart.getDate() + i);
        const k = dayKey(d);
        const rows = (grouped.get(k) || []).slice().sort((a, b) => new Date(a.at) - new Date(b.at));
        const inMonth = d >= monthStart && d <= monthEnd;
        const items = rows.slice(0, 3).map((e) => `<span class="m-evt ${e.type}" title="${esc(`${fmtTime(e.at)} ${e.title}${e.company ? ` · ${e.company}` : ''}`)}"><i></i><b>${esc(fmtTime(e.at))}</b> ${esc(e.title)}</span>`).join('');
        const more = rows.length > 3 ? `<span class="m-more">+${rows.length - 3} more</span>` : '';
        cells.push(`<button type="button" class="day ${inMonth ? '' : 'muted'} ${k === SELECTED_DAY ? 'sel' : ''} ${k === today ? 'today' : ''}" onclick="selectDay('${k}')" ondblclick="openDay('${k}')" aria-label="${esc(dayLabel(k))}: ${rows.length} event${rows.length === 1 ? '' : 's'}"><span class="daynum">${d.getDate()}</span><span class="m-list">${items}${more}</span></button>`);
      }
      host.innerHTML = `<div class="month-grid">${labels}${cells.join('')}</div>`;
    }

    function weekStartFromSelected() {
      const base = new Date(`${SELECTED_DAY}T00:00:00`);
      const offset = (base.getDay() + 6) % 7;
      const start = new Date(base);
      start.setDate(base.getDate() - offset);
      return start;
    }

    function renderWeek(events) {
      const host = $('weekView');
      const wStart = weekStartFromSelected();
      const wEnd = new Date(wStart);
      wEnd.setDate(wStart.getDate() + 6);
      $('rangeLabel').textContent = `${wStart.toLocaleDateString('en-GB', { day:'2-digit', month:'short' })} - ${wEnd.toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric' })}`;

      const grouped = new Map();
      events.forEach((e) => {
        const k = dayKey(e.at);
        if (!k) return;
        if (!grouped.has(k)) grouped.set(k, []);
        grouped.get(k).push(e);
      });

      const cols = [];
      const today = dayKey(new Date());
      for (let i = 0; i < 7; i += 1) {
        const d = new Date(wStart);
        d.setDate(wStart.getDate() + i);
        const k = dayKey(d);
        const rows = (grouped.get(k) || []).sort((a, b) => new Date(a.at) - new Date(b.at));
        cols.push(`<div class="week-col ${k === SELECTED_DAY ? 'sel' : ''} ${k === today ? 'today' : ''}">
          <div class="week-head"><b>${d.getDate()}</b>${esc(d.toLocaleDateString('en-GB', { weekday:'short' }))}</div>
          <div class="week-items">${rows.length ? rows.map((e) => {
            const id = Number(e.leadId);
            const canOpen = Number.isFinite(id) && id > 0 && (e.type === 'meeting' || e.type === 'callback');
            const attrs = canOpen
              ? ` role="button" tabindex="0" onclick="openEventFromCalendar('${esc(e.type)}', ${id})"`
              : '';
            return `<div class="week-evt ${esc(e.type)}"${attrs}><div class="week-evt-title">${esc(e.title)}${e.company ? ` · ${esc(e.company)}` : ''}</div><div class="week-evt-meta">${esc(fmtTimeRange(e.at, e.endsAt))} · ${esc(e.owner || 'Unassigned')}</div></div>`;
          }).join('') : '<div class="muted">No events</div>'}</div>
        </div>`);
      }
      host.innerHTML = `<div class="week-grid">${cols.join('')}</div>`;
    }

    function renderDay(events) {
      const host = $('dayView');
      const rows = events
        .filter((e) => dayKey(e.at) === SELECTED_DAY)
        .sort((a, b) => new Date(a.at) - new Date(b.at));
      $('rangeLabel').textContent = dayLabel(SELECTED_DAY);
      if (!rows.length) {
        host.innerHTML = '<div class="day-empty">No events scheduled for this day.</div>';
        return;
      }
      const repColumns = calendarRepColumns();
      const firstHour = Math.min(6, ...rows.map((event) => parseIso(event.at)?.getHours()).filter((v) => Number.isFinite(v)));
      const lastHourFromEnds = rows.map((event) => parseIso(event.endsAt || addMinutes(event.at, defaultEventDurationMinutes(event.type)))?.getHours()).filter((v) => Number.isFinite(v));
      const lastHour = Math.max(22, ...lastHourFromEnds);
      const startHour = Math.max(0, firstHour);
      const endHour = Math.min(24, Math.max(startHour + 8, lastHour + 1));
      const totalMinutes = (endHour - startHour) * 60;
      const pxPerHour = 56;
      const minBlockPx = 24;
      const minBlockMinutes = Math.ceil((minBlockPx / pxPerHour) * 60);
      const gridHeight = (endHour - startHour) * pxPerHour;
      const dayDate = parseIso(`${SELECTED_DAY}T00:00:00`);
      const now = new Date();
      const isToday = dayDate && now.toDateString() === dayDate.toDateString();
      const nowMinutes = ((now.getHours() * 60) + now.getMinutes()) - (startHour * 60);
      const nowTopPct = isToday && nowMinutes >= 0 && nowMinutes <= totalMinutes
        ? (nowMinutes / totalMinutes) * 100
        : null;

      const labels = [];
      for (let hour = startHour; hour <= endHour; hour += 1) {
        const topPx = (hour - startHour) * pxPerHour;
        const label = new Date(`2026-01-01T${String(hour % 24).padStart(2, '0')}:00:00`).toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit' });
        labels.push(`<div class="day-hour-label" style="top:${topPx}px">${esc(label)}</div>`);
      }

      const head = repColumns.map((rep) => {
        const repRows = rows.filter((event) => eventMatchesRep(event, rep.id));
        const meetingCount = repRows.filter((event) => event.type === 'meeting').length;
        return `<div class="day-rep-head"><div class="day-rep-name">${esc(rep.name)}</div><div class="day-rep-meta">${repRows.length} events · ${meetingCount} meetings</div></div>`;
      }).join('');
      const body = repColumns.map((rep) => {
        const repRows = rows.filter((event) => eventMatchesRep(event, rep.id));
        const laidOut = layoutDayEvents(repRows);
        const lines = [];
        const slots = [];
        for (let hour = startHour; hour <= endHour; hour += 1) {
          const topPx = (hour - startHour) * pxPerHour;
          lines.push(`<div class="day-hour-line" style="top:${topPx}px"></div>`);
          if (hour < endHour) slots.push(`<button type="button" class="day-slot" style="top:${topPx}px;height:${pxPerHour}px" onclick="setDayFromSlot('${SELECTED_DAY}')" aria-label="Select time slot"></button>`);
        }
        const blocks = laidOut.map((event) => {
          const startDate = parseIso(event.at);
          const endDate = parseIso(event.endsAt || addMinutes(event.at, defaultEventDurationMinutes(event.type)));
          const startMinutes = ((startDate.getHours() * 60) + startDate.getMinutes()) - (startHour * 60);
          const endMinutes = ((endDate.getHours() * 60) + endDate.getMinutes()) - (startHour * 60);
          const clampedStart = Math.max(0, Math.min(totalMinutes, startMinutes));
          const clampedEnd = Math.max(clampedStart + minBlockMinutes, Math.min(totalMinutes, endMinutes));
          const blockHeightPx = ((clampedEnd - clampedStart) / 60) * pxPerHour;
          const compactClass = blockHeightPx < 42 ? ' compact' : '';
          const topPct = (clampedStart / totalMinutes) * 100;
          const heightPct = ((clampedEnd - clampedStart) / totalMinutes) * 100;
          const cols = Math.max(1, Number(event._cols || 1));
          const col = Math.max(0, Number(event._col || 0));
          const leftPct = (col / cols) * 100;
          const widthPct = (1 / cols) * 100;
          const id = Number(event.leadId);
          const canOpen = Number.isFinite(id) && id > 0 && (event.type === 'meeting' || event.type === 'callback');
          const clickAttrs = canOpen
            ? ` role="button" tabindex="0" onclick="openEventFromCalendar('${esc(event.type)}', ${id})"`
            : '';
          return `<div class="day-block ${event.type}${compactClass}${canOpen ? ' clickable' : ''}"${clickAttrs} style="top:${topPct}%;height:${heightPct}%;left:calc(${leftPct}% + 3px);width:calc(${widthPct}% - 6px)">
            <div class="day-block-title">${esc(event.title)}${event.company ? ` · ${esc(event.company)}` : ''}</div>
            <div class="day-block-meta">${esc(fmtTimeRange(event.at, event.endsAt))} · ${esc(event.owner || 'Unassigned')}</div>
          </div>`;
        }).join('');
        const nowLine = nowTopPct != null ? `<div class="day-now-line" style="top:${nowTopPct}%"></div>` : '';
        return `<div class="day-rep-col"><div class="day-rep-canvas" style="height:${gridHeight}px">${lines.join('')}${slots.join('')}${nowLine}${blocks}${repRows.length ? '' : '<div class="day-col-empty">No events</div>'}</div></div>`;
      }).join('');

      const nowRail = nowTopPct != null
        ? `<div class="day-now-rail" style="top:${nowTopPct}%"></div><div class="day-now-label" style="top:${nowTopPct}%">Now</div>`
        : '';
      host.innerHTML = `<div class="day-team-scroll"><div class="day-team-grid" style="--reps:${repColumns.length}"><div class="day-head-row"><div class="day-time-head"></div>${head}</div><div class="day-body" style="height:${gridHeight}px"><div class="day-time-rail" style="height:${gridHeight}px">${labels.join('')}${nowRail}</div>${body}</div></div></div>`;
    }

    function setDayFromSlot(dayKeyValue) {
      if (!dayKeyValue) return;
      SELECTED_DAY = dayKeyValue;
      render();
    }

    function syncViewButtons() {
      $('viewMonth')?.classList.toggle('on', VIEW === 'month');
      $('viewWeek')?.classList.toggle('on', VIEW === 'week');
      $('viewDay')?.classList.toggle('on', VIEW === 'day');
      $('fltAll')?.classList.toggle('on', FILTER === 'all');
      $('fltMeeting')?.classList.toggle('on', FILTER === 'meeting');
      $('fltCallback')?.classList.toggle('on', FILTER === 'callback');
      $('fltActivity')?.classList.toggle('on', FILTER === 'activity');

      $('monthView')?.classList.toggle('hidden', VIEW !== 'month');
      $('weekView')?.classList.toggle('hidden', VIEW !== 'week');
      $('dayView')?.classList.toggle('hidden', VIEW !== 'day');
      const hint = $('viewHint');
      if (hint) hint.textContent = VIEW === 'month' ? 'Double-click a day to open it' : VIEW === 'day' ? 'Click a meeting or callback to open it' : '';
    }

    function selectDay(k) {
      if (!k) return;
      SELECTED_DAY = k;
      render();
    }

    async function refreshLeads() {
      const res = await fetch('/api/apollo-sales-queue?source=outbound', { credentials:'same-origin' });
      if (res.status === 401) {
        location.href = '/login?next=' + encodeURIComponent(location.pathname);
        return false;
      }
      const data = await res.json().catch(() => ({ success:false }));
      if (!data.success) {
        $('status').textContent = data.error || 'Could not load lead calendar data.';
        return false;
      }
      LEADS = Array.isArray(data.contacts) ? data.contacts : [];
      return true;
    }

    async function refreshBlocks() {
      const { start, end } = expandedFetchRange();
      const data = await api({
        action: 'manual-activities-recent',
        source: 'outbound',
        rangeStart: start.toISOString(),
        rangeEnd: end.toISOString(),
        limit: 600,
      });
      if (data && data.success && Array.isArray(data.logs)) {
        BLOCKS = data.logs;
      } else {
        BLOCKS = [];
      }
    }

    function render() {
      const rawEvents = buildEvents();
      renderOwnerFilter(rawEvents);
      const events = filteredEvents(rawEvents);
      renderStats(events);
      syncViewButtons();
      if (VIEW === 'month') renderMonth(events);
      else if (VIEW === 'week') renderWeek(events);
      else renderDay(events);
      $('status').textContent = `${events.length} upcoming event${events.length === 1 ? '' : 's'} in current filters.`;
    }

    function tickNowLine() {
      if (VIEW !== 'day') return;
      if (SELECTED_DAY !== dayKey(new Date())) return;
      const events = filteredEvents(buildEvents());
      renderDay(events);
    }

    function startNowLineTicker() {
      if (nowLineTimer) clearInterval(nowLineTimer);
      nowLineTimer = setInterval(tickNowLine, 30000);
    }

    async function boot() {
      await SQ.init((caps, user) => {
        CAPS = caps;
        USER = user;
      });
      $('workflowClose')?.addEventListener('click', closeWorkflowModal);
      $('workflowOverlay')?.addEventListener('click', (event) => {
        if (event.target === event.currentTarget) closeWorkflowModal();
      });
      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape') closeWorkflowModal();
      });
      window.addEventListener('message', onWorkflowMessage);
      const ok = await refreshLeads();
      if (!ok) return;
      await refreshBlocks();
      OWNER = 'all';
      render();
      startNowLineTicker();
    }

    window.setView = setView;
    window.shiftAnchor = shiftAnchor;
    window.jumpToday = jumpToday;
    window.setFilter = setFilter;
    window.selectDay = selectDay;
    window.openDay = openDay;
    window.setOwner = setOwner;
    window.setDayFromSlot = setDayFromSlot;
    window.closeWorkflowModal = closeWorkflowModal;

    window.addEventListener('DOMContentLoaded', boot);
  </script>
</body>
</html>
