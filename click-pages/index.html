<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>i3MEDIA</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #073b35;
      color: #fff;
      font-family: "DM Sans", "Segoe UI", sans-serif;
    }
    main { text-align: center; padding: 24px; }
    .mark {
      display: inline-grid;
      place-items: center;
      width: 74px;
      height: 74px;
      margin-bottom: 22px;
      border-radius: 20px;
      background: #f47d62;
      color: #073b35;
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: -.06em;
    }
    h1 { margin: 0; font-size: clamp(2.5rem, 8vw, 5rem); letter-spacing: -.07em; }
    p { margin: 14px 0 0; color: rgba(255,255,255,.65); font-size: .95rem; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-label="i3MEDIA logo">i3</div>
    <h1>i3MEDIA</h1>
    <p>Digital growth for ambitious organisations.</p>
  </main>
</body>
</html>
