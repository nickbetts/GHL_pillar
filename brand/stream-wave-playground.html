<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Stream logo wave playground</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; display: grid; grid-template-columns: 340px 1fr; font: 13px/1.4 Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: #111827; background: #f4f5f7; }
  aside { padding: 18px 20px 28px; background: #fff; border-right: 1px solid #e5e7eb; overflow-y: auto; }
  h1 { margin: 0 0 4px; font-size: 16px; }
  h2 { margin: 22px 0 10px; padding-top: 14px; border-top: 1px solid #eef0f3; color: #6b7280; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
  .hint { margin: 0 0 12px; color: #6b7280; font-size: 12px; }
  .ctrl { margin-bottom: 14px; }
  .ctrl > label, .ctrl > .lbl { display: flex; justify-content: space-between; margin-bottom: 6px; font-weight: 600; }
  .ctrl output { color: #4463ff; font-variant-numeric: tabular-nums; font-weight: 600; }
  .ctrl small, .check + small { display: block; margin-top: 4px; color: #6b7280; font-size: 11.5px; }
  .ctrl.color { display: flex; align-items: center; justify-content: space-between; }
  .ctrl.color > label { margin: 0; }
  input[type=range] { width: 100%; accent-color: #4463ff; }
  input[type=color] { width: 44px; height: 28px; padding: 0 2px; border: 1px solid #d1d5db; border-radius: 6px; background: #fff; cursor: pointer; }
  .seg { display: inline-flex; flex-wrap: wrap; border: 1px solid #d1d5db; border-radius: 8px; overflow: hidden; }
  .seg button { border: 0; border-right: 1px solid #d1d5db; padding: 6px 10px; background: #fff; cursor: pointer; font: inherit; }
  .seg button:last-child { border-right: 0; }
  .seg button.on { background: #4463ff; color: #fff; }
  .check { display: flex; align-items: center; gap: 8px; font-weight: 600; cursor: pointer; }
  .presets { display: flex; flex-wrap: wrap; gap: 6px; }
  .presets button, .btn { height: 30px; padding: 0 10px; border: 1px solid #d1d5db; border-radius: 8px; background: #fff; font: inherit; font-weight: 600; cursor: pointer; }
  .presets button:hover, .btn:hover { border-color: #4463ff; color: #4463ff; }
  .btn.primary { border-color: #4463ff; background: #4463ff; color: #fff; }
  .btn.primary:hover { color: #fff; filter: brightness(1.05); }
  .btn.wide { width: 100%; height: 36px; margin-top: 8px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
  .warn { margin: 0 0 10px; padding: 8px 10px; border-radius: 8px; background: #fef3c7; color: #92400e; font-size: 12px; }
  .ok { margin: 0 0 10px; padding: 8px 10px; border-radius: 8px; background: #ecfdf5; color: #047857; font-size: 12px; }
  textarea { width: 100%; min-height: 150px; margin-top: 8px; padding: 10px; border: 1px solid #d1d5db; border-radius: 8px; font: 11.5px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; resize: vertical; }
  code { font-size: 11.5px; }
  main { position: relative; display: grid; place-items: center; padding: 32px; overflow: auto; transition: background .2s; }
  main.dark { background: #111827; }
  main.checker { background: repeating-conic-gradient(#e5e7eb 0 25%, #fff 0 50%) 0 0 / 20px 20px; }
  #stage svg { display: block; max-width: 100%; height: auto; }
  .meta { position: absolute; left: 16px; bottom: 12px; color: #6b7280; font-size: 12px; }
  main.dark .meta { color: #9ca3af; }
  #toast { position: fixed; bottom: 20px; right: 20px; padding: 10px 14px; border-radius: 8px; background: #111827; color: #fff; opacity: 0; transition: opacity .2s; pointer-events: none; }
  #toast.show { opacity: 1; }
</style>
</head>
<body>
<aside>
  <h1>Stream wave playground</h1>
  <p class="hint">Everything previews live and autosaves in this browser. Try a preset or <strong>Surprise me</strong>, then fine-tune.</p>

  <div class="presets" id="presets"></div>
  <button type="button" class="btn wide" id="randomize">🎲 Surprise me</button>
  <button type="button" class="btn wide" id="barberToggle" aria-pressed="false"></button>

  <div id="status" style="margin-top:14px"></div>
  <div id="controls"></div>

  <h2>Preview</h2>
  <div class="row">
    <label class="check"><input id="playing" type="checkbox" checked /> Playing</label>
    <div class="seg" id="viewMode"><button type="button" data-v="mark" class="on">Mark</button><button type="button" data-v="full">Full logo</button></div>
  </div>
  <div class="row"><div class="seg" id="bg"><button type="button" data-v="" class="on">Light</button><button type="button" data-v="dark">Dark</button><button type="button" data-v="checker">Checker</button></div></div>
  <div class="ctrl"><label for="zoom">Zoom <output id="zoomOut"></output></label><input id="zoom" type="range" min="1" max="6" step="0.25" value="3" /></div>

  <h2>Use it</h2>
  <button type="button" class="btn primary wide" id="download">Download SVG</button>
  <button type="button" class="btn wide" id="copySettings">Copy settings JSON</button>
  <p class="hint" style="margin-top:10px">To rebuild the repo logo, save the JSON as a file and run<br><code>node scripts/build-stream-wave-logo.mjs settings.json</code></p>
  <textarea id="json" spellcheck="false" aria-label="Settings JSON"></textarea>
  <div class="row" style="margin-top:8px"><button type="button" class="btn" id="applyJson">Apply JSON</button><button type="button" class="btn" id="reset">Reset to defaults</button></div>
</aside>
<main id="main"><div id="stage"></div><div class="meta" id="meta"></div></main>
<div id="toast" role="status"></div>

<script type="image/svg+xml" id="logoSource">

<script src="stream-wave.js"></script>
<script>
  const { DEFAULTS, normalize, prepare, shapeAt, shimmerStops, build } = StreamWave;
  const SOURCE = document.getElementById('logoSource').textContent.trim();
  const STORAGE_KEY = 'stream-wave-playground';
  const SVG_NS = 'http://www.w3.org/2000/svg';
  const $ = (id) => document.getElementById(id);

  const CONTROLS = [
    { section: 'Motion' },
    { key: 'amplitude', min: 0, max: 14, step: 0.25, hint: 'How far the white sways sideways.' },
    { key: 'wavelength', min: 8, max: 140, step: 1, hint: 'Distance between ripples. The middle piece is about 49 tall.' },
    { key: 'duration', label: 'Loop duration', min: 0.4, max: 8, step: 0.1, unit: 's', hint: 'Seconds per full cycle.' },
    { key: 'direction', type: 'seg', options: [['1', 'Down'], ['-1', 'Up']] },
    { key: 'speedVariation', label: 'Speed variation', min: 0, max: 0.95, step: 0.05, hint: 'Surges then eases within each loop, like a pulse.' },
    { section: 'Barber pole' },
    { key: 'barberMask', label: 'Mask', type: 'seg', options: [['zone', 'Middle band'], ['shape', 'Middle shape']], hint: 'Middle band shows the stream across the whole band between the seams. Middle shape only shows it inside the original middle piece.' },
    { key: 'barberStretch', label: 'Stretch', min: 0.25, max: 3, step: 0.05, unit: '×', hint: 'Squashes or stretches each squiggle in the column. 1 lines up exactly with the seams.' },
    { section: 'Wave shape' },
    { key: 'shape', type: 'seg', options: [['sine', 'Sine'], ['triangle', 'Triangle'], ['square', 'Square'], ['peaks', 'Peaks']] },
    { key: 'sharpness', min: 0.3, max: 6, step: 0.1, hint: 'Square: higher is flatter and blockier. Peaks: above 1 is pointier, below 1 is rounder.' },
    { section: 'Second ripple' },
    { key: 'layer2Amount', label: 'Mix', min: 0, max: 1, step: 0.05, hint: 'Blends in a second ripple for a less mechanical, more water-like flow.' },
    { key: 'layer2Scale', label: 'Size', min: 0.2, max: 3, step: 0.05, unit: '×', hint: 'Its wavelength relative to the main ripple.' },
    { key: 'layer2Speed', label: 'Speed', min: 1, max: 4, step: 1, unit: '×', hint: 'How many times faster it travels than the main ripple.' },
    { section: 'Shaping' },
    { key: 'pieces', label: 'Animate', type: 'seg', options: [['middle', 'Middle only'], ['all', 'Whole S']], hint: 'Whole S runs the wave through all three white pieces so they flow as one stream.' },
    { key: 'pinned', type: 'check', label: 'Pin the ends', hint: 'Middle only: pins the seams to the other pieces. Whole S: pins the top and bottom tips.' },
    { key: 'falloff', label: 'Pin falloff', min: 0.2, max: 4, step: 0.05, hint: 'Below 1 keeps motion close to the pinned ends; above 1 concentrates it in the centre.' },
    { key: 'taper', min: -1, max: 1, step: 0.05, hint: 'Negative gives more motion at the top, positive more at the bottom.' },
    { key: 'twist', label: 'Edge twist', min: -1, max: 1, step: 0.05, hint: 'Offsets the left edge from the right so the white breathes. 0 keeps its width constant.' },
    { section: 'Colour' },
    { key: 'segmentColor', type: 'color', label: 'White pieces' },
    { key: 'tileColor', type: 'color', label: 'Tile' },
    { key: 'shimmer', min: 0, max: 1, step: 0.05, hint: 'A tinted band flowing down through the white, like light on water.' },
    { key: 'shimmerSize', label: 'Shimmer spacing', min: 10, max: 140, step: 1 },
    { section: 'Export quality' },
    { key: 'frames', label: 'Frames', min: 8, max: 90, step: 1, hint: 'Keyframes in the exported SVG. More is smoother but a bigger file.' },
    { key: 'density', label: 'Edge detail', min: 3, max: 20, step: 1, hint: 'Points sampled per curve. Higher keeps edges smoother while waving.' },
  ];

  const PRESETS = {
    Current: {},
    Gentle: { amplitude: 2.5, wavelength: 56, duration: 3.8 },
    River: { amplitude: 4.5, wavelength: 44, duration: 3.2, layer2Amount: 0.35, layer2Scale: 0.45, layer2Speed: 2, shimmer: 0.35, shimmerSize: 48 },
    Rapids: { amplitude: 3, wavelength: 16, duration: 1.3, shape: 'peaks', sharpness: 0.6 },
    'Whole S': { pieces: 'all', amplitude: 3.5, wavelength: 44, duration: 3, falloff: 0.8 },
    Surge: { amplitude: 5, wavelength: 36, duration: 2.6, speedVariation: 0.75 },
    Ribbon: { amplitude: 6, wavelength: 80, duration: 3.4, falloff: 1.6, taper: 0.4 },
    Blocky: { shape: 'square', sharpness: 4, amplitude: 3, wavelength: 24, duration: 2 },
    'Barber pole': { barber: true, duration: 3 },
  };

  const label = (c) => c.label || c.key.replace(/^./, (ch) => ch.toUpperCase());
  const hint = (c) => (c.hint ? `<small>${c.hint}</small>` : '');

  $('controls').innerHTML = CONTROLS.map((c) => {
    if (c.section) return `<h2>${c.section}</h2>`;
    if (c.type === 'seg') return `<div class="ctrl"><div class="lbl">${label(c)}</div><div class="seg" data-key="${c.key}">${c.options.map(([v, t]) => `<button type="button" data-v="${v}">${t}</button>`).join('')}</div>${hint(c)}</div>`;
    if (c.type === 'check') return `<div class="ctrl"><label class="check"><input type="checkbox" data-key="${c.key}" /> ${label(c)}</label>${hint(c)}</div>`;
    if (c.type === 'color') return `<div class="ctrl color"><label for="c-${c.key}">${label(c)}</label><input type="color" id="c-${c.key}" data-key="${c.key}" /></div>`;
    return `<div class="ctrl"><label for="c-${c.key}">${label(c)} <output data-out="${c.key}"></output></label><input id="c-${c.key}" type="range" data-key="${c.key}" min="${c.min}" max="${c.max}" step="${c.step}" />${hint(c)}</div>`;
  }).join('');
  $('presets').innerHTML = Object.keys(PRESETS).map((name) => `<button type="button" data-preset="${name}">${name}</button>`).join('');

  function load() {
    try { return normalize(JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}')); } catch { return normalize({}); }
  }
  let settings = load();
  const view = { mode: 'mark', zoom: 3, playing: true };

  const stage = $('stage');
  stage.innerHTML = SOURCE;
  const svg = stage.querySelector('svg');
  const tile = svg.querySelector('rect');
  const whites = [...svg.querySelectorAll('path')].filter((p) => p.getAttribute('fill') === 'white');
  const originals = whites.map((p) => p.getAttribute('d'));
  const defs = svg.insertBefore(document.createElementNS(SVG_NS, 'defs'), svg.firstChild);
  const gradient = defs.appendChild(document.createElementNS(SVG_NS, 'linearGradient'));
  Object.entries({ id: 'live-shimmer', gradientUnits: 'userSpaceOnUse', x1: 0, y1: 0, x2: 0, spreadMethod: 'repeat' }).forEach(([k, v]) => gradient.setAttribute(k, v));
  const stops = [0, 0.5, 1].map((offset) => { const stop = gradient.appendChild(document.createElementNS(SVG_NS, 'stop')); stop.setAttribute('offset', offset); return stop; });
  const barberHost = document.createElementNS(SVG_NS, 'g');
  whites[0].after(barberHost);

  function renderBarber() {
    barberHost.replaceChildren();
    whites[0].style.display = settings.barber ? 'none' : '';
    if (!settings.barber) return;
    const paint = settings.shimmer > 0 ? 'url(#live-shimmer)' : settings.segmentColor;
    const doc = new DOMParser().parseFromString(`<svg xmlns="${SVG_NS}">${StreamWave.barberFragment(model, paint)}</svg>`, 'image/svg+xml');
    barberHost.append(...[...doc.documentElement.childNodes].map((node) => document.importNode(node, true)));
  }

  let model = prepare(SOURCE, settings);

  function fmt(c, value) {
    const decimals = c.step < 1 ? (String(c.step).split('.')[1] || '').length : 0;
    return `${Number(value).toFixed(decimals)}${c.unit || ''}`;
  }

  let sizeTimer = null;
  function update({ skipJson = false } = {}) {
    settings = normalize(settings);
    model = prepare(SOURCE, settings);
    whites.forEach((p, i) => p.setAttribute('d', originals[i]));
    tile.setAttribute('fill', settings.tileColor);
    const { base, tint } = shimmerStops(settings);
    [base, tint, base].forEach((color, i) => stops[i].setAttribute('stop-color', color));
    gradient.setAttribute('y2', settings.shimmerSize);
    whites.forEach((p) => p.setAttribute('fill', settings.shimmer > 0 ? 'url(#live-shimmer)' : settings.segmentColor));
    renderBarber();
    $('barberToggle').textContent = `💈 Barber pole mode: ${settings.barber ? 'On' : 'Off'}`;
    $('barberToggle').setAttribute('aria-pressed', String(settings.barber));
    $('barberToggle').classList.toggle('primary', settings.barber);

    CONTROLS.forEach((c) => {
      if (!c.key) return;
      const value = settings[c.key];
      if (c.type === 'seg') document.querySelectorAll(`.seg[data-key="${c.key}"] button`).forEach((b) => b.classList.toggle('on', b.dataset.v === String(value)));
      else if (c.type === 'check') document.querySelector(`[data-key="${c.key}"]`).checked = value;
      else {
        document.querySelector(`[data-key="${c.key}"]`).value = value;
        const out = document.querySelector(`[data-out="${c.key}"]`);
        if (out) out.textContent = fmt(c, value);
      }
    });

    const notes = [];
    if (settings.barber) notes.push('<p class="ok">Barber pole mode is on. Motion, wave shape, second ripple and shaping settings are paused; loop duration, direction, colour and shimmer still apply.</p>');
    else {
      if (settings.twist !== 0) notes.push('<p class="warn">Edge twist is on, so the white’s width changes as it moves.</p>');
      if (!settings.pinned && settings.pieces === 'middle') notes.push('<p class="warn">Unpinned with Middle only, so the middle piece will drift away from the top and bottom pieces at the seams.</p>');
    }
    if (!notes.length) notes.push('<p class="ok">Width preserved and seams aligned.</p>');
    $('status').innerHTML = notes.join('');

    if (!skipJson) $('json').value = JSON.stringify(settings, null, 2);
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(settings)); } catch { /* storage disabled */ }

    clearTimeout(sizeTimer);
    sizeTimer = setTimeout(() => {
      const kb = new Blob([build(SOURCE, settings)]).size / 1024;
      $('meta').textContent = `Export ≈ ${kb.toFixed(1)} KB · ${settings.frames} frames · ${settings.duration}s loop`;
    }, 150);
  }

  function applyView() {
    const full = view.mode === 'full';
    svg.setAttribute('viewBox', full ? '0 0 540 120' : '0 0 120 120');
    svg.setAttribute('width', (full ? 540 : 120) * view.zoom);
    svg.setAttribute('height', 120 * view.zoom);
    $('zoomOut').textContent = `${view.zoom}×`;
    document.querySelectorAll('#viewMode button').forEach((b) => b.classList.toggle('on', b.dataset.v === view.mode));
  }

  let phase = 0;
  let last = performance.now();
  function tick(now) {
    if (view.playing) phase = (phase + (now - last) / 1000 / settings.duration) % 1;
    last = now;
    if (!settings.barber) shapeAt(model, phase).forEach((d, i) => whites[i].setAttribute('d', d));
    gradient.setAttribute('gradientTransform', `translate(0 ${phase * settings.shimmerSize * settings.direction})`);
    requestAnimationFrame(tick);
  }

  const controls = $('controls');
  controls.addEventListener('input', (event) => {
    const key = event.target.dataset.key;
    if (!key || event.target.type === 'checkbox') return;
    settings[key] = event.target.type === 'range' ? Number(event.target.value) : event.target.value;
    update();
  });
  controls.addEventListener('change', (event) => {
    if (event.target.type !== 'checkbox') return;
    settings[event.target.dataset.key] = event.target.checked;
    update();
  });
  controls.addEventListener('click', (event) => {
    const button = event.target.closest('.seg button');
    if (!button) return;
    settings[button.parentElement.dataset.key] = button.dataset.v;
    update();
  });

  $('presets').addEventListener('click', (event) => {
    const name = event.target.dataset.preset;
    if (!name) return;
    const keepColors = name === 'Current' ? {} : { segmentColor: settings.segmentColor, tileColor: settings.tileColor };
    settings = normalize({ ...PRESETS[name], ...keepColors, frames: settings.frames, density: settings.density });
    update();
    toast(`${name} preset`);
  });

  const rand = (min, max, step = 0.05) => Math.round((min + Math.random() * (max - min)) / step) * step;
  const pick = (list) => list[Math.floor(Math.random() * list.length)];
  $('randomize').addEventListener('click', () => {
    settings = normalize({
      ...settings,
      amplitude: rand(1.5, 8, 0.25),
      wavelength: rand(16, 90, 1),
      duration: rand(1.2, 5, 0.1),
      direction: 1,
      speedVariation: Math.random() < 0.4 ? rand(0.2, 0.8) : 0,
      shape: pick(['sine', 'sine', 'sine', 'triangle', 'square', 'peaks']),
      sharpness: rand(0.5, 4, 0.1),
      layer2Amount: Math.random() < 0.5 ? rand(0.15, 0.6) : 0,
      layer2Scale: rand(0.3, 2),
      layer2Speed: pick([1, 1, 2, 3]),
      pinned: true,
      falloff: rand(0.5, 2.5),
      taper: Math.random() < 0.4 ? rand(-0.6, 0.6) : 0,
      twist: 0,
      pieces: pick(['middle', 'middle', 'all']),
      shimmer: Math.random() < 0.35 ? rand(0.2, 0.6) : 0,
      shimmerSize: rand(20, 90, 1),
    });
    update();
    toast('Randomised: keep going until one clicks');
  });

  $('playing').addEventListener('change', (event) => {
    view.playing = event.target.checked;
    if (view.playing) svg.unpauseAnimations(); else svg.pauseAnimations();
  });
  $('barberToggle').addEventListener('click', () => {
    settings.barber = !settings.barber;
    update();
    toast(`Barber pole mode ${settings.barber ? 'on' : 'off'}`);
  });
  $('zoom').addEventListener('input', (event) => { view.zoom = Number(event.target.value); applyView(); });
  $('viewMode').addEventListener('click', (event) => { const b = event.target.closest('button'); if (b) { view.mode = b.dataset.v; applyView(); } });
  $('bg').addEventListener('click', (event) => {
    const b = event.target.closest('button');
    if (!b) return;
    document.querySelectorAll('#bg button').forEach((x) => x.classList.toggle('on', x === b));
    $('main').className = b.dataset.v;
  });

  function toast(text) {
    const node = $('toast');
    node.textContent = text;
    node.classList.add('show');
    clearTimeout(toast.timer);
    toast.timer = setTimeout(() => node.classList.remove('show'), 1800);
  }

  $('download').addEventListener('click', () => {
    const blob = new Blob([build(SOURCE, settings)], { type: 'image/svg+xml' });
    const link = Object.assign(document.createElement('a'), { href: URL.createObjectURL(blob), download: 'stream-container-wave.svg' });
    link.click();
    setTimeout(() => URL.revokeObjectURL(link.href), 1000);
    toast('SVG downloaded');
  });
  $('copySettings').addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(JSON.stringify(settings, null, 2)); toast('Settings JSON copied'); }
    catch { $('json').select(); toast('Copy blocked, so the JSON is selected below'); }
  });
  $('applyJson').addEventListener('click', () => {
    try { settings = normalize(JSON.parse($('json').value)); update(); toast('Settings applied'); }
    catch { toast('That JSON could not be read'); }
  });
  $('reset').addEventListener('click', () => { settings = normalize({}); update(); toast('Reset to defaults'); });

  update();
  applyView();
  requestAnimationFrame(tick);
</script>
</body>
</html>
