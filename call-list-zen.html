  function renderStack() {
    const pool = currentPool();
    const pageCount = Math.max(1, Math.ceil(pool.length / QUEUE_PAGE_SIZE));
    queuePage = Math.min(queuePage, pageCount - 1);
    const start = queuePage * QUEUE_PAGE_SIZE;
    const rows = pool.slice(start, start + QUEUE_PAGE_SIZE);
    const pager = document.getElementById('queuePager');
    pager.hidden = pageCount < 2;
    if (pageCount > 1) pager.innerHTML = `<button onclick="setQueuePage(${queuePage - 1})" ${queuePage === 0 ? 'disabled' : ''}>← Previous</button><button onclick="setQueuePage(${queuePage + 1})" ${queuePage === pageCount - 1 ? 'disabled' : ''}>Next →</button>`;
    const el = document.getElementById('stack');
    if (!rows.length) {
      el.innerHTML = `<div class="stack-empty">${filter === 'all' ? 'No call-ready leads right now.' : 'No leads match this priority.'}</div>`;
    } else {
      el.innerHTML = rows.map((l, i) => {
        const badges = [];
        if (l.callbackAt) badges.push(`<span class="b cb">Callback ${fmtDate(l.callbackAt)}</span>`);
        if (l.status === 'wants_more_info') badges.push('<span class="b info">Wants info</span>');
        if ((l.disposition || '').toLowerCase().includes('send email')) badges.push('<span class="b mail">Email</span>');
        if (Number(l.noteCount || 0) > 0) badges.push(`<span class="b notes" title="${Number(l.noteCount)} note${Number(l.noteCount) === 1 ? '' : 's'}">📝 ${Number(l.noteCount)}</span>`);
        badges.push(sourceBadge(l));
        return `
          <button class="row ${l.id === contactOpenId ? 'sel' : ''}" data-id="${l.id}" style="animation-delay:${Math.min(i * 28, 300)}ms" onclick="openContact('${l.id}')">
            <div class="pri ${l.priority}"></div>
            <div>
              <div class="nm">${esc(leadName(l))}</div>
              <div class="meta">${leadMeta(l)}</div>
              <div class="badges">${badges.join('')}</div>
            </div>
          </button>
        `;
      }).join('');
    }
    renderTopKpis();
  }
  window.setQueuePage = (page) => { queuePage = Math.max(0, page); renderStack(); };

  document.querySelectorAll('.filter-chip').forEach((chip) => {
    chip.addEventListener('click', () => {
      document.querySelectorAll('.filter-chip').forEach((c) => { c.classList.remove('on'); c.setAttribute('aria-pressed', 'false'); });
      chip.classList.add('on');
      chip.setAttribute('aria-pressed', 'true');
      filter = chip.dataset.f;
      queuePage = 0;
      renderStack();
    });
  });

  // ── RIGHT COLUMN — overview ──
  function renderCallbacksHero() {
    const today = STATE.londonDay();
    const cb = callbackPool();
    const overdueN = cb.filter((lead) => STATE.londonDay(lead.callbackAt) < today).length;
    const pageCount = Math.max(1, Math.ceil(cb.length / CALLBACK_PAGE_SIZE));
    callbackPage = Math.min(callbackPage, pageCount - 1);
    const pageRows = cb.slice(callbackPage * CALLBACK_PAGE_SIZE, (callbackPage + 1) * CALLBACK_PAGE_SIZE);
    const host = document.getElementById('cbtoday');
    if (!cb.length) {
      host.innerHTML = `<div class="callback-heading"><h3>Callbacks due today</h3><span class="big">0</span></div><div class="empty-note">No callbacks due today.</div>`;
      return;
    }
    host.innerHTML = `
      <div class="callback-heading">
        <div><h3>Callbacks due today</h3><div class="sub">${overdueN ? `<b>${overdueN} overdue</b> · ` : ''}${cb.length - overdueN} still to come</div></div>
        <span class="big">${cb.length}</span>
      </div>
      <div class="list">
        ${pageRows.map((l) => {
          const isOverdue = STATE.londonDay(l.callbackAt) < today;
          return `<button class="item callback-item ${isOverdue ? 'overdue' : ''}" aria-label="Open ${esc(leadName(l))}" onclick="openContact('${l.id}', {context:'callbacks'})">
            <div class="tm">${fmtDate(l.callbackAt)}</div>
            <span class="callback-open"><span class="nm">${esc(leadName(l))}</span><span class="co">${leadMeta(l)}</span></span>
          </button>`;
        }).join('')}
      </div>
      ${pageCount > 1 ? `<div class="cb-pager">
        <button onclick="setCallbackPage(${callbackPage - 1})" ${callbackPage === 0 ? 'disabled' : ''}>← Previous</button>
        <button onclick="setCallbackPage(${callbackPage + 1})" ${callbackPage === pageCount - 1 ? 'disabled' : ''}>Next →</button>
      </div>` : ''}
    `;
  }
  window.setCallbackPage = (page) => {
    callbackPage = Math.max(0, page);
    renderCallbacksHero();
  };

  const OPPORTUNITY_VISIBLE_STAGES = new Set(['qualified','meeting_booked','meeting_attended','scoping','proposal']);
  const OPPORTUNITY_STAGE_HEAT = {
    qualified:'cold', meeting_booked:'cold', meeting_attended:'warm', scoping:'warm', proposal:'hot',
  };

  let currentOppFilter = 'all';

  window.setOppFilter = (filterVal) => {
    currentOppFilter = filterVal;
    renderOpportunities();
  };

  function renderOpportunities() {
    if (STATE.reportError) {
      document.getElementById('oppcard').innerHTML = `<div class="notes-empty" role="status">${esc(STATE.reportError)} <button class="reset-btn" onclick="refreshZen()">Retry</button></div>`;
      return;
    }
    const owned = (MOCK.opportunities || []).filter((o) => o.ownerId === MOCK.rep.id);
    const visibleAll = owned.filter((o) => OPPORTUNITY_VISIBLE_STAGES.has(o.stage));

    const visible = visibleAll.filter((o) => {
      if (currentOppFilter === 'qualified') return o.stage === 'qualified';
      if (currentOppFilter === 'meeting_booked') return o.stage === 'meeting_booked';
      if (currentOppFilter === 'meeting_attended') return o.stage === 'meeting_attended';
      if (currentOppFilter === 'proposal') return o.stage === 'proposal' || o.stage === 'scoping';
      if (currentOppFilter === 'waiting') return opportunityNextStep(o.id, o) === 'WAITING!';
      return true;
    });

    const openMrr = visibleAll.reduce((sum, o) => sum + (o.mrrValue || 0), 0);
    const openOneOff = visibleAll.reduce((sum, o) => sum + (o.oneOffValue || 0), 0);

    const money = (n) => new Intl.NumberFormat('en-GB', { style:'currency', currency:'GBP', maximumFractionDigits:0 }).format(n);

    const rows = visible
      .slice()
      .sort((a, b) => new Date(b.updatedAt) - new Date(a.updatedAt))
      .map((o) => {
        const stage = MOCK.OPPORTUNITY_STAGES[o.stage] || { label:o.stage, tone:'qualified' };
        const heat = OPPORTUNITY_STAGE_HEAT[o.stage] || 'cold';
        const nextStep = opportunityNextStep(o.id, o);
        const isWaiting = nextStep === 'WAITING!';
        return `
          <button class="opp-row" onclick="openOpportunityModal('${esc(String(o.id))}')">
            <div class="pri ${heat}"></div>
            <div>
              <div class="nm">${esc(o.contactName)}</div>
              <div class="co">${esc(o.companyName)}</div>
              ${nextStep ? `<div class="action ${isWaiting ? 'waiting' : ''}">${esc(nextStep)}</div>` : ''}
              <div class="badges">
                <span class="stage-pill ${o.stage}">${esc(stage.label)}</span>
                ${isWaiting ? '<span class="stage-pill waiting">WAITING!</span>' : ''}
              </div>
            </div>
            <div class="right">
              <div class="val">${money(o.mrrValue || 0)} MRR · ${money(o.oneOffValue || 0)} one-off</div>
              <div class="when">${fmtWhen(o.updatedAt)}</div>
            </div>
          </button>
        `;
      }).join('');

    const counts = {
      all: visibleAll.length,
      qualified: visibleAll.filter((o) => o.stage === 'qualified').length,
      meeting_booked: visibleAll.filter((o) => o.stage === 'meeting_booked').length,
      meeting_attended: visibleAll.filter((o) => o.stage === 'meeting_attended').length,
      proposal: visibleAll.filter((o) => o.stage === 'proposal' || o.stage === 'scoping').length,
      waiting: visibleAll.filter((o) => opportunityNextStep(o.id, o) === 'WAITING!').length,
    };

    const filterConfig = [
      { key: 'all', label: 'All', count: counts.all },
      { key: 'qualified', label: 'Qualified', count: counts.qualified },
      { key: 'meeting_booked', label: 'Meeting booked', count: counts.meeting_booked },
      { key: 'meeting_attended', label: 'Meeting attended', count: counts.meeting_attended },
      { key: 'proposal', label: 'Proposal sent', count: counts.proposal },
      { key: 'waiting', label: 'WAITING!', count: counts.waiting, isWaiting: true },
    ];

    const pillsHtml = filterConfig.map((item) => {
      const isActive = currentOppFilter === item.key;
      const classes = [
        'opp-pill', // class="opp-pill"
        isActive ? 'active' : '',
        item.isWaiting ? 'pill-waiting' : '',
      ].filter(Boolean).join(' ');
      return `
        <button type="button" class="${classes}" onclick="setOppFilter('${item.key}')">
          <span>${esc(item.label)}</span>
          <span class="pill-badge">${item.count}</span>
        </button>
      `;
    }).join('');

    document.getElementById('oppcard').innerHTML = `
      <div class="oppcard-head">
        <div class="oppcard-top">
          <div>
            <div class="title">Qualified opportunities</div>
            <div class="sub">${visible.length} shown of ${visibleAll.length} in play</div>
          </div>
          <div class="total">
            <div class="v">${money(openMrr)} MRR</div>
            <div class="k">${money(openOneOff)} one-off</div>
          </div>
        </div>
        <div class="opp-filter-pills" role="tablist" aria-label="Filter opportunities by stage">
          ${pillsHtml}
        </div>
      </div>
      <div class="oppcard-list">${rows || '<div class="stack-empty">No qualified opportunities in play right now.</div>'}</div>
    `;
  }

  function opportunityNextStep(id, opportunity, contact = null) {
    const scheduled = (STATE.meetingsByLead?.[String(id)] || [])
      .filter((meeting) => (meeting.status || 'scheduled') === 'scheduled')
      .sort((a, b) => new Date(a.scheduledFor || a.bookedAt || 0) - new Date(b.scheduledFor || b.bookedAt || 0))[0];
    if (scheduled) {
      const when = scheduled.scheduledFor || scheduled.bookedAt;
      return `Meeting booked${when ? ` · ${fmtDateTime(when)}` : ''}`;
    }
    const step = opportunity?.nextAction || contact?.nextStepSummary || STATE.contactsById?.[String(id)]?.nextStepSummary;
    if (step && step.trim() && step !== 'No next step recorded') {
      return step;
    }
    return 'WAITING!';
  }

  function opportunityAnswerText(lead) {
    const answers = lead?.qualifyAnswers;
    if (!answers || typeof answers !== 'object') return 'No qualification answers saved.';
    const labels = QUALIFY_QUESTIONS.flatMap((question) => {
      const value = answers[question.key];
      const values = Array.isArray(value) ? value : value ? [value] : [];
      return values.length ? [`${question.label}: ${values.join(', ')}`] : [];
    });
    return labels.length ? labels.join('\n') : 'No qualification answers saved.';
  }

  function opportunityMeetingText(id) {
    const meetings = STATE.meetingsByLead?.[String(id)] || [];
    if (!meetings.length) return 'No meetings booked yet for this opportunity.';
    return meetings.map((meeting) => {
      const when = meeting.scheduledFor || meeting.occurredAt || meeting.bookedAt;
      const status = meeting.status || 'scheduled';
      return `${status} · ${when ? fmtDateTime(when) : 'time not set'}${meeting.meetingType ? ` · ${meeting.meetingType}` : ''}`;
    }).join('\n');
  }

  function ensureOpportunityModal() {
    const existing = document.getElementById('zenOpportunityModal');
    if (existing) return existing;
    const modal = document.createElement('div');
    modal.id = 'zenOpportunityModal';
    modal.className = 'zen-modal';
    modal.hidden = true;
    modal.setAttribute('role', 'region');
    modal.setAttribute('aria-labelledby', 'zenOpportunityTitle');
    document.getElementById('contact').replaceChildren(modal);
    return modal;
  }

  window.openOpportunityModal = (id) => {
    const opportunity = (MOCK.opportunities || []).find((item) => String(item.id) === String(id));
    const lead = STATE.get(id);
    if (!opportunity && !lead) return;
    const row = opportunity || {
      id,
      contactName: lead.name || 'Opportunity',
      companyName: lead.companyName || '',
      stage: lead.opportunityStage || 'qualified',
      mrrValue: lead.mrrValue,
      oneOffValue: lead.oneOffValue,
      nextAction: lead.nextStepSummary || 'No next step recorded',
      updatedAt: lead.qualifiedAt,
    };
    const stage = MOCK.OPPORTUNITY_STAGES[row.stage]?.label || row.stage || 'Qualified';
    const contact = lead || row;
    const primaryPhone = contact.directPhone || contact.phone || '';
    const website = displayWebsite(contact);
    const contactMeta = [contact.title, contact.companyName].filter(Boolean).join(' · ') || 'Company contact';
    const modal = ensureOpportunityModal();
    opportunityOpenId = String(id);
    contactOpenId = String(id);
    document.body.classList.add('contact-open');
    document.body.classList.add('opportunity-open');
    renderStack();
    renderChecklist();
    modal.innerHTML = `<div class="zen-modal-card">
      <div class="zen-modal-head"><div class="contact-head"><div><div class="badges"><span class="badge info">Opportunity</span><span class="badge ${contact.priority || 'warm'}">${esc(stage)}</span>${contact.source ? sourceBadge(contact) : ''}</div><div class="nm" id="zenOpportunityTitle">${esc(row.contactName || contact.name || 'Opportunity')}</div><div class="role">${esc(contactMeta)}</div><div style="color:var(--mute);font-size:12px;margin-top:4px">${esc([contact.sector, contact.subSector, contact.disposition].filter(Boolean).join(' · ') || 'Qualified lead')}</div></div><div class="contact-head-actions">${lead ? `<details class="drawer-tools"><summary title="Contact actions" aria-label="Contact actions">${ICON.pencil}</summary><div class="drawer-tools-menu"><button onclick="openOpportunityContact('${esc(String(lead.id))}', 'name')">Edit name</button><button onclick="openOpportunityContact('${esc(String(lead.id))}', 'notes')">Notes timeline</button><button onclick="openOpportunityContact('${esc(String(lead.id))}')">Open contact</button></div></details>` : ''}<button class="close-x zen-modal-close" onclick="closeOpportunityModal()" title="Close opportunity" aria-label="Close opportunity details">${ICON.close}</button></div></div></div>
      <div class="dial-section-inline"><div class="dial-bar"><div class="num">${esc(normalizeZenPhone(primaryPhone) || '—')}<small>${contact.directPhone ? 'Direct dial' : 'Office line'}</small></div><button class="call-btn" onclick="callOpportunity('${esc(String(row.id))}')" ${primaryPhone ? '' : 'disabled'}>${primaryPhone ? '📞 Call now' : 'No number'}</button><button class="call-alt" onclick="copyZenPhone('${esc(normalizeZenPhone(primaryPhone))}')" ${primaryPhone ? '' : 'disabled'}>Copy</button>${contact.directPhone && contact.phone ? `<button class="call-alt" onclick="callOpportunity('${esc(String(row.id))}', 'office')">Office line</button>` : ''}</div></div>
      <section class="zen-modal-section opportunity-meetings"><div class="section-heading"><h4>Meetings</h4><button id="zenBookMeeting" onclick="openOpportunityMeetingForm('${esc(String(row.id))}')" ${opportunityMeetingOpen ? 'hidden' : ''}>${ICON.calendar} Book next meeting</button></div>${opportunityMeetingHtml(row.id)}${renderOpportunityMeetingForm(row.id)}</section>
      ${renderOpportunityControls(row)}
      <div class="zen-modal-body"><div class="contact-grid"><div class="cell"><div class="k">Email</div><div class="v">${contact.email ? `<a href="mailto:${esc(contact.email)}">${esc(contact.email)}</a>` : '<span class="missing">No email recorded</span>'}</div></div><div class="cell"><div class="k">Phone</div><div class="v">${primaryPhone ? `<a href="tel:${esc(primaryPhone)}">${esc(primaryPhone)}</a>` : '<span class="missing">No phone recorded</span>'}</div></div><div class="cell"><div class="k">Website</div><div class="v">${website ? `<a href="${esc(website)}" target="_blank" rel="noopener noreferrer">${esc(website)}</a>` : '<span class="missing">No website recorded</span>'}</div></div><div class="cell"><div class="k">Opportunity stage</div><div class="v">${esc(stage)}</div></div></div><div class="zen-modal-sections"><p class="zen-updated">Updated ${esc(fmtDate(row.updatedAt))}</p><div class="zen-modal-grid"><div class="zen-modal-field"><b>Monthly recurring revenue</b><span class="amount">${esc(fmtCurrency(row.mrrValue))}</span></div><div class="zen-modal-field"><b>One-off value</b><span class="amount">${esc(fmtCurrency(row.oneOffValue))}</span></div><div class="zen-modal-field next-step"><b>Next step</b>${esc(opportunityNextStep(row.id, row, contact))}</div></div>
        <div class="zen-modal-section"><h4>Qualification from call</h4><p>${esc(opportunityAnswerText(contact))}</p></div>
        ${contact.callNotes ? `<div class="zen-modal-section"><h4>Context notes</h4><p>${esc(contact.callNotes)}</p></div>` : ''}
      </div>
      <div class="zen-modal-foot"><span class="zen-updated">${esc(stage)}</span></div>
    </div>`;
    modal.hidden = false;
    updateOpportunityStageFields();
    modal.querySelector('.zen-modal-close')?.focus();
  };
  function opportunityMeetingHtml(id) {
    const meetings = STATE.meetingsByLead?.[String(id)] || [];
    if (!meetings.length) return '<p>No meetings booked yet for this opportunity.</p>';
    return meetings.map((meeting) => {
      const when = meeting.scheduledFor || meeting.occurredAt || meeting.bookedAt;
      const meetingId = String(meeting.id || '').replace(/^meeting-/, '');
      const canAct = meeting.status === 'scheduled' && meetingId;
      return `<div class="zen-meeting-row"><div class="meeting-detail"><b>${esc((meeting.meetingType || 'Meeting').replaceAll('_', ' '))}</b><span>${esc(when ? fmtDateTime(when) : 'Time not set')}</span></div><span class="badge">${esc((meeting.status || 'scheduled').replaceAll('_', ' '))}</span>${canAct ? `<div class="zen-meeting-actions"><button onclick="updateOpportunityMeeting('${esc(String(id))}','attended','${esc(meetingId)}')">Mark attended</button><button onclick="updateOpportunityMeeting('${esc(String(id))}','no_show','${esc(meetingId)}')">No-show</button></div>` : ''}</div>`;
    }).join('');
  }
  function renderOpportunityControls(row) {
    const currentStageIndex = OPPORTUNITY_STAGES.findIndex(([value]) => value === row.stage);
    const canMoveBackward = !!(window.SQ?.caps?.isAdmin);
    const stageButtons = OPPORTUNITY_STAGES.map(([value, label], index) => { const selected = row.stage === value; const disabled = !canMoveBackward && currentStageIndex >= 0 && index < currentStageIndex; return `<button type="button" class="opp-choice ${selected ? 'on' : ''}" data-stage="${value}" aria-pressed="${selected}" ${disabled ? 'disabled title="Only admins can move an opportunity backwards"' : ''} onclick="selectOpportunityStage('${value}')">${label}</button>`; }).join('');
    const dealButtons = ['Recurring', 'One-off', 'Hybrid'].map((value) => `<button type="button" class="opp-choice ${row.dealType === value ? 'on' : ''}" data-deal-type="${value}" aria-pressed="${row.dealType === value}" onclick="selectOpportunityDealType('${value}')">${value}</button>`).join('');
    const lossReasons = ['Budget', 'Timing', 'No authority', 'Competitor', 'Not a fit'].map((value) => `<button type="button" onclick="setOpportunityLossReason('${value}')">${value}</button>`).join('');
    return `<section class="zen-opportunity-controls" id="zenOpportunityControls" aria-label="Opportunity workflow">
      <div class="section-heading"><div><h4>Opportunity workflow</h4><p class="opp-control-hint">Pick the stage, then fill the details for this step.</p></div></div>
      <input id="zenOppStage" type="hidden" value="${esc(row.stage || 'qualified')}" />
      <input id="zenOppDealType" type="hidden" value="${esc(row.dealType || '')}" />
      <fieldset class="opp-choice-group"><legend>Where is this opportunity now?</legend><div class="opp-choice-grid">${stageButtons}</div></fieldset>
      <fieldset class="opp-choice-group" data-stages="scoping proposal won" data-preserve="#zenOppDealType"><legend>How are you charging?</legend><div class="opp-choice-grid deal-types">${dealButtons}</div></fieldset>
      <fieldset><legend>Commercials</legend><div class="control-grid"><label data-stages="scoping proposal won">Monthly recurring revenue (£)<input id="zenOppMrr" type="number" min="0" step="0.01" value="${esc(row.mrrValue ?? '')}" /></label><label data-stages="scoping proposal won">One-off value (£)<input id="zenOppOneOff" type="number" min="0" step="0.01" value="${esc(row.oneOffValue ?? '')}" /></label></div></fieldset>
      <fieldset><legend>Next action</legend><div class="control-grid"><label class="full" data-stages="qualified meeting_booked meeting_no_show meeting_attended scoping proposal">Next step<input id="zenOppNextStep" maxlength="1000" value="${esc(row.nextAction || '')}" /></label><label data-stages="qualified meeting_no_show scoping">Follow-up<input id="zenOppCallback" type="datetime-local" value="${row.callbackAt ? localDateTimeValue(new Date(row.callbackAt)) : ''}" /></label><label data-stages="scoping proposal">Decision deadline<input id="zenOppDeadline" type="datetime-local" value="${row.decisionDeadlineAt ? localDateTimeValue(new Date(row.decisionDeadlineAt)) : ''}" /></label></div></fieldset>
      <fieldset id="zenStageDetails"><legend>Stage details</legend><div class="control-grid"><label data-stages="meeting_booked">Meeting date and time<input id="zenOppMeetingScheduledAt" type="datetime-local" value="${row.meetingScheduledAt ? localDateTimeValue(new Date(row.meetingScheduledAt)) : ''}" /></label><label data-stages="proposal won">Proposal sent<input id="zenOppProposalSent" type="datetime-local" value="${row.proposalSentAt ? localDateTimeValue(new Date(row.proposalSentAt)) : ''}" /></label><div class="loss-reason-field" data-stages="lost"><label>Loss reason<input id="zenOppLossReason" maxlength="500" value="${esc(row.lossReason || '')}" /></label><div class="loss-reason-chips">${lossReasons}</div></div><label data-stages="meeting_attended">Meeting attended<input id="zenOppMeetingAt" type="datetime-local" /></label></div></fieldset>
      <div class="followup-actions"><button class="primary" onclick="saveOpportunityControls('${esc(String(row.id))}')">Save stage details</button></div></section>`;
  }
  window.selectOpportunityStage = (stage) => {
    const input = document.getElementById('zenOppStage');
    if (!input) return;
    input.value = stage;
    document.querySelectorAll('#zenOpportunityControls [data-stage]').forEach((button) => { const selected = button.dataset.stage === stage; button.classList.toggle('on', selected); button.setAttribute('aria-pressed', String(selected)); });
    updateOpportunityStageFields();
  };
  window.selectOpportunityDealType = (dealType) => {
    const input = document.getElementById('zenOppDealType');
    if (!input) return;
    input.value = dealType;
    document.querySelectorAll('#zenOpportunityControls [data-deal-type]').forEach((button) => { const selected = button.dataset.dealType === dealType; button.classList.toggle('on', selected); button.setAttribute('aria-pressed', String(selected)); });
  };
  window.setOpportunityLossReason = (reason) => {
    const input = document.getElementById('zenOppLossReason');
    if (input) input.value = reason;
  };
  window.updateOpportunityStageFields = () => {
    const stage = document.getElementById('zenOppStage').value;
    const labels = [...document.querySelectorAll('#zenOpportunityControls [data-stages]')];
    labels.forEach((label) => {
      const currentValue = label.querySelector('input')?.value || '';
      const hasMeaningfulValue = currentValue && currentValue !== '0';
      label.hidden = !label.dataset.stages.split(' ').includes(stage) && !hasMeaningfulValue;
    });
    document.querySelectorAll('#zenOpportunityControls fieldset').forEach((fieldset) => {
      if (fieldset.dataset.stages) {
        const currentValue = document.querySelector(fieldset.dataset.preserve)?.value || '';
        fieldset.hidden = !fieldset.dataset.stages.split(' ').includes(stage) && !currentValue;
        return;
      }
      const staged = [...fieldset.querySelectorAll('[data-stages]')];
      if (staged.length) fieldset.hidden = staged.every((label) => label.hidden);
    });
  };
  window.openOpportunityContact = (id, mode) => {
    closeOpportunityModal();
    openContact(id, { onReady: () => {
      if (mode === 'name') beginInlineEdit('name');
      if (mode === 'notes') document.getElementById('ctNote')?.focus();
    } });
  };
  function renderOpportunityMeetingForm(id) {
    return `<div class="zen-meeting-form" ${opportunityMeetingOpen ? '' : 'hidden'}><div class="control-grid"><label>Meeting date and time<input id="zenMeetingAt" type="datetime-local" min="${localDateTimeValue(new Date())}" /></label><label>Meeting type<select id="zenMeetingType"><option value="discovery">Discovery</option><option value="demo">Demo</option><option value="follow_up">Follow-up</option><option value="proposal_review">Proposal review</option><option value="close">Close</option><option value="other">Other</option></select></label><label class="full">Next step summary<input id="zenMeetingNextStep" maxlength="1000" placeholder="Send invite, confirm attendees..." /></label><label class="full">Meeting notes<textarea id="zenMeetingNotes" maxlength="5000" placeholder="Agenda and context..."></textarea></label></div><div class="followup-actions"><button class="cancel" onclick="closeOpportunityMeetingForm()">Cancel</button><button class="primary" onclick="saveZenOpportunityMeeting('${esc(String(id))}')">Book meeting</button></div></div>`;
  }
  window.saveOpportunityControls = async (id) => {
    const value = (selector) => document.querySelector(selector)?.value || '';
    const asIso = (selector) => { const raw = value(selector); if (!raw) return null; const date = new Date(raw); return Number.isNaN(date.getTime()) ? null : date.toISOString(); };
    const stage = value('#zenOppStage');
    const hasCommercials = Number(value('#zenOppMrr') || 0) > 0 || Number(value('#zenOppOneOff') || 0) > 0;
    if (stage === 'meeting_booked' && !value('#zenOppMeetingScheduledAt')) { STATE.toast('Add the meeting date before saving Meeting booked', 'warn'); return; }
    if (['scoping', 'proposal', 'won'].includes(stage) && !value('#zenOppDealType')) { STATE.toast('Choose a deal type before saving this stage', 'warn'); return; }
    if (['scoping', 'proposal', 'won'].includes(stage) && !hasCommercials) { STATE.toast('Add MRR or one-off value before saving this stage', 'warn'); return; }
    if (stage === 'proposal' && !value('#zenOppProposalSent')) { STATE.toast('Add the proposal sent date before saving Proposal', 'warn'); return; }
    if (stage === 'lost' && !value('#zenOppLossReason').trim()) { STATE.toast('Add a loss reason before saving Lost', 'warn'); return; }
    const fields = {
      dealType: value('#zenOppDealType') || null,
      mrrValue: value('#zenOppMrr') || null,
      oneOffValue: value('#zenOppOneOff') || null,
      nextStepSummary: value('#zenOppNextStep') || null,
      callbackAt: asIso('#zenOppCallback'),
      meetingScheduledAt: asIso('#zenOppMeetingScheduledAt'),
      proposalSentAt: asIso('#zenOppProposalSent'),
      decisionDeadlineAt: asIso('#zenOppDeadline'),
      lossReason: value('#zenOppLossReason') || null,
      meetingAt: asIso('#zenOppMeetingAt'),
    };
    if (!value('#zenOppMrr')) delete fields.mrrValue;
    if (!value('#zenOppOneOff')) delete fields.oneOffValue;
    try {
      await STATE.setOpportunityStage(id, stage, fields);
      STATE.toast('Opportunity updated');
      if (!document.getElementById('zenOpportunityModal')?.hidden) openOpportunityModal(id);
    } catch (error) { STATE.toast(error.message || 'Could not update opportunity', 'bad'); }
  };
  window.updateOpportunityMeeting = async (id, outcome, meetingId) => {
    try {
      await STATE.logMeetingOutcome(id, outcome, meetingId);
      STATE.toast(outcome === 'attended' ? 'Meeting marked attended' : 'Meeting marked no-show');
      if (!document.getElementById('zenOpportunityModal')?.hidden) openOpportunityModal(id);
    } catch (error) { STATE.toast(error.message || 'Could not update meeting', 'bad'); }
  };
  window.openOpportunityMeetingForm = () => {
    opportunityMeetingOpen = true;
    document.querySelector('.zen-meeting-form').hidden = false;
    document.getElementById('zenBookMeeting').hidden = true;
    document.getElementById('zenMeetingAt').focus();
  };
  window.closeOpportunityMeetingForm = () => {
    opportunityMeetingOpen = false;
    document.querySelector('.zen-meeting-form').hidden = true;
    document.getElementById('zenBookMeeting').hidden = false;
    document.getElementById('zenBookMeeting').focus();
  };
  window.callOpportunity = (id, type = 'primary') => {
    const lead = STATE.get(id) || (MOCK.opportunities || []).find((item) => String(item.id) === String(id));
    if (!lead) return;
    const phone = type === 'office' ? (lead.phone || lead.directPhone) : (lead.directPhone || lead.phone);
    SalesCall.dialDirect({ ...lead, phone }, phone);
  };
  window.saveZenOpportunityMeeting = async (id) => {
    const scheduledFor = document.getElementById('zenMeetingAt')?.value || '';
    if (!scheduledFor) { STATE.toast('Meeting date is required', 'warn'); return; }
    const date = new Date(scheduledFor);
    if (Number.isNaN(date.getTime())) { STATE.toast('Choose a valid meeting time', 'warn'); return; }
    try {
      const response = await STATE.bookOpportunityMeeting(id, {
        scheduledFor: date.toISOString(),
        meetingType: document.getElementById('zenMeetingType')?.value || 'discovery',
        nextStepSummary: document.getElementById('zenMeetingNextStep')?.value || '',
        notes: document.getElementById('zenMeetingNotes')?.value || '',
      });
      if (!response) return;
      closeOpportunityModal();
      STATE.toast('Meeting booked');
      await refreshZen();
    } catch (error) { STATE.toast(error.message || 'Could not book meeting', 'bad'); }
  };
  window.closeOpportunityModal = () => {
    const modal = document.getElementById('zenOpportunityModal');
    if (modal) modal.hidden = true;
    opportunityMeetingOpen = false;
    opportunityOpenId = null;
    contactOpenId = null;
    document.body.classList.remove('contact-open');
    document.body.classList.remove('opportunity-open');
    renderStack();
    renderCallbacksHero();
    renderChecklist();
  };

  function renderTopKpis() {
    if (STATE.reportError) {
      document.getElementById('topKpis').innerHTML = `<div class="top-kpi" role="status">Figures unavailable <button class="reset-btn" onclick="refreshZen()">Retry</button></div>`;
      return;
    }
    const owned = (MOCK.opportunities || []).filter((o) => o.ownerId === MOCK.rep.id);
    const openOpps = owned.filter((o) => o.stage !== 'won' && o.stage !== 'lost');
    const openMrr = openOpps.reduce((sum, o) => sum + (o.mrrValue || 0), 0);
    const openOneOff = openOpps.reduce((sum, o) => sum + (o.oneOffValue || 0), 0);
    const money = new Intl.NumberFormat('en-GB', { style:'currency', currency:'GBP', maximumFractionDigits:0 });
    const callRows = (STATE.counters.byOwner || []).map((row) => `
      <div class="rep-row"><span class="nm">${esc(row.ownerName || 'Unassigned')}</span><span class="ct">${Number(row.made || 0)}</span></div>
    `).join('') || '<div class="rep-row"><span class="nm">No calls logged yet</span><span class="ct">0</span></div>';
    document.getElementById('topKpis').innerHTML = `
      <div class="top-kpi calls has-breakdown" onmouseenter="setCallsPopover(true)" onmouseleave="setCallsPopover(false)" onfocusout="if(!this.contains(event.relatedTarget)) setCallsPopover(false, true)">
        <button class="calls-trigger" aria-expanded="false" aria-controls="callsBreakdown" onfocus="setCallsPopover(true)" onclick="setCallsPopover(this.dataset.pinned !== 'true', true)">
          <span class="n">${STATE.counters.dialed}</span><span class="k">Calls made today</span><span class="kpi-hint" aria-hidden="true">i</span>
        </button>
        <div class="kpi-breakdown" id="callsBreakdown" hidden><div class="hd">Calls by rep today</div>${callRows}</div>
      </div>
      <div class="top-kpi opps"><div class="n">${openOpps.length}</div><div class="k">Open opps</div></div>
      <div class="top-kpi mrr"><div class="n">${money.format(openMrr)}</div><div class="k">Open MRR</div></div>
      <div class="top-kpi oneoff"><div class="n">${money.format(openOneOff)}</div><div class="k">Open one-off</div></div>
    `;
  }

  window.setCallsPopover = (open, pin = false) => {
    const panel = document.getElementById('callsBreakdown');
    const trigger = document.querySelector('.calls-trigger');
    if (!panel || !trigger) return;
    if (pin) trigger.dataset.pinned = String(open);
    else if (trigger.dataset.pinned === 'true') return;
    panel.hidden = !open;
    trigger.setAttribute('aria-expanded', String(open));
  };

  // ── MIDDLE COLUMN — qualifying checklist ──
  function getChecklist(id) {
    if (!checklistState[id]) checklistState[id] = defaultChecklistState();
    return checklistState[id];
  }
  function defaultChecklistState() {
    return CHECK_ITEMS.reduce((acc, it) => { acc[it.key] = false; return acc; }, {});
  }

  function getQualificationChecklist(id) {
    const key = String(id);
    if (!qualificationState[key]) {
      const lead = STATE.get(id);
      const previous = lead?.qualifyAnswers || {};
      qualificationState[key] = {};
      QUALIFY_QUESTIONS.forEach((question) => {
        qualificationState[key][question.key] = question.type === 'multi'
          ? (Array.isArray(previous[question.key]) ? [...previous[question.key]] : [])
          : (previous[question.key] || '');
      });
    }
    return qualificationState[key];
  }

  function getQualificationStep(id) {
    const key = String(id);
    if (!Number.isInteger(qualificationStepState[key])) qualificationStepState[key] = 0;
    return Math.min(qualificationStepState[key], QUALIFY_QUESTIONS.length - 1);
  }

  function renderChecklist() {
    if (!contactOpenId) { document.getElementById('colMid').innerHTML = ''; return; }
    if (qualification && !opportunityOpenId) {
      const lead = STATE.get(contactOpenId);
      const meeting = qualificationMeetings.get(String(contactOpenId)) || {};
      document.getElementById('colMid').innerHTML = `<div class="qualification-panel qualification-sidebar qualification-handoff">
        <button class="back-link" type="button" onclick="cancelQualification()">← Back to qualification checklist</button>
        <h4>Qualify ${esc(leadShortName(lead))} → Opportunity</h4>
        <p class="sub">The checklist answers will be saved with this opportunity.</p>
        <label class="meeting-toggle"><input type="checkbox" ${meeting.booked ? 'checked' : ''} onchange="updateQualificationMeeting('${esc(String(contactOpenId))}','booked',this.checked)"> Meeting booked on this call</label>
        ${meeting.booked ? `<div class="meeting-fields"><label for="qualifyMeetingAt">Meeting date and time</label><input id="qualifyMeetingAt" type="datetime-local" value="${esc(meeting.at || '')}" min="${localDateTimeValue(new Date())}" oninput="updateQualificationMeeting('${esc(String(contactOpenId))}','at',this.value)"><label for="qualifyNextStep">Meeting next step</label><input id="qualifyNextStep" value="${esc(meeting.nextStep || '')}" placeholder="What should happen next?" oninput="updateQualificationMeeting('${esc(String(contactOpenId))}','nextStep',this.value)"></div>` : ''}
        <label class="context-label" for="qualifyNote">Opportunity context notes</label><textarea id="qualifyNote" placeholder="Context for the opportunity..." oninput="updateQualificationNote('${esc(String(contactOpenId))}', this.value)">${esc(qualificationNotes.get(String(contactOpenId)) || '')}</textarea>
        <button class="confirm" type="button" onclick="saveQualification()">Qualify and create opportunity</button>
      </div>`;
      return;
    }
    const previousChecklist = document.querySelector('.checklist');
    const checklistOpen = previousChecklist ? previousChecklist.open : !window.matchMedia('(max-width:900px)').matches;
    const l = STATE.get(contactOpenId);
    const isOpportunity = !!opportunityOpenId;
    const cl = isOpportunity ? getChecklist(contactOpenId) : getQualificationChecklist(contactOpenId);
    const qualificationStep = isOpportunity ? 0 : getQualificationStep(contactOpenId);
    const activeQuestion = isOpportunity ? null : QUALIFY_QUESTIONS[qualificationStep];
    const activeAnswered = isOpportunity || (activeQuestion.type === 'multi'
      ? (Array.isArray(cl[activeQuestion.key]) && cl[activeQuestion.key].length > 0)
      : !!cl[activeQuestion.key]);
    const qualificationDone = QUALIFY_QUESTIONS.filter((question) => Array.isArray(cl[question.key]) ? cl[question.key].length > 0 : !!cl[question.key]).length;
    const done = isOpportunity ? CHECK_ITEMS.filter((it) => cl[it.key]).length : qualificationDone;
    const total = isOpportunity ? CHECK_ITEMS.length : QUALIFY_QUESTIONS.length;
    const allDone = done === total;
    const pct = isOpportunity ? Math.round((done / total) * 100) : Math.round(((qualificationStep + 1) / total) * 100);

    // Position of the open contact within the ACTIVE pool, so the rep sees
    // "Lead 3 of 24" tracked against the filter they're using.
    const pool = navigationPool();
    const idxInPool = pool.findIndex((x) => x.id === contactOpenId);
    const prevLead = idxInPool > 0 ? pool[idxInPool - 1] : null;
    const nextLead = idxInPool >= 0 && idxInPool < pool.length - 1 ? pool[idxInPool + 1] : null;
    const posLabel = idxInPool >= 0
      ? `Lead <b>${idxInPool + 1}</b> of <b>${pool.length}</b>`
      : `<b>${pool.length}</b> leads in queue`;

    document.getElementById('colMid').innerHTML = `
      <div class="leadnav ${introAnim ? 'intro' : ''}" title="Move through today's queue without closing the drawer">
        <button class="prev" onclick="prevLeadInPool()" ${prevLead ? '' : 'disabled'}>
          <span>←</span><span>Previous</span>
        </button>
        <div class="pos">${posLabel}</div>
        <button class="next" onclick="nextLeadInPool()" ${nextLead ? '' : 'disabled'}>
          <span>Next</span><span>→</span>
        </button>
      </div>
      <details class="checklist ${isOpportunity ? '' : 'qualifying'} ${introAnim ? 'intro' : ''}" ${checklistOpen ? 'open' : ''}>
        <summary class="title">${opportunityOpenId ? 'Closing checklist' : 'Qualifying checklist'}</summary>
        <div class="progress">
          <div class="n">${isOpportunity ? `${done} / ${total}` : `Step ${qualificationStep + 1} of ${total}`}</div>
          <div class="bar"><i style="width:${pct}%"></i></div>
        </div>
        <div class="items">
          ${isOpportunity ? CHECK_ITEMS.map((it) => `
            <label class="check ${cl[it.key] ? 'on' : ''}">
              <input type="checkbox" ${cl[it.key] ? 'checked' : ''} onchange="toggleCheck('${it.key}')" />
              <div><div class="cb-lbl">${it.icon} ${esc(it.label)}</div><div class="cb-hint">${esc(it.hint)}</div></div>
            </label>
          `).join('') : [activeQuestion].map((question) => `<div class="qualify-question checklist-question"><div class="qualify-label">${esc(question.label)}</div><div class="qualify-options" role="group" aria-label="${esc(question.label)}" data-multiple="${question.type === 'multi'}">${question.options.map((option) => { const selected = question.type === 'multi' ? (cl[question.key] || []).includes(option) : cl[question.key] === option; return `<button class="${selected ? 'on' : ''}" aria-pressed="${selected}" onclick="pickChecklistQualification('${question.key}','${question.type}',${JSON.stringify(option).replace(/"/g, '&quot;')})">${esc(option)}</button>`; }).join('')}</div></div>`).join('')}
        </div>
        ${!isOpportunity ? `<div class="qualify-step-actions">
          <button type="button" class="step-back" onclick="previousQualificationStep()" ${qualificationStep === 0 ? 'disabled' : ''}>← Back</button>
          ${qualificationStep < total - 1 ? `<button type="button" class="step-next" onclick="nextQualificationStep()" ${activeAnswered ? '' : 'disabled'}>Next →</button>` : ''}
        </div>` : ''}
        <div class="close-cta ${allDone && (isOpportunity || qualificationStep === total - 1) ? 'show' : ''}">
          <div class="big">${opportunityOpenId ? 'Ready to send the contract' : 'Ready to qualify'}</div>
          <div class="sub">${opportunityOpenId ? 'Every closing check is complete for this opportunity.' : 'Qualification answers complete.'}</div>
          ${!opportunityOpenId ? '<button type="button" onclick="beginQualification()">Qualify → Opportunity</button>' : ''}
        </div>
        <button class="reset-link" onclick="resetChecklist()">Reset checklist</button>
      </details>
    `;
  }

  function switchContact(id) {
    if (!id || transitioning || id === contactOpenId) return;
    const card = document.querySelector('.contact-card');
    const checklist = document.getElementById('colMid');
    if (!card) { openContact(id); return; }
    transitioning = true;
    card.classList.add('leaving');
    checklist.classList.add('leaving');
    setTimeout(() => {
      checklist.classList.remove('leaving');
      transitioning = false;
      openContact(id);
    }, transitionDelay());
  }

  window.prevLeadInPool = () => {
    if (!contactOpenId) return;
    const pool = navigationPool();
    const i = pool.findIndex((x) => x.id === contactOpenId);
    if (i > 0) switchContact(pool[i - 1].id);
  };
  window.nextLeadInPool = () => {
    if (!contactOpenId) return;
    const pool = navigationPool();
    const i = pool.findIndex((x) => x.id === contactOpenId);
    if (i >= 0 && i < pool.length - 1) switchContact(pool[i + 1].id);
  };

  window.toggleCheck = (key) => {
    if (!contactOpenId) return;
    const cl = getChecklist(contactOpenId);
    cl[key] = !cl[key];
    const wasChecked = cl[key];
    renderChecklist();
    // Re-query after re-render, then pop the row + bump the counter.
    const idx = CHECK_ITEMS.findIndex((it) => it.key === key);
    const rowEl = document.querySelectorAll('.checklist .check')[idx];
    rowEl?.querySelector('input')?.focus({ preventScroll: true });
    if (rowEl && wasChecked) {
      rowEl.style.animation = 'none';
      rowEl.classList.add('just-checked');
    }
    const prog = document.querySelector('.checklist .progress');
    if (prog) { prog.classList.add('bump'); setTimeout(() => prog.classList.remove('bump'), 360); }
  };
  window.pickChecklistQualification = (key, type, option) => {
    if (!contactOpenId || opportunityOpenId) return;
    const state = getQualificationChecklist(contactOpenId);
    if (type === 'multi') {
      const values = state[key] || (state[key] = []);
      const index = values.indexOf(option);
      if (index >= 0) values.splice(index, 1); else values.push(option);
    } else {
      state[key] = state[key] === option ? '' : option;
    }
    renderChecklist();
    if (type === 'single' && state[key]) {
      qualificationStepState[String(contactOpenId)] = Math.min(getQualificationStep(contactOpenId) + 1, QUALIFY_QUESTIONS.length - 1);
      renderChecklist();
    }
  };
  window.nextQualificationStep = () => {
    if (!contactOpenId || opportunityOpenId) return;
    const question = QUALIFY_QUESTIONS[getQualificationStep(contactOpenId)];
    const state = getQualificationChecklist(contactOpenId);
    const answered = question.type === 'multi' ? state[question.key].length > 0 : !!state[question.key];
    if (!answered) return;
    qualificationStepState[String(contactOpenId)] = Math.min(getQualificationStep(contactOpenId) + 1, QUALIFY_QUESTIONS.length - 1);
    renderChecklist();
  };
  window.previousQualificationStep = () => {
    if (!contactOpenId || opportunityOpenId) return;
    qualificationStepState[String(contactOpenId)] = Math.max(getQualificationStep(contactOpenId) - 1, 0);
    renderChecklist();
  };
  window.resetChecklist = () => {
    if (!contactOpenId) return;
    if (opportunityOpenId) checklistState[contactOpenId] = defaultChecklistState();
    else {
      qualificationState[contactOpenId] = {};
      qualificationStepState[String(contactOpenId)] = 0;
      QUALIFY_QUESTIONS.forEach((question) => { qualificationState[contactOpenId][question.key] = question.type === 'multi' ? [] : ''; });
    }
    renderChecklist();
  };
  function completeContact(id, title, sub) {
    if (String(contactOpenId) !== String(id)) return;
    STATE.toast(`${title}. ${sub}`);
    renderOpportunities();
    const nextLead = navigationPool()[0] || null;
    if (nextLead) {
      switchContact(nextLead.id);
      return;
    }
    closeContact({ instant: true });
  }

  // ── RIGHT COLUMN — contact panel ──
  function openContact(id, opts = {}) {
    if (transitioning || !STATE.get(id)) return;
    contactContext = opts.context || (contactOpenId ? contactContext : 'queue');
    const switchingLead = contactOpenId !== id;
    contactOpenId = id;
    dialState = 'idle'; suggested = null; booking = false; followup = null; qualification = false; leadControls = false;
    introAnim = switchingLead;
    document.body.classList.add('contact-open');
    try {
      renderStack();
      renderChecklist();
      renderContact();
    } catch (error) {
      console.error('Zen contact render failed', error);
      STATE.toast(error.message || 'Could not render contact', 'bad');
    }
    introAnim = false;
    STATE.hydrateNotes(id)
      .then(() => { if (String(contactOpenId) === String(id)) renderContact(); })
      .catch((error) => STATE.toast(error.message, 'warn'))
      .finally(() => { if (String(contactOpenId) === String(id)) opts.onReady?.(); });
    if (opts.autoDial) doDial();
  }
  window.openContact = openContact;

  function finishClose(opts = {}) {
    document.body.classList.remove('overview-returning');
    void document.body.offsetWidth;
    document.body.classList.add('overview-returning');
    contactOpenId = null;
    document.body.classList.remove('contact-open');
    if (!opts.skipRender) { renderStack(); renderCallbacksHero(); }
    renderChecklist();
    document.getElementById('contact').innerHTML = '';
    setTimeout(() => document.body.classList.remove('overview-returning'), transitionDelay());
  }

  function closeContact(opts = {}) {
    if (opts.instant) { finishClose(opts); return; }
    if (!contactOpenId || transitioning) return;
    const card = document.querySelector('.contact-card');
    const checklist = document.getElementById('colMid');
    if (!card) { finishClose(opts); return; }
    transitioning = true;
    card.classList.add('leaving');
    checklist.classList.add('leaving');
    setTimeout(() => {
      checklist.classList.remove('leaving');
      transitioning = false;
      finishClose(opts);
    }, transitionDelay());
  }
  window.closeContact = closeContact;

  function renderContact() {
    if (!contactOpenId) return;
    const l = STATE.get(contactOpenId);
    if (!l) return;
    const primary = l.directPhone || l.phone;
    const notes = STATE.allNotes(l.id);
    const previousNote = document.getElementById('ctNote');
    const restoreNoteFocus = previousNote && document.activeElement === previousNote && previousNote.dataset.leadId === String(l.id);
    const selectionStart = restoreNoteFocus ? previousNote.selectionStart : 0;
    const selectionEnd = restoreNoteFocus ? previousNote.selectionEnd : 0;

    const stateBar = dialState === 'idle' ? '' :
      dialState === 'calling' ? '<div class="dial-state calling show"><span class="pulse"></span>Dialing 3CX…</div>' :
      dialState === 'connected' ? '<div class="dial-state connected show"><span class="pulse"></span>Connected — log the outcome below</div>' :
                                  '<div class="dial-state missed show"><span class="pulse"></span>No answer — log voicemail or no-answer below</div>';

    const outcomeButtons = OUTCOMES.map((o) => {
      const on = suggested === o.key ? ' on' : '';
      const handler = o.key === 'interested' ? `beginBooking()` : o.key === 'wants_info' ? `beginFollowup('wants_info')` : o.key === 'gatekeeper' ? `beginFollowup('gatekeeper')` : o.key === 'qualify' ? `beginQualification()` : `logOutcome('${o.key}')`;
      return `<button class="${o.tone}${on}" onclick="${handler}">${esc(o.label)}<small>${esc(o.hint)}</small></button>`;
    }).join('');

    const bookingPanel = booking ? renderBookingPanel(l) : '';
    const followupPanel = followup ? renderFollowupPanel(l) : '';
    const controlsPanel = leadControls ? renderLeadControls(l) : '';

    document.getElementById('contact').innerHTML = `
      <div class="contact-card ${introAnim ? 'intro' : ''}" aria-busy="${pendingContacts.has(String(l.id))}">
        <div class="contact-head">
          <div>
            <div class="badges">
              <span class="badge ${l.priority}">${l.priority.toUpperCase()}</span>
              ${l.callbackAt ? `<span class="badge cb">Callback ${fmtDate(l.callbackAt)}</span>` : ''}
              ${l.status === 'wants_more_info' ? `<span class="badge info">Wants info</span>` : ''}
              ${sourceBadge(l)}
            </div>
            <div class="nm inline-edit" data-field="name"><span>${esc(leadName(l))}</span><button class="edit" type="button" onclick="beginInlineEdit('name')" title="Edit name" aria-label="Edit name">${ICON.pencil}</button></div>
            <div class="role inline-edit" data-field="title"><span>${esc(l.title || 'Add title')}${l.companyName ? ` <span style="color:var(--mute)">· ${esc(l.companyName)}</span>` : ''}</span><button class="edit" type="button" onclick="beginInlineEdit('title')" title="Edit title" aria-label="Edit title">${ICON.pencil}</button></div>
            <div style="color:var(--mute); font-size:12px; margin-top:4px">${esc(l.subSector)} · ${esc(MOCK.STATUS_LABELS[l.status] || l.status)}${l.disposition ? ` · ${esc(l.disposition)}` : ''}</div>
          </div>

          <div class="cell"><div class="k">Website</div><div class="v">${displayWebsite(l) ? `<a href="${esc(displayWebsite(l))}" target="_blank" rel="noopener">${esc(displayWebsite(l))}</a>` : '<span class="missing">No website recorded</span>'}</div></div>

        <div class="contact-body">

          <div class="section">
            <h4>Notes &amp; timeline (${notes.length})</h4>
            <div class="notes-list">
              ${notes.length ? notes.map((n) => `
                <div class="note-item">
                  <div class="head"><div><span class="who">${esc(n.who)}</span><span class="kind ${n.kind || 'note'}">${esc(n.kind || 'note')}</span></div><div class="when">${fmtWhen(n.when)}</div></div>
                  <div>${esc(n.text)}</div>
                </div>
              `).join('') : '<div class="notes-empty">No notes on this lead yet. Add one after your call.</div>'}
            </div>
          </div>

        <div class="contact-foot">
          <button class="fbtn snooze" onclick="snoozeCurrent()">Snooze til tomorrow</button>
          <button class="fbtn void" onclick="voidCurrentContact()">Void contact</button>
          <div class="spacer"></div>
          <button class="fbtn next" onclick="saveAndNext()">Save &amp; next lead →</button>
        </div>
      </div>
    `;
    if (pendingContacts.has(String(l.id))) {
      document.querySelectorAll('#contact button').forEach((button) => { button.disabled = true; });
    }
    if (restoreNoteFocus) {
      const nextNote = document.getElementById('ctNote');
      nextNote.focus({ preventScroll: true });
      nextNote.setSelectionRange(selectionStart, selectionEnd);
    }
  }

  function renderBookingPanel(l) {
    const now = new Date();
    const tmr = new Date(now); tmr.setDate(tmr.getDate() + 1); tmr.setHours(9, 0, 0, 0);
    const in2 = new Date(now); in2.setDate(in2.getDate() + 2); in2.setHours(9, 0, 0, 0);
    const nextMon = new Date(now);
    const daysToMon = (8 - nextMon.getDay()) % 7 || 7;
    nextMon.setDate(nextMon.getDate() + daysToMon); nextMon.setHours(9, 0, 0, 0);
    const nextFri = new Date(now);
    const daysToFri = (5 - nextFri.getDay() + 7) % 7 || 7;
    nextFri.setDate(nextFri.getDate() + daysToFri); nextFri.setHours(9, 0, 0, 0);

    return `
      <div class="booking">
        <h4>Book a callback with ${esc(leadShortName(l))}</h4>
        <div class="presets">
          <button class="preset" onclick="confirmBooking('${tmr.toISOString()}')">Tomorrow</button>
          <button class="preset" onclick="confirmBooking('${in2.toISOString()}')">In 2 days</button>
          <button class="preset" onclick="confirmBooking('${nextMon.toISOString()}')">Next Mon</button>
          <button class="preset" onclick="confirmBooking('${nextFri.toISOString()}')">Next Fri</button>
        </div>
        <div class="custom">
          <label for="cbCustom">Callback date and time</label>
          <input type="datetime-local" id="cbCustom" aria-label="Callback date and time" value="${esc(callbackDrafts.get(String(l.id)) || localDateTimeValue(tmr))}" min="${localDateTimeValue(now)}" oninput="updateCallbackDraft('${esc(String(l.id))}', this.value)" />
          <button class="cancel" onclick="cancelBooking()">Cancel</button>
          <button class="confirm" onclick="confirmCustomBooking()">Book callback</button>
        </div>
      </div>
    `;
  }

  function localDateTimeValue(date) {
    const d = new Date(date);
    d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
    return d.toISOString().slice(0, 16);
  }

  function renderFollowupPanel(l) {
    const mode = followup.mode;
    const callback = followup.choice === 'callback';
    const choices = mode === 'gatekeeper'
      ? [['email', 'Send email'], ['callback', 'Book callback'], ['not_interested', 'Not interested']]
      : [['email', 'Email follow-up'], ['callback', 'Book callback']];
    return `<div class="followup-panel">
      <h4>${mode === 'gatekeeper' ? 'Gatekeeper result' : 'Wants-info follow-up'}</h4>
      <div class="followup-choices" role="group" aria-label="Follow-up action">${choices.map(([key, label]) => `<button class="${followup.choice === key ? 'on' : ''}" aria-pressed="${followup.choice === key}" onclick="chooseFollowup('${key}')">${label}</button>`).join('')}</div>
      ${callback ? `<label for="followupAt">Callback date and time</label><input id="followupAt" type="datetime-local" min="${localDateTimeValue(new Date())}" value="${esc(followup.callbackAt || '')}" oninput="updateFollowupTime(this.value)" />` : ''}
      <div class="followup-actions"><button class="cancel" onclick="cancelFollowup()">Back</button><button class="confirm" onclick="saveFollowup()" ${followup.choice && (!callback || followup.callbackAt) ? '' : 'disabled'}>Save follow-up</button></div>
    </div>`;
  }

  function renderLeadControls(l) {
    const statusOptions = STATUS_ORDER.map((status) => `<option value="${status}" ${l.status === status ? 'selected' : ''}>${esc(MOCK.STATUS_LABELS[status] || status)}</option>`).join('');
    const repOptions = REP_OPTIONS.map((rep) => `<option value="${rep.id}" ${String(l.ownerId) === rep.id ? 'selected' : ''}>${esc(rep.name)}</option>`).join('');
    const callbackValue = l.callbackAt ? localDateTimeValue(new Date(l.callbackAt)) : '';
    const sectors = STATE.taxonomy?.sectors || [];
    const sectorOptions = ['<option value="">Select sector</option>'].concat(sectors.map((sector) => `<option value="${esc(sector)}" ${l.sector === sector ? 'selected' : ''}>${esc(sector)}</option>`)).join('');
    const subSectors = STATE.taxonomy?.subSectorsBySector?.[l.sector] || [];
    const subSectorOptions = ['<option value="">Select sub-sector</option>'].concat(subSectors.map((sector) => `<option value="${esc(sector)}" ${l.subSector === sector ? 'selected' : ''}>${esc(sector)}</option>`)).join('');
    return `<div class="lead-controls" id="zenLeadControls" role="group" aria-label="Lead controls">
      <div class="lc-section">
        <div class="lc-head">${ICON.tag}<h4>Lead controls</h4></div>
        <div class="control-grid"><label>Sector<select id="editLeadSector" onchange="updateSectorOptions()">${sectorOptions}</select></label><label>Sub-sector<select id="editLeadSubSector">${subSectorOptions}</select></label><label>Status<select id="editLeadStatus">${statusOptions}</select></label><label>Reassign owner<select id="editLeadOwner">${repOptions}</select></label></div>
        <div class="lc-actions"><button class="confirm" onclick="saveLeadControls()">Save controls</button></div>
      </div>
      <div class="lc-section">
        <div class="lc-head">${ICON.calendar}<h4>Disposition &amp; callback</h4></div>
        <div class="control-grid"><label>Disposition<select id="editDisposition"><option value="">None</option>${['No answer','Left voicemail','Callback booked','Gatekeeper','Wrong number','Interested','Not interested','Covered by colleague','Already worked this company','Company target'].map((value) => `<option value="${esc(value)}" ${l.disposition === value ? 'selected' : ''}>${esc(value)}</option>`).join('')}</select></label><label>Callback date and time<input id="editCallbackAt" type="datetime-local" value="${callbackValue}" /></label></div>
        <div class="lc-actions"><button class="confirm" onclick="saveDispositionControls()">Save disposition</button></div>
      </div>
    </div>`;

  /* Play the fly-out on a stack row, then re-render the list. */
  function flyOutThenRefresh(id) {
    const row = document.querySelector(`.row[data-id="${id}"]`);
    if (!row) { renderStack(); renderCallbacksHero(); return; }
    row.classList.add('leaving');
    setTimeout(() => { renderStack(); renderCallbacksHero(); }, 340);
  }

  window.beginBooking = () => { booking = true; suggested = 'interested'; renderContact(); };
  window.cancelBooking = () => { booking = false; suggested = null; renderContact(); };
  window.confirmBooking = (iso) => runContactAction(
    (id, note) => STATE.applyOutcome(id, 'interested', { callbackAt: iso, note }),
    { clearDraft: true, onSaved: (id) => completeContact(id, 'Callback booked', `Follow up ${fmtDate(iso)}.`) },
  );
  window.confirmCustomBooking = () => {
    const el = document.getElementById('cbCustom');
    if (!el || !el.value) { STATE.toast('Pick a day first', 'warn'); return; }
    // Anchor to 09:00 on the picked day — the time is internal-only.
    const d = new Date(el.value);
    if (Number.isNaN(d.getTime())) { STATE.toast('Choose a valid callback time', 'warn'); return; }
    confirmBooking(d.toISOString());
  };

  window.beginFollowup = (mode) => { followup = { mode, choice: null, callbackAt: '' }; booking = false; qualification = false; renderContact(); };
  window.chooseFollowup = (choice) => { if (!followup) return; followup.choice = choice; renderContact(); };
  window.updateFollowupTime = (value) => {
    if (!followup) return;
    followup.callbackAt = value;
    const saveButton = document.querySelector('.followup-panel .confirm');
    if (saveButton) saveButton.disabled = !value;
  };
  window.cancelFollowup = () => { followup = null; renderContact(); };
  window.saveFollowup = () => {
    if (!followup?.choice) return;
    const selected = followup;
    if (selected.choice === 'callback' && !selected.callbackAt) { STATE.toast('Choose a callback date and time', 'warn'); return; }
    const callbackAt = selected.callbackAt ? new Date(selected.callbackAt) : null;
    if (callbackAt && Number.isNaN(callbackAt.getTime())) { STATE.toast('Choose a valid callback time', 'warn'); return; }
    runContactAction((id, note) => {
      if (selected.mode === 'gatekeeper' && selected.choice === 'not_interested') return STATE.saveFollowup(id, 'Gatekeeper', 'not_interested', 'Not interested', null, note);
      if (selected.choice === 'callback') return STATE.saveFollowup(id, selected.mode === 'gatekeeper' ? 'Gatekeeper' : 'Answered - wants info', 'to_call_back', selected.mode === 'gatekeeper' ? 'Gatekeeper' : 'Interested', callbackAt.toISOString(), note);
      return STATE.saveFollowup(id, selected.mode === 'gatekeeper' ? 'Gatekeeper' : 'Answered - wants info', 'wants_more_info', selected.mode === 'gatekeeper' ? 'Gatekeeper - send email' : 'Send email', null, note);
    }, { clearDraft: true, onSaved: (id) => completeContact(id, 'Follow-up saved', selected.choice === 'callback' ? `Callback set for ${fmtDate(callbackAt.toISOString())}.` : 'The selected follow-up was recorded.') });
  };

  window.beginInlineEdit = (field) => {
    if (!contactOpenId || !['name', 'title'].includes(field)) return;
    const lead = STATE.get(contactOpenId);
    const current = field === 'name' ? (lead.name || '') : (lead.title || '');
    const container = document.querySelector(`.inline-edit[data-field="${field}"]`);
    if (!container) return;
    container.innerHTML = `<input id="inlineEditInput" value="${esc(current)}" aria-label="Edit ${field}" placeholder="${field === 'name' ? 'Contact name' : 'Job title'}" /><button class="save" type="button" onclick="saveInlineEdit('${field}')" aria-label="Save ${field}">${ICON.check}</button><button class="cancel" type="button" onclick="renderContact()" aria-label="Cancel edit">${ICON.close}</button>`;
    const input = document.getElementById('inlineEditInput');
    input.focus();
    input.select();
    input.addEventListener('keydown', (event) => { if (event.key === 'Enter') { event.preventDefault(); saveInlineEdit(field); } if (event.key === 'Escape') { event.preventDefault(); renderContact(); } });
  };
  window.saveInlineEdit = async (field) => {
    if (!contactOpenId) return;
    const lead = STATE.get(contactOpenId);
    const value = document.getElementById('inlineEditInput')?.value.trim().replace(/\s+/g, ' ');
    if (!value) { STATE.toast(`${field === 'name' ? 'Name' : 'Title'} is required`, 'warn'); return; }
    try {
      await STATE.updateLead(contactOpenId, field === 'name' ? { name: value, title: lead.title || null } : { name: lead.name || lead.companyName, title: value });
      STATE.toast(`${field === 'name' ? 'Name' : 'Title'} updated`);
      renderContact();
    } catch (error) { STATE.toast(error.message || 'Could not update lead details', 'bad'); }
  };
  window.updateSectorOptions = () => {
    const sector = document.getElementById('editLeadSector')?.value || '';
    const select = document.getElementById('editLeadSubSector');
    if (!select) return;
    const options = ['<option value="">Select sub-sector</option>'].concat((STATE.taxonomy?.subSectorsBySector?.[sector] || []).map((value) => `<option value="${esc(value)}">${esc(value)}</option>`));
    select.innerHTML = options.join('');
  };

  window.beginQualification = () => {
    if (!contactOpenId) return;
    getQualificationChecklist(contactOpenId);
    qualificationNotes.set(String(contactOpenId), '');
    qualificationMeetings.set(String(contactOpenId), { booked: false, at: '', nextStep: '' });
    qualification = true; booking = false; followup = null; renderChecklist();
  };
  window.pickQualification = (key, type, option) => {
    if (!contactOpenId) return;
    const state = qualificationState[String(contactOpenId)] || (qualificationState[String(contactOpenId)] = {});
    if (type === 'multi') { const values = state[key] || (state[key] = []); const index = values.indexOf(option); if (index >= 0) values.splice(index, 1); else values.push(option); }
    else state[key] = state[key] === option ? '' : option;
    renderContact();
  };
  window.cancelQualification = () => { qualification = false; renderChecklist(); };
  window.saveQualification = () => {
    if (!contactOpenId) return;
    const id = String(contactOpenId);
    const answers = qualificationState[id] || {};
    const note = (qualificationNotes.get(id) || document.getElementById('qualifyNote')?.value || '').trim();
    const meeting = qualificationMeetings.get(id) || {};
    if (meeting.booked && !meeting.at) { STATE.toast('Meeting date is required when a meeting is booked', 'warn'); return; }
    const meetingAt = meeting.booked ? new Date(meeting.at) : null;
    if (meetingAt && Number.isNaN(meetingAt.getTime())) { STATE.toast('Choose a valid meeting time', 'warn'); return; }
    runContactAction((leadId) => STATE.qualify(leadId, answers, note, meetingAt?.toISOString() || null, meeting.nextStep?.trim() || null), { onSaved: (leadId) => completeContact(leadId, 'Qualified', meeting.booked ? 'Opportunity created and meeting details saved.' : 'Opportunity created in the pipeline.') });
  };
  window.toggleLeadControls = () => { leadControls = !leadControls; qualification = false; followup = null; renderContact(); };
  window.saveLeadControls = () => {
    if (!contactOpenId) return;
    const id = String(contactOpenId);
    const lead = STATE.get(id);
    const ownerId = document.getElementById('editLeadOwner')?.value || '';
    const changes = { sector: document.getElementById('editLeadSector')?.value.trim(), subSector: document.getElementById('editLeadSubSector')?.value.trim(), status: document.getElementById('editLeadStatus')?.value };
    runContactAction(async (leadId) => { await STATE.updateLead(leadId, changes); if (ownerId && ownerId !== String(lead?.ownerId || '')) await STATE.reassign(leadId, ownerId); }, { onSaved: () => { leadControls = false; renderContact(); STATE.toast('Lead details updated'); } });
  };
  window.saveDispositionControls = () => {
    if (!contactOpenId) return;
    const disposition = document.getElementById('editDisposition')?.value || '';
    const callbackValue = document.getElementById('editCallbackAt')?.value || '';
    const callbackAt = callbackValue ? new Date(callbackValue) : null;
    if (callbackAt && Number.isNaN(callbackAt.getTime())) { STATE.toast('Choose a valid callback time', 'warn'); return; }
    runContactAction((id) => STATE.updateDisposition(id, disposition, callbackAt?.toISOString() || null), { onSaved: () => { leadControls = false; renderContact(); STATE.toast('Disposition updated'); } });
  };

  window.doDial = (type = 'primary') => {
    if (!contactOpenId) return;
    const lead = STATE.get(contactOpenId);
    if (!lead) return;
    const phone = type === 'office' ? (lead.phone || lead.directPhone) : (lead.directPhone || lead.phone);
    SalesCall.dialDirect({ ...lead, phone }, phone);
  };

  function normalizeZenPhone(phone) { return String(phone || '').replace(/^\+44\s*/i, '0').replace(/[().\s-]+/g, ''); }
  window.copyZenPhone = async (phone) => {
    if (!phone) return;
    try {
      if (navigator.clipboard?.writeText) await navigator.clipboard.writeText(phone);
      else { const input = document.createElement('textarea'); input.value = phone; input.style.position = 'fixed'; input.style.opacity = '0'; document.body.appendChild(input); input.select(); document.execCommand('copy'); input.remove(); }
      STATE.toast('Phone number copied');
    } catch { STATE.toast('Could not copy phone number', 'bad'); }
  };
  window.voidCurrentContact = () => {
    if (!contactOpenId || !confirm('Void this contact? It will be removed from all active queues.')) return;
    runContactAction((id) => STATE.voidLead(id), { onSaved: (id) => completeContact(id, 'Contact voided', 'Removed from all active queues.') });
  };

  window.logOutcome = async (key) => {
    const labels = {
      wants_info: ['Outcome saved', 'Email follow-up is required.'],
      no_answer: ['No answer logged', 'This lead will resurface tomorrow.'],
      voicemail: ['Voicemail logged', 'The lead has been set aside for a retry.'],
      gatekeeper: ['Gatekeeper logged', 'Email follow-up is required.'],
      not_interested: ['Outcome saved', 'This lead is out of today’s calls.'],
      wrong_number: ['Number flagged', 'This lead is out of today’s calls.'],
      qualify: ['Qualified', 'Opportunity created in the pipeline.'],
    };
    const completion = labels[key] || ['Outcome saved', 'This lead is out of today’s calls.'];
    await runContactAction(
      (id, note) => STATE.applyOutcome(id, key, { note }),
      { clearDraft: true, onSaved: (id) => completeContact(id, completion[0], completion[1]) },
    );
  };

  window.saveNote = async () => {
    if (!(noteDrafts.get(String(contactOpenId)) || '').trim()) { STATE.toast('Type a note first', 'warn'); return; }
    await runContactAction((id, note) => STATE.addNote(id, note), {
      clearDraft: true,
      onSaved: () => STATE.toast('Note saved'),
    });
  };

  window.snoozeCurrent = () => runContactAction((id) => STATE.snooze(id), {
    onSaved: (id) => completeContact(id, 'Snoozed until tomorrow', 'This lead will return to your callbacks.'),
  });

  window.saveAndNext = async () => {
    await runContactAction((id, note) => note ? STATE.addNote(id, note) : Promise.resolve(), {
      clearDraft: true,
      onSaved: (id) => {
        const pool = navigationPool();
        const index = pool.findIndex((lead) => String(lead.id) === String(id));
        const nextLead = index >= 0 ? pool[index + 1] : null;
        if (nextLead) switchContact(nextLead.id);
        else closeContact();
      },
    });
  };

  document.addEventListener('keydown', (e) => {
    const opportunityModal = document.getElementById('zenOpportunityModal');
    if (e.key === 'Escape' && opportunityModal && !opportunityModal.hidden) {
      e.preventDefault();
      closeOpportunityModal();
      return;
    }
    if (e.key === 'Escape' && document.querySelector('.calls-trigger[aria-expanded="true"]')) {
      e.preventDefault();
      setCallsPopover(false, true);
      return;
    }
    const callOverlay = document.getElementById('scDialOverlay');
    if (callOverlay && !callOverlay.classList.contains('hidden')) return;
    if (e.target && ['TEXTAREA','INPUT'].includes(e.target.tagName)) return;
    if (e.key === 'Escape') closeContact();
    if (contactOpenId) {
      if (e.key === ']' || e.key === 'ArrowRight') { e.preventDefault(); window.nextLeadInPool(); }
      if (e.key === '[' || e.key === 'ArrowLeft')  { e.preventDefault(); window.prevLeadInPool(); }
    }
  });

  async function refreshZen() {
    try {
      await STATE.refresh();
      await initializeCallWidget();
      renderStack();
      renderCallbacksHero();
      renderOpportunities();
      renderTopKpis();
      finishLoading();
      if (opportunityOpenId && !document.getElementById('zenOpportunityModal')?.hidden) openOpportunityModal(opportunityOpenId);
    } catch (error) {
      renderZenLoadFailure(error.message || 'Could not refresh live queue');
      STATE.toast(error.message || 'Could not refresh live queue', 'bad');
    }
  }
  window.refreshZen = refreshZen;

  const TITLE_CARD_SELECTOR = '.stack-head, .callback-heading, .oppcard-head, .colRight .contact .contact-head';
  const TITLE_CARD_COLORS = [
    'rgba(14,215,157,.72)',
    'rgba(54,128,255,.68)',
    'rgba(244,56,139,.58)',
    'rgba(255,145,45,.58)',
  ];
  let titleCardObserver = null;

  function randomizeTitleCards(root = document) {
    const cards = root.matches?.(TITLE_CARD_SELECTOR)
      ? [root]
      : Array.from(root.querySelectorAll?.(TITLE_CARD_SELECTOR) || []);

    cards.forEach((card) => {
      if (card.dataset.titleBackgroundReady === 'true') return;
      const offset = Math.floor(Math.random() * TITLE_CARD_COLORS.length);
      TITLE_CARD_COLORS.forEach((_, index) => {
        card.style.setProperty(`--title-color-${String.fromCharCode(97 + index)}`, TITLE_CARD_COLORS[(index + offset) % TITLE_CARD_COLORS.length]);
      });
      card.style.setProperty('--title-start-x', `${Math.round(Math.random() * 80)}%`);
      card.style.setProperty('--title-start-y', `${Math.round(20 + Math.random() * 60)}%`);
      card.style.setProperty('--title-duration', `${(10 + Math.random() * 8).toFixed(1)}s`);
      card.style.setProperty('--title-delay', `${(-Math.random() * 14).toFixed(1)}s`);
      card.style.animationDirection = Math.random() > 0.5 ? 'alternate' : 'alternate-reverse';
      card.dataset.titleBackgroundReady = 'true';
    });
  }

  function initializeTitleCardBackgrounds() {
    randomizeTitleCards();
    if (titleCardObserver || typeof MutationObserver === 'undefined') return;
    titleCardObserver = new MutationObserver((mutations) => {
      mutations.forEach((mutation) => mutation.addedNodes.forEach((node) => {
        if (node.nodeType === 1) randomizeTitleCards(node);
      }));
    });
    titleCardObserver.observe(document.querySelector('.app-main') || document.body, { childList:true, subtree:true });
  }

  function finishLoading() {
    if (typeof document === 'undefined' || !document.body) return;
    document.body.classList.remove('is-loading');
    document.body.classList.add('is-ready');
    initializeTitleCardBackgrounds();
    const loader = document.getElementById('zenLoading');
    if (loader) loader.hidden = true;
  }

  function renderZenLoadFailure(message) {
    if (typeof document === 'undefined' || !document.getElementById) return;
    const safeMessage = String(message || '').replace(/[&<>"']/g, (character) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[character]));
    const setText = (id, text) => { const element = document.getElementById(id); if (element) element.textContent = text; };
    const setHtml = (id, html) => { const element = document.getElementById(id); if (element) element.innerHTML = html; };
    setHtml('stack', `<div class="notes-empty" role="alert">${safeMessage} <button class="reset-btn" onclick="refreshZen()">Retry</button></div>`);
    const queuePager = document.getElementById('queuePager'); if (queuePager) queuePager.hidden = true;
    setHtml('cbtoday', `<div class="notes-empty" role="status">Callbacks unavailable</div>`);
    setHtml('oppcard', `<div class="notes-empty" role="status">Opportunities unavailable</div>`);
    setHtml('topKpis', `<div class="top-kpi" role="status">Figures unavailable</div>`);
  }

  let callWidgetReady = false;
  async function initializeCallWidget() {
    if (!callWidgetReady) {
      await SalesCall.init({ isAdmin: true });
      callWidgetReady = true;
    }
    document.getElementById('zenAvatar').innerHTML = SQ.avatarInner(MOCK.rep);
    document.getElementById('zenAvatar').style.background = MOCK.rep.avatarColor;
    document.getElementById('zenRepName').textContent = MOCK.rep.name;
  }

  async function applyConfiguredWorkspaceBackground() {
    let personal = MOCK.rep.workspaceBackground || BLOBS_BACKGROUND;
    if (personal === BREAD_BACKGROUND || personal === CURTAINS_BACKGROUND) personal = BLOBS_BACKGROUND;
    let background = personal;
    if (personal === BLOBS_BACKGROUND) {
      try {
        const response = await fetch('/api/apollo-sales-queue', {
          method:'POST', headers:{ 'Content-Type':'application/json' }, credentials:'same-origin',
          body:JSON.stringify({ action:'get-config' }),
        });
        const data = await response.json().catch(() => ({}));
        if (response.ok && data.success && data.defaultZenBackground) {
          background = data.defaultZenBackground;
          if (background === BREAD_BACKGROUND || background === CURTAINS_BACKGROUND) background = BLOBS_BACKGROUND;
        }
      } catch { /* keep the stock background when config is unavailable */ }
    }
    applyWorkspaceBackground(background);
  }

  SQ.init(async (caps, user) => {
    try {
      await STATE.init(caps, user);
      await applyConfiguredWorkspaceBackground();
      await initializeCallWidget();
      renderStack();
      renderCallbacksHero();
      renderOpportunities();
      renderTopKpis();
      finishLoading();
    } catch (error) {
      try { await initializeCallWidget(); } catch {}
      renderZenLoadFailure(error.message || 'Could not load queue');
      finishLoading();
      STATE.toast(error.message || 'Could not load live call queue', 'bad');
    }
  });
</script>
</body>
</html>
