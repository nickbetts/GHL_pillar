<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Call queue | Pillar CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/sales-app.css" />
<link rel="stylesheet" href="/call-list-zen.css" />
</head>
<body class="sq is-loading">
  <div class="app">
    <aside class="sidebar" id="sqSidebar"></aside>
    <main class="app-main">
  <header class="top">
    <div class="top-brand">
      <h1>Call queue</h1>
      <span class="sub"><span id="zenRepName">Loading...</span> · <span id="zenToday"></span></span>
    </div>
    <div class="search" role="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="zenSearch" type="search" placeholder="Search leads or phone…" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="zenSearchResults" aria-autocomplete="list" aria-label="Search leads and opportunities" />
      <kbd>⌘K</kbd>
      <div class="search-results" id="zenSearchResults" role="listbox" hidden></div>
    </div>
    <div class="top-kpis" id="topKpis"></div>
    <div class="rep">
      <span class="updated" id="zenUpdated" aria-live="polite"></span>
      <button class="reset-btn" onclick="refreshZen()" title="Refresh live data"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36L21 8"/><path d="M21 3v5h-5"/></svg>Refresh</button>
      <button class="icon-btn" onclick="openShortcuts()" title="Keyboard shortcuts (?)" aria-label="Keyboard shortcuts"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"/></svg></button>
    </div>
  </header>

  <div class="wrap">
    <div class="colLeft">
      <section class="stack">
        <div class="stack-head">
          <h2 class="lbl">Up next <span class="count" id="queueCount">–</span></h2>
          <div class="stack-actions">
          <div class="filters" role="group" aria-label="Filter by priority">
            <button class="filter-chip on" data-f="all" aria-pressed="true">All</button>
            <button class="filter-chip" data-f="hot" aria-pressed="false">Hot</button>
            <button class="filter-chip" data-f="warm" aria-pressed="false">Warm</button>
            <button class="filter-chip" data-f="cold" aria-pressed="false">Cold</button>
          </div>
          <button class="btn primary" id="startCalling" onclick="startCalling()" aria-keyshortcuts="C" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2Z"/></svg>Start calling</button>
          </div>
        </div>
        <div id="stack"><div class="zen-skeleton-stack" aria-hidden="true"><div class="zen-skeleton-row"><span class="zen-skeleton av"></span><div><div class="zen-skeleton bar"></div><div class="zen-skeleton bar short"></div></div><span class="zen-skeleton pill"></span></div><div class="zen-skeleton-row"><span class="zen-skeleton av"></span><div><div class="zen-skeleton bar"></div><div class="zen-skeleton bar short"></div></div><span class="zen-skeleton pill"></span></div><div class="zen-skeleton-row"><span class="zen-skeleton av"></span><div><div class="zen-skeleton bar"></div><div class="zen-skeleton bar short"></div></div><span class="zen-skeleton pill"></span></div><div class="zen-skeleton-row"><span class="zen-skeleton av"></span><div><div class="zen-skeleton bar"></div><div class="zen-skeleton bar short"></div></div><span class="zen-skeleton pill"></span></div><div class="zen-skeleton-row"><span class="zen-skeleton av"></span><div><div class="zen-skeleton bar"></div><div class="zen-skeleton bar short"></div></div><span class="zen-skeleton pill"></span></div></div></div>
        <div class="cb-pager queue-pager" id="queuePager" hidden></div>
      </section>
    </div>

    <aside class="colMid" id="colMid"></aside>

    <aside class="colRight" id="colRight">
      <div class="overview">
        <section class="cbtoday" id="cbtoday"><div class="zen-skeleton-panel" aria-hidden="true"><div class="zen-skeleton bar"></div><div class="zen-skeleton line"></div><div class="zen-skeleton line short"></div><div class="zen-skeleton line"></div></div></section>
        <section class="cbtoday todaycard" id="todayCard"><div class="zen-skeleton-panel" aria-hidden="true"><div class="zen-skeleton bar"></div><div class="zen-skeleton line"></div><div class="zen-skeleton line short"></div></div></section>
      </div>
      <div class="contact" id="contact"><div class="zen-modal" id="zenOpportunityModal" hidden role="region" aria-labelledby="zenOpportunityTitle"></div></div>
    </aside>
    <section class="oppcard" id="oppcard"><div class="zen-skeleton-panel" aria-hidden="true"><div class="zen-skeleton bar"></div><div class="zen-skeleton line"></div><div class="zen-skeleton line short"></div><div class="zen-skeleton line"></div></div></section>
  </div>

  <div class="zen-loading" id="zenLoading" role="status" aria-live="polite"><div class="zen-loading-bar"></div><span class="sr-only">Loading call queue…</span></div>

  <dialog class="shortcuts" id="zenShortcuts" aria-labelledby="zenShortcutsTitle">
    <form method="dialog">
      <div class="shortcuts-head"><h2 id="zenShortcutsTitle">Keyboard shortcuts</h2><button class="icon-btn" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
      <dl>
        <div><dt>Start calling / call this lead</dt><dd><kbd>C</kbd></dd></div>
        <div><dt>Log outcome</dt><dd><kbd>1</kbd>–<kbd>8</kbd></dd></div>
        <div><dt>Write a note</dt><dd><kbd>N</kbd></dd></div>
        <div><dt>Previous / next lead</dt><dd><kbd>←</kbd><kbd>→</kbd> or <kbd>[</kbd><kbd>]</kbd></dd></div>
        <div><dt>Close contact</dt><dd><kbd>Esc</kbd></dd></div>
        <div><dt>Search</dt><dd><kbd>⌘K</kbd> or <kbd>/</kbd></dd></div>
        <div><dt>Show shortcuts</dt><dd><kbd>?</kbd></dd></div>
      </dl>
    </form>
  </dialog>

    </main>
  </div>

<script src="/sales-app.js"></script>
<script src="/sales-call.js"></script>
<script src="/call-list-zen-live.js"></script>
<script>
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const ICON = {
    pencil: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg>',
    cog: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1A2 2 0 1 1 4 16.9l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 4.5 9a1.7 1.7 0 0 0-.3-1.9l-.1-.1A2 2 0 1 1 7 4.1l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1A2 2 0 1 1 19.9 7l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>',
    close: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>',
    check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="4 12 10 18 20 6"/></svg>',
    tag: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12 12 4H4v8l8 8Z"/><circle cx="7.5" cy="7.5" r="1.2"/></svg>',
    calendar: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>',
    phone: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2Z"/></svg>',
    copy: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>',
    note: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6M16 13H8M16 17H8"/></svg>',
    chevronLeft: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>',
    chevronRight: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg>',
    alert: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>',
    clock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  };
  const AVATAR_TONES = [['#eef2ff','#4338ca'],['#ecfdf5','#047857'],['#fff7ed','#c2410c'],['#fdf2f8','#be185d'],['#f0f9ff','#0369a1'],['#f5f3ff','#6d28d9'],['#f1f5f9','#334155']];
  function avatarHtml(name, size = '') {
    const text = String(name || '').trim();
    const parts = text.split(/\s+/).filter(Boolean);
    const letters = ((parts[0]?.[0] || '') + (parts.length > 1 ? parts[parts.length - 1][0] : '')).toUpperCase() || '?';
    let hash = 0;
    for (const ch of text) hash = (hash * 31 + ch.charCodeAt(0)) >>> 0;
    const [bg, fg] = AVATAR_TONES[hash % AVATAR_TONES.length];
    return `<span class="avatar ${size}" style="--av-bg:${bg};--av-fg:${fg}" aria-hidden="true">${esc(letters)}</span>`;
  }
  const todayLabel = document.getElementById('zenToday');
  if (todayLabel) todayLabel.textContent = new Date().toLocaleDateString('en-GB', { weekday:'short', day:'numeric', month:'short' });
  // Times are intentionally hidden across the mockup — reps put specific times
  // in notes if it matters. Everything shows only a day / relative day label.
  const fmtDate = (iso) => {
    const d = new Date(iso), n = new Date();
    const same = (a, b) => a.toDateString() === b.toDateString();
    const tmr = new Date(n); tmr.setDate(tmr.getDate() + 1);
    if (same(d, n))   return 'Today';
    if (same(d, tmr)) return 'Tomorrow';
    const sameYear = d.getFullYear() === n.getFullYear();
    return d.toLocaleDateString([], sameYear
      ? { weekday:'short', month:'short', day:'numeric' }
      : { month:'short', day:'numeric', year:'numeric' });
  };
  const fmtWhen = (iso) => {
    const d = new Date(iso), now = new Date();
    if (Number.isNaN(d.getTime())) return 'Earlier';
    if (d.toDateString() === now.toDateString()) return 'today';
    const dayDiff = Math.floor((new Date(now.toDateString()) - new Date(d.toDateString())) / 86400000);
    if (dayDiff === 1)  return 'yesterday';
    if (dayDiff < 7)    return `${dayDiff} days ago`;
    return d.toLocaleDateString([], { month:'short', day:'numeric' });
  };
  const fmtDateTime = (iso) => {
    const d = new Date(iso);
    return Number.isNaN(d.getTime()) ? 'Unknown time' : d.toLocaleString('en-GB', { day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' });
  };
  const dateValue = (iso) => {
    const d = new Date(iso); d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
    return d.toISOString().slice(0, 10);
  };
  const fmtCurrency = (value) => new Intl.NumberFormat('en-GB', { style:'currency', currency:'GBP', maximumFractionDigits:0 }).format(Number(value || 0));

  let queuePage = 0;
  const QUEUE_PAGE_SIZE = 5;
  let filter = 'all';
  let callbackPage = 0;
  const CALLBACK_PAGE_SIZE = 5;
  let contactOpenId = null;
  let contactContext = 'queue';
  let dialState = 'idle';
  let suggested = null;
  let booking = false;
  let followup = null;
  let qualification = false;
  let leadControls = false;
  let introAnim = false;   // true only on the render right after opening a contact
  let transitioning = false;
  const checklistState = {};
  const noteDrafts = new Map();
  const callbackDrafts = new Map();
  window.updateCallbackDraft = (id, value) => callbackDrafts.set(String(id), value);
  const leadEditState = {};
  const qualificationState = {};
  const qualificationStepState = {};
  const qualificationNotes = new Map();
  const qualificationMeetings = new Map();
  let opportunityMeetingOpen = false;
  let opportunityOpenId = null;
  window.updateQualificationNote = (id, value) => qualificationNotes.set(String(id), value);
  window.updateQualificationMeeting = (id, key, value) => {
    const meeting = qualificationMeetings.get(String(id)) || {};
    meeting[key] = value;
    qualificationMeetings.set(String(id), meeting);
    if (key === 'booked') renderChecklist();
  };
  const QUALIFY_QUESTIONS = [
    { key:'services', label:'Services they’re interested in', type:'multi', options:['Web Design','SEO','Paid Ads','AIO / Search Innovation'] },
    { key:'budget', label:'Monthly paid media budget', type:'single', options:['Under £1k','£1k – £2.5k','£2.5k – £5k','£5k+'] },
    { key:'decisionMaker', label:'Decision-maker status', type:'single', options:['Sole decision maker (can sign off on call)','Needs partner / board sign-off','Gathering info / influencer only'] },
    { key:'agencyExperience', label:'Agency experience & sentiment', type:'single', options:['First time hiring an agency','Worked with agencies before (positive experience)','Burned by previous agency (high-trust required)'] },
    { key:'painPoint', label:'Main growth challenge / pain point', type:'single', options:['Lead quality','Lead volume','Conversion rate / landing page issues','High CAC / scaling limits'] },
    { key:'timeline', label:'Timeline to start', type:'single', options:['Immediate (within 14 days)','1–3 months','3+ months / fact-finding'] },
  ];
  const STATUS_ORDER = ['to_contact','to_call_back','wants_more_info','no_answer','qualified','not_interested'];
  const REP_OPTIONS = [
    { id:'6FX5X4kH2JFJc6u9zhSC', name:'Brendon Mwatsenekenyi' },
    { id:'XbyxbOK1Q1raRCjjGx4O', name:'Zain Safir-Sheikh' },
  ];
  const OPPORTUNITY_STAGES = [
    ['qualified', 'Qualified'], ['meeting_booked', 'Meeting booked'], ['meeting_no_show', 'Meeting no-show'],
    ['meeting_attended', 'Meeting attended'], ['scoping', 'Scoping'], ['proposal', 'Proposal sent'], ['won', 'Closed won'], ['lost', 'Closed lost'],
  ];
  const pendingContacts = new Set();

  window.updateNoteDraft = (id, value) => {
    if (value) noteDrafts.set(String(id), value);
    else noteDrafts.delete(String(id));
  };

  async function runContactAction(operation, { clearDraft = false, onSaved } = {}) {
    const id = contactOpenId;
    if (!id || pendingContacts.has(String(id))) return;
    const draft = noteDrafts.get(String(id)) || '';
    pendingContacts.add(String(id));
    renderContact();
    try {
      await operation(id, draft.trim());
      if (clearDraft && noteDrafts.get(String(id)) === draft) noteDrafts.delete(String(id));
      if (String(contactOpenId) === String(id) && onSaved) onSaved(id);
    } catch (error) {
      STATE.toast(error.message || 'Could not save changes', 'bad');
    } finally {
      pendingContacts.delete(String(id));
      if (String(contactOpenId) === String(id) && !transitioning) renderContact();
    }
  }

  window.addEventListener('beforeunload', (event) => {
    if (!noteDrafts.size && !pendingContacts.size) return;
    event.preventDefault();
    event.returnValue = '';
  });

  const CHECK_ITEMS = [
    { key:'decisionMakerAlignment', label:'Decision-maker alignment',    hint:'All key decision-makers are on the call or have granted full buying authority.' },
    { key:'scopeAgreed',            label:'Scope & deliverables agreed', hint:'Client confirmed the strategy, channels and deliverables directly match their goals.' },
    { key:'commercialsApproved',    label:'Commercials & budget approved', hint:'Client agreed to both the retainer fee and monthly ad spend with no unresolved objections.' },
    { key:'objectionsResolved',     label:'Objections surfaced & resolved', hint:'All concerns on ROI, timing, onboarding commitment and contract terms are addressed.' },
    { key:'launchDateSet',          label:'Clear onboarding & launch date', hint:'Client agreed on an exact kick-off date and is ready to sign the agreement today.' },
  ];

  function sourceBadge(lead) {
    const source = String(lead.source || 'outbound').toLowerCase();
    if (source === 'google_maps') return '<span class="b src maps">Google Maps</span>';
    if (source === 'hs_pd' || source === 'hubspot_pipedrive') return '<span class="b src hspd">HubSpot / Pipedrive</span>';
    if (source === 'apollo') return '<span class="b src apollo">Apollo</span>';
    return '<span class="b src outbound">Outbound</span>';
  }
  function leadName(lead) {
    const name = String(lead.name || '').trim();
    const placeholder = /^(unknown|unnamed|n\/?a|null|none|-)$/i.test(name);
    return (!name || placeholder) ? String(lead.companyName || 'Unnamed company').trim() : name;
  }
  function leadMeta(lead) {
    const parts = [];
    const rawName = String(lead.name || '').trim();
    const hasPersonName = !!rawName && !/^(unknown|unnamed|n\/?a|null|none|-)$/i.test(rawName);
    if (lead.title) parts.push(`<b>${esc(lead.title)}</b>`);
    if (hasPersonName && lead.companyName) parts.push(esc(lead.companyName));
    const website = displayWebsite(lead);
    if (!parts.length && website) parts.push(esc(website.replace(/^https?:\/\//, '')));
    return parts.join(' · ') || 'Company contact';
  }
  function leadShortName(lead) {
    return leadName(lead).split(/\s+/)[0] || 'lead';
  }
  const PERSONAL_EMAIL_DOMAINS = new Set([
    'gmail.com','googlemail.com','yahoo.com','yahoo.co.uk','ymail.com','rocketmail.com',
    'hotmail.com','hotmail.co.uk','outlook.com','live.com','live.co.uk','msn.com',
    'aol.com','aol.co.uk','icloud.com','me.com','mac.com','btinternet.com','btconnect.com',
    'btopenworld.com','sky.com','virginmedia.com','virgin.net','talktalk.net','tiscali.co.uk',
    'ntlworld.com','blueyonder.co.uk','o2.co.uk','protonmail.com','proton.me','tutamail.com',
    'tutanota.com','fastmail.com','gmx.com','gmx.co.uk','gmx.de','mail.com','email.com',
    'inbox.com','nhs.net','nhs.uk',
  ]);
  function displayWebsite(lead) {
    const stored = String(lead.companyWebsite || '').trim();
    const email = String(lead.email || '').trim().toLowerCase();
    const domain = email.includes('@') ? email.slice(email.lastIndexOf('@') + 1) : '';
    const candidate = stored || (domain && domain.includes('.') && !PERSONAL_EMAIL_DOMAINS.has(domain) ? `https://${domain}` : '');
    if (!candidate) return '';
    try {
      const url = new URL(/^[a-z][a-z\d+.-]*:/i.test(candidate) ? candidate : `https://${candidate}`);
      return ['http:', 'https:'].includes(url.protocol) && !url.username && !url.password ? url.href : '';
    } catch { return ''; }
  }
  function leadEmails(lead) {
    return Array.from(new Set(
      [lead.email, ...(Array.isArray(lead.emails) ? lead.emails : [])]
        .map((value) => String(value || '').trim().toLowerCase())
        .filter(Boolean)
    ));
  }

  // ── LEFT COLUMN ──
  function currentPool() {
    let p = STATE.activeLeads();
    if (filter !== 'all') p = p.filter((l) => l.priority === filter);
    return p;
  }

  function callbackPool() {
    const today = STATE.londonDay();
    return STATE.dueCallbacks().sort((first, second) => {
      const firstToday = STATE.londonDay(first.callbackAt) === today;
      const secondToday = STATE.londonDay(second.callbackAt) === today;
      if (firstToday !== secondToday) return firstToday ? -1 : 1;
      return firstToday ? new Date(first.callbackAt) - new Date(second.callbackAt) : new Date(second.callbackAt) - new Date(first.callbackAt);
    });
  }

  function navigationPool() {
    return contactContext === 'callbacks' ? callbackPool() : currentPool();
  }

  function transitionDelay() {
    return window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 180;
  }

  function renderStack() {
    const pool = currentPool();
    const pageCount = Math.max(1, Math.ceil(pool.length / QUEUE_PAGE_SIZE));
    queuePage = Math.min(queuePage, pageCount - 1);
    const start = queuePage * QUEUE_PAGE_SIZE;
    const rows = pool.slice(start, start + QUEUE_PAGE_SIZE);
    const pager = document.getElementById('queuePager');
    pager.hidden = pageCount < 2;
    if (pageCount > 1) pager.innerHTML = `<span class="pager-pos">${start + 1}–${Math.min(start + QUEUE_PAGE_SIZE, pool.length)} of ${pool.length}</span><div class="pager-btns"><button onclick="setQueuePage(${queuePage - 1})" ${queuePage === 0 ? 'disabled' : ''}>${ICON.chevronLeft}Previous</button><button onclick="setQueuePage(${queuePage + 1})" ${queuePage === pageCount - 1 ? 'disabled' : ''}>Next${ICON.chevronRight}</button></div>`;
    const count = document.getElementById('queueCount');
    if (count) count.textContent = pool.length;
    const startBtn = document.getElementById('startCalling');
    if (startBtn) startBtn.disabled = !pool.length;
    const el = document.getElementById('stack');
    if (!rows.length) {
      el.innerHTML = `<div class="stack-empty">${filter === 'all' ? 'You’re all caught up — no call-ready leads right now.' : 'No leads match this priority.'}${filter === 'all' ? '' : ' <button class="reset-btn" onclick="setPriorityFilter(\'all\')">Show all</button>'}</div>`;
    } else {
      el.innerHTML = rows.map((l) => {
        const id = esc(String(l.id));
        const badges = [];
        if (l.callbackAt) badges.push(`<span class="b cb">Callback ${fmtDate(l.callbackAt)}</span>`);
        if (l.status === 'wants_more_info') badges.push('<span class="b info">Wants info</span>');
        if ((l.disposition || '').toLowerCase().includes('send email')) badges.push('<span class="b mail">Email</span>');
        if (Number(l.noteCount || 0) > 0) badges.push(`<span class="b notes" title="${Number(l.noteCount)} note${Number(l.noteCount) === 1 ? '' : 's'}">${ICON.note}${Number(l.noteCount)}</span>`);
        badges.push(sourceBadge(l));
        return `
          <div class="row ${l.id === contactOpenId ? 'sel' : ''}" data-id="${id}">
            <button class="row-hit" onclick="openContact('${id}')" aria-label="Open ${esc(leadName(l))}"></button>
            ${avatarHtml(leadName(l))}
            <div>
              <div class="nm"><span>${esc(leadName(l))}</span><span class="prio ${esc(l.priority)}">${esc(String(l.priority || '').replace(/^./, (c) => c.toUpperCase()))}</span></div>
              <div class="meta">${leadMeta(l)}</div>
            </div>
            <div class="row-side"><div class="badges">${badges.join('')}</div><span class="chev">${ICON.chevronRight}</span>
              <div class="row-actions"><button class="icon-btn" onclick="quickCall('${id}')" title="Call now" aria-label="Call ${esc(leadName(l))}">${ICON.phone}</button><button class="icon-btn" onclick="quickSnooze('${id}')" title="Snooze until tomorrow" aria-label="Snooze ${esc(leadName(l))}">${ICON.clock}</button></div>
            </div>
          </div>
        `;
      }).join('');
    }
    renderTopKpis();
  }
  window.setQueuePage = (page) => { queuePage = Math.max(0, page); renderStack(); };
  window.quickCall = (id) => openContact(id, { autoDial: true, context: 'queue' });
  window.quickSnooze = async (id) => {
    try {
      await STATE.snooze(id);
      STATE.toast('Snoozed until tomorrow');
      flyOutThenRefresh(id);
    } catch (error) { STATE.toast(error.message || 'Could not snooze lead', 'bad'); }
  };
  window.startCalling = () => {
    const first = currentPool()[0];
    if (first) openContact(first.id, { autoDial: true, context: 'queue' });
  };
  window.setPriorityFilter = (value) => {
    document.querySelector(`.filter-chip[data-f="${value}"]`)?.click();
  };

  document.querySelectorAll('.filter-chip').forEach((chip) => {
    chip.addEventListener('click', () => {
      document.querySelectorAll('.filter-chip').forEach((c) => { c.classList.remove('on'); c.setAttribute('aria-pressed', 'false'); });
      chip.classList.add('on');
      chip.setAttribute('aria-pressed', 'true');
      filter = chip.dataset.f;
      queuePage = 0;
      renderStack();
    });
  });

  // ── RIGHT COLUMN — overview ──
  function renderCallbacksHero() {
    const today = STATE.londonDay();
    const cb = callbackPool();
    const overdueN = cb.filter((lead) => STATE.londonDay(lead.callbackAt) < today).length;
    const pageCount = Math.max(1, Math.ceil(cb.length / CALLBACK_PAGE_SIZE));
    callbackPage = Math.min(callbackPage, pageCount - 1);
    const pageRows = cb.slice(callbackPage * CALLBACK_PAGE_SIZE, (callbackPage + 1) * CALLBACK_PAGE_SIZE);
    const host = document.getElementById('cbtoday');
    if (!cb.length) {
      host.innerHTML = `<div class="callback-heading"><h2>Callbacks due <span class="big">0</span></h2></div><div class="empty-note">No callbacks due today.</div>`;
      return;
    }
    host.innerHTML = `
      <div class="callback-heading">
        <div><h2>Callbacks due <span class="big">${cb.length}</span></h2><div class="sub">${overdueN ? `<b>${overdueN} overdue</b> · ` : ''}${cb.length - overdueN} due today</div></div>
      </div>
      <div class="list">
        ${pageRows.map((l) => {
          const isOverdue = STATE.londonDay(l.callbackAt) < today;
          return `<button class="item callback-item ${isOverdue ? 'overdue' : ''}" aria-label="Open ${esc(leadName(l))}" onclick="openContact('${esc(String(l.id))}', {context:'callbacks'})">
            <div class="tm">${fmtDate(l.callbackAt)}${isOverdue ? '<small>Overdue</small>' : ''}</div>
            <span class="callback-open"><span class="nm">${esc(leadName(l))}</span><span class="co">${leadMeta(l)}</span></span>
            <span class="chev">${ICON.chevronRight}</span>
          </button>`;
        }).join('')}
      </div>
      ${pageCount > 1 ? `<div class="cb-pager">
        <span class="pager-pos">Page ${callbackPage + 1} of ${pageCount}</span>
        <div class="pager-btns"><button onclick="setCallbackPage(${callbackPage - 1})" ${callbackPage === 0 ? 'disabled' : ''}>${ICON.chevronLeft}Previous</button>
        <button onclick="setCallbackPage(${callbackPage + 1})" ${callbackPage === pageCount - 1 ? 'disabled' : ''}>Next${ICON.chevronRight}</button></div>
      </div>` : ''}
    `;
  }
  window.setCallbackPage = (page) => {
    callbackPage = Math.max(0, page);
    renderCallbacksHero();
  };

  const OPPORTUNITY_VISIBLE_STAGES = new Set(['qualified','meeting_booked','meeting_attended','scoping','proposal']);

  let currentOppFilter = 'all';

  window.setOppFilter = (filterVal) => {
    currentOppFilter = filterVal;
    renderOpportunities();
  };

  function renderOpportunities() {
    if (STATE.reportError) {
      document.getElementById('oppcard').innerHTML = `<div class="notes-empty" role="status">${esc(STATE.reportError)} <button class="reset-btn" onclick="refreshZen()">Retry</button></div>`;
      return;
    }
    const owned = (MOCK.opportunities || []).filter((o) => o.ownerId === MOCK.rep.id);
    const visibleAll = owned.filter((o) => OPPORTUNITY_VISIBLE_STAGES.has(o.stage));

    const visible = visibleAll.filter((o) => {
      if (currentOppFilter === 'qualified') return o.stage === 'qualified';
      if (currentOppFilter === 'meeting_booked') return o.stage === 'meeting_booked';
      if (currentOppFilter === 'meeting_attended') return o.stage === 'meeting_attended';
      if (currentOppFilter === 'proposal') return o.stage === 'proposal' || o.stage === 'scoping';
      if (currentOppFilter === 'waiting') return opportunityNextStep(o.id, o) === 'WAITING!';
      return true;
    });

    const openMrr = visibleAll.reduce((sum, o) => sum + (o.mrrValue || 0), 0);
    const openOneOff = visibleAll.reduce((sum, o) => sum + (o.oneOffValue || 0), 0);

    const money = (n) => new Intl.NumberFormat('en-GB', { style:'currency', currency:'GBP', maximumFractionDigits:0 }).format(n);

    const rows = visible
      .slice()
      .sort((a, b) => new Date(b.updatedAt) - new Date(a.updatedAt))
      .map((o) => {
        const stage = MOCK.OPPORTUNITY_STAGES[o.stage] || { label:o.stage, tone:'qualified' };
        const nextStep = opportunityNextStep(o.id, o);
        const isWaiting = nextStep === 'WAITING!';
        const waitingLabel = o.stage === 'meeting_booked' ? 'Meeting date missing' : 'No next step set';
        const valueParts = [o.mrrValue > 0 ? `${money(o.mrrValue)}/mo` : '', o.oneOffValue > 0 ? `${money(o.oneOffValue)} one-off` : ''].filter(Boolean);
        return `
          <button class="opp-row" onclick="openOpportunityModal('${esc(String(o.id))}')">
            <div class="opp-contact">${avatarHtml(o.contactName || o.companyName, 'sm')}<div><div class="nm">${esc(o.contactName)}</div><div class="co">${esc(o.companyName)}</div></div></div>
            <div><span class="stage-pill ${esc(o.stage)}">${esc(stage.label)}</span></div>
            <div class="action ${isWaiting ? 'waiting' : ''}">${isWaiting ? `${ICON.alert}${waitingLabel}` : esc(nextStep)}</div>
            <div class="val">${valueParts.length ? `${valueParts[0]}${valueParts[1] ? `<small>${valueParts[1]}</small>` : ''}` : '<span class="muted">—</span>'}</div>
            <div class="when">${fmtWhen(o.updatedAt)}</div>
          </button>
        `;
      }).join('');

    const counts = {
      all: visibleAll.length,
      qualified: visibleAll.filter((o) => o.stage === 'qualified').length,
      meeting_booked: visibleAll.filter((o) => o.stage === 'meeting_booked').length,
      meeting_attended: visibleAll.filter((o) => o.stage === 'meeting_attended').length,
      proposal: visibleAll.filter((o) => o.stage === 'proposal' || o.stage === 'scoping').length,
      waiting: visibleAll.filter((o) => opportunityNextStep(o.id, o) === 'WAITING!').length,
    };

    const filterConfig = [
      { key: 'all', label: 'All', count: counts.all },
      { key: 'qualified', label: 'Qualified', count: counts.qualified },
      { key: 'meeting_booked', label: 'Meeting booked', count: counts.meeting_booked },
      { key: 'meeting_attended', label: 'Meeting attended', count: counts.meeting_attended },
      { key: 'proposal', label: 'Proposal sent', count: counts.proposal },
      { key: 'waiting', label: 'Needs next step', count: counts.waiting, isWaiting: true },
    ];

    const pillsHtml = filterConfig.map((item) => {
      const isActive = currentOppFilter === item.key;
      const classes = [
        'opp-pill', // class="opp-pill"
        isActive ? 'active' : '',
        item.isWaiting ? 'pill-waiting' : '',
        !item.count && !isActive ? 'empty' : '',
      ].filter(Boolean).join(' ');
      return `
        <button type="button" role="tab" aria-selected="${isActive}" class="${classes}" onclick="setOppFilter('${item.key}')">
          <span>${esc(item.label)}</span>
          <span class="pill-badge">${item.count}</span>
        </button>
      `;
    }).join('');

    document.getElementById('oppcard').innerHTML = `
      <div class="oppcard-head">
        <div class="oppcard-top">
          <div>
            <h2 class="title">Opportunities <span class="count">${visibleAll.length}</span></h2>
            <div class="sub">${visible.length} shown · qualified through proposal</div>
          </div>
          <div class="opp-totals">
            <div><div class="k">Pipeline MRR</div><div class="v">${money(openMrr)}</div></div>
            <div><div class="k">Pipeline one-off</div><div class="v">${money(openOneOff)}</div></div>
          </div>
        </div>
        <div class="opp-filter-pills" role="tablist" aria-label="Filter opportunities by stage">
          ${pillsHtml}
        </div>
      </div>
      <div class="oppcard-list">${rows ? `<div class="opp-thead" aria-hidden="true"><span>Contact</span><span>Stage</span><span>Next step</span><span class="r">Value</span><span class="r">Updated</span></div>${rows}` : '<div class="stack-empty">No opportunities match this view.</div>'}</div>
    `;
  }

  function opportunityNextStep(id, opportunity, contact = null) {
    const scheduled = (STATE.meetingsByLead?.[String(id)] || [])
      .filter((meeting) => (meeting.status || 'scheduled') === 'scheduled')
      .sort((a, b) => new Date(a.scheduledFor || a.bookedAt || 0) - new Date(b.scheduledFor || b.bookedAt || 0))[0];
    if (scheduled) {
      const when = scheduled.scheduledFor || scheduled.bookedAt;
      return `Meeting booked${when ? ` · ${fmtDateTime(when)}` : ''}`;
    }
    if (opportunity?.stage === 'meeting_booked' && opportunity.meetingScheduledAt) {
      return `Meeting booked · ${fmtDateTime(opportunity.meetingScheduledAt)}`;
    }
    const step = opportunity?.nextAction || contact?.nextStepSummary || STATE.contactsById?.[String(id)]?.nextStepSummary;
    if (step && step.trim() && step !== 'No next step recorded') {
      return step;
    }
    return 'WAITING!';
  }

  function opportunityAnswerText(lead) {
    const answers = lead?.qualifyAnswers;
    if (!answers || typeof answers !== 'object') return 'No qualification answers saved.';
    const labels = QUALIFY_QUESTIONS.flatMap((question) => {
      const value = answers[question.key];
      const values = Array.isArray(value) ? value : value ? [value] : [];
      return values.length ? [`${question.label}: ${values.join(', ')}`] : [];
    });
    return labels.length ? labels.join('\n') : 'No qualification answers saved.';
  }

  function opportunityMeetingText(id) {
    const meetings = STATE.meetingsByLead?.[String(id)] || [];
    if (!meetings.length) return 'No meetings booked yet for this opportunity.';
    return meetings.map((meeting) => {
      const when = meeting.scheduledFor || meeting.occurredAt || meeting.bookedAt;
      const status = meeting.status || 'scheduled';
      return `${status} · ${when ? fmtDateTime(when) : 'time not set'}${meeting.meetingType ? ` · ${meeting.meetingType}` : ''}`;
    }).join('\n');
  }

  function ensureOpportunityModal() {
    const existing = document.getElementById('zenOpportunityModal');
    if (existing) return existing;
    const modal = document.createElement('div');
    modal.id = 'zenOpportunityModal';
    modal.className = 'zen-modal';
    modal.hidden = true;
    modal.setAttribute('role', 'region');
    modal.setAttribute('aria-labelledby', 'zenOpportunityTitle');
    document.getElementById('contact').replaceChildren(modal);
    return modal;
  }

  window.openOpportunityModal = (id) => {
    const opportunity = (MOCK.opportunities || []).find((item) => String(item.id) === String(id));
    const lead = STATE.get(id);
    if (!opportunity && !lead) return;
    const row = opportunity || {
      id,
      contactName: lead.name || 'Opportunity',
      companyName: lead.companyName || '',
      stage: lead.opportunityStage || 'qualified',
      mrrValue: lead.mrrValue,
      oneOffValue: lead.oneOffValue,
      nextAction: lead.nextStepSummary || 'No next step recorded',
      updatedAt: lead.qualifiedAt,
    };
    const stage = MOCK.OPPORTUNITY_STAGES[row.stage]?.label || row.stage || 'Qualified';
    const contact = lead || row;
    const primaryPhone = contact.directPhone || contact.phone || '';
    const website = displayWebsite(contact);
    const contactMeta = [contact.title, contact.companyName].filter(Boolean).join(' · ') || 'Company contact';
    const modal = ensureOpportunityModal();
    opportunityOpenId = String(id);
    contactOpenId = String(id);
    document.body.classList.add('contact-open');
    document.body.classList.add('opportunity-open');
    renderStack();
    renderChecklist();
    modal.innerHTML = `<div class="zen-modal-card">
      <div class="zen-modal-head"><div class="contact-head"><div class="contact-id">${avatarHtml(row.contactName || contact.name || 'Opportunity', 'lg')}<div><div class="nm" id="zenOpportunityTitle">${esc(row.contactName || contact.name || 'Opportunity')}</div><div class="role">${esc(contactMeta)}</div><div class="meta-line">${esc([contact.sector, contact.subSector, contact.disposition].filter(Boolean).join(' · ') || 'Qualified lead')}</div><div class="badges"><span class="stage-pill ${esc(row.stage || 'qualified')}">${esc(stage)}</span>${contact.source ? sourceBadge(contact) : ''}</div></div></div><div class="contact-head-actions">${lead ? `<details class="drawer-tools"><summary title="Contact actions" aria-label="Contact actions">${ICON.pencil}</summary><div class="drawer-tools-menu"><button onclick="openOpportunityContact('${esc(String(lead.id))}', 'name')">Edit name</button><button onclick="openOpportunityContact('${esc(String(lead.id))}', 'notes')">Notes timeline</button><button onclick="openOpportunityContact('${esc(String(lead.id))}')">Open contact</button></div></details>` : ''}<button class="close-x zen-modal-close" onclick="closeOpportunityModal()" title="Close opportunity" aria-label="Close opportunity details">${ICON.close}</button></div></div></div>
      <div class="dial-section-inline"><div class="dial-bar"><div class="num">${esc(normalizeZenPhone(primaryPhone) || '—')}<small>${contact.directPhone ? 'Direct dial' : 'Office line'}</small></div><button class="call-btn" onclick="callOpportunity('${esc(String(row.id))}')" ${primaryPhone ? '' : 'disabled'}>${primaryPhone ? `${ICON.phone}Call now` : 'No number'}</button><button class="call-alt" onclick="copyZenPhone('${esc(normalizeZenPhone(primaryPhone))}')" ${primaryPhone ? '' : 'disabled'}>${ICON.copy}Copy</button>${contact.directPhone && contact.phone ? `<button class="call-alt" onclick="callOpportunity('${esc(String(row.id))}', 'office')">Office line</button>` : ''}</div></div>
      <section class="zen-modal-section opportunity-meetings"><div class="section-heading"><h4>Meetings</h4><button id="zenBookMeeting" onclick="openOpportunityMeetingForm('${esc(String(row.id))}')" ${opportunityMeetingOpen ? 'hidden' : ''}>${ICON.calendar} Book next meeting</button></div>${opportunityMeetingHtml(row.id)}${renderOpportunityMeetingForm(row.id)}</section>
      ${renderOpportunityControls(row)}
      <div class="zen-modal-body"><div class="contact-grid"><div class="cell"><div class="k">Email</div><div class="v">${contact.email ? `<a href="mailto:${esc(contact.email)}">${esc(contact.email)}</a>` : '<span class="missing">No email recorded</span>'}</div></div><div class="cell"><div class="k">Phone</div><div class="v">${primaryPhone ? `<a href="tel:${esc(primaryPhone)}">${esc(primaryPhone)}</a>` : '<span class="missing">No phone recorded</span>'}</div></div><div class="cell"><div class="k">Website</div><div class="v">${website ? `<a href="${esc(website)}" target="_blank" rel="noopener noreferrer">${esc(website)}</a>` : '<span class="missing">No website recorded</span>'}</div></div><div class="cell"><div class="k">Opportunity stage</div><div class="v">${esc(stage)}</div></div></div><div class="zen-modal-sections"><p class="zen-updated">Updated ${esc(fmtDate(row.updatedAt))}</p><div class="zen-modal-grid"><div class="zen-modal-field"><b>Monthly recurring revenue</b><span class="amount">${esc(fmtCurrency(row.mrrValue))}</span></div><div class="zen-modal-field"><b>One-off value</b><span class="amount">${esc(fmtCurrency(row.oneOffValue))}</span></div><div class="zen-modal-field next-step"><b>Next step</b>${esc(opportunityNextStep(row.id, row, contact))}</div></div>
        <div class="zen-modal-section"><h4>Qualification from call</h4><p>${esc(opportunityAnswerText(contact))}</p></div>
        ${contact.callNotes ? `<div class="zen-modal-section"><h4>Context notes</h4><p>${esc(contact.callNotes)}</p></div>` : ''}
      </div>
      <div class="zen-modal-foot"><span class="zen-updated">${esc(stage)}</span></div>
    </div>`;
    modal.hidden = false;
    updateOpportunityStageFields();
    modal.querySelector('.zen-modal-close')?.focus();
  };
  function opportunityMeetingHtml(id) {
    const meetings = STATE.meetingsByLead?.[String(id)] || [];
    if (!meetings.length) return '<p>No meetings booked yet for this opportunity.</p>';
    return meetings.map((meeting) => {
      const when = meeting.scheduledFor || meeting.occurredAt || meeting.bookedAt;
      const meetingId = String(meeting.id || '').replace(/^meeting-/, '');
      const canAct = meeting.status === 'scheduled' && meetingId;
      return `<div class="zen-meeting-row"><div class="meeting-detail"><b>${esc((meeting.meetingType || 'Meeting').replaceAll('_', ' '))}</b><span>${esc(when ? fmtDateTime(when) : 'Time not set')}</span></div><span class="badge">${esc((meeting.status || 'scheduled').replaceAll('_', ' '))}</span>${canAct ? `<div class="zen-meeting-actions"><button onclick="updateOpportunityMeeting('${esc(String(id))}','attended','${esc(meetingId)}')">Mark attended</button><button onclick="updateOpportunityMeeting('${esc(String(id))}','no_show','${esc(meetingId)}')">No-show</button></div>` : ''}</div>`;
    }).join('');
  }
  function renderOpportunityControls(row) {
    const currentStageIndex = OPPORTUNITY_STAGES.findIndex(([value]) => value === row.stage);
    const canMoveBackward = !!(window.SQ?.caps?.isAdmin);
    const stageButtons = OPPORTUNITY_STAGES.map(([value, label], index) => { const selected = row.stage === value; const disabled = !canMoveBackward && currentStageIndex >= 0 && index < currentStageIndex; return `<button type="button" class="opp-choice ${selected ? 'on' : ''}" data-stage="${value}" aria-pressed="${selected}" ${disabled ? 'disabled title="Only admins can move an opportunity backwards"' : ''} onclick="selectOpportunityStage('${value}')">${label}</button>`; }).join('');
    const dealButtons = ['Recurring', 'One-off', 'Hybrid'].map((value) => `<button type="button" class="opp-choice ${row.dealType === value ? 'on' : ''}" data-deal-type="${value}" aria-pressed="${row.dealType === value}" onclick="selectOpportunityDealType('${value}')">${value}</button>`).join('');
    const lossReasons = ['Budget', 'Timing', 'No authority', 'Competitor', 'Not a fit'].map((value) => `<button type="button" onclick="setOpportunityLossReason('${value}')">${value}</button>`).join('');
    return `<section class="zen-opportunity-controls" id="zenOpportunityControls" aria-label="Opportunity workflow">
      <div class="section-heading"><div><h4>Opportunity workflow</h4><p class="opp-control-hint">Pick the stage, then fill the details for this step.</p></div></div>
      <input id="zenOppStage" type="hidden" value="${esc(row.stage || 'qualified')}" />
      <input id="zenOppDealType" type="hidden" value="${esc(row.dealType || '')}" />
      <fieldset class="opp-choice-group"><legend>Where is this opportunity now?</legend><div class="opp-choice-grid">${stageButtons}</div></fieldset>
      <fieldset class="opp-choice-group" data-stages="scoping proposal won" data-preserve="#zenOppDealType"><legend>How are you charging?</legend><div class="opp-choice-grid deal-types">${dealButtons}</div></fieldset>
      <fieldset><legend>Commercials</legend><div class="control-grid"><label data-stages="scoping proposal won">Monthly recurring revenue (£)<input id="zenOppMrr" type="number" min="0" step="0.01" value="${esc(row.mrrValue ?? '')}" /></label><label data-stages="scoping proposal won">One-off value (£)<input id="zenOppOneOff" type="number" min="0" step="0.01" value="${esc(row.oneOffValue ?? '')}" /></label></div></fieldset>
      <fieldset><legend>Next action</legend><div class="control-grid"><label class="full" data-stages="qualified meeting_booked meeting_no_show meeting_attended scoping proposal">Next step<input id="zenOppNextStep" maxlength="1000" value="${esc(row.nextAction || '')}" /></label><label data-stages="qualified meeting_no_show scoping">Follow-up<input id="zenOppCallback" type="datetime-local" value="${row.callbackAt ? localDateTimeValue(new Date(row.callbackAt)) : ''}" /></label><label data-stages="scoping proposal">Decision deadline<input id="zenOppDeadline" type="datetime-local" value="${row.decisionDeadlineAt ? localDateTimeValue(new Date(row.decisionDeadlineAt)) : ''}" /></label></div></fieldset>
      <fieldset id="zenStageDetails"><legend>Stage details</legend><div class="control-grid"><label data-stages="meeting_booked">Meeting date and time<input id="zenOppMeetingScheduledAt" type="datetime-local" value="${row.meetingScheduledAt ? localDateTimeValue(new Date(row.meetingScheduledAt)) : ''}" /></label><label data-stages="proposal won">Proposal sent<input id="zenOppProposalSent" type="datetime-local" value="${row.proposalSentAt ? localDateTimeValue(new Date(row.proposalSentAt)) : ''}" /></label><div class="loss-reason-field" data-stages="lost"><label>Loss reason<input id="zenOppLossReason" maxlength="500" value="${esc(row.lossReason || '')}" /></label><div class="loss-reason-chips">${lossReasons}</div></div><label data-stages="meeting_attended">Meeting attended<input id="zenOppMeetingAt" type="datetime-local" /></label></div></fieldset>
      <div class="followup-actions"><button class="primary" onclick="saveOpportunityControls('${esc(String(row.id))}')">Save stage details</button></div></section>`;
  }
  window.selectOpportunityStage = (stage) => {
    const input = document.getElementById('zenOppStage');

  function renderTopKpis() {

  // ── MIDDLE COLUMN — qualifying checklist ──
  function getChecklist(id) {
    if (!checklistState[id]) checklistState[id] = defaultChecklistState();
    return checklistState[id];
  }
  function defaultChecklistState() {
    return CHECK_ITEMS.reduce((acc, it) => { acc[it.key] = false; return acc; }, {});
  }

  function getQualificationChecklist(id) {
    const key = String(id);
    if (!qualificationState[key]) {
      const lead = STATE.get(id);
      const previous = lead?.qualifyAnswers || {};
      qualificationState[key] = {};
      QUALIFY_QUESTIONS.forEach((question) => {
        qualificationState[key][question.key] = question.type === 'multi'
          ? (Array.isArray(previous[question.key]) ? [...previous[question.key]] : [])
          : (previous[question.key] || '');
      });
    }
    return qualificationState[key];
  }

  function getQualificationStep(id) {
    const key = String(id);
    if (!Number.isInteger(qualificationStepState[key])) qualificationStepState[key] = 0;
    return Math.min(qualificationStepState[key], QUALIFY_QUESTIONS.length - 1);
  }

  function renderChecklist() {
    if (!contactOpenId) { document.getElementById('colMid').innerHTML = ''; return; }
    if (qualification && !opportunityOpenId) {
      const lead = STATE.get(contactOpenId);
      const meeting = qualificationMeetings.get(String(contactOpenId)) || {};
      document.getElementById('colMid').innerHTML = `<div class="qualification-panel qualification-sidebar qualification-handoff">
        <button class="back-link" type="button" onclick="cancelQualification()">${ICON.chevronLeft}Back to qualification checklist</button>
        <h4>Qualify ${esc(leadShortName(lead))} → Opportunity</h4>
        <p class="sub">The checklist answers will be saved with this opportunity.</p>
        <label class="meeting-toggle"><input type="checkbox" ${meeting.booked ? 'checked' : ''} onchange="updateQualificationMeeting('${esc(String(contactOpenId))}','booked',this.checked)"> Meeting booked on this call</label>
        ${meeting.booked ? `<div class="meeting-fields"><label for="qualifyMeetingAt">Meeting date and time</label><input id="qualifyMeetingAt" type="datetime-local" value="${esc(meeting.at || '')}" min="${localDateTimeValue(new Date())}" oninput="updateQualificationMeeting('${esc(String(contactOpenId))}','at',this.value)"><label for="qualifyNextStep">Meeting next step</label><input id="qualifyNextStep" value="${esc(meeting.nextStep || '')}" placeholder="What should happen next?" oninput="updateQualificationMeeting('${esc(String(contactOpenId))}','nextStep',this.value)"></div>` : ''}
        <label class="context-label" for="qualifyNote">Opportunity context notes</label><textarea id="qualifyNote" placeholder="Context for the opportunity..." oninput="updateQualificationNote('${esc(String(contactOpenId))}', this.value)">${esc(qualificationNotes.get(String(contactOpenId)) || '')}</textarea>
        <button class="confirm" type="button" onclick="saveQualification()">Qualify and create opportunity</button>
      </div>`;
      return;
    }
    const previousChecklist = document.querySelector('.checklist');
    const checklistOpen = previousChecklist ? previousChecklist.open : !window.matchMedia('(max-width:900px)').matches;
    const l = STATE.get(contactOpenId);
    const isOpportunity = !!opportunityOpenId;
    const cl = isOpportunity ? getChecklist(contactOpenId) : getQualificationChecklist(contactOpenId);
    const qualificationStep = isOpportunity ? 0 : getQualificationStep(contactOpenId);
    const activeQuestion = isOpportunity ? null : QUALIFY_QUESTIONS[qualificationStep];
    const activeAnswered = isOpportunity || (activeQuestion.type === 'multi'
      ? (Array.isArray(cl[activeQuestion.key]) && cl[activeQuestion.key].length > 0)
      : !!cl[activeQuestion.key]);
    const qualificationDone = QUALIFY_QUESTIONS.filter((question) => Array.isArray(cl[question.key]) ? cl[question.key].length > 0 : !!cl[question.key]).length;
    const done = isOpportunity ? CHECK_ITEMS.filter((it) => cl[it.key]).length : qualificationDone;
    const total = isOpportunity ? CHECK_ITEMS.length : QUALIFY_QUESTIONS.length;
    const allDone = done === total;
    const pct = isOpportunity ? Math.round((done / total) * 100) : Math.round(((qualificationStep + 1) / total) * 100);

    // Position of the open contact within the ACTIVE pool, so the rep sees
    // "Lead 3 of 24" tracked against the filter they're using.
    const pool = navigationPool();
    const idxInPool = pool.findIndex((x) => x.id === contactOpenId);
    const prevLead = idxInPool > 0 ? pool[idxInPool - 1] : null;
    const nextLead = idxInPool >= 0 && idxInPool < pool.length - 1 ? pool[idxInPool + 1] : null;
    const posLabel = idxInPool >= 0
      ? `Lead <b>${idxInPool + 1}</b> of <b>${pool.length}</b>`
      : `<b>${pool.length}</b> leads in queue`;

    document.getElementById('colMid').innerHTML = `
      <div class="leadnav ${introAnim ? 'intro' : ''}" title="Move through today's queue without closing the drawer">
        <button class="prev" onclick="prevLeadInPool()" ${prevLead ? '' : 'disabled'}>
          ${ICON.chevronLeft}<span>Previous</span>
        </button>
        <div class="pos">${posLabel}</div>
        <button class="next" onclick="nextLeadInPool()" ${nextLead ? '' : 'disabled'}>
          <span>Next</span>${ICON.chevronRight}
        </button>
      </div>
      <details class="checklist ${isOpportunity ? '' : 'qualifying'} ${introAnim ? 'intro' : ''}" ${checklistOpen ? 'open' : ''}>
        <summary class="title"><span>${opportunityOpenId ? 'Closing checklist' : 'Qualifying checklist'}</span></summary>
        <div class="progress">
          <div class="n">${isOpportunity ? `${done} / ${total}` : `Step ${qualificationStep + 1} of ${total}`}</div>
          <div class="bar"><i style="width:${pct}%"></i></div>
        </div>
        <div class="items">
          ${isOpportunity ? CHECK_ITEMS.map((it) => `
            <label class="check ${cl[it.key] ? 'on' : ''}">
              <input type="checkbox" ${cl[it.key] ? 'checked' : ''} onchange="toggleCheck('${it.key}')" />
              <div><div class="cb-lbl">${esc(it.label)}</div><div class="cb-hint">${esc(it.hint)}</div></div>
            </label>
          `).join('') : [activeQuestion].map((question) => `<div class="qualify-question checklist-question"><div class="qualify-label">${esc(question.label)}</div><div class="qualify-options" role="group" aria-label="${esc(question.label)}" data-multiple="${question.type === 'multi'}">${question.options.map((option) => { const selected = question.type === 'multi' ? (cl[question.key] || []).includes(option) : cl[question.key] === option; return `<button class="${selected ? 'on' : ''}" aria-pressed="${selected}" onclick="pickChecklistQualification('${question.key}','${question.type}',${JSON.stringify(option).replace(/"/g, '&quot;')})">${esc(option)}</button>`; }).join('')}</div></div>`).join('')}
        </div>
        ${!isOpportunity ? `<div class="qualify-step-actions">
          <button type="button" class="step-back" onclick="previousQualificationStep()" ${qualificationStep === 0 ? 'disabled' : ''}>${ICON.chevronLeft}Back</button>
          ${qualificationStep < total - 1 ? `<button type="button" class="step-next" onclick="nextQualificationStep()" ${activeAnswered ? '' : 'disabled'}>Next${ICON.chevronRight}</button>` : ''}
        </div>` : ''}
        <div class="close-cta ${allDone && (isOpportunity || qualificationStep === total - 1) ? 'show' : ''}">
          <div class="big">${opportunityOpenId ? 'Ready to send the contract' : 'Ready to qualify'}</div>
          <div class="sub">${opportunityOpenId ? 'Every closing check is complete for this opportunity.' : 'Qualification answers complete.'}</div>
          ${!opportunityOpenId ? '<button type="button" onclick="beginQualification()">Qualify → Opportunity</button>' : ''}
        </div>
        <button class="reset-link" onclick="resetChecklist()">Reset checklist</button>
      </details>
    `;
  }

  function switchContact(id) {
    if (!id || transitioning || id === contactOpenId) return;
    const card = document.querySelector('.contact-card');
    const checklist = document.getElementById('colMid');
    if (!card) { openContact(id); return; }
    transitioning = true;
    card.classList.add('leaving');
    checklist.classList.add('leaving');
    setTimeout(() => {
      checklist.classList.remove('leaving');
      transitioning = false;
      openContact(id);
    }, transitionDelay());
  }

  window.prevLeadInPool = () => {
    if (!contactOpenId) return;
    const pool = navigationPool();
    const i = pool.findIndex((x) => x.id === contactOpenId);
    if (i > 0) switchContact(pool[i - 1].id);
  };
  window.nextLeadInPool = () => {
    if (!contactOpenId) return;
    const pool = navigationPool();
    const i = pool.findIndex((x) => x.id === contactOpenId);
    if (i >= 0 && i < pool.length - 1) switchContact(pool[i + 1].id);
  };

  window.toggleCheck = (key) => {
    if (!contactOpenId) return;
    const cl = getChecklist(contactOpenId);
    cl[key] = !cl[key];
    const wasChecked = cl[key];
    renderChecklist();
    // Re-query after re-render, then pop the row + bump the counter.
    const idx = CHECK_ITEMS.findIndex((it) => it.key === key);
    const rowEl = document.querySelectorAll('.checklist .check')[idx];
    rowEl?.querySelector('input')?.focus({ preventScroll: true });
    if (rowEl && wasChecked) {
      rowEl.style.animation = 'none';
      rowEl.classList.add('just-checked');
    }
    const prog = document.querySelector('.checklist .progress');
    if (prog) { prog.classList.add('bump'); setTimeout(() => prog.classList.remove('bump'), 360); }
  };
  window.pickChecklistQualification = (key, type, option) => {
    if (!contactOpenId || opportunityOpenId) return;
    const state = getQualificationChecklist(contactOpenId);
    if (type === 'multi') {
      const values = state[key] || (state[key] = []);
      const index = values.indexOf(option);
      if (index >= 0) values.splice(index, 1); else values.push(option);
    } else {
      state[key] = state[key] === option ? '' : option;
    }
    renderChecklist();
    if (type === 'single' && state[key]) {
      qualificationStepState[String(contactOpenId)] = Math.min(getQualificationStep(contactOpenId) + 1, QUALIFY_QUESTIONS.length - 1);
      renderChecklist();
    }
  };
  window.nextQualificationStep = () => {
    if (!contactOpenId || opportunityOpenId) return;
    const question = QUALIFY_QUESTIONS[getQualificationStep(contactOpenId)];
    const state = getQualificationChecklist(contactOpenId);
    const answered = question.type === 'multi' ? state[question.key].length > 0 : !!state[question.key];
    if (!answered) return;
    qualificationStepState[String(contactOpenId)] = Math.min(getQualificationStep(contactOpenId) + 1, QUALIFY_QUESTIONS.length - 1);
    renderChecklist();
  };
  window.previousQualificationStep = () => {
    if (!contactOpenId || opportunityOpenId) return;

  window.resetChecklist = () => {

    renderChecklist();

  function completeContact(id, title, sub) {

      .then(() => { if (String(contactOpenId) === String(id)) renderContact(); })
      .catch((error) => STATE.toast(error.message, 'warn'))
      .finally(() => { if (String(contactOpenId) === String(id)) opts.onReady?.(); });

      checklist.classList.remove('leaving');
      transitioning = false;
      finishClose(opts);
