  window.closeContact = closeContact;

  function renderContact() {
    if (!contactOpenId) return;
    const l = STATE.get(contactOpenId);
    if (!l) return;
    const primary = l.directPhone || l.phone;
    const notes = STATE.allNotes(l.id);
    const previousNote = document.getElementById('ctNote');
    const restoreNoteFocus = previousNote && document.activeElement === previousNote && previousNote.dataset.leadId === String(l.id);
    const selectionStart = restoreNoteFocus ? previousNote.selectionStart : 0;
    const selectionEnd = restoreNoteFocus ? previousNote.selectionEnd : 0;
    const classification = [l.sector, l.subSector].map((value) => String(value || '').trim()).filter(Boolean).join(' · ');
    const emails = leadEmails(l);
    const sameLead = document.querySelector('#contact .contact-card')?.dataset.leadId === String(l.id);
    const openEdits = sameLead ? new Map([...document.querySelectorAll('#contact .field-edit[open]')].map((el) => [el.dataset.field, el.querySelector('input')?.value])) : new Map();

    const stateBar = dialState === 'idle' ? '' :
      dialState === 'calling' ? '<div class="dial-state calling show"><span class="pulse"></span>Dialing 3CX…</div>' :
      dialState === 'connected' ? '<div class="dial-state connected show"><span class="pulse"></span>Connected — log the outcome below</div>' :
                                  '<div class="dial-state missed show"><span class="pulse"></span>No answer — log voicemail or no-answer below</div>';

    const outcomeButtons = OUTCOMES.map((o, index) => {
      const on = suggested === o.key ? ' on' : '';
      const handler = o.key === 'interested' ? `beginBooking()` : o.key === 'wants_info' ? `beginFollowup('wants_info')` : o.key === 'gatekeeper' ? `beginFollowup('gatekeeper')` : o.key === 'qualify' ? `beginQualification()` : `logOutcome('${o.key}')`;
      return `<button class="${o.tone}${on}" onclick="${handler}" aria-keyshortcuts="${index + 1}">${esc(o.label)}<kbd>${index + 1}</kbd><small>${esc(o.hint)}</small></button>`;
    }).join('');

    const bookingPanel = booking ? renderBookingPanel(l) : '';
    const followupPanel = followup ? renderFollowupPanel(l) : '';
    const controlsPanel = leadControls ? renderLeadControls(l) : '';

    document.getElementById('contact').innerHTML = `
      <div class="contact-card ${introAnim ? 'intro' : ''}" data-lead-id="${esc(String(l.id))}" aria-busy="${pendingContacts.has(String(l.id))}">
        <div class="contact-head">
          <div class="contact-id">
            ${avatarHtml(leadName(l), 'lg')}
            <div>
            <div class="nm inline-edit" data-field="name"><span>${esc(leadName(l))}</span><button class="edit" type="button" onclick="beginInlineEdit('name')" title="Edit name" aria-label="Edit name">${ICON.pencil}</button></div>
            <div class="role inline-edit" data-field="title"><span>${esc(l.title || 'Add title')}${l.companyName ? ` <span class="co">· ${esc(l.companyName)}</span>` : ''}</span><button class="edit" type="button" onclick="beginInlineEdit('title')" title="Edit title" aria-label="Edit title">${ICON.pencil}</button></div>
            <div class="meta-line">${classification ? `${esc(classification)} · ` : ''}${esc(MOCK.STATUS_LABELS[l.status] || l.status)}${l.disposition ? ` · ${esc(l.disposition)}` : ''}</div>
            <div class="badges">
              <span class="badge ${esc(l.priority)}">${esc(String(l.priority || '').replace(/^./, (c) => c.toUpperCase()))}</span>
              ${l.callbackAt ? `<span class="badge cb">Callback ${fmtDate(l.callbackAt)}</span>` : ''}
              ${l.status === 'wants_more_info' ? `<span class="badge info">Wants info</span>` : ''}
              ${sourceBadge(l)}
            </div>
            </div>
          </div>
          <div class="contact-head-actions"><button class="icon-btn ${leadControls ? 'on' : ''}" onclick="toggleLeadControls()" title="Lead controls" aria-label="Lead controls" aria-expanded="${leadControls}" aria-controls="zenLeadControls">${ICON.cog}</button><button class="close-x" onclick="closeContact()" title="Close (Esc)" aria-label="Close">${ICON.close}</button></div>
        </div>

        ${controlsPanel}

        <div class="dial-section-inline">
          <div class="dial-bar">
            <div class="num">${esc(normalizeZenPhone(primary) || '—')}<small>${l.directPhone ? 'Direct dial' : 'Office line'}</small></div>
            <button class="call-btn" onclick="doDial()" aria-keyshortcuts="C" ${dialState === 'calling' ? 'disabled' : ''}>${ICON.phone}${dialState === 'calling' ? 'Calling…' : `Call ${l.directPhone ? 'direct' : 'now'}`}<kbd>C</kbd></button>
            <button class="call-alt" onclick="copyZenPhone('${esc(normalizeZenPhone(primary))}')" ${primary ? '' : 'disabled'}>${ICON.copy}Copy</button>
            ${l.directPhone && l.phone ? `<button class="call-alt" onclick="doDial('office')" ${dialState === 'calling' ? 'disabled' : ''}>Office line</button>` : ''}
          </div>
          ${stateBar}
        </div>

        <div class="contact-body">
          <div class="section">
            <h4>Log outcome</h4>
            <div class="out">${outcomeButtons}</div>
            ${bookingPanel}
            ${followupPanel}
          </div>

          <div class="section add-note">
            <h4><label for="ctNote">Add note</label><kbd>N</kbd></h4>
            <textarea id="ctNote" data-lead-id="${esc(String(l.id))}" oninput="updateNoteDraft(this.dataset.leadId, this.value)" placeholder="What did you learn on the call?">${esc(noteDrafts.get(String(l.id)) || '')}</textarea>
            <button onclick="saveNote()">Save note</button>
          </div>
        </div>

        <div class="contact-grid">
          <div class="cell"><div class="k">Email addresses</div><div class="v email-links">${emails.length ? emails.map((email) => `<a href="mailto:${esc(email)}">${esc(email)}</a>`).join('') : '<span class="missing">No email recorded</span>'}</div><details class="field-edit" data-field="emails"><summary>${ICON.pencil}Edit emails</summary><div class="edit-row"><input id="contactEmails" type="text" value="${esc(emails.join(', '))}" placeholder="name@company.com, second@company.com" aria-label="Email addresses, separated by commas" /><button type="button" onclick="saveContactEmails()">Save</button></div></details></div>
          <div class="cell"><div class="k">Website</div><div class="v">${displayWebsite(l) ? `<a href="${esc(displayWebsite(l))}" target="_blank" rel="noopener">${esc(displayWebsite(l))}</a>` : '<span class="missing">No website recorded</span>'}</div></div>
          ${l.callbackAt ? `<div class="cell"><div class="k">Callback due</div><div class="v">${esc(fmtDate(l.callbackAt))}</div><details class="field-edit" data-field="callback"><summary>${ICON.calendar}Reschedule</summary><div class="edit-row"><input id="callbackRescheduleAt" type="datetime-local" value="${esc(localDateTimeValue(new Date(l.callbackAt)))}" aria-label="New callback date and time" /><button type="button" onclick="rescheduleCurrentCallback()">Change date</button></div></details></div>` : ''}
        </div>

        <div class="contact-body">
          <div class="section">
            <h4>Notes &amp; timeline (${notes.length})</h4>
            <div class="notes-list">
              ${notes.length ? notes.map((n) => `
                <div class="note-item">
                  <div class="head"><div><span class="who">${esc(n.who)}</span><span class="kind ${n.kind || 'note'}">${esc(n.kind || 'note')}</span></div><div class="when">${fmtWhen(n.when)}</div></div>
                  <div>${esc(n.text)}</div>
                </div>
              `).join('') : '<div class="notes-empty">No notes on this lead yet. Add one after your call.</div>'}
            </div>
          </div>
        </div>

        <div class="contact-foot">
          <button class="fbtn snooze" onclick="snoozeCurrent()">Snooze til tomorrow</button>
          <button class="fbtn void" onclick="voidCurrentContact()">Void contact</button>
          <div class="spacer"></div>
          <button class="fbtn next" onclick="saveAndNext()">Save &amp; next lead${ICON.chevronRight}</button>
        </div>
      </div>
    `;
    if (pendingContacts.has(String(l.id))) {
      document.querySelectorAll('#contact button').forEach((button) => { button.disabled = true; });
    }
    openEdits.forEach((value, field) => {
      const details = document.querySelector(`#contact .field-edit[data-field="${field}"]`);
      if (!details) return;
      details.open = true;
      const input = details.querySelector('input');
      if (input && value !== undefined) input.value = value;
    });
    if (restoreNoteFocus) {
      const nextNote = document.getElementById('ctNote');
      nextNote.focus({ preventScroll: true });
      nextNote.setSelectionRange(selectionStart, selectionEnd);
    }
  }

  function renderBookingPanel(l) {
    const now = new Date();
    const tmr = new Date(now); tmr.setDate(tmr.getDate() + 1); tmr.setHours(9, 0, 0, 0);
    const in2 = new Date(now); in2.setDate(in2.getDate() + 2); in2.setHours(9, 0, 0, 0);
    const nextMon = new Date(now);
    const daysToMon = (8 - nextMon.getDay()) % 7 || 7;
    nextMon.setDate(nextMon.getDate() + daysToMon); nextMon.setHours(9, 0, 0, 0);
    const nextFri = new Date(now);
    const daysToFri = (5 - nextFri.getDay() + 7) % 7 || 7;
    nextFri.setDate(nextFri.getDate() + daysToFri); nextFri.setHours(9, 0, 0, 0);

    return `
      <div class="booking">
        <h4>Book a callback with ${esc(leadShortName(l))}</h4>
        <div class="presets">
          <button class="preset" onclick="confirmBooking('${tmr.toISOString()}')">Tomorrow</button>
          <button class="preset" onclick="confirmBooking('${in2.toISOString()}')">In 2 days</button>
          <button class="preset" onclick="confirmBooking('${nextMon.toISOString()}')">Next Mon</button>
          <button class="preset" onclick="confirmBooking('${nextFri.toISOString()}')">Next Fri</button>
        </div>
        <div class="custom">
          <label for="cbCustom">Callback date and time</label>
          <input type="datetime-local" id="cbCustom" aria-label="Callback date and time" value="${esc(callbackDrafts.get(String(l.id)) || localDateTimeValue(tmr))}" min="${localDateTimeValue(now)}" oninput="updateCallbackDraft('${esc(String(l.id))}', this.value)" />
          <button class="cancel" onclick="cancelBooking()">Cancel</button>
          <button class="confirm" onclick="confirmCustomBooking()">Book callback</button>
        </div>
      </div>
    `;
  }

  function localDateTimeValue(date) {
    const d = new Date(date);
    d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
    return d.toISOString().slice(0, 16);
  }

  function renderFollowupPanel(l) {
    const mode = followup.mode;
    const callback = followup.choice === 'callback';
    const choices = mode === 'gatekeeper'
      ? [['email', 'Send email'], ['callback', 'Book callback'], ['not_interested', 'Not interested']]
      : [['email', 'Email follow-up'], ['callback', 'Book callback']];
    return `<div class="followup-panel">
      <h4>${mode === 'gatekeeper' ? 'Gatekeeper result' : 'Wants-info follow-up'}</h4>
      <div class="followup-choices" role="group" aria-label="Follow-up action">${choices.map(([key, label]) => `<button class="${followup.choice === key ? 'on' : ''}" aria-pressed="${followup.choice === key}" onclick="chooseFollowup('${key}')">${label}</button>`).join('')}</div>
      ${callback ? `<label for="followupAt">Callback date and time</label><input id="followupAt" type="datetime-local" min="${localDateTimeValue(new Date())}" value="${esc(followup.callbackAt || '')}" oninput="updateFollowupTime(this.value)" />` : ''}
      <div class="followup-actions"><button class="cancel" onclick="cancelFollowup()">Back</button><button class="confirm" onclick="saveFollowup()" ${followup.choice && (!callback || followup.callbackAt) ? '' : 'disabled'}>Save follow-up</button></div>
    </div>`;
  }

  function renderLeadControls(l) {
    const statusOptions = STATUS_ORDER.map((status) => `<option value="${status}" ${l.status === status ? 'selected' : ''}>${esc(MOCK.STATUS_LABELS[status] || status)}</option>`).join('');
    const repOptions = REP_OPTIONS.map((rep) => `<option value="${rep.id}" ${String(l.ownerId) === rep.id ? 'selected' : ''}>${esc(rep.name)}</option>`).join('');
    const callbackValue = l.callbackAt ? localDateTimeValue(new Date(l.callbackAt)) : '';
    const sectors = STATE.taxonomy?.sectors || [];
    const sectorOptions = ['<option value="">Select sector</option>'].concat(sectors.map((sector) => `<option value="${esc(sector)}" ${l.sector === sector ? 'selected' : ''}>${esc(sector)}</option>`)).join('');
    const subSectors = STATE.taxonomy?.subSectorsBySector?.[l.sector] || [];
    const subSectorOptions = ['<option value="">Select sub-sector</option>'].concat(subSectors.map((sector) => `<option value="${esc(sector)}" ${l.subSector === sector ? 'selected' : ''}>${esc(sector)}</option>`)).join('');
    return `<div class="lead-controls" id="zenLeadControls" role="group" aria-label="Lead controls">
      <div class="lc-section">
        <div class="lc-head">${ICON.tag}<h4>Lead controls</h4></div>
        <div class="control-grid"><label>Sector<select id="editLeadSector" onchange="updateSectorOptions()">${sectorOptions}</select></label><label>Sub-sector<select id="editLeadSubSector">${subSectorOptions}</select></label><label>Status<select id="editLeadStatus">${statusOptions}</select></label><label>Reassign owner<select id="editLeadOwner">${repOptions}</select></label></div>
        <div class="lc-actions"><button class="confirm" onclick="saveLeadControls()">Save controls</button></div>
      </div>
      <div class="lc-section">
        <div class="lc-head">${ICON.calendar}<h4>Disposition &amp; callback</h4></div>
        <div class="control-grid"><label>Disposition<select id="editDisposition"><option value="">None</option>${['No answer','Left voicemail','Callback booked','Gatekeeper','Wrong number','Interested','Not interested','Covered by colleague','Already worked this company','Company target'].map((value) => `<option value="${esc(value)}" ${l.disposition === value ? 'selected' : ''}>${esc(value)}</option>`).join('')}</select></label><label>Callback date and time<input id="editCallbackAt" type="datetime-local" value="${callbackValue}" /></label></div>
        <div class="lc-actions"><button class="confirm" onclick="saveDispositionControls()">Save disposition</button></div>
      </div>
    </div>`;
  }

  /* Play the fly-out on a stack row, then re-render the list. */
  function flyOutThenRefresh(id) {
    const row = document.querySelector(`.row[data-id="${id}"]`);
    if (!row) { renderStack(); renderCallbacksHero(); return; }
    row.classList.add('leaving');
    setTimeout(() => { renderStack(); renderCallbacksHero(); }, 340);
  }

  window.beginBooking = () => { booking = true; suggested = 'interested'; renderContact(); };
  window.cancelBooking = () => { booking = false; suggested = null; renderContact(); };
  window.confirmBooking = (iso) => runContactAction(
    (id, note) => STATE.applyOutcome(id, 'interested', { callbackAt: iso, note }),
    { clearDraft: true, onSaved: (id) => completeContact(id, 'Callback booked', `Follow up ${fmtDate(iso)}.`) },
  );
  window.confirmCustomBooking = () => {
    const el = document.getElementById('cbCustom');
    if (!el || !el.value) { STATE.toast('Pick a day first', 'warn'); return; }
    // Anchor to 09:00 on the picked day — the time is internal-only.
    const d = new Date(el.value);
    if (Number.isNaN(d.getTime())) { STATE.toast('Choose a valid callback time', 'warn'); return; }
    confirmBooking(d.toISOString());
  };

  window.beginFollowup = (mode) => { followup = { mode, choice: null, callbackAt: '' }; booking = false; qualification = false; renderContact(); };
  window.chooseFollowup = (choice) => { if (!followup) return; followup.choice = choice; renderContact(); };
  window.updateFollowupTime = (value) => {
    if (!followup) return;
    followup.callbackAt = value;
    const saveButton = document.querySelector('.followup-panel .confirm');
    if (saveButton) saveButton.disabled = !value;
  };
  window.cancelFollowup = () => { followup = null; renderContact(); };
  window.saveFollowup = () => {
    if (!followup?.choice) return;
    const selected = followup;
    if (selected.choice === 'callback' && !selected.callbackAt) { STATE.toast('Choose a callback date and time', 'warn'); return; }
    const callbackAt = selected.callbackAt ? new Date(selected.callbackAt) : null;
    if (callbackAt && Number.isNaN(callbackAt.getTime())) { STATE.toast('Choose a valid callback time', 'warn'); return; }
    runContactAction((id, note) => {
      if (selected.mode === 'gatekeeper' && selected.choice === 'not_interested') return STATE.saveFollowup(id, 'Gatekeeper', 'not_interested', 'Not interested', null, note);
      if (selected.choice === 'callback') return STATE.saveFollowup(id, selected.mode === 'gatekeeper' ? 'Gatekeeper' : 'Answered - wants info', 'to_call_back', selected.mode === 'gatekeeper' ? 'Gatekeeper' : 'Interested', callbackAt.toISOString(), note);
      return STATE.saveFollowup(id, selected.mode === 'gatekeeper' ? 'Gatekeeper' : 'Answered - wants info', 'wants_more_info', selected.mode === 'gatekeeper' ? 'Gatekeeper - send email' : 'Send email', null, note);
    }, { clearDraft: true, onSaved: (id) => completeContact(id, 'Follow-up saved', selected.choice === 'callback' ? `Callback set for ${fmtDate(callbackAt.toISOString())}.` : 'The selected follow-up was recorded.') });
  };

  window.beginInlineEdit = (field) => {
    if (!contactOpenId || !['name', 'title'].includes(field)) return;
    const lead = STATE.get(contactOpenId);
    const current = field === 'name' ? (lead.name || '') : (lead.title || '');
    const container = document.querySelector(`.inline-edit[data-field="${field}"]`);
    if (!container) return;
    container.innerHTML = `<input id="inlineEditInput" value="${esc(current)}" aria-label="Edit ${field}" placeholder="${field === 'name' ? 'Contact name' : 'Job title'}" /><button class="save" type="button" onclick="saveInlineEdit('${field}')" aria-label="Save ${field}">${ICON.check}</button><button class="cancel" type="button" onclick="renderContact()" aria-label="Cancel edit">${ICON.close}</button>`;
    const input = document.getElementById('inlineEditInput');
    input.focus();
    input.select();
    input.addEventListener('keydown', (event) => { if (event.key === 'Enter') { event.preventDefault(); saveInlineEdit(field); } if (event.key === 'Escape') { event.preventDefault(); renderContact(); } });
  };
  window.saveInlineEdit = async (field) => {
    if (!contactOpenId) return;
    const lead = STATE.get(contactOpenId);
    const value = document.getElementById('inlineEditInput')?.value.trim().replace(/\s+/g, ' ');
    if (!value) { STATE.toast(`${field === 'name' ? 'Name' : 'Title'} is required`, 'warn'); return; }
    try {
      await STATE.updateLead(contactOpenId, field === 'name' ? { name: value, title: lead.title || null } : { name: lead.name || lead.companyName, title: value });
      STATE.toast(`${field === 'name' ? 'Name' : 'Title'} updated`);
      renderContact();
    } catch (error) { STATE.toast(error.message || 'Could not update lead details', 'bad'); }
  };
  window.saveContactEmails = async () => {
    if (!contactOpenId) return;
    const values = String(document.getElementById('contactEmails')?.value || '')
      .split(/[\s,;]+/)
      .map((value) => value.trim().toLowerCase())
      .filter(Boolean);
    const emails = Array.from(new Set(values));
    const invalid = emails.find((email) => !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email));
    if (invalid) { STATE.toast(`Invalid email address: ${invalid}`, 'warn'); return; }
    try {
      await STATE.updateEmails(contactOpenId, emails);
      STATE.toast(emails.length === 1 ? 'Email updated' : 'Email addresses updated');
      renderContact();
    } catch (error) { STATE.toast(error.message || 'Could not update email addresses', 'bad'); }
  };
  window.rescheduleCurrentCallback = async () => {
    if (!contactOpenId) return;
    const value = document.getElementById('callbackRescheduleAt')?.value || '';
    const callbackAt = new Date(value);
    if (!value || Number.isNaN(callbackAt.getTime())) { STATE.toast('Choose a valid callback date and time', 'warn'); return; }
    try {
      await STATE.rescheduleCallback(contactOpenId, callbackAt.toISOString());
      STATE.toast('Callback date changed');
      renderContact();
      renderCallbacksHero();
      renderStack();
    } catch (error) { STATE.toast(error.message || 'Could not change callback date', 'bad'); }
  };
  window.updateSectorOptions = () => {
    const sector = document.getElementById('editLeadSector')?.value || '';
    const select = document.getElementById('editLeadSubSector');
    if (!select) return;
    const options = ['<option value="">Select sub-sector</option>'].concat((STATE.taxonomy?.subSectorsBySector?.[sector] || []).map((value) => `<option value="${esc(value)}">${esc(value)}</option>`));
    select.innerHTML = options.join('');
  };

  window.beginQualification = () => {
    if (!contactOpenId) return;
    getQualificationChecklist(contactOpenId);
    qualificationNotes.set(String(contactOpenId), '');
    qualificationMeetings.set(String(contactOpenId), { booked: false, at: '', nextStep: '' });
    qualification = true; booking = false; followup = null; renderChecklist();
  };
  window.pickQualification = (key, type, option) => {
    if (!contactOpenId) return;
    const state = qualificationState[String(contactOpenId)] || (qualificationState[String(contactOpenId)] = {});
    if (type === 'multi') { const values = state[key] || (state[key] = []); const index = values.indexOf(option); if (index >= 0) values.splice(index, 1); else values.push(option); }
    else state[key] = state[key] === option ? '' : option;
    renderContact();
  };
  window.cancelQualification = () => { qualification = false; renderChecklist(); };
  window.saveQualification = () => {
    if (!contactOpenId) return;
    const id = String(contactOpenId);
    const answers = qualificationState[id] || {};
    const note = (qualificationNotes.get(id) || document.getElementById('qualifyNote')?.value || '').trim();
    const meeting = qualificationMeetings.get(id) || {};
    if (meeting.booked && !meeting.at) { STATE.toast('Meeting date is required when a meeting is booked', 'warn'); return; }
    const meetingAt = meeting.booked ? new Date(meeting.at) : null;
    if (meetingAt && Number.isNaN(meetingAt.getTime())) { STATE.toast('Choose a valid meeting time', 'warn'); return; }
    runContactAction((leadId) => STATE.qualify(leadId, answers, note, meetingAt?.toISOString() || null, meeting.nextStep?.trim() || null), { onSaved: (leadId) => completeContact(leadId, 'Qualified', meeting.booked ? 'Opportunity created and meeting details saved.' : 'Opportunity created in the pipeline.') });
  };
  window.toggleLeadControls = () => { leadControls = !leadControls; qualification = false; followup = null; renderContact(); };
  window.saveLeadControls = () => {
    if (!contactOpenId) return;
    const id = String(contactOpenId);
    const lead = STATE.get(id);
    const ownerId = document.getElementById('editLeadOwner')?.value || '';
    const changes = { sector: document.getElementById('editLeadSector')?.value.trim(), subSector: document.getElementById('editLeadSubSector')?.value.trim(), status: document.getElementById('editLeadStatus')?.value };
    runContactAction(async (leadId) => { await STATE.updateLead(leadId, changes); if (ownerId && ownerId !== String(lead?.ownerId || '')) await STATE.reassign(leadId, ownerId); }, { onSaved: () => { leadControls = false; renderContact(); STATE.toast('Lead details updated'); } });
  };
  window.saveDispositionControls = () => {
    if (!contactOpenId) return;
    const lead = STATE.get(contactOpenId);
    const disposition = document.getElementById('editDisposition')?.value || '';
    const callbackValue = document.getElementById('editCallbackAt')?.value || '';
    if (lead?.callbackAt && !callbackValue) { STATE.toast('Callback dates can be changed, not removed', 'warn'); return; }
    const callbackAt = callbackValue ? new Date(callbackValue) : null;
    if (callbackAt && Number.isNaN(callbackAt.getTime())) { STATE.toast('Choose a valid callback time', 'warn'); return; }
    runContactAction((id) => STATE.updateDisposition(id, disposition, callbackAt?.toISOString() || null), { onSaved: () => { leadControls = false; renderContact(); STATE.toast('Disposition updated'); } });
  };

  window.doDial = (type = 'primary') => {
    if (!contactOpenId) return;
    const lead = STATE.get(contactOpenId);
    if (!lead) return;
    const phone = type === 'office' ? (lead.phone || lead.directPhone) : (lead.directPhone || lead.phone);
    SalesCall.dialDirect({ ...lead, phone }, phone);
  };

  function normalizeZenPhone(phone) { return String(phone || '').replace(/^\+44\s*/i, '0').replace(/[().\s-]+/g, ''); }
  window.copyZenPhone = async (phone) => {
    if (!phone) return;
    try {
      if (navigator.clipboard?.writeText) await navigator.clipboard.writeText(phone);
      else { const input = document.createElement('textarea'); input.value = phone; input.style.position = 'fixed'; input.style.opacity = '0'; document.body.appendChild(input); input.select(); document.execCommand('copy'); input.remove(); }
      STATE.toast('Phone number copied');
    } catch { STATE.toast('Could not copy phone number', 'bad'); }
  };
  window.voidCurrentContact = () => {
    if (!contactOpenId || !confirm('Void this contact? It will be removed from all active queues.')) return;
    runContactAction((id) => STATE.voidLead(id), { onSaved: (id) => completeContact(id, 'Contact voided', 'Removed from all active queues.') });
  };

  window.logOutcome = async (key) => {
    const labels = {
      wants_info: ['Outcome saved', 'Email follow-up is required.'],
      no_answer: ['No answer logged', 'This lead will resurface tomorrow.'],
      voicemail: ['Voicemail logged', 'The lead has been set aside for a retry.'],
      gatekeeper: ['Gatekeeper logged', 'Email follow-up is required.'],
      not_interested: ['Outcome saved', 'This lead is out of today’s calls.'],
      wrong_number: ['Number flagged', 'This lead is out of today’s calls.'],
      qualify: ['Qualified', 'Opportunity created in the pipeline.'],
    };
    const completion = labels[key] || ['Outcome saved', 'This lead is out of today’s calls.'];
    await runContactAction(
      (id, note) => STATE.applyOutcome(id, key, { note }),
      { clearDraft: true, onSaved: (id) => completeContact(id, completion[0], completion[1]) },
    );
  };

  window.saveNote = async () => {
    if (!(noteDrafts.get(String(contactOpenId)) || '').trim()) { STATE.toast('Type a note first', 'warn'); return; }
    await runContactAction((id, note) => STATE.addNote(id, note), {
      clearDraft: true,
      onSaved: () => STATE.toast('Note saved'),
    });
  };

  window.snoozeCurrent = () => runContactAction((id) => STATE.snooze(id), {
    onSaved: (id) => completeContact(id, 'Snoozed until tomorrow', 'This lead will return to your callbacks.'),
  });

  window.saveAndNext = async () => {
    await runContactAction((id, note) => note ? STATE.addNote(id, note) : Promise.resolve(), {
      clearDraft: true,
      onSaved: (id) => {
        const pool = navigationPool();
        const index = pool.findIndex((lead) => String(lead.id) === String(id));
        const nextLead = index >= 0 ? pool[index + 1] : null;
        if (nextLead) switchContact(nextLead.id);
        else closeContact();
      },
    });
  };

  document.addEventListener('keydown', (e) => {
    const opportunityModal = document.getElementById('zenOpportunityModal');
    if (e.key === 'Escape' && opportunityModal && !opportunityModal.hidden) {
      e.preventDefault();
      closeOpportunityModal();
      return;
    }
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
      e.preventDefault();
      focusSearch();
      return;
    }
    const callOverlay = document.getElementById('scDialOverlay');
    if (callOverlay && !callOverlay.classList.contains('hidden')) return;
    if (document.getElementById('zenShortcuts')?.open) return;
    if (e.target && (['TEXTAREA','INPUT','SELECT'].includes(e.target.tagName) || e.target.isContentEditable)) return;
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === '/') { e.preventDefault(); focusSearch(); return; }
    if (e.key === '?') { e.preventDefault(); openShortcuts(); return; }
    if (e.key === 'Escape') closeContact();
    if (!contactOpenId && (e.key === 'c' || e.key === 'C')) { e.preventDefault(); startCalling(); return; }
    if (contactOpenId && !opportunityOpenId) {
      if (e.key === ']' || e.key === 'ArrowRight') { e.preventDefault(); window.nextLeadInPool(); }
      if (e.key === '[' || e.key === 'ArrowLeft')  { e.preventDefault(); window.prevLeadInPool(); }
      if (e.key === 'c' || e.key === 'C') { e.preventDefault(); doDial(); }
      if (e.key === 'n' || e.key === 'N') { e.preventDefault(); document.getElementById('ctNote')?.focus(); }
      if (/^[1-9]$/.test(e.key)) {
        const button = document.querySelectorAll('#contact .out button')[Number(e.key) - 1];
        if (button && !button.disabled) { e.preventDefault(); button.click(); }
      }
    }
  });

  async function refreshZen() {
    try {
      await STATE.refresh();
      window.zenLastRefreshAt = Date.now();
      await initializeCallWidget();
      renderStack();
      renderCallbacksHero();
      renderOpportunities();
      renderTopKpis();
      finishLoading();
      if (opportunityOpenId && !document.getElementById('zenOpportunityModal')?.hidden) openOpportunityModal(opportunityOpenId);
    } catch (error) {
      renderZenLoadFailure(error.message || 'Could not refresh live queue');
      STATE.toast(error.message || 'Could not refresh live queue', 'bad');
    }
  }
  window.refreshZen = refreshZen;

  function finishLoading() {
    if (typeof document === 'undefined' || !document.body) return;
    document.body.classList.remove('is-loading');
    document.body.classList.add('is-ready');
    window.renderUpdatedLabel?.();
    const loader = document.getElementById('zenLoading');
    if (loader) loader.hidden = true;
  }

  function renderZenLoadFailure(message) {
    if (typeof document === 'undefined' || !document.getElementById) return;
    const safeMessage = String(message || '').replace(/[&<>"']/g, (character) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[character]));
    const setText = (id, text) => { const element = document.getElementById(id); if (element) element.textContent = text; };
    const setHtml = (id, html) => { const element = document.getElementById(id); if (element) element.innerHTML = html; };
    setHtml('stack', `<div class="notes-empty" role="alert">${safeMessage} <button class="reset-btn" onclick="refreshZen()">Retry</button></div>`);
    const queuePager = document.getElementById('queuePager'); if (queuePager) queuePager.hidden = true;
    setHtml('cbtoday', `<div class="notes-empty" role="status">Callbacks unavailable</div>`);
    setHtml('oppcard', `<div class="notes-empty" role="status">Opportunities unavailable</div>`);
    setHtml('todayCard', `<div class="notes-empty" role="status">Team activity unavailable</div>`);
    setHtml('topKpis', `<div class="top-kpi" role="status">Figures unavailable</div>`);
  }

  let callWidgetReady = false;
  async function initializeCallWidget() {
    if (!callWidgetReady) {
      await SalesCall.init({ isAdmin: true });
      callWidgetReady = true;
    }
    document.getElementById('zenRepName').textContent = MOCK.rep.name;
  }

  SQ.init(async (caps, user) => {
    try {
      await STATE.init(caps, user);
      window.zenLastRefreshAt = Date.now();
      await initializeCallWidget();
      renderStack();
      renderCallbacksHero();
      renderOpportunities();
      renderTopKpis();
      finishLoading();
    } catch (error) {
      try { await initializeCallWidget(); } catch {}
      renderZenLoadFailure(error.message || 'Could not load queue');
      finishLoading();
      STATE.toast(error.message || 'Could not load live call queue', 'bad');
    }
  });

  // ── Auto-refresh (overview only, so open drafts are never re-rendered away) ──
  const AUTO_REFRESH_MS = 120000;
  let autoRefreshing = false;
  function renderUpdatedLabel() {
    const label = document.getElementById('zenUpdated');
    if (!label || !window.zenLastRefreshAt) return;
    const mins = Math.floor((Date.now() - window.zenLastRefreshAt) / 60000);
    label.textContent = mins < 1 ? 'Updated just now' : `Updated ${mins}m ago`;
  }
  window.renderUpdatedLabel = renderUpdatedLabel;
  async function autoRefresh() {
    renderUpdatedLabel();
    if (autoRefreshing || document.hidden || contactOpenId || pendingContacts.size || !window.zenLastRefreshAt) return;
    if (Date.now() - window.zenLastRefreshAt < AUTO_REFRESH_MS) return;
    autoRefreshing = true;
    try {
      await STATE.refresh();
      window.zenLastRefreshAt = Date.now();
      if (!contactOpenId) { renderStack(); renderCallbacksHero(); renderOpportunities(); }
    } catch { /* keep the last good data; the label shows its age */ }
    finally { autoRefreshing = false; renderUpdatedLabel(); }
  }
  setInterval(autoRefresh, 30000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) autoRefresh(); });

  // ── Search (⌘K or /) ──
  const searchInput = document.getElementById('zenSearch');
  const searchResults = document.getElementById('zenSearchResults');
  let searchIndex = -1;
  function focusSearch() { searchInput?.focus(); searchInput?.select(); }
  function searchMatches(query) {
    const q = query.trim().toLowerCase();
    if (q.length < 2) return [];
    const digits = q.replace(/\D/g, '');
    const hit = (...values) => values.some((value) => String(value || '').toLowerCase().includes(q));
    const phoneHit = (...values) => digits.length >= 4 && values.some((value) => String(value || '').replace(/\D/g, '').includes(digits));
    const leads = (MOCK.leads || [])
      .filter((lead) => hit(lead.name, lead.companyName, lead.email, ...(lead.emails || [])) || phoneHit(lead.phone, lead.directPhone))
      .slice(0, 6)
      .map((lead) => ({ kind:'lead', id:String(lead.id), title:leadName(lead), sub:[lead.companyName, MOCK.STATUS_LABELS[lead.status] || lead.status].filter(Boolean).join(' · ') }));
    const opps = (MOCK.opportunities || [])
      .filter((opp) => opp.ownerId === MOCK.rep.id && (hit(opp.contactName, opp.companyName, opp.email) || phoneHit(opp.phone, opp.directPhone)))
      .slice(0, 4)
      .map((opp) => ({ kind:'opportunity', id:String(opp.id), title:opp.contactName || opp.companyName, sub:[opp.companyName, MOCK.OPPORTUNITY_STAGES[opp.stage]?.label || opp.stage].filter(Boolean).join(' · ') }));
    return [...leads, ...opps];
  }
  function renderSearch() {
    const results = searchMatches(searchInput.value);
    searchIndex = results.length ? Math.max(0, Math.min(searchIndex, results.length - 1)) : -1;
    searchResults.hidden = searchInput.value.trim().length < 2;
    searchInput.setAttribute('aria-expanded', String(!searchResults.hidden));
    searchResults.innerHTML = results.length
      ? results.map((item, index) => `<button type="button" role="option" id="zenSearchOpt${index}" aria-selected="${index === searchIndex}" class="search-item ${index === searchIndex ? 'on' : ''}" data-kind="${item.kind}" data-id="${esc(item.id)}">${avatarHtml(item.title, 'sm')}<span class="search-text"><span class="nm">${esc(item.title)}</span><span class="co">${esc(item.sub)}</span></span><span class="search-kind">${item.kind === 'lead' ? 'Lead' : 'Opportunity'}</span></button>`).join('')
      : '<div class="search-empty">No matching leads or opportunities</div>';
    if (searchIndex >= 0) searchInput.setAttribute('aria-activedescendant', `zenSearchOpt${searchIndex}`);
    else searchInput.removeAttribute('aria-activedescendant');
  }
  function closeSearch() { searchResults.hidden = true; searchInput.setAttribute('aria-expanded', 'false'); }
  function openSearchResult(button) {
    if (!button) return;
    const { kind, id } = button.dataset;
    searchInput.value = '';
    closeSearch();
    searchInput.blur();
    if (kind === 'opportunity') openOpportunityModal(id);
    else openContact(id, { context:'queue' });
  }
  searchInput?.addEventListener('input', () => { searchIndex = 0; renderSearch(); });
  searchInput?.addEventListener('focus', () => { if (searchInput.value.trim().length >= 2) renderSearch(); });
  searchInput?.addEventListener('keydown', (event) => {
    const options = searchResults.querySelectorAll('.search-item');
    if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
      event.preventDefault();
      if (!options.length) return;
      searchIndex = (searchIndex + (event.key === 'ArrowDown' ? 1 : -1) + options.length) % options.length;
      renderSearch();
    } else if (event.key === 'Enter') {
      event.preventDefault();
      openSearchResult(options[Math.max(0, searchIndex)]);
    } else if (event.key === 'Escape') {
      event.preventDefault();
      searchInput.value = '';
      closeSearch();
      searchInput.blur();
    }
  });
  searchResults?.addEventListener('mousedown', (event) => {
    const button = event.target.closest('.search-item');
    if (!button) return;
    event.preventDefault();
    openSearchResult(button);
  });
  searchInput?.addEventListener('blur', () => setTimeout(closeSearch, 100));

  // ── Keyboard shortcuts help ──
  function openShortcuts() { document.getElementById('zenShortcuts')?.showModal(); }
  window.openShortcuts = openShortcuts;
</script>
</body>
</html>
