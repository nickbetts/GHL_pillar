<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weekly Dashboard</title>
  <link rel="stylesheet" href="/sales-app.css" />
  <style>
    .wrap { max-width: 1460px; margin: 0 auto; padding: 24px 22px 36px; }
    .head { display:flex; justify-content:space-between; align-items:flex-start; gap:16px; flex-wrap:wrap; margin-bottom:14px; }
    .head h1 { margin:0; font-size:30px; letter-spacing:-.02em; }
    .head .sub { margin:6px 0 0; color:#64748b; font-size:13px; max-width:760px; }
    .ctrls { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
    .ctrls label { font-size:12px; color:#334155; font-weight:700; }
    .ctrls input, .ctrls select, .ctrls button {
      height:36px;
      border:1px solid #d1d5db;
      border-radius:10px;
      background:#fff;
      color:#0f172a;
      font:inherit;
      font-size:13px;
      padding:0 10px;
    }
    .ctrls button { cursor:pointer; font-weight:700; }
    .ctrls button.primary { background:#0f172a; border-color:#0f172a; color:#fff; }

    .ribbon { display:grid; grid-template-columns:repeat(auto-fit, minmax(170px, 1fr)); gap:10px; margin:12px 0 16px; }
    .stat { background:#fff; border:1px solid #e2e8f0; border-radius:14px; box-shadow:0 5px 16px rgba(15,23,42,.06); padding:10px 12px; }
    .stat .k { font-size:11px; color:#6b7280; text-transform:uppercase; letter-spacing:.03em; font-weight:700; }
    .stat .v { margin-top:5px; font-size:24px; font-weight:800; color:#0f172a; }

    .leaderboard { display:grid; grid-template-columns:repeat(auto-fill, minmax(320px, 1fr)); gap:12px; }
    .rep {
      background:#fff;
      border:1px solid #dbe4f0;
      border-radius:16px;
      box-shadow:0 8px 20px rgba(15,23,42,.06);
      overflow:hidden;
    }
    .rep-top {
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      padding:12px;
      background:linear-gradient(160deg,#eef2ff,#f8fafc);
      border-bottom:1px solid #eef2f7;
    }
    .rep-id { display:flex; align-items:center; gap:10px; min-width:0; }
    .rank {
      width:34px;
      height:34px;
      border-radius:999px;
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight:800;
      font-size:14px;
      background:#111827;
      color:#fff;
      flex:0 0 34px;
    }
    .who { min-width:0; }
    .who .nm { font-size:16px; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .who .meta { font-size:11px; color:#64748b; margin-top:2px; }
    .score { text-align:right; }
    .score .k { font-size:10px; text-transform:uppercase; letter-spacing:.04em; color:#64748b; font-weight:700; }
    .score .v { font-size:24px; font-weight:900; color:#0f172a; line-height:1; }

    .metrics {
      display:grid;
      grid-template-columns:repeat(5, minmax(0, 1fr));
      gap:8px;
      padding:12px;
    }
    .m {
      background:#f8fafc;
      border:1px solid #eef2f7;
      border-radius:11px;
      padding:8px 6px;
      text-align:center;
    }
    .m .n { font-size:18px; font-weight:800; color:#0f172a; }
    .m .k { margin-top:2px; font-size:10px; color:#64748b; text-transform:uppercase; letter-spacing:.03em; font-weight:700; }

    .status { color:#64748b; font-size:13px; margin-top:14px; }
    .empty {
      padding:30px;
      border:1px dashed #cbd5e1;
      border-radius:14px;
      color:#64748b;
      text-align:center;
      background:#f8fafc;
    }

    @media (max-width: 860px) {
      .head h1 { font-size:24px; }
      .metrics { grid-template-columns:repeat(3, minmax(0, 1fr)); }
    }
    @media (max-width: 620px) {
      .wrap { padding:16px 12px 22px; }
      .metrics { grid-template-columns:repeat(2, minmax(0, 1fr)); }
    }
  </style>
</head>
<body class="sq">
  <div class="app">
    <aside class="sidebar" id="sqSidebar"></aside>
    <main class="app-main">
      <div class="wrap">
        <section class="head">
          <div>
            <h1>Weekly Dashboard</h1>
            <p class="sub">Current week leaderboard (Mon to now). Ranking score prioritizes outcomes: deals closed, meetings attended, meetings booked, qualified contacts, then calls.</p>
          </div>
          <div class="ctrls">
            <label for="from">From</label>
            <input id="from" type="date" />
            <label for="to">To</label>
            <input id="to" type="date" />
            <label for="owner">Rep</label>
            <select id="owner">
              <option value="">All reps</option>
            </select>
            <button class="primary" type="button" onclick="loadDashboard()">Refresh</button>
          </div>
        </section>

        <section id="totals" class="ribbon"></section>
        <section id="board" class="leaderboard"></section>
        <div id="status" class="status">Loading weekly leaderboard...</div>
      </div>
    </main>
  </div>

  <script src="/sales-app.js"></script>
  <script>
    const REPS = [
      { id: '6FX5X4kH2JFJc6u9zhSC', name: 'Brendon Mwatsenekenyi' },
      { id: 'XbyxbOK1Q1raRCjjGx4O', name: 'Zain Safir-Sheikh' },
      { id: 's7OG2BM94q7uNRsHLqM7', name: 'Amir Ward' },
    ];

    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
    const fmt = (n) => Number(n || 0).toLocaleString('en-GB');

    function mondayDateISO() {
      const now = new Date();
      const dow = (now.getDay() + 6) % 7;
      now.setDate(now.getDate() - dow);
      now.setHours(0, 0, 0, 0);
      return now.toISOString().slice(0, 10);
    }

    function todayISO() {
      return new Date().toISOString().slice(0, 10);
    }

    function initFilters() {
      $('from').value = mondayDateISO();
      $('to').value = todayISO();
      $('owner').innerHTML = ['<option value="">All reps</option>']
        .concat(REPS.map((r) => `<option value="${esc(r.id)}">${esc(r.name)}</option>`))
        .join('');
    }

    async function getJson(url) {
      const res = await fetch(url, { credentials: 'same-origin' });
      if (res.status === 401) {
        location.href = '/login?next=' + encodeURIComponent(location.pathname);
        return null;
      }
      return res.json().catch(() => ({ success:false, error:'Request failed' }));
    }

    function totalsHtml(totals) {
      const cards = [
        { label:'Calls', value: totals.calls },
        { label:'Qualified contacts', value: totals.qualifiedContacts },
        { label:'Meetings booked', value: totals.meetingsBooked },
        { label:'Meetings attended', value: totals.meetingsAttended },
        { label:'Deals closed', value: totals.dealsClosed },
      ];
      return cards.map((c) => `<article class="stat"><div class="k">${esc(c.label)}</div><div class="v">${esc(fmt(c.value))}</div></article>`).join('');
    }

    function repCard(rep) {
      return `<article class="rep">
        <div class="rep-top">
          <div class="rep-id">
            <span class="rank">${esc(rep.rank)}</span>
            <div class="who">
              <div class="nm">${esc(rep.owner || 'Unassigned')}</div>
              <div class="meta">Owner ID: ${esc(rep.ownerId || 'N/A')}</div>
            </div>
          </div>
          <div class="score">
            <div class="k">Weekly Score</div>
            <div class="v">${esc(fmt(rep.score))}</div>
          </div>
        </div>
        <div class="metrics">
          <div class="m"><div class="n">${esc(fmt(rep.dealsClosed))}</div><div class="k">Deals Closed</div></div>
          <div class="m"><div class="n">${esc(fmt(rep.meetingsAttended))}</div><div class="k">Attended</div></div>
          <div class="m"><div class="n">${esc(fmt(rep.meetingsBooked))}</div><div class="k">Booked</div></div>
          <div class="m"><div class="n">${esc(fmt(rep.qualifiedContacts))}</div><div class="k">Qualified</div></div>
          <div class="m"><div class="n">${esc(fmt(rep.calls))}</div><div class="k">Calls</div></div>
        </div>
      </article>`;
    }

    function render(payload) {
      const reps = Array.isArray(payload.reps) ? payload.reps : [];
      $('totals').innerHTML = totalsHtml(payload.totals || {});
      $('board').innerHTML = reps.length
        ? reps.map(repCard).join('')
        : '<div class="empty">No weekly activity found for this filter range.</div>';

      const f = payload.filters || {};
      $('status').textContent = `Showing ${reps.length} rep${reps.length === 1 ? '' : 's'} · ${f.from || ''} to ${f.to || ''} (${f.timeZone || 'UTC'})`;
    }

    async function loadDashboard() {
      $('status').textContent = 'Loading weekly leaderboard...';
      const qs = new URLSearchParams();
      const from = ($('from').value || '').trim();
      const to = ($('to').value || '').trim();
      const ownerId = ($('owner').value || '').trim();
      if (from) qs.set('from', from);
      if (to) qs.set('to', to);
      if (ownerId) qs.set('ownerId', ownerId);

      const data = await getJson(`/api/weekly-dashboard?${qs.toString()}`);
      if (!data || !data.success) {
        $('totals').innerHTML = '';
        $('board').innerHTML = '<div class="empty">Weekly dashboard unavailable right now.</div>';
        $('status').textContent = (data && data.error) || 'Could not load weekly dashboard';
        return;
      }
      render(data);
    }

    function boot() {
      SQ.init(() => {
        initFilters();
        loadDashboard();
      });
    }

    window.loadDashboard = loadDashboard;
    window.addEventListener('DOMContentLoaded', boot);
  </script>
</body>
</html>
