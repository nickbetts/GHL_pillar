<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Team &amp; Access — i3 Sales</title>
  <style>
    :root { --bd:#e5e7eb; }
    * { box-sizing: border-box; }
    body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; margin: 0; background: #f4f5f7; color: #111827; -webkit-font-smoothing: antialiased; }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 24px; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
    .topbar h1 { font-size: 20px; margin: 0; }
    .nav { display: flex; gap: 6px; flex-wrap: wrap; }
    .nav a { text-decoration: none; font-size: 13px; font-weight: 600; color: #374151; background: #fff; border: 1px solid #d8dce2; padding: 8px 12px; border-radius: 10px; }
    .nav a:hover { background: #f3f4f6; }
    .nav a.active { background: #111827; color: #fff; border-color: #111827; }
    .card { background: #fff; border-radius: 16px; padding: 20px; box-shadow: 0 1px 2px rgba(16,24,40,.04), 0 8px 28px rgba(16,24,40,.06); margin-bottom: 18px; }
    .card h2 { font-size: 15px; margin: 0 0 14px; }
    label { display: block; font-size: 12px; font-weight: 600; color: #374151; margin: 0 0 5px; }
    input, select { height: 40px; width: 100%; padding: 0 12px; border-radius: 10px; border: 1px solid #d1d5db; font: inherit; font-size: 13px; background: #fff; }
    input:focus, select:focus { outline: none; border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,.12); }
    .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; align-items: end; }
    button { height: 40px; padding: 0 16px; border: none; border-radius: 10px; background: #2563eb; color: #fff; cursor: pointer; font-size: 13px; font-weight: 700; }
    button:hover { background: #1d4ed8; }
    button.ghost { background: #fff; color: #374151; border: 1px solid #d8dce2; font-weight: 600; }
    button.ghost:hover { background: #f3f4f6; }
    button.danger { background: #b91c1c; }
    button.small { height: 32px; padding: 0 10px; font-size: 12px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    thead th { text-align: left; padding: 10px 12px; background: #f9fafb; border-bottom: 1px solid var(--bd); font-weight: 600; color: #374151; white-space: nowrap; }
    tbody td { padding: 10px 12px; border-bottom: 1px solid #f1f2f4; vertical-align: middle; }
    .role-badge { padding: 3px 9px; border-radius: 999px; font-size: 12px; font-weight: 700; }
    .role-admin { background: #ede9fe; color: #6d28d9; }
    .role-manager { background: #dbeafe; color: #1d4ed8; }
    .role-rep { background: #dcfce7; color: #15803d; }
    .muted { color: #6b7280; font-size: 12px; }
    .inactive { opacity: .5; }
    .err { font-size: 13px; color: #b91c1c; background: #fee2e2; border: 1px solid #fecaca; border-radius: 10px; padding: 9px 11px; margin-top: 12px; display: none; }
    .err.show { display: block; }
    .ok { font-size: 13px; color: #15803d; background: #dcfce7; border: 1px solid #bbf7d0; border-radius: 10px; padding: 9px 11px; margin-top: 12px; display: none; }
    .ok.show { display: block; }
    .auditrow td { font-size: 12px; color: #4b5563; }
    @media (max-width: 820px) { .grid { grid-template-columns: 1fr 1fr; } }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <h1>Team &amp; Access</h1>
      <div class="nav">
        <a href="/sales-queue">Board</a>
        <a href="/wave-1">Waves</a>
        <a href="/sales-queue-report">Reports</a>
        <a href="/sq-admin" class="active">Team</a>
        <a href="#" onclick="logout();return false;">Sign out</a>
      </div>
    </div>

    <div id="gate" class="card" style="display:none;">
      <h2>Admin access required</h2>
      <p class="muted">This page is only available to admins. <a href="/sales-queue">Back to the board</a>.</p>
    </div>

    <div id="app" style="display:none;">
      <div class="card">
        <h2>Add a team member</h2>
        <div class="grid">
          <div><label>Name</label><input id="n-name" placeholder="Jane Doe" /></div>
          <div><label>Email</label><input id="n-email" type="email" placeholder="jane@i3media.net" /></div>
          <div>
            <label>Role</label>
            <select id="n-role">
              <option value="rep">Rep (own leads)</option>
              <option value="manager">Manager (team ops)</option>
              <option value="admin">Admin (full control)</option>
            </select>
          </div>
          <div>
            <label>GHL rep (for reps)</label>
            <select id="n-owner">
              <option value="">Not linked</option>
              <option value="6FX5X4kH2JFJc6u9zhSC">Brendon Mwatsenekenyi</option>
              <option value="XbyxbOK1Q1raRCjjGx4O">Zain Safir-Sheikh</option>
              <option value="s7OG2BM94q7uNRsHLqM7">Amir Ward</option>
            </select>
          </div>
          <div><label>Temp password</label><input id="n-pass" type="text" placeholder="8+ characters" /></div>
        </div>
        <div style="margin-top:14px;"><button onclick="createUser()">Create member</button></div>
        <div id="err" class="err"></div>
        <div id="ok" class="ok"></div>
      </div>

      <div class="card">
        <h2>Team members</h2>
        <div style="overflow-x:auto;">
          <table>
            <thead><tr><th>Name</th><th>Email</th><th>Role</th><th>GHL rep</th><th>Last sign in</th><th>Actions</th></tr></thead>
            <tbody id="users"></tbody>
          </table>
        </div>
      </div>

      <div class="card">
        <h2>Recent activity</h2>
        <div style="overflow-x:auto;">
          <table>
            <thead><tr><th>When</th><th>Who</th><th>Event</th><th>Target</th></tr></thead>
            <tbody id="audit"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script>
    const OWNERS = {
      '6FX5X4kH2JFJc6u9zhSC': 'Brendon Mwatsenekenyi',
      'XbyxbOK1Q1raRCjjGx4O': 'Zain Safir-Sheikh',
      's7OG2BM94q7uNRsHLqM7': 'Amir Ward',
    };
    const $ = (id) => document.getElementById(id);
    function esc(s){ return String(s ?? '').replace(/[&<>'"]/g,(c)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

    async function api(payload) {
      const res = await fetch('/api/sq-auth', {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'same-origin',
        body: JSON.stringify(payload),
      });
      const data = await res.json().catch(() => ({}));
      if (res.status === 401) { location.href = '/login?next=/sq-admin'; throw new Error('auth'); }
      if (!res.ok || !data.success) throw new Error(data.error || 'Request failed');
      return data;
    }

    function flash(kind, msg) {
      const el = $(kind); el.textContent = msg; el.classList.add('show');
      setTimeout(() => el.classList.remove('show'), 4000);
    }

    async function logout() {
      await fetch('/api/sq-auth', { method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'same-origin', body: JSON.stringify({ action: 'logout' }) });
      location.href = '/login';
    }

    async function createUser() {
      try {
        await api({
          action: 'create-user',
          name: $('n-name').value.trim(),
          email: $('n-email').value.trim(),
          role: $('n-role').value,
          ghlOwnerId: $('n-owner').value || null,
          password: $('n-pass').value,
        });
        $('n-name').value = ''; $('n-email').value = ''; $('n-pass').value = ''; $('n-owner').value = '';
        flash('ok', 'Team member created');
        loadUsers();
      } catch (e) { if (e.message !== 'auth') flash('err', e.message); }
    }

    async function updateRole(id, role) {
      try { await api({ action: 'update-user', id, role }); loadUsers(); } catch (e) { flash('err', e.message); }
    }
    async function updateOwner(id, ghlOwnerId) {
      try { await api({ action: 'update-user', id, ghlOwnerId: ghlOwnerId || null }); loadUsers(); } catch (e) { flash('err', e.message); }
    }
    async function toggleActive(id, active) {
      try { await api({ action: 'update-user', id, active }); loadUsers(); } catch (e) { flash('err', e.message); }
    }
    async function resetPassword(id) {
      const p = prompt('New temporary password (8+ characters):');
      if (!p) return;
      try { await api({ action: 'set-password', id, password: p }); flash('ok', 'Password updated'); } catch (e) { flash('err', e.message); }
    }

    function userRow(u) {
      const owner = u.ghlOwnerId ? OWNERS[u.ghlOwnerId] || u.ghlOwnerId : '';
      const ownerSel = ['<option value="">Not linked</option>'].concat(
        Object.entries(OWNERS).map(([id, n]) => `<option value="${id}" ${u.ghlOwnerId === id ? 'selected' : ''}>${esc(n)}</option>`)
      ).join('');
      const roleSel = ['rep','manager','admin'].map((r) => `<option value="${r}" ${u.role === r ? 'selected' : ''}>${r}</option>`).join('');
      return `<tr class="${u.active ? '' : 'inactive'}">
        <td>${esc(u.name || '')}</td>
        <td>${esc(u.email)}</td>
        <td><select onchange="updateRole(${u.id}, this.value)" style="height:32px;width:120px;">${roleSel}</select></td>
        <td><select onchange="updateOwner(${u.id}, this.value)" style="height:32px;width:180px;">${ownerSel}</select></td>
        <td class="muted">${u.lastLoginAt ? new Date(u.lastLoginAt).toLocaleString('en-GB') : 'Never'}</td>
        <td>
          <button class="ghost small" onclick="resetPassword(${u.id})">Reset password</button>
          ${u.active ? `<button class="danger small" onclick="toggleActive(${u.id}, false)">Disable</button>` : `<button class="ghost small" onclick="toggleActive(${u.id}, true)">Enable</button>`}
        </td>
      </tr>`;
    }

    async function loadUsers() {
      const data = await api({ action: 'list-users' });
      $('users').innerHTML = data.users.map(userRow).join('') || '<tr><td colspan="6" class="muted">No members yet</td></tr>';
      try {
        const a = await api({ action: 'audit' });
        $('audit').innerHTML = (a.audit || []).slice(0, 50).map((r) => `<tr class="auditrow">
          <td>${new Date(r.created_at).toLocaleString('en-GB')}</td>
          <td>${esc(r.actor_email || '')}</td>
          <td>${esc(r.event)}</td>
          <td>${esc(r.target || '')}</td></tr>`).join('') || '<tr><td colspan="4" class="muted">No activity yet</td></tr>';
      } catch { /* audit optional */ }
    }

    (async function init() {
      let me;
      try { me = await api({ action: 'me' }); } catch { location.href = '/login?next=/sq-admin'; return; }
      if (!me.caps || !me.caps.manageUsers) { $('gate').style.display = 'block'; return; }
      $('app').style.display = 'block';
      loadUsers();
    })();
  </script>
</body>
</html>
